# SPDX-License-Identifier: MIT
name: Verify Meguri

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/meguri-verification.yml'
      - 'app/**'
      - 'conformance/**'
      - 'core/**'
      - 'docker/**'
      - 'server/**'
      - 'specs/**'
      - 'tools/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/meguri-verification.yml'
      - 'app/**'
      - 'conformance/**'
      - 'core/**'
      - 'docker/**'
      - 'server/**'
      - 'specs/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      apple:
        description: Also build the unsigned Mac and simulator Core XCFramework
        type: boolean
        default: false

permissions:
  contents: read

# Each suite has its own concurrency group, so a push that skips Core does not
# cancel a Core run that an earlier push started.

jobs:
  suites:
    name: Select suites
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # Core runs when an input of `tools/mg core-test` changed: the Rust
      # workspace, the conformance data and specs its tests read (servers/
      # specs excepted), its tools/mg job and the dev image. Manual runs, new
      # branches and anything that cannot be compared run every suite.
      - name: Select the suites this change affects
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          case "$EVENT" in
            # The checked-out merge commit's first parent is the base tip.
            pull_request) base=HEAD^1 ;;
            push)
              if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] &&
                 git fetch --no-tags --depth=1 origin "$BEFORE"; then
                base="$BEFORE"
              fi
              ;;
          esac
          core=yes
          if [[ -n "$base" ]] && changed="$(git diff --name-only "$base" HEAD)"; then
            core_dirs='core|conformance|specs|tools/conformance'
            core_files='\.github/workflows/meguri-verification\.yml|tools/mg|tools/mg\.d/core\.sh|tools/mg-result\.schema\.json|docker/compose\.yml|docker/dev\.Dockerfile(\.dockerignore)?'
            # Filter before testing: under pipefail, `grep -q` exiting early
            # would fail its writer and skip Core on a large change.
            relevant="$(grep -v '^specs/servers/' <<<"$changed" || true)"
            if ! grep -qE "^(($core_dirs)/|($core_files)$)" <<<"$relevant"; then
              core=no
            fi
            printf 'Changed files:\n%s\n' "$changed"
          fi
          if [[ "$core" == yes ]]; then
            suites='["core","server","conformance","package-smoke"]'
          else
            suites='["server","conformance","package-smoke"]'
          fi
          echo "Suites: $suites"
          echo "suites=$suites" >>"$GITHUB_OUTPUT"

  linux:
    name: Linux · ${{ matrix.suite }}
    needs: suites
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    concurrency:
      group: meguri-verification-${{ github.ref }}-${{ matrix.suite }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Meguri verification
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mg() {
            sudo -n env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory \
              GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/mg" "$@"
          }

          if [[ "$SUITE" == server || "$SUITE" == package-smoke ]]; then
            mg sync-web-image
            mg sync-web-deps --install
          fi

          case "$SUITE" in
            core) args=(core-test --quick) ;;
            server) args=(sync-server-test) ;;
            conformance) args=(conformance --lane docker) ;;
            package-smoke)
              mg sync-web-browser-install
              args=(sync-server-package-test)
              ;;
            *) exit 2 ;;
          esac

          rc=0
          receipt="$(mg "${args[@]}")" || rc=$?
          artifact="$RUNNER_TEMP/meguri-result.json"
          receipt_prefix="$GITHUB_WORKSPACE/build/mg/${args[0]}/"
          receipt_suffix="${receipt#"$receipt_prefix"}"
          if [[ "$receipt" == "$receipt_prefix"* &&
                "$receipt_suffix" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+/result\.json$ ]] &&
             sudo -n test -f "$receipt"; then
            sudo -n cat -- "$receipt" > "$artifact.tmp"
            mv -- "$artifact.tmp" "$artifact"
          fi
          ((rc == 0))
          jq -e --arg sha "$GITHUB_SHA" --arg job "${args[0]}" \
            '.status == "pass" and .commit.sha == $sha and .commit.dirty == false and .job == $job' "$artifact"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meguri-linux-${{ matrix.suite }}-result
          path: ${{ runner.temp }}/meguri-result.json
          if-no-files-found: ignore
          retention-days: 7

  apple:
    name: Unsigned Apple Core build pilot
    if: github.event_name == 'workflow_dispatch' && inputs.apple
    runs-on: xcode-27
    timeout-minutes: 60
    concurrency:
      group: meguri-verification-${{ github.ref }}-apple
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Debug Core XCFramework
        shell: bash
        run: |
          rc=0
          receipt="$(tools/mg core-xcframework --configuration Debug --slices mac,sim)" || rc=$?
          if [[ -f "$receipt" ]]; then
            cp "$receipt" "$RUNNER_TEMP/meguri-result.json"
          fi
          ((rc == 0))
          jq -e --arg sha "$GITHUB_SHA" \
            '.status == "pass" and .commit.sha == $sha and .commit.dirty == false' "$receipt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meguri-apple-core-pilot-result
          path: ${{ runner.temp }}/meguri-result.json
          if-no-files-found: ignore
          retention-days: 7
