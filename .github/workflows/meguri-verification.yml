# SPDX-License-Identifier: MIT
name: Verify Meguri

# Hosted Linux checks (docs/process/tiers.md, "Hosted checks"). Every pull
# request and master push starts this workflow; "Select suites" decides what
# runs, and a suite the change does not affect still reports, as a quick pass
# that says it was not selected, so no check waits forever. Linux · selftest
# and its jobs are the exception: they skip (a skipped check counts as
# passing), so a pull request outside tools/, .github/ and docker/ takes no
# runner for them.
#
# - Linux · core: one result for the Core suite. It passes only when every
#   shard ran and passed `tools/mg core-test --quick` and the lint job passed
#   `tools/mg core-lint`, on this commit; a job that failed, was cancelled or
#   never started fails it.
# - Linux · core · build: the canaries, then quick's test binaries built
#   once into a nextest archive (`core-test --build-archive`).
# - Linux · core · shard M/N: nextest partition M of N of the quick tests,
#   from that archive, without the tests in .github/core-timing-sensitive.txt.
# - Linux · core · lint: `tools/mg core-lint` (clippy, layering-check, the
#   AnkiWeb scan).
# - Linux · core (timing-sensitive): advisory. Runs the listed tests alone,
#   one at a time; its failures show in its summary and do not fail Core.
# - Linux · server, conformance, package-smoke: unchanged suites.
# - Linux · checks: every run. static-checks against the base, lint-ui,
#   design-docs and core-deny, one after another on one runner.
# - Linux · selftest: one result for the self-tests, for pull requests that
#   change tools/, .github/ or docker/, every master push and manual and
#   scheduled runs. It passes only when every shard and the image-tools job
#   ran and passed on this commit and the shards together ran every test
#   file once.
# - Linux · selftest · shard M/N: `tools/mg selftest --shard M/N`, share M of
#   N of the bats files (tools/mg.d/selftest.sh splits them by the seconds in
#   tools/tests/selftest-seconds.tsv).
# - Linux · selftest · image-tools: `tools/mg image-tools-selftest`.
# - macOS · Swift packages: advisory. `tools/mg swift-test --package
#   MeguriCore` on the hosted Xcode 27 runner, for changes to the packages or
#   the core's FFI interface.
# - Linux · similarity: the similarity scan against the pinned Anki releases
#   (.github/similarity.sh), for the files this change adds or modifies.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # The weekly run starts cold: it builds the dev image and every crate
  # from scratch with no cache, proving that path still works.
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      apple:
        description: Also build the unsigned Mac and simulator Core XCFramework
        type: boolean
        default: false
      cold:
        description: Use no cache (no prebuilt dev image, no Rust build cache)
        type: boolean
        default: false

permissions:
  contents: read

# Each suite has its own concurrency group, so a push that skips Core does not
# cancel a Core run that an earlier push started. A suite that is not selected
# takes a group of its own run, so its quick report cancels nothing.

jobs:
  suites:
    name: Select suites
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      core: ${{ steps.select.outputs.core }}
      linux: ${{ steps.select.outputs.linux }}
      selftest: ${{ steps.select.outputs.selftest }}
      swift: ${{ steps.select.outputs.swift }}
      core_shards: ${{ steps.select.outputs.core_shards }}
      selftest_shards: ${{ steps.select.outputs.selftest_shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # The server, conformance and package-smoke suites run for a change to
      # their inputs: app/, conformance/, core/, docker/, server/, specs/,
      # tools/, this workflow or the dev image script (the paths that started
      # this workflow before it ran on every change). Core runs when an input
      # of `tools/mg core-test` or `core-lint` changed: the Rust workspace, the
      # conformance data and specs its tests read (servers/ specs excepted),
      # their tools/mg jobs (with the AnkiWeb scanner), the dev image (with
      # .github/dev-image.sh), the cache script and the timing-sensitive list.
      # A change to docs/ or to Markdown outside those directories runs
      # neither. Manual runs, new branches and anything that cannot be compared
      # run every suite.
      - name: Select the suites this change affects
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          case "$EVENT" in
            # The checked-out merge commit's first parent is the base tip.
            pull_request) base=HEAD^1 ;;
            push)
              if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] &&
                 git fetch --no-tags --depth=1 origin "$BEFORE"; then
                base="$BEFORE"
              fi
              ;;
          esac
          core=yes
          linux=yes
          selftest=yes
          swift=yes
          # -z: git would quote a name with non-ASCII or special bytes, and
          # the anchored patterns below would miss it. --no-renames: a moved
          # file counts for both its old and its new directory.
          if [[ -n "$base" ]] && changed="$(git diff -z --no-renames --name-only "$base" HEAD | tr '\0' '\n')"; then
            printf 'Changed files:\n%s\n' "$changed"
            linux_dirs='app|conformance|core|docker|server|specs|tools'
            if ! grep -qE "^(($linux_dirs)/|\.github/workflows/meguri-verification\.yml$|\.github/dev-image\.sh$)" <<<"$changed"; then
              linux=no
            fi
            # The self-tests cover tools/mg, its scripts, the workflow and the
            # images they build. A pull request runs them only when it changes
            # one of those; every master push runs them.
            if [[ "$EVENT" == pull_request ]] && ! grep -qE '^(tools|\.github|docker)/' <<<"$changed"; then
              selftest=no
            fi
            # MeguriCore's Swift tests, only for Swift or the core's FFI
            # surface: the package, the FFI crate and the bindings generator,
            # the workspace manifest, lock, vendored crates and toolchain that
            # build the XCFramework, the scripts that build it, swift-test's
            # job and the hosted skip list. A trade: the XCFramework holds all
            # of core, but a change elsewhere in core is left to Linux · core.
            # A change only to tools/mg or this workflow does not run it: run
            # it by hand (workflow_dispatch) after one.
            swift_paths='app/Packages/MeguriCore/|core/crates/meguri-ffi/|core/tools/uniffi-bindgen-swift/|core/Cargo\.toml$|core/Cargo\.lock$|core/vendor/|core/rust-toolchain\.toml$|tools/scripts/build-core-xcframework\.sh$|tools/scripts/repair-swift-integer-reader\.py$|tools/mg\.d/bridge\.sh$|\.github/swift-timing-sensitive\.txt$'
            if ! grep -qE "^($swift_paths)" <<<"$changed"; then
              swift=no
            fi
            core_dirs='core|conformance|specs|tools/conformance'
            core_files='\.github/workflows/meguri-verification\.yml|\.github/dev-image\.sh|\.github/rust-cache\.sh|\.github/core-timing-sensitive\.txt|tools/mg|tools/mg\.d/core\.sh|tools/scripts/ankiweb-scan\.py|tools/mg-result\.schema\.json|docker/compose\.yml|docker/dev\.Dockerfile(\.dockerignore)?'
            # Filter before testing: under pipefail, `grep -q` exiting early
            # would fail its writer and skip Core on a large change.
            relevant="$(grep -v '^specs/servers/' <<<"$changed" || true)"
            if ! grep -qE "^(($core_dirs)/|($core_files)$)" <<<"$relevant"; then
              core=no
            fi
          fi
          # A test added to the timing-sensitive list stops blocking Core: say so.
          added=
          if [[ -n "$base" ]]; then
            added="$(git diff --no-renames -U0 "$base" HEAD -- .github/core-timing-sensitive.txt |
              grep -E '^\+[[:space:]]*[^+#[:space:]]' | cut -c2- | awk '{ print $1, $2 }' || true)"
          fi
          if [[ -n "$added" ]]; then
            while IFS= read -r t; do
              echo "::warning file=.github/core-timing-sensitive.txt::This change makes $t advisory: it no longer blocks Linux · core."
            done <<<"$added"
          fi
          echo "Core: $core; server, conformance and package-smoke: $linux; selftest: $selftest"
          {
            echo "core=$core"
            echo "linux=$linux"
            echo "selftest=$selftest"
            echo "swift=$swift"
            # The one list of Core shards: the shard matrix and the check in
            # "Linux · core" both read it.
            echo 'core_shards=[1,2,3,4]'
            # The one list of selftest shards: the shard matrix and the check
            # in "Linux · selftest" both read it.
            echo 'selftest_shards=[1,2,3,4]'
          } >>"$GITHUB_OUTPUT"
          {
            echo "### Selected suites"
            echo
            echo "- Core (4 shards, lint and the timing-sensitive job): **$core**"
            echo "- server, conformance, package-smoke: **$linux**"
            echo "- selftest (4 shards and the image-tools job): **$selftest** (Linux · checks runs on every change)"
            echo "- Swift packages (macOS, advisory): **$swift**"
            if [[ -n "$added" ]]; then
              echo
              echo "**This change adds tests to .github/core-timing-sensitive.txt; they no longer block Linux · core:**"
              sed 's/^/- `/; s/$/`/' <<<"$added"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  # Builds the dev image once per change of its inputs and shares it through
  # GitHub Container Registry, tagged with a hash of those inputs
  # (.github/dev-image.sh names them and explains the trust). Master runs
  # push to meguri-dev and record the digest in a master-only cache entry;
  # every run takes master's image by that digest. Pull requests without a
  # record push to meguri-dev-pr, which master never reads. Jobs pull it and tools/mg uses it
  # instead of building (MEGURI_CI_DEV_IMAGE). An empty ref (cold runs, fork
  # pull requests that cannot push, a registry failure) makes each job build
  # the image itself, as before. Linux · checks needs it on every run, so it
  # does not wait for the suite selection.
  image:
    name: Prepare dev image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.image.outputs.ref }}
      hash: ${{ steps.image.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hash the image inputs
        id: hash
        shell: bash
        run: |
          hash="$(.github/dev-image.sh hash)"
          echo "hash=$hash" >>"$GITHUB_OUTPUT"

      # The digest of master's image of this hash. Only master runs save it,
      # so a pull request cannot change which image master uses. Entries are
      # immutable: each new record gets its own key, and the newest wins.
      - name: Restore the record of master's image
        if: github.event_name != 'schedule' && inputs.cold != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dev-image-digest
          key: dev-image-v1-${{ steps.hash.outputs.hash }}-${{ github.run_id }}
          restore-keys: dev-image-v1-${{ steps.hash.outputs.hash }}-

      - name: Find or build the dev image
        id: image
        shell: bash
        env:
          COLD: ${{ github.event_name == 'schedule' || inputs.cold == true }}
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          TRUSTED: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          TOKEN: ${{ github.token }}
          DIGEST_FILE: ${{ runner.temp }}/dev-image-digest
        run: .github/dev-image.sh ensure

      - name: Save the record of master's image
        if: steps.image.outputs.record == 'yes'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dev-image-digest
          key: dev-image-v1-${{ steps.hash.outputs.hash }}-${{ github.run_id }}

  # Builds quick's test binaries once, as a nextest archive (`core-test
  # --build-archive`). The shards and the timing-sensitive job download it
  # and only run tests: one compile per run instead of one per shard.
  core-build:
    name: Linux · core · build
    needs: [suites, image]
    if: ${{ !cancelled() && needs.suites.result == 'success' && needs.suites.outputs.core == 'yes' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    concurrency:
      group: meguri-verification-${{ github.ref }}-core-build-${{ needs.suites.outputs.core == 'yes' && ((github.event_name == 'schedule' || inputs.cold) && 'cold' || 'run') || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull the shared dev image
        id: pull
        if: needs.image.outputs.ref != ''
        shell: bash
        env:
          REF: ${{ needs.image.outputs.ref }}
          TOKEN: ${{ github.token }}
        run: .github/dev-image.sh pull

      # Third-party crates only (local crates are pruned before saving), keyed
      # on the image hash (so the toolchain) and Cargo.lock. Only with the
      # shared image, so never on cold runs or with an image built here.
      - name: Restore the Rust dependency cache
        id: rust-cache
        if: steps.pull.outputs.used == 'yes'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/index
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-target
          key: core-deps-v1-${{ needs.image.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: core-deps-v1-${{ needs.image.outputs.hash }}-

      # The canaries first, building only their packages (AE82): a pin drift
      # that also breaks the build of other crates is still reported. Then
      # the archive. Each leaves its receipt for Linux · core.
      - name: Run the canaries, then build the Core test archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-home" "$RUNNER_TEMP/cargo-target" "$RUNNER_TEMP/receipts"
          # step <name> <tools/mg args...>: run, keep the receipt as <name>.json, check it.
          step() {
            local name="$1" rc=0 receipt artifact="$RUNNER_TEMP/receipts/$1.json" want
            shift
            receipt="$(sudo -n env MEGURI_CI_DEV_IMAGE="${MEGURI_CI_DEV_IMAGE:-}" \
              MEGURI_DOCKER_CARGO_HOME="$RUNNER_TEMP/cargo-home" MEGURI_DOCKER_CARGO_TARGET="$RUNNER_TEMP/cargo-target" \
              GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory \
              GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/mg" "$@")" || rc=$?
            local prefix="$GITHUB_WORKSPACE/build/mg/core-test/"
            local suffix="${receipt#"$prefix"}"
            if [[ "$receipt" == "$prefix"* && "$suffix" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+/result\.json$ ]] &&
               sudo -n test -f "$receipt"; then
              sudo -n cat -- "$receipt" > "$artifact.tmp"
              mv -- "$artifact.tmp" "$artifact"
              jq -r --arg n "$name" '"\($n): \(.status). \(.message)"' "$artifact" >>"$GITHUB_STEP_SUMMARY"
              jq -r '.failures[]? | "- `\(.id)`"' "$artifact" >>"$GITHUB_STEP_SUMMARY"
            fi
            ((rc == 0)) || return 1
            want="$(printf '%s\n' "${@:2}" | jq -Rnc '[inputs]')"
            jq -e --arg sha "$GITHUB_SHA" --argjson want "$want" '
              .status == "pass" and .commit.sha == $sha and .commit.dirty == false
              and .job == "core-test" and .args == $want' "$artifact" >/dev/null
          }
          step canaries core-test --canaries
          step build core-test --build-archive build/ci/core-tests.tar.zst
          jq -e '.details.archive.file == "build/ci/core-tests.tar.zst"' "$RUNNER_TEMP/receipts/build.json"

      # Already compressed (zstd), so the upload stores it as it is.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meguri-linux-core-tests-archive
          path: build/ci/core-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      # Only a master push or manual run saves, and only a new key, once the
      # archive built: pull requests read master's cache but never add
      # to the 10 GB budget. A manual run on a branch saves where only that
      # branch reads it; unused entries age out (7 days, or least recently
      # used first when the budget is full).
      - name: Keep only third-party crates in the Rust cache
        id: prune
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && steps.pull.outputs.used == 'yes' && steps.rust-cache.outputs.cache-hit != 'true'
        shell: bash
        run: .github/rust-cache.sh prune "Rust dependency cache" 4096

      - name: Save the Rust dependency cache
        if: steps.prune.outputs.save == 'yes'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/index
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-target
          key: core-deps-v1-${{ needs.image.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meguri-linux-core-build-result
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: ignore
          retention-days: 7

  core-shard:
    name: Linux · core · shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: [suites, image, core-build]
    if: ${{ !cancelled() && needs.suites.result == 'success' && needs.suites.outputs.core == 'yes' && needs.core-build.result == 'success' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    concurrency:
      group: meguri-verification-${{ github.ref }}-core-${{ matrix.shard }}-${{ needs.suites.outputs.core == 'yes' && ((github.event_name == 'schedule' || inputs.cold) && 'cold' || 'run') || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.suites.outputs.core_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull the shared dev image
        id: pull
        if: needs.image.outputs.ref != ''
        shell: bash
        env:
          REF: ${{ needs.image.outputs.ref }}
          TOKEN: ${{ github.token }}
        run: .github/dev-image.sh pull

      # The test binaries Linux · core · build archived on this commit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meguri-linux-core-tests-archive
          path: build/ci

      - name: Run Core shard ${{ matrix.shard }}
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.suites.outputs.core_shards }}
        run: |
          mg() {
            sudo -n env MEGURI_CI_DEV_IMAGE="${MEGURI_CI_DEV_IMAGE:-}" \
              GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory \
              GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/mg" "$@"
          }
          count="$(jq length <<<"$SHARDS")"
          args=(core-test --quick --archive build/ci/core-tests.tar.zst --partition "hash:$SHARD/$count" --exclude-list .github/core-timing-sensitive.txt)

          rc=0
          receipt="$(mg "${args[@]}")" || rc=$?
          artifact="$RUNNER_TEMP/meguri-result.json"
          receipt_prefix="$GITHUB_WORKSPACE/build/mg/core-test/"
          receipt_suffix="${receipt#"$receipt_prefix"}"
          if [[ "$receipt" == "$receipt_prefix"* &&
                "$receipt_suffix" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+/result\.json$ ]] &&
             sudo -n test -f "$receipt"; then
            sudo -n cat -- "$receipt" > "$artifact.tmp"
            mv -- "$artifact.tmp" "$artifact"
            jq -r '"Shard \(env.SHARD): \(.status). \(.message)"' "$artifact" >>"$GITHUB_STEP_SUMMARY"
            jq -r '.failures[]? | "- `\(.id)`"' "$artifact" >>"$GITHUB_STEP_SUMMARY"
          fi
          ((rc == 0))
          # Not `jq --args`: jq would read the --quick that follows as its own option.
          want="$(printf '%s\n' "${args[@]:1}" | jq -Rnc '[inputs]')"
          jq -e --arg sha "$GITHUB_SHA" --argjson want "$want" '
            .status == "pass" and .commit.sha == $sha and .commit.dirty == false
            and .job == "core-test" and .args == $want' "$artifact"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meguri-linux-core-shard-${{ matrix.shard }}-result
          path: ${{ runner.temp }}/meguri-result.json
          if-no-files-found: ignore
          retention-days: 7

  # Advisory: see .github/core-timing-sensitive.txt. Not needed by "Linux ·
  # core"; continue-on-error keeps its failure from failing the run.
  core-timing:
    name: Linux · core (timing-sensitive)
    needs: [suites, image, core-build]
    if: ${{ !cancelled() && needs.suites.result == 'success' && needs.suites.outputs.core == 'yes' && needs.core-build.result == 'success' }}
    permissions:
      contents: read
      packages: read
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    concurrency:
      group: meguri-verification-${{ github.ref }}-core-timing-${{ needs.suites.outputs.core == 'yes' && ((github.event_name == 'schedule' || inputs.cold) && 'cold' || 'run') || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull the shared dev image
        id: pull
        if: needs.image.outputs.ref != ''
        shell: bash
        env:
          REF: ${{ needs.image.outputs.ref }}
          TOKEN: ${{ github.token }}
        run: .github/dev-image.sh pull

      # The test binaries Linux · core · build archived on this commit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meguri-linux-core-tests-archive
          path: build/ci

      - name: Run the timing-sensitive Core tests alone
        shell: bash
        run: |
          mg() {
            sudo -n env MEGURI_CI_DEV_IMAGE="${MEGURI_CI_DEV_IMAGE:-}" \
              GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory \
              GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/mg" "$@"
          }
          args=(core-test --quick --archive build/ci/core-tests.tar.zst --only-list .github/core-timing-sensitive.txt)

          rc=0
          receipt="$(mg "${args[@]}")" || rc=$?
          artifact="$RUNNER_TEMP/meguri-result.json"
          receipt_prefix="$GITHUB_WORKSPACE/build/mg/core-test/"
          receipt_suffix="${receipt#"$receipt_prefix"}"
          {
            echo "### Timing-sensitive Core tests (advisory)"
            echo
            echo "These tests are left out of the Core shards because they fail on hosted runners for timing reasons."
            echo "Their failures do not fail **Linux · core**. They are tracked in docs/process/verification-status.md."
            echo
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ "$receipt" == "$receipt_prefix"* &&
                "$receipt_suffix" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+/result\.json$ ]] &&
             sudo -n test -f "$receipt"; then
            sudo -n cat -- "$receipt" > "$artifact.tmp"
            mv -- "$artifact.tmp" "$artifact"
            {
              jq -r '.message' "$artifact"
              echo
              echo "| Result | Test |"
              echo "| --- | --- |"
              jq -r '.details.listed_results[]? | "| \(if .event == "ok" then "passed" else "**" + .event + "**" end) | `\(.name)` |"' "$artifact"
              echo
              if jq -e '[.failures[]?] | length > 0' "$artifact" >/dev/null; then
                echo "Failures:"
                jq -r '.failures[] | "- `\(.id)`"' "$artifact"
              fi
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No core-test receipt; see the log." >>"$GITHUB_STEP_SUMMARY"
          fi
          ((rc == 0))
          # Not `jq --args`: jq would read the --quick that follows as its own option.
          want="$(printf '%s\n' "${args[@]:1}" | jq -Rnc '[inputs]')"
          jq -e --arg sha "$GITHUB_SHA" --argjson want "$want" '
            .status == "pass" and .commit.sha == $sha and .commit.dirty == false
            and .job == "core-test" and .args == $want' "$artifact"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meguri-linux-core-timing-sensitive-result
          path: ${{ runner.temp }}/meguri-result.json
          if-no-files-found: ignore
          retention-days: 7

  # `tools/mg core-lint`, as agents run it locally. It does not check source
  # formatting. Clippy checks every crate with all features, and the AnkiWeb
  # scan builds meguri-sync without its features: neither reuses the shards'
  # test builds, so lint keeps its own cache of third-party crates
  # (core-lint-v1), saved like the shards' (master pushes and manual runs,
  # once per key, after a pass) and never mixed with theirs.
  core-lint:
    name: Linux · core · lint
    needs: [suites, image]
    if: ${{ !cancelled() && needs.suites.result == 'success' && needs.suites.outputs.core == 'yes' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    concurrency:
      group: meguri-verification-${{ github.ref }}-core-lint-${{ needs.suites.outputs.core == 'yes' && ((github.event_name == 'schedule' || inputs.cold) && 'cold' || 'run') || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull the shared dev image
        id: pull
        if: needs.image.outputs.ref != ''
        shell: bash
        env:
          REF: ${{ needs.image.outputs.ref }}
          TOKEN: ${{ github.token }}
        run: .github/dev-image.sh pull

      - name: Restore the Rust lint cache
        id: rust-cache
        if: steps.pull.outputs.used == 'yes'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/index
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-target
          key: core-lint-v1-${{ needs.image.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: core-lint-v1-${{ needs.image.outputs.hash }}-

      - name: Run Core lint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-home" "$RUNNER_TEMP/cargo-target"
          rc=0
          receipt="$(sudo -n env MEGURI_CI_DEV_IMAGE="${MEGURI_CI_DEV_IMAGE:-}" \
            MEGURI_DOCKER_CARGO_HOME="$RUNNER_TEMP/cargo-home" MEGURI_DOCKER_CARGO_TARGET="$RUNNER_TEMP/cargo-target" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory \
            GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/mg" core-lint)" || rc=$?
          artifact="$RUNNER_TEMP/meguri-result.json"
          receipt_prefix="$GITHUB_WORKSPACE/build/mg/core-lint/"
          receipt_suffix="${receipt#"$receipt_prefix"}"
          if [[ "$receipt" == "$receipt_prefix"* &&
                "$receipt_suffix" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+/result\.json$ ]] &&
             sudo -n test -f "$receipt"; then
            sudo -n cat -- "$receipt" > "$artifact.tmp"
            mv -- "$artifact.tmp" "$artifact"
            {
              jq -r '"### Linux · core · lint: \(.status)\n\n\(.message)\n"' "$artifact"
              jq -r '.failures[]? | "- `\(.id)`"' "$artifact"
            } >>"$GITHUB_STEP_SUMMARY"
          fi
          ((rc == 0))
          jq -e --arg sha "$GITHUB_SHA" '
            .status == "pass" and .commit.sha == $sha and .commit.dirty == false
            and .job == "core-lint" and .args == [] and .summary.failed == 0 and .summary.passed > 0' "$artifact"

      - name: Keep only third-party crates in the Rust lint cache
        id: prune
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && steps.pull.outputs.used == 'yes' && steps.rust-cache.outputs.cache-hit != 'true'
        shell: bash
        run: .github/rust-cache.sh prune "Rust lint cache" 2048

      - name: Save the Rust lint cache
        if: steps.prune.outputs.save == 'yes'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/index
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-target
          key: core-lint-v1-${{ needs.image.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meguri-linux-core-lint-result
          path: ${{ runner.temp }}/meguri-result.json
          if-no-files-found: ignore
          retention-days: 7

  # The Core result. always(): it must report even when a shard or lint
  # failed, was cancelled or never started, and then it fails. A skipped job
  # would count as passing, so this job never skips itself.
  core:
    name: Linux · core
    needs: [suites, core-build, core-shard, core-lint]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Download the shard receipts
        if: needs.suites.outputs.core == 'yes'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: meguri-linux-core-shard-*-result
          path: ${{ runner.temp }}/shards

      - name: Download the build receipt
        if: needs.suites.outputs.core == 'yes'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: meguri-linux-core-build-result
          path: ${{ runner.temp }}/build

      - name: Download the lint receipt
        if: needs.suites.outputs.core == 'yes'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: meguri-linux-core-lint-result
          path: ${{ runner.temp }}/lint

      - name: Require every Core shard and lint to pass on this commit
        shell: bash
        env:
          SUITES: ${{ needs.suites.result }}
          CORE: ${{ needs.suites.outputs.core }}
          BUILD_JOB: ${{ needs.core-build.result }}
          SHARD_JOBS: ${{ needs.core-shard.result }}
          LINT_JOB: ${{ needs.core-lint.result }}
          SHARDS: ${{ needs.suites.outputs.core_shards }}
        run: |
          fail() {
            echo "::error::$1"
            printf '### Linux · core: failed\n\n%s\n' "$1" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          }
          [[ "$SUITES" == success ]] || fail "Select suites ended $SUITES, so the Core selection is unknown."
          if [[ "$CORE" == no ]]; then
            printf '### Linux · core: not selected\n\nNo Core input changed, so no shard or lint ran.\n' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$CORE" == yes ]] || fail "Select suites gave no Core selection ('$CORE')."
          # Lint first, failing only after the shards: a lint failure must
          # not hide the shard results.
          lint="$RUNNER_TEMP/lint/meguri-result.json"
          lint_error=
          if [[ "$LINT_JOB" != success ]]; then
            lint_error="Linux · core · lint ended $LINT_JOB (failed, cancelled or not started)."
          elif [[ ! -f "$lint" ]]; then
            lint_error="Linux · core · lint left no receipt."
          elif ! jq -e --arg sha "$GITHUB_SHA" '
              .status == "pass" and .commit.sha == $sha and .commit.dirty == false
              and .job == "core-lint" and .args == [] and .summary.failed == 0 and .summary.passed > 0' "$lint" >/dev/null; then
            lint_error="The lint receipt is not a passing core-lint run on $GITHUB_SHA."
          fi
          printf 'Lint: %s\n\n' "${lint_error:-$(jq -r '.message' "$lint")}" >>"$GITHUB_STEP_SUMMARY"
          [[ "$BUILD_JOB" == success ]] || fail "Linux · core · build ended $BUILD_JOB (failed, cancelled or not started), so no shard ran."
          build="$RUNNER_TEMP/build/build.json"
          [[ -f "$build" ]] || fail "Linux · core · build left no build receipt."
          jq -e --arg sha "$GITHUB_SHA" '.status == "pass" and .commit.sha == $sha and .commit.dirty == false
            and .job == "core-test" and .args == ["--canaries"] and .summary.passed > 0' "$RUNNER_TEMP/build/canaries.json" >/dev/null 2>&1 ||
            fail "Linux · core · build left no passing canary receipt on $GITHUB_SHA."
          archive_sha="$(jq -r --arg sha "$GITHUB_SHA" '
            select(.status == "pass" and .commit.sha == $sha and .commit.dirty == false and .job == "core-test"
              and .args == ["--build-archive", "build/ci/core-tests.tar.zst"]) | .details.archive.sha256 // empty' "$build")"
          [[ "$archive_sha" =~ ^[0-9a-f]{64}$ ]] || fail "The build receipt is not a passing --build-archive run on $GITHUB_SHA."
          [[ "$SHARD_JOBS" == success ]] || fail "The Core shards ended $SHARD_JOBS (failed, cancelled or not started)."
          count="$(jq length <<<"$SHARDS")"
          ((count > 0)) || fail "The shard list is empty."
          jq -e '. == [range(1; length + 1)]' <<<"$SHARDS" >/dev/null || fail "The shard list $SHARDS is not 1..N."
          {
            echo "### Linux · core: $count shards"
            echo
            echo "| Shard | Passed | Failed | Skipped |"
            echo "| --- | --- | --- | --- |"
          } >>"$GITHUB_STEP_SUMMARY"
          total=0
          for shard in $(jq -r '.[]' <<<"$SHARDS"); do
            receipt="$RUNNER_TEMP/shards/meguri-linux-core-shard-$shard-result/meguri-result.json"
            [[ -f "$receipt" ]] || fail "Shard $shard left no receipt."
            jq -e --arg sha "$GITHUB_SHA" --arg partition "hash:$shard/$count" --arg archive "$archive_sha" '
              .status == "pass" and .commit.sha == $sha and .commit.dirty == false
              and .job == "core-test" and .summary.failed == 0 and .summary.passed > 0
              and .args == ["--quick", "--archive", "build/ci/core-tests.tar.zst", "--partition", $partition, "--exclude-list", ".github/core-timing-sensitive.txt"]
              and .details.hosted_selection.archive == {file: "build/ci/core-tests.tar.zst", sha256: $archive}
              and .details.hosted_selection.partition == $partition' "$receipt" >/dev/null ||
              fail "Shard $shard's receipt is not a passing hash:$shard/$count run on $GITHUB_SHA."
            jq -r --arg shard "$shard" '"| \($shard) | \(.summary.passed) | \(.summary.failed) | \(.summary.skipped) |"' \
              "$receipt" >>"$GITHUB_STEP_SUMMARY"
            total=$((total + $(jq '.summary.passed' "$receipt")))
          done
          {
            echo
            echo "$total passes across the shards (each shard also runs the canaries)."
            echo "Not covered here: the tests of .github/core-timing-sensitive.txt, which run in the advisory job **Linux · core (timing-sensitive)**:"
            jq -r '.details.hosted_selection.listed[]? | "- `\(.)`"' "$receipt"
          } >>"$GITHUB_STEP_SUMMARY"
          [[ -z "$lint_error" ]] || fail "$lint_error"

  # !cancelled(), not success(): when "Select suites" fails, each suite must
  # still report, and fail, rather than skip (a skipped check counts as passing).
  linux:
    name: Linux · ${{ matrix.suite }}
    needs: [suites, image]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    concurrency:
      group: meguri-verification-${{ github.ref }}-${{ matrix.suite }}-${{ needs.suites.outputs.linux == 'yes' && ((github.event_name == 'schedule' || inputs.cold) && 'cold' || 'run') || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        suite: [server, conformance, package-smoke]
    steps:
      - name: Check the suite selection
        id: selected
        shell: bash
        env:
          SUITES: ${{ needs.suites.result }}
          LINUX: ${{ needs.suites.outputs.linux }}
          SUITE: ${{ matrix.suite }}
        run: |
          if [[ "$SUITES" != success || ! "$LINUX" =~ ^(yes|no)$ ]]; then
            echo "::error::Select suites ended $SUITES without a selection, so this suite cannot report."
            exit 1
          fi
          echo "run=$LINUX" >>"$GITHUB_OUTPUT"
          if [[ "$LINUX" == no ]]; then
            printf '### Linux · %s: not selected\n\nNo input of this suite changed.\n' "$SUITE" >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.selected.outputs.run == 'yes'
        with:
          persist-credentials: false

      - name: Pull the shared dev image
        if: steps.selected.outputs.run == 'yes' && needs.image.outputs.ref != ''
        shell: bash
        env:
          REF: ${{ needs.image.outputs.ref }}
          TOKEN: ${{ github.token }}
        run: .github/dev-image.sh pull

      - name: Run Meguri verification
        if: steps.selected.outputs.run == 'yes'
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mg() {
            sudo -n env MEGURI_CI_DEV_IMAGE="${MEGURI_CI_DEV_IMAGE:-}" \
              GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory \
              GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/mg" "$@"
          }

          if [[ "$SUITE" == server || "$SUITE" == package-smoke ]]; then
            mg sync-web-image
            mg sync-web-deps --install
          fi

          case "$SUITE" in
            server) args=(sync-server-test) ;;
            conformance) args=(conformance --lane docker) ;;
            package-smoke)
              mg sync-web-browser-install
              args=(sync-server-package-test)
              ;;
            *) exit 2 ;;
          esac

          rc=0
          receipt="$(mg "${args[@]}")" || rc=$?
          artifact="$RUNNER_TEMP/meguri-result.json"
          receipt_prefix="$GITHUB_WORKSPACE/build/mg/${args[0]}/"
          receipt_suffix="${receipt#"$receipt_prefix"}"
          if [[ "$receipt" == "$receipt_prefix"* &&
                "$receipt_suffix" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+/result\.json$ ]] &&
             sudo -n test -f "$receipt"; then
            sudo -n cat -- "$receipt" > "$artifact.tmp"
            mv -- "$artifact.tmp" "$artifact"
          fi
          ((rc == 0))
          jq -e --arg sha "$GITHUB_SHA" --arg job "${args[0]}" \
            '.status == "pass" and .commit.sha == $sha and .commit.dirty == false and .job == $job' "$artifact"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.selected.outputs.run == 'yes'
        with:
          name: meguri-linux-${{ matrix.suite }}-result
          path: ${{ runner.temp }}/meguri-result.json
          if-no-files-found: ignore
          retention-days: 7

  # The clean-room similarity scan (docs/process/provenance.md, "Similarity
  # scan"). It fetches the pinned Anki release tags itself, into a directory
  # outside the checkout that no cache or artifact reads, and mounts them
  # read-only into the scanner. Its own index cache holds hashes plus Anki
  # paths and line numbers, never text, under a key and a path no other job
  # uses. It uploads nothing, and prints only what the filter in
  # .github/similarity.sh builds: file names, scores, counts and the verdict.
  # It needs no secret: only the read-only token of the checkout.
  similarity:
    name: Linux · similarity
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    # A pull request's newer run replaces its older one. Every other run has
    # a group of its own: a master push scans only what it pushed, and a
    # cancelled or dropped one would leave that unscanned.
    concurrency:
      group: meguri-verification-${{ github.ref }}-similarity-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # A change the scanner never reads (docs/, specs/, conformance data
      # outside scenarios and goldens, file types it has no lexer for)
      # passes in seconds with "not selected": a skipped job would count as
      # passing too, but would not say so.
      - name: Select what to scan
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: .github/similarity.sh select

      - name: Fetch the pinned Anki releases
        if: steps.select.outputs.run == 'yes'
        shell: bash
        run: .github/similarity.sh corpus "$RUNNER_TEMP/similarity-refs"

      # Keyed by the pin and the scanner (its code, config and the interop
      # vocabulary, which together decide the index), and only ever saved by
      # master pushes and manual runs, once per key. Cold runs build it.
      - name: Restore the similarity index
        id: index
        if: steps.select.outputs.run == 'yes' && github.event_name != 'schedule' && inputs.cold != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/similarity-index
          key: similarity-index-v1-${{ hashFiles('tools/similarity/config.yaml', 'tools/similarity/meguri_similarity/**', 'specs/*/interop-vocab.txt') }}

      - name: Build the scanner image
        if: steps.select.outputs.run == 'yes'
        shell: bash
        run: docker build --progress plain -f docker/similarity.Dockerfile --target similarity .

      - name: Scan
        if: steps.select.outputs.run == 'yes'
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REFS: ${{ runner.temp }}/similarity-refs
          BASE: ${{ steps.select.outputs.base }}
          CODE: ${{ steps.select.outputs.code }}
          AREAS: ${{ steps.select.outputs.areas }}
        run: .github/similarity.sh scan

      # Also after a scan that flagged something: the index is still good.
      - name: Save the similarity index
        if: >-
          !cancelled() && steps.select.outputs.run == 'yes' && steps.index.outputs.cache-hit != 'true'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && hashFiles('build/similarity-index/*/meta.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/similarity-index
          key: similarity-index-v1-${{ hashFiles('tools/similarity/config.yaml', 'tools/similarity/meguri_similarity/**', 'specs/*/interop-vocab.txt') }}

  # The cheap gate checks, on every run, one after another on one runner. Each
  # step runs even when an earlier one failed, and names its result in the
  # summary. static-checks compares the branch with its base: the base tip
  # for a pull request (the first parent of GitHub's merge commit, which the
  # trailers check skips as a merge), the previous tip for a push.
  checks:
    name: Linux · checks
    needs: image
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # Only a newer push to the same pull request cancels a run: on master,
    # each push checks its own range, and a scheduled or manual run must not
    # stop a push's checks.
    concurrency:
      group: meguri-verification-${{ github.ref }}-checks-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: true
    steps:
      # Full history: the trailers and sessions checks read every commit of
      # the branch and the commits the session records name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Find the base of this change
        id: base
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          case "$EVENT" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            push)
              # A previous tip the checkout lacks (after a force push) is
              # fetched; one that cannot be fetched fails the step rather
              # than widen or narrow the range.
              if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
                git cat-file -e "$BEFORE^{commit}" 2>/dev/null ||
                  git fetch --no-tags origin "$BEFORE" ||
                  { echo "::error::Cannot fetch the previous tip $BEFORE"; exit 1; }
                base="$BEFORE"
              fi
              ;;
          esac
          # Manual and scheduled runs, and a new branch's first push: where
          # the branch left master, or master's previous commit.
          if [[ -z "$base" ]]; then
            base="$(git merge-base origin/master HEAD)"
            [[ "$base" != "$(git rev-parse HEAD)" ]] || base="$(git rev-parse HEAD^1)"
          fi
          echo "Base: $base"
          echo "base=$base" >>"$GITHUB_OUTPUT"

      - name: Pull the shared dev image
        if: needs.image.outputs.ref != ''
        shell: bash
        env:
          REF: ${{ needs.image.outputs.ref }}
          TOKEN: ${{ github.token }}
        run: .github/dev-image.sh pull

      - name: static-checks
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: .github/mg-step.sh static-checks static-checks --base "$BASE"

      - name: lint-ui
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        shell: bash
        run: .github/mg-step.sh lint-ui lint-ui

      - name: design-docs
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        shell: bash
        run: .github/mg-step.sh design-docs design-docs

      - name: core-deny
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        shell: bash
        run: .github/mg-step.sh core-deny core-deny

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meguri-linux-checks-results
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: ignore
          retention-days: 7

  # The tools/mg self-tests (bats, in the dev image), for changes to tools/,
  # .github/ or docker/ only: share M of N of the test files on each runner
  # (`tools/mg selftest --shard M/N`), so the suite takes the time of its
  # slowest share instead of the sum.
  selftest-shard:
    name: Linux · selftest · shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: [suites, image]
    if: ${{ !cancelled() && needs.suites.result == 'success' && needs.suites.outputs.selftest == 'yes' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    concurrency:
      group: meguri-verification-${{ github.ref }}-selftest-${{ matrix.shard }}-${{ needs.suites.outputs.selftest == 'yes' && ((github.event_name == 'schedule' || inputs.cold) && 'cold' || 'run') || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.suites.outputs.selftest_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull the shared dev image
        if: needs.image.outputs.ref != ''
        shell: bash
        env:
          REF: ${{ needs.image.outputs.ref }}
          TOKEN: ${{ github.token }}
        run: .github/dev-image.sh pull

      # Some self-tests run git in /work inside the container, as root. The
      # runner's checkout belongs to the runner user, so git would refuse it
      # as a repository of another owner; root owns it for the run.
      - name: Give the checkout to root for the container
        shell: bash
        run: sudo chown -R 0:0 "$GITHUB_WORKSPACE"

      - name: selftest shard ${{ matrix.shard }}
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.suites.outputs.selftest_shards }}
        run: .github/mg-step.sh "selftest shard $SHARD/$(jq length <<<"$SHARDS")" selftest --shard "$SHARD/$(jq length <<<"$SHARDS")"

      - name: Give the checkout back to the runner user
        if: always()
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meguri-linux-selftest-shard-${{ matrix.shard }}-result
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: ignore
          retention-days: 7

  # The Python tests of the scripts that run in the image-tools container
  # (dev-icon, contact-sheet, hierarchy-check and the others it lists). The
  # job builds that image itself; it does not use the dev image.
  selftest-image-tools:
    name: Linux · selftest · image-tools
    needs: suites
    if: ${{ !cancelled() && needs.suites.result == 'success' && needs.suites.outputs.selftest == 'yes' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    concurrency:
      group: meguri-verification-${{ github.ref }}-selftest-image-tools-${{ needs.suites.outputs.selftest == 'yes' && ((github.event_name == 'schedule' || inputs.cold) && 'cold' || 'run') || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As for the shards: the container's root runs git in /work.
      - name: Give the checkout to root for the container
        shell: bash
        run: sudo chown -R 0:0 "$GITHUB_WORKSPACE"

      - name: image-tools-selftest
        shell: bash
        run: .github/mg-step.sh image-tools-selftest image-tools-selftest

      - name: Give the checkout back to the runner user
        if: always()
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meguri-linux-selftest-image-tools-result
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: ignore
          retention-days: 7

  # The selftest result. It skips, like its jobs, when the self-tests are not
  # selected (a skipped check counts as passing, and takes no runner). When
  # they are, !cancelled() makes it report even when a shard or the
  # image-tools job failed, was cancelled or never started, and then it fails.
  selftest:
    name: Linux · selftest
    needs: [suites, selftest-shard, selftest-image-tools]
    if: ${{ !cancelled() && needs.suites.result == 'success' && needs.suites.outputs.selftest == 'yes' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Download the shard receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: meguri-linux-selftest-shard-*-result
          path: ${{ runner.temp }}/shards

      - name: Download the image-tools receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: meguri-linux-selftest-image-tools-result
          path: ${{ runner.temp }}/image-tools

      - name: Require every shard and the image-tools tests to pass on this commit
        shell: bash
        env:
          SHARD_JOBS: ${{ needs.selftest-shard.result }}
          IMAGE_TOOLS_JOB: ${{ needs.selftest-image-tools.result }}
          SHARDS: ${{ needs.suites.outputs.selftest_shards }}
        run: |
          fail() {
            echo "::error::$1"
            printf '### Linux · selftest: failed\n\n%s\n' "$1" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          }
          # The image-tools tests first, failing only after the shards: their
          # failure must not hide the shard results.
          tools="$RUNNER_TEMP/image-tools/image-tools-selftest.json"
          tools_error=
          if [[ "$IMAGE_TOOLS_JOB" != success ]]; then
            tools_error="Linux · selftest · image-tools ended $IMAGE_TOOLS_JOB (failed, cancelled or not started)."
          elif [[ ! -f "$tools" ]]; then
            tools_error="Linux · selftest · image-tools left no receipt."
          elif ! jq -e --arg sha "$GITHUB_SHA" '
              .status == "pass" and .commit.sha == $sha and .commit.dirty == false
              and .job == "image-tools-selftest" and .args == [] and .summary.failed == 0 and .summary.passed > 0' "$tools" >/dev/null; then
            tools_error="The image-tools receipt is not a passing image-tools-selftest run on $GITHUB_SHA."
          fi
          printf 'image-tools: %s\n\n' "${tools_error:-$(jq -r '.message' "$tools")}" >>"$GITHUB_STEP_SUMMARY"
          count="$(jq length <<<"$SHARDS")"
          ((count > 0)) || fail "The shard list is empty."
          jq -e '. == [range(1; length + 1)]' <<<"$SHARDS" >/dev/null || fail "The shard list $SHARDS is not 1..N."
          {
            echo "### Linux · selftest: $count shards"
            echo
            echo "| Shard | Files | Passed | Failed | Skipped | Slowest file |"
            echo "| --- | --- | --- | --- | --- | --- |"
          } >>"$GITHUB_STEP_SUMMARY"
          receipts=()
          for shard in $(jq -r '.[]' <<<"$SHARDS"); do
            receipt="$RUNNER_TEMP/shards/meguri-linux-selftest-shard-$shard-result/selftest.json"
            if [[ ! -f "$receipt" ]]; then
              echo "| $shard | no receipt | | | | |" >>"$GITHUB_STEP_SUMMARY"
              continue
            fi
            receipts+=("$receipt")
            jq -r --arg shard "$shard" '
              "| \($shard) | \(.details.shard.files | length? // "?") | \(.summary.passed) | \(.summary.failed) | \(.summary.skipped) | \(
                (.details.file_seconds // {} | to_entries | max_by(.value) | "\(.key), \(.value | round) s")? // "") |"' \
              "$receipt" >>"$GITHUB_STEP_SUMMARY"
          done
          echo >>"$GITHUB_STEP_SUMMARY"
          [[ "$SHARD_JOBS" == success ]] || fail "The selftest shards ended $SHARD_JOBS (failed, cancelled or not started)."
          for shard in $(jq -r '.[]' <<<"$SHARDS"); do
            receipt="$RUNNER_TEMP/shards/meguri-linux-selftest-shard-$shard-result/selftest.json"
            [[ -f "$receipt" ]] || fail "Shard $shard left no receipt."
            jq -e --arg sha "$GITHUB_SHA" --arg spec "$shard/$count" --argjson index "$shard" --argjson count "$count" '
              .status == "pass" and .commit.sha == $sha and .commit.dirty == false
              and .job == "selftest" and .args == ["--shard", $spec]
              and .summary.failed == 0 and .summary.passed > 0
              and .details.shard.index == $index and .details.shard.count == $count
              and (.details.shard.files | length) > 0' "$receipt" >/dev/null ||
              fail "Shard $shard's receipt is not a passing --shard $shard/$count run on $GITHUB_SHA."
          done
          # Every test file in exactly one shard: the shards' lists share no
          # file and together hold as many as each shard counted in tools/tests.
          jq -e -s '
            ([.[].details.shard.files[]]) as $files
            | ([.[].details.shard.all_files] | unique) as $all
            | ($all | length) == 1 and ($files | length) == $all[0] and ($files | unique | length) == $all[0]' \
            "${receipts[@]}" >/dev/null ||
            fail "The shards did not run every test file exactly once: $(jq -c -s '{ran: ([.[].details.shard.files[]] | length), distinct: ([.[].details.shard.files[]] | unique | length), test_files: ([.[].details.shard.all_files] | unique)}' "${receipts[@]}")."
          jq -r -s '"\([.[].summary.passed] | add) passed and \([.[].summary.skipped] | add) skipped in \([.[].details.shard.files[]] | length) test files, each in one shard."' \
            "${receipts[@]}" >>"$GITHUB_STEP_SUMMARY"
          [[ -z "$tools_error" ]] || fail "$tools_error"

  # Advisory until it has passed on ten pull requests (docs/process/tiers.md):
  # Antoine (2026-11-21) let unsigned Swift package tests run on GitHub's
  # hosted macOS runner. MeguriCore's tests on the Xcode this project pins,
  # with the Debug core XCFramework built here. Nothing is signed, no secret
  # is read, and nothing runs in a simulator, the test VM or the app. lint-ui
  # needs Docker, which these runners lack, so swift-test leaves it to Linux ·
  # checks, which lints the same commit.
  swift:
    name: macOS · Swift packages
    needs: suites
    if: ${{ !cancelled() && needs.suites.result == 'success' && needs.suites.outputs.swift == 'yes' }}
    continue-on-error: true
    permissions:
      contents: read
    runs-on: xcode-27
    timeout-minutes: 60
    concurrency:
      group: meguri-verification-${{ github.ref }}-swift-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: true
    env:
      # The Xcode this Mac and the test VM use (tools/mg doctor needs 27.1 or
      # newer). The image keeps it at this path.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      MEGURI_CI_LINT_UI_ELSEWHERE: Linux · checks
      # Keeps the cached core/target small: no incremental state.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the pinned Xcode
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -version | grep -qx 'Xcode 27.2' ||
            { echo "::error::$DEVELOPER_DIR is not Xcode 27.2"; exit 1; }
          xcrun --sdk macosx --show-sdk-version

      # The pinned Rust toolchain with its Apple targets, the cargo registry
      # and the Apple builds of the core. Saved by master pushes and manual
      # runs, once per key; pull requests read master's. A fresh checkout
      # gives every source file a new time, so cargo rebuilds the local
      # crates from this commit's source.
      - name: Restore the Rust and XCFramework cache
        id: cache
        if: github.event_name != 'schedule' && inputs.cold != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            core/target
          key: swift-core-v1-${{ runner.os }}-${{ runner.arch }}-xcode27.2-${{ hashFiles('core/rust-toolchain.toml') }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: swift-core-v1-${{ runner.os }}-${{ runner.arch }}-xcode27.2-${{ hashFiles('core/rust-toolchain.toml') }}-

      # The toolchain, components and Apple targets core/rust-toolchain.toml
      # pins (a no-op when the cache restored them).
      - name: Install the pinned Rust toolchain
        shell: bash
        run: cd core && rustup toolchain install && rustc -V

      - name: swift-test MeguriCore
        shell: bash
        env:
          MG_STEP_SUDO: "no"
        run: |
          # The tests of .github/swift-timing-sensitive.txt, skipped by name.
          skips=()
          while read -r name _ || [[ -n "$name" ]]; do
            [[ -n "$name" && "$name" != \#* ]] || continue
            [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::bad line in .github/swift-timing-sensitive.txt: $name"; exit 1; }
            skips+=(--skip "$name")
          done < .github/swift-timing-sensitive.txt
          .github/mg-step.sh "swift-test MeguriCore" swift-test --package MeguriCore ${skips[0]+-- "${skips[@]}"}

      # Only third-party crates, as in the Linux caches: local packages'
      # artifacts and the profile roots' copies are deleted, and an entry over
      # 3 GB is not saved. Also after a failing test run: the builds are good.
      - name: Keep only third-party crates in the cache
        id: prune
        if: >-
          !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pkgs="$(find core -name Cargo.toml -not -path '*/target/*' -print0 |
            xargs -0 awk 'FNR == 1 { p = 0 } /^\[package\]/ { p = 1; next } /^\[/ { p = 0 }
              p && /^name[[:space:]]*=/ { gsub(/[" ]/, ""); sub(/^name=/, ""); print }' | sort -u)"
          [[ -n "$pkgs" ]] || { echo "::error::No local packages found"; exit 1; }
          for dir in core/target/*/ core/target/*/*/; do
            [[ -d "$dir/deps" ]] || continue
            rm -rf -- "$dir/incremental"
            while IFS= read -r p; do
              u="${p//-/_}"
              rm -rf -- "$dir"deps/"$u"-* "$dir"deps/lib"$u"-* "$dir".fingerprint/"$p"-* "$dir"build/"$p"-*
            done <<<"$pkgs"
            find "$dir" -maxdepth 1 -type f -delete
          done
          size="$(du -smc ~/.rustup/toolchains ~/.cargo/registry/index ~/.cargo/registry/cache core/target 2>/dev/null | tail -n 1 | cut -f1)"
          echo "Swift job cache: $size MB"
          if ((size > 3072)); then
            echo "::warning::Swift job cache is $size MB, over its 3072 MB cap; not saving it."
            echo "save=no" >>"$GITHUB_OUTPUT"
          else
            echo "save=yes" >>"$GITHUB_OUTPUT"
          fi

      - name: Save the Rust and XCFramework cache
        if: ${{ !cancelled() && steps.prune.outputs.save == 'yes' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            core/target
          key: swift-core-v1-${{ runner.os }}-${{ runner.arch }}-xcode27.2-${{ hashFiles('core/rust-toolchain.toml') }}-${{ hashFiles('core/Cargo.lock') }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meguri-macos-swift-result
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: ignore
          retention-days: 7

  apple:
    name: Unsigned Apple Core build pilot
    if: github.event_name == 'workflow_dispatch' && inputs.apple
    runs-on: xcode-27
    timeout-minutes: 60
    concurrency:
      group: meguri-verification-${{ github.ref }}-apple
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Debug Core XCFramework
        shell: bash
        run: |
          rc=0
          receipt="$(tools/mg core-xcframework --configuration Debug --slices mac,sim)" || rc=$?
          if [[ -f "$receipt" ]]; then
            cp "$receipt" "$RUNNER_TEMP/meguri-result.json"
          fi
          ((rc == 0))
          jq -e --arg sha "$GITHUB_SHA" \
            '.status == "pass" and .commit.sha == $sha and .commit.dirty == false' "$receipt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meguri-apple-core-pilot-result
          path: ${{ runner.temp }}/meguri-result.json
          if-no-files-found: ignore
          retention-days: 7
