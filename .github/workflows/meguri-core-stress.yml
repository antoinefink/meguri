# SPDX-License-Identifier: MIT
name: Verify Core at scale

# `tools/mg core-test --stress`: exactly the three full-scale Core cases that
# the quick suite leaves out (docs/process/tiers.md, "Hosted checks").
#
# When "stress" runs:
# - a pull request or master push that changes an input of those cases: the
#   Rust workspace (core/**), the dev image (docker/compose.yml,
#   docker/dev.Dockerfile and its .dockerignore, .github/dev-image.sh), the
#   job that runs them
#   (tools/mg, tools/mg.d/core.sh) or this file. These are the paths below.
#   The cases read no specs, conformance data or app sources, so a change to
#   those alone (or to docs/) does not run them, and then no "stress" check
#   appears on the pull request at all;
# - every night at 02:37 UTC on master, and on manual runs.

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/meguri-core-stress.yml'
      - 'core/**'
      - '.github/dev-image.sh'
      - 'docker/compose.yml'
      - 'docker/dev.Dockerfile*'
      - 'tools/mg'
      - 'tools/mg.d/core.sh'
  push:
    branches: [master]
    paths:
      - '.github/workflows/meguri-core-stress.yml'
      - 'core/**'
      - '.github/dev-image.sh'
      - 'docker/compose.yml'
      - 'docker/dev.Dockerfile*'
      - 'tools/mg'
      - 'tools/mg.d/core.sh'
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meguri-core-stress-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hash the image inputs
        id: hash
        shell: bash
        run: |
          hash="$(.github/dev-image.sh hash)"
          echo "hash=$hash" >>"$GITHUB_OUTPUT"

      # Master's dev image of this hash, as "Verify Meguri" records it
      # (.github/dev-image.sh); without a record, tools/mg builds the image.
      - name: Restore the record of master's image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dev-image-digest
          key: dev-image-v1-${{ steps.hash.outputs.hash }}-${{ github.run_id }}
          restore-keys: dev-image-v1-${{ steps.hash.outputs.hash }}-

      - name: Pull the shared dev image
        id: pull
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          DIGEST_FILE: ${{ runner.temp }}/dev-image-digest
        run: .github/dev-image.sh pull

      # Read only: the Core shards of "Verify Meguri" save this cache.
      - name: Restore the Rust dependency cache
        if: steps.pull.outputs.used == 'yes'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/index
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-target
          key: core-deps-v1-${{ steps.hash.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: core-deps-v1-${{ steps.hash.outputs.hash }}-

      - name: Run the three full-scale Core cases
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-home" "$RUNNER_TEMP/cargo-target"
          rc=0
          receipt="$(sudo -n env MEGURI_CI_DEV_IMAGE="${MEGURI_CI_DEV_IMAGE:-}" \
            MEGURI_DOCKER_CARGO_HOME="$RUNNER_TEMP/cargo-home" MEGURI_DOCKER_CARGO_TARGET="$RUNNER_TEMP/cargo-target" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory \
            GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/mg" \
            core-test --stress)" || rc=$?
          if [[ -f "$receipt" ]]; then
            cp "$receipt" "$RUNNER_TEMP/meguri-result.json"
          fi
          ((rc == 0))
          jq -e --arg sha "$GITHUB_SHA" \
            '.status == "pass" and .commit.sha == $sha and .commit.dirty == false
            and .job == "core-test" and .args == ["--stress"]
            and .placement == "docker" and .service == "dev"
            and .summary == {total: 3, passed: 3, failed: 0, skipped: 0}
            and (.details.stress_tests | type == "array" and length == 3)' "$receipt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meguri-core-stress-result
          path: ${{ runner.temp }}/meguri-result.json
          if-no-files-found: ignore
          retention-days: 7
