[workspace]
resolver = "3"
members = ["."]

[package]
name = "meguri-sync-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
# Only the [[test]] targets below build (tests/main.rs is server_it).
autotests = false

[features]
default = []
# Deterministic pause/failure/kill controls. Never enable in a shipped binary.
test-hooks = []

[dependencies]
# Deliberately selected exact pins; see DEPENDENCIES.md for per-crate rationale.
# The resolved graph requires maintenance/advisory/license review through MG.
tokio = { version = "=1.53.3", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "=0.8.8", default-features = false, features = ["http1", "tokio", "json"] }
http-body = { version = "=1.1.0", default-features = false }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "backup", "collation"] }
meguri-model = { path = "../core/crates/meguri-model", default-features = false }
unicase = { version = "=2.6.0", default-features = false }
zstd = { version = "=0.14.4", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
getrandom = "=0.4.3"
rand = { version = "=0.9.4", default-features = false, features = ["std_rng"] }
# Legacy note checksum and media protocol digest; never an authorization proof.
sha1 = { version = "=0.11.0", default-features = false }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rawzip = { version = "=0.5.2", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
unicode-normalization = "=0.1.24"
regex = { version = "=1.11.2", default-features = false, features = ["std", "perf", "unicode"] }
htmlescape = { version = "=0.3.1", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
base64 = "=0.23.1"
url = "=2.5.9"
time = { version = "=0.3.55", default-features = false, features = ["std", "formatting"] }
libc = "=0.2.190"

[dev-dependencies]
tempfile = "=3.27.0"
# Real loopback HTTP client only; no external endpoints or TLS graph needed.
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }

# Integration tests: one binary. A file gets its own target only when it
# cannot share that binary, with the reason.
[[test]]
name = "server_it"
path = "tests/main.rs"
