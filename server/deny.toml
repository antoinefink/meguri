[graph]
all-features = true

[advisories]
unsound = "all"
unmaintained = "all"
yanked = "deny"

[licenses]
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Unlicense", "Zlib"]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
