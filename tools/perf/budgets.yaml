        percentile: p95
        limit: 0
        fixture: review-corpus-scripted
        where: [simulator, device]
        simulator: regression
        pending: U243
      - id: frames-p99
        suite: ReviewLoopPerfTests
        name: review.answerToNextVisible
        relative_to: probe.nativeSwap
        metric: frames
        unit: frames
        percentile: p99
        limit: 1
