probes:
  # The harness's own interval (U12): `perf/probe` emits it around a 30 ms
  # delay. No budget; the +10% rule against its baseline.
  - id: smoke-probe
    title: The smoke screen's named interval (U12), evaluated per change
    group: smoke
    cases:
      - id: synthetic-delay
        suite: SmokePerfTests
        name: probe.syntheticDelay
        metric: duration
        unit: ms
        percentile: p50
        limit: null
        fixture: null
        where: [simulator, device]
        note: p50, not p95. Over the smoke's 5 iterations p95 is the slowest one, which moved 7% between three runs on the VM's iPhone simulator (36.5 to 39.1 ms) while p50 stayed at 34.1-34.3 ms; a check of the harness should not flake on one slow iteration.
