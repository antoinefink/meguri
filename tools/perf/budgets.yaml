# Performance budget catalog (U241; R1802, R1803, R1861-R1864, R1866).
#
# One entry per budget of the plan's Performance requirements R1807-R1855,
# plus R1583, mapped to the intervals and benchmarks that measure it. `tools/mg
# perf-gate` judges perf results (tools/perf/perf-result.schema.json, written
# by perf-ui, bench, bench-mac and bench-icount) against it and against the
# baselines under tools/perf/baselines/; `tools/mg perf-gate --check` keeps it
# equal to the plan, the interval registry, the UI performance tests and
# docs/process/milestones.yaml. tools/scripts/gates/perf_gate.py is the
# evaluator; its docstring states the rules.
#
# Entry fields:
#   id       the budget's R-ID (probes: a slug; probes gate the harness itself)
#   title    what the budget holds
#   group    perf-gate's group (details.groups of its result); the perf-gate
#            suites of milestones.yaml scope these
#   devices  the device families it applies to (default iphone, ipad, mac);
#            equal to milestones.yaml budget_devices
#   cases    the measurements that prove it, each:
#     id          slug, unique in the entry (key: <entry>/<id>)
#     suite       the perf result's suite: a PerfTestCase subclass for UI
#                 placements, a bench target for core ones
#     test        a glob on the result row's test (Class/testMethod()) when one
#                 suite measures the same interval under different conditions
#     name        the interval (IntervalNames, R1861), xctest.<metric> for
#                 XCTest's own metrics, or the benchmark name
#     relative_to the interval whose value at the same percentile is
#                 subtracted first (frames against the native-swap baseline)
#     metric, unit  as the perf result rows carry them
#     percentile  p50, p95, p99 or max (default p95)
#     limit       the budget at `fixture`, in `unit`; null only while pending
#     strict      true for "below": the limit itself fails
#     fixture     the collection it is stated for (default 150k); a size
#                 (10k, 150k, 500k, 1m) or a named fixture (exact match). A
#                 row without a fixture fits only `fixture: null`: it is
#                 never taken at the case's (PerfTestCase.fixture). Rows at
#                 other sizes are judged, but only one at this fixture proves
#                 the case: a 1M completion leaves a 150k case missing.
#     multiplier_500k, rule_1m  R1803: a time budget stated at 150k or less
#                 may be 2x at up to 500k; above 500k a result only has to
#                 exist (completes, no crash or hang)
#     where       core-docker, core-mac, simulator (iOS simulators and the Mac
#                 in the test VM) and device (real iPhone and iPad, the Mac
#                 host); every limit a budget states has a device case (R1802,
#                 U256), not only a core bench
#     simulator   regression: only the +10% rule on simulators, whatever the
#                 unit (KTD19: R1807, R1808, R1815)
#     pending     the unit that lands the measurement. A pending case is
#                 judged when a result measures it, and its group reports
#                 pending until then. The owning unit implements the name,
#                 suite, test and fixture given here (or changes them here in
#                 its own change), registers new intervals in IntervalNames and
#                 removes `pending`; from then on --check requires its suite
#                 to declare the interval and call measure(app:), and every
#                 result of that suite must measure it (R1861).
#     note        why a number or a choice is what it is
#
# Rules: budgets are absolute on devices and in the Mac core benchmarks. On
# simulators only frame, hitch-ratio (ms/s), memory (MB) and count budgets are
# absolute; ms budgets get the regression rule alone. UI metrics fail above
# +10% against their baseline (R1863), instruction counts above +5% (R1864);
# wall-clock benches are tracked (p50, p95, p99) and fail only on a breach.

version: 1
plan: docs/plans/2026-10-12-1926-feat-meguri-anki-compatible-apple-app-plan.md
budget_range: [R1807, R1855]
extra_budgets: [R1583]
registry: app/Packages/MeguriCore/Sources/Instrumentation/IntervalNames.swift
perf_tests: app/MeguriUITests/Performance

rules:
  ui_regression_percent: 10      # R1863
  icount_regression_percent: 5   # R1864
  simulator_absolute_units: [frames, ms/s, MB, count]
  time_units: [ms, s]

defaults:
  fixture: 150k
  percentile: p95
  multiplier_500k: 2
  rule_1m: completes

groups:
  launch: Launch and the start of a review (R1813, R1818)
  review: The answer write (R1817)
  open: Opening the collection (R1823)
  sync: Normal, full and media sync (R1842-R1844)
  bulk: Bulk operations and Find and Replace (R1831, R1832)
  import: Imports (R1846)
  check-database: Check Database (R1847)
  backup: Backups (R1848)
  memory-states: FSRS memory-state recompute (R1849)
  optimizer: FSRS parameter optimization (R1850)
  review-loop: The review loop's frame, reveal, undo, menu, audio and hitch budgets (R1807-R1812, R1814-R1816)
  home: Home and the deck list (R1819-R1822)
  browser-search: Search and the browser (R1824-R1830)
  editor: The editors (R1833-R1836)
  stats: Stats, heatmap and card info (R1837-R1839, R1841)
  widget: Widgets (R1840)
  memory: Peak memory and memory growth (R1851-R1853)
  idle: Idle CPU (R1854)
  media: Media folder checks (R1583, R1855)
  sync-coexistence: Studying during sync (R1845)
  smoke: The performance harness's own probe (U12)

budgets:
  # --- Review loop (U243: ReviewLoopPerfTests, ReviewRevealPerfTests,
  # ReviewMenuOpsPerfTests; fixtures from profiles/review-corpus.toml) ------
  - id: R1807
    title: After an answer the next question appears in the earliest frame (p95), at most one frame later at p99, against a native view swap on the same device
    group: review-loop
    cases:
      - id: frames-p95
        suite: ReviewLoopPerfTests
        name: review.answerToNextVisible
        relative_to: probe.nativeSwap
        metric: frames
        unit: frames
        percentile: p95
        limit: 0
        fixture: review-corpus
        where: [simulator, device]
        simulator: regression
        pending: U243
      - id: frames-p99
        suite: ReviewLoopPerfTests
        name: review.answerToNextVisible
        relative_to: probe.nativeSwap
        metric: frames
        unit: frames
        percentile: p99
        limit: 1
        fixture: review-corpus
        where: [simulator, device]
        simulator: regression
        pending: U243
      - id: settle-p99
        suite: ReviewLoopPerfTests
        name: review.presentToNextSettled
        metric: duration
        unit: ms
        percentile: p99
        limit: null
        fixture: review-corpus
        where: [simulator, device]
        pending: U243
        note: The layer budget under R1807 (U176). Its limit is the p5 of the real dwell histogram (core/crates/meguri-testkit/profiles/review-dwell.json, U243), so with every card at fastest-5% dwell at most 1% of swaps wait on settle.
  - id: R1808
    title: R1807 also holds for script-heavy (Migaku-like), image occlusion and type-in cards
    group: review-loop
    cases:
      - id: frames-p95
