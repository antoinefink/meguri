  - {job: sync-web-browser, why: "Focused real browser journey against an owned preview; sync-web-verify uses a private gate fixture"}
  - {job: sync-web-preview-down, why: "Explicit cleanup of the owned persistent preview; never stop it for gates"}
  - {job: sync-web-preview-up, why: "Explicit user preview with published loopback ports; never a gate service"}
  - {job: sync-web-actualserver-build, why: "On-demand real server and asset build; sync-web-verify covers gates"}
  - {job: sync-web-check, why: "Focused frontend type, unit and build checks; sync-web-verify covers gates"}
  - {job: sync-web-build, why: "Focused embedded asset build; sync-web-verify covers gates"}
  - {job: sync-web-unit, why: "Focused real frontend unit proofs; sync-web-verify covers gates"}
  - {job: sync-web-typecheck, why: "Focused frontend type check; sync-web-verify covers gates"}
  - {job: sync-web-browser-install, why: "On-demand pinned browser acquisition; sync-web-verify prepares its browser runtime"}
  - {job: sync-web-deps, why: "On-demand locked frontend dependency audit and preparation; sync-web-verify covers gates"}
  - {job: sync-web-image, why: "On-demand pinned frontend/browser image; sync-web-verify prepares the required gate runtime"}
  - {job: cloud-fetch-probe-host, why: "On-demand SDK observation; no gate evidence"}
  - {job: cloud-record-read-host, why: "On-demand read-only acknowledged-record observation; no gate or acceptance evidence"}
