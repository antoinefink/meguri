# Test tiers (R1950, KTD23, oracle-harness.md section 6; docs/process/tiers.md).
#
# Each run is one `tools/mg <job> <args>` call with its tier, the paths that
# trigger it, where its work happens (R1952) and a time budget. `tools/mg gate`
# runs T0 and T1 for their changed paths; `tools/mg nightly` runs T2; `tools/mg
# milestone <M>` runs in full the T0, T1 and T3 runs M's gate reads
# (docs/process/milestones.yaml) and lists its T4 runs; `tools/mg milestone
# release` runs every T0, T1, T3 and T4 run. Every registered tools/mg job is a
# run here or a utility below: `tools/mg gate` refuses this file otherwise.
#
# Run fields:
#   id            unique slug; receipts and quarantine entries name it
#   job, args     the tools/mg call. Placeholders: {base} (the commit the
#                 change is measured from), {tip} (the commit under test),
#                 {seed} (the nightly seed, R1937), {milestone}; and, as a
#                 whole argument, {artifact:<run id>:<file name>}: that file
#                 among the artifacts of an earlier run of the same gate (the
#                 run is unresolved, and blocks, when there is none)
#   tier          T0..T4
#   stage         static and canary run before every other run; a canary
#                 whose failure blocks (not quarantined) stops the gate (AE82
#                 ordering). Default main.
#   triggers      path globs (`**`, `*`, trailing `/`, leading `!` excludes);
#                 absent: every change. T2-T4 runs have none.
#   filters       instead of triggers, for conformance: path glob -> scenario
#                 filters appended to args; `*` selects every scenario
#   placement     where the run's work happens: host, vm (the macOS test VM)
#                 or docker:<service>; a list when it spans several
#   needs         oracle, sync-server, image-diff and frame-extraction run in
#                 Docker; simulator, device, mac-ui and vm on the host or the
#                 VM (R1952); refs and private-data only in the main checkout
#   budget_s      time budget; a run over it is reported, not failed
#   local         runs in `tools/mg gate --local` (default true); the
#                 similarity scan and oracle-image runs do not (U2)
#   where         worktree (default), main or tip. Outside the main checkout,
#                 `tools/mg merge` runs a main run from the main checkout with
#                 merge_args, against the branch's tree, and a tip run with
#                 its args in a full checkout of the branch tip (the branch's
#                 code and oracle/, the main checkout's similarity corpus)
#   oracle        an oracle-image run: it needs the branch's own oracle/. A
#                 checkout without one uses the main checkout's when that is
#                 this HEAD's; otherwise the merge runs it in its tip checkout
#   oracle_files  reads files of the branch's oracle/ without its image (the
#                 pin's lock, the harvest inventory): runs in gate --local, but
#                 where the oracle/ it would read is not this HEAD's, the gate
#                 defers it as it does an oracle-image run
#   class        unit, conformance, sync, data-safety, ui, perf, static,
#                 tooling or similarity; quarantined tests of a conformance,
#                 sync or data-safety run fail every milestone run (R1953)
#   schedule      T2: nightly or weekly
#   require       pass rules on the job's result: {id, summary, max} or
#                 {id, detail, only_keys}; `release: true` applies one only in
#                 release runs
#   release_only  T3 runs that only `tools/mg milestone release` runs
#   user_step     T4: performed by Antoine (U256); the run reports it as
#                 awaiting him, and its job need not be a tools/mg job. A
#                 milestone run lists it when the milestone has a user step
#                 whose validator type is this value (device-run)
#   pending       the unit that lands the job; the run is listed and reported,
#                 never run. Once the job is registered this file is refused
#                 until the run is wired (pending removed).
#   disabled      the job exists, but this run waits for the unit named here
#   blocking      false: reported, never fails the gate (default true)

version: 1

tiers:
  T0: {when: every change, what: "static checks, canaries, committed goldens on macOS and Linux, unit tests, lint, dependency gate, similarity scan, snapshot and accessibility tests for touched UI, simulator perf smoke for touched hot paths", budget: "conformance part under 60 s"}
  T1: {when: changes matching each run's triggers, what: "live oracle suites for the touched areas, server interoperability, sync smoke, oracle-checked fixtures", budget: "2-5 min"}
  T2: {when: nightly (weekly for the weekly runs), what: "fuzzing with a logged seed, JPlag, Meguri-versus-Anki timing, long simulations, the full sync, media and fault matrix", budget: "60-90 min"}
  T3: {when: milestone and release, what: "private collection suite, macOS-native oracle confirmation, Mac benchmarks, harvest coverage (R1880), release audit", budget: "10-30 min plus the benchmarks"}
  T4: {when: milestone and release, what: "on-device performance, performed by Antoine (U256)", budget: "per R1863"}

runs:
  # --- T0: static ------------------------------------------------------------
  - id: static
    job: static-checks
    args: [--base, "{base}"]
    tier: T0
    stage: static
    placement: host
    class: static
    budget_s: 60
  - id: static-tree
    job: static-checks
    args: [--base, "{base}"]
    merge_args: [--rev, "{tip}", --base, "{base}"]
    tier: T0
    stage: static
    placement: host
    class: static
    budget_s: 60
    local: false
    where: main

  # --- T0: canaries (AE82: a pin bump fails before anything else) -----------
  - id: pin-canary
    job: core-test
    args: [--canaries]
    tier: T0
    stage: canary
    placement: docker:dev
    class: unit
    triggers: [core/, tools/mg.d/core.sh]
    budget_s: 600
  - id: canary-scenarios
    job: conformance
    # The 10,000-pair fuzz table (pending until U45 activates it), its smoke
    # subset and the unicase collation canaries.
    args: [--lane, all, fp-probe/corpus/fuzz-table, smoke/fuzz-table-small, text/fold/unicase, storage/open/collation]
    tier: T0
    stage: canary
    placement: [host, docker:dev]
    class: conformance
    triggers: [core/, conformance/scenarios/, conformance/goldens/, conformance/goldens-apple/, tools/mg.d/conformance.sh]
    budget_s: 900

  # --- T0: Rust ---------------------------------------------------------------
  - id: core-lint
    job: core-lint
    tier: T0
    placement: docker:dev
    class: static
    triggers: [core/, tools/mg.d/core.sh, tools/scripts/ankiweb-scan.py]
    budget_s: 1200
  - id: core-deny
    job: core-deny
    tier: T0
    placement: docker:dev
    class: static
    triggers: ["core/**/Cargo.toml", core/Cargo.lock, core/deny.toml, tools/mg.d/core.sh]
    budget_s: 600
  - id: core-test
    job: core-test
    args: [--, --features, meguri-ffi/test-hooks]
    tier: T0
    placement: docker:dev
    class: unit
    triggers: [core/, conformance/, tools/mg.d/core.sh, tools/mg.d/conformance.sh, tools/mg.d/oracle.sh, "!conformance/schema/meguri-sync-server.schema.json", "!conformance/catalog/meguri-sync-server.json", "!conformance/fixtures/meguri-sync-server/", "!conformance/recordings/scenarios/meguri-sync-server/"]
    budget_s: 2400
  - id: sync-server-test
    job: sync-server-test
    tier: T0
    placement: docker:dev
    class: unit
    triggers: &sync-server [server/, tools/mg.d/meguri-sync.sh, core/crates/meguri-model/, core/Cargo.toml, core/rust-toolchain.toml, docker/dev.Dockerfile, docker/compose.yml, docker/dev.Dockerfile.dockerignore]
    budget_s: 2400
  - id: sync-server-lint
    job: sync-server-lint
    tier: T0
    placement: docker:dev
    class: static
    triggers: *sync-server
    budget_s: 1200
  - id: sync-server-deps
    job: sync-server-deps
    tier: T0
    placement: docker:dev
    class: static
    triggers: [server/Cargo.toml, server/Cargo.lock, server/deny.toml, server/about.toml, server/DEPENDENCIES.md, server/LICENSE, server/rust-toolchain.toml, tools/mg.d/meguri-sync.sh, core/crates/meguri-model/, core/Cargo.toml, core/rust-toolchain.toml, docker/dev.Dockerfile, docker/compose.yml, docker/dev.Dockerfile.dockerignore]
    budget_s: 600
  - id: sync-server-package-test
    job: sync-server-package-test
    tier: T0
    placement: host
    class: data-safety
    triggers: [tools/tests/sync_package.bats, tools/tests/sync_package_context_test.py, server/, core/crates/meguri-model/, core/Cargo.toml, core/rust-toolchain.toml, tools/mg, tools/mg.d/sync-package.sh, tools/mg.d/meguri-sync.sh, tools/mg.d/sync-web.sh, tools/mg.d/host.sh, docker/dev.Dockerfile, docker/dev.Dockerfile.dockerignore, docker/compose.yml, docker/sync-web-compose.yml, docker/sync-web.Dockerfile, docker/sync-web.Dockerfile.dockerignore]
    budget_s: 3600
  - id: meguri-provider-real-server
    job: meguri-provider-real-server
    tier: T1
    placement: [host, docker:dev]
    class: sync
    triggers: [server/, core/crates/meguri-host/, core/crates/meguri-sync/, core/crates/meguri-engine/, core/crates/meguri-storage/, core/crates/meguri-package/, core/crates/meguri-model/, core/Cargo.toml, core/Cargo.lock, core/rust-toolchain.toml, specs/sync/meguri-provider.md, tools/mg, tools/mg.d/meguri-provider-test.sh, tools/mg.d/sync-package.sh, tools/mg.d/meguri-sync.sh, tools/mg.d/host.sh, tools/tests/meguri_provider_real_server.bats, tools/gate/tiers.yaml, docker/dev.Dockerfile, docker/dev.Dockerfile.dockerignore, docker/compose.yml]
    budget_s: 3600
  - id: native-durability
    job: native-durability
    tier: T0
    placement: host
    class: data-safety
    triggers: [core/crates/meguri-ffi/, core/crates/meguri-host/, core/crates/meguri-engine/src/lifecycle/, core/crates/meguri-engine/src/suspend.rs, core/crates/meguri-engine/src/executor/, core/crates/meguri-engine/src/session/journal.rs, core/crates/meguri-engine/src/session/service.rs, core/crates/meguri-engine/tests/session_recovery.rs, core/crates/meguri-engine/tests/session_support/, core/crates/meguri-engine/Cargo.toml, core/crates/meguri-engine/tests/suspend.rs, core/crates/meguri-engine/tests/wal_durability.rs, core/crates/meguri-storage/src/durability.rs, core/crates/meguri-storage/src/pragmas.rs, core/crates/meguri-storage/src/persistent_identity.rs, core/crates/meguri-storage/src/connections.rs, core/crates/meguri-storage/src/lib.rs, core/crates/meguri-storage/Cargo.toml, core/crates/meguri-sync/src/cloud/, core/crates/meguri-sync/tests/cloud_records.rs, core/crates/meguri-sync/tests/cloud_recovery.rs, core/crates/meguri-sync/Cargo.toml, tools/mg.d/native-durability.sh, tools/tests/native_durability.bats]
    budget_s: 1800

  # --- T0: conformance on the committed goldens --------------------------------
  - id: conformance
    job: conformance
    args: [--lane, all]
    tier: T0
    placement: [host, docker:dev]
    class: conformance
    triggers: [core/, conformance/, tools/mg.d/conformance.sh, tools/mg.d/oracle.sh, "!conformance/schema/meguri-sync-server.schema.json", "!conformance/catalog/meguri-sync-server.json", "!conformance/fixtures/meguri-sync-server/", "!conformance/recordings/scenarios/meguri-sync-server/"]
    budget_s: 1200
  - id: goldens-check
    job: goldens-check
    args: [--base, "{base}"]
    tier: T0
    placement: [host, docker:dev]
    class: conformance
    triggers: [conformance/, core/crates/meguri-testkit/, core/tools/meguri-cli/, tools/conformance/, tools/mg.d/conformance.sh, "!conformance/schema/meguri-sync-server.schema.json", "!conformance/catalog/meguri-sync-server.json", "!conformance/fixtures/meguri-sync-server/", "!conformance/recordings/scenarios/meguri-sync-server/"]
    oracle_files: true
    budget_s: 900
  - id: harvest-report
    job: harvest-report
    tier: T0
    placement: [host, docker:dev]
    class: conformance
    triggers: [conformance/catalog/, conformance/scenarios/, core/crates/meguri-testkit/src/catalog.rs, tools/mg.d/conformance.sh, "!conformance/catalog/meguri-sync-server.json"]
    oracle_files: true
    budget_s: 900

  # The wrapper orchestrates its own Docker reference image.
  - id: sync-server-reference-selftest
    job: sync-server-reference
    args: [selftest]
    tier: T0
    placement: host
    class: conformance
    oracle_files: true
    triggers: [oracle/meguri-sync-server/, docker/meguri-sync-reference.Dockerfile, docker/meguri-sync-reference.Dockerfile.dockerignore, docker/meguri-sync-reference.compose.yml, tools/mg.d/meguri-sync-reference.sh, conformance/schema/meguri-sync-server.schema.json, conformance/catalog/meguri-sync-server.json, conformance/fixtures/meguri-sync-server/, conformance/recordings/scenarios/meguri-sync-server/, specs/conformance/meguri-sync-server.md, specs/conformance/meguri-sync-candidate.md, specs/conformance/meguri-sync-mobile-package.md, "specs/sync/server-*.md"]
    budget_s: 900

  # Prepare and verify the embedded web application before Rust consumers.
  - id: sync-web-verify
    job: sync-web-verify
    tier: T0
    stage: canary
    placement: host
    class: ui
    triggers: [server/, core/crates/meguri-model/, core/Cargo.toml, core/rust-toolchain.toml, tools/mg.d/meguri-sync.sh, tools/mg.d/sync-web.sh, tools/mg.d/meguri-sync-reference.sh, oracle/meguri-sync-server/, docker/dev.Dockerfile, docker/dev.Dockerfile.dockerignore, docker/compose.yml, docker/sync-web-compose.yml, docker/sync-web.Dockerfile, docker/sync-web.Dockerfile.dockerignore, docker/meguri-sync-reference.Dockerfile, docker/meguri-sync-reference.Dockerfile.dockerignore, docker/meguri-sync-reference.compose.yml, conformance/schema/meguri-sync-server.schema.json, conformance/catalog/meguri-sync-server.json, conformance/fixtures/meguri-sync-server/, conformance/recordings/scenarios/meguri-sync-server/, specs/conformance/meguri-sync-server.md, specs/conformance/meguri-sync-candidate.md, "specs/sync/server-*.md"]
    budget_s: 1800

  # --- T0: tooling self-tests -------------------------------------------------
  - id: selftest
    job: selftest
    tier: T0
    placement: docker:dev
    class: tooling
    triggers: [tools/, docker/, .claude/, .gitattributes, .gitignore]
    budget_s: 2400
  - id: conformance-route-transport
    disabled: "Anki server harness frozen by Antoine on 2026-10-26; explicit request required"
    job: conformance-route-test
    tier: T0
    placement: [host, docker:oracle]
    class: conformance
    needs: [oracle]
    oracle_files: true
    local: false
    triggers: [core/crates/meguri-testkit/src/exec/, tools/mg, tools/mg.d/conformance, tools/mg.d/oracle.sh, tools/tests/conformance_edge, docker/compose.yml]
    budget_s: 900
  - id: selftest-host
    job: selftest-host
    tier: T0
    placement: [host, docker:dev]
    class: tooling
    triggers: [tools/mg, tools/mg.d/, tools/tests/mg_host_selftest.sh, docker/compose.yml, "docker/*.Dockerfile"]
    budget_s: 1200
  - id: selftest-xcframework
    job: selftest-xcframework
    tier: T0
    placement: host
    class: tooling
    triggers: [tools/scripts/build-core-xcframework.sh, tools/scripts/repair-swift-integer-reader.py, tools/tests/xcframework_selftest.sh]
    budget_s: 2400
  - id: image-tools-selftest
    job: image-tools-selftest
    tier: T0
    placement: docker:image-tools
    class: tooling
    triggers: [tools/scripts/contact-sheet/, tools/scripts/hierarchy-check/, tools/scripts/image-diff/, tools/scripts/screen-status/, tools/scripts/critic/, tools/scripts/gallery/, tools/scripts/perf-compare/, tools/scripts/research/, "docker/image-tools.Dockerfile*", tools/mg.d/selftest.sh]
    budget_s: 900
  - id: lint-ui-selftest
    job: lint-ui-selftest
    tier: T0
    placement: host
    class: tooling
    triggers: [tools/lint-ui/, tools/mg.d/lint-ui.sh]
    budget_s: 300
  - id: private-selftest
    job: private-selftest
    tier: T0
    placement: [host, docker:private]
    class: data-safety
    triggers: [tools/mg.d/private.sh, tools/scripts/private-scan/, core/crates/meguri-testkit/src/private/, core/tools/meguri-cli/src/private.rs, docker/compose.yml]
    budget_s: 900
  - id: design-docs
    job: design-docs
    tier: T0
    placement: docker:dev
    class: static
    triggers: [docs/design/, tools/scripts/design-screens.py, tools/mg.d/design.sh]
    budget_s: 300
  # U240: the milestone manifest mirrors the plan's Delivery Milestones and
  # names only runs that tools/mg milestone executes.
  - id: milestones
    job: milestone-gate
    args: [--check]
    tier: T0
    placement: [host, docker:dev]
    class: static
    triggers: [docs/process/milestones.yaml, docs/plans/, tools/gate/tiers.yaml, tools/gate/gate.py, tools/scripts/gates/, tools/mg.d/milestone-gate.sh]
    budget_s: 300

  # --- T0: Apple side ---------------------------------------------------------
  - id: lint-ui
    job: lint-ui
    tier: T0
    placement: host
    class: static
    triggers: [app/, tools/lint-ui/, tools/mg.d/lint-ui.sh]
    budget_s: 300
  - id: swift-test-core
    job: swift-test
    args: [--package, MeguriCore]
    tier: T0
    placement: host
    class: unit
    triggers: [app/Packages/MeguriCore/, core/crates/, core/Cargo.lock, core/Cargo.toml, "!core/crates/meguri-testkit/**", "!core/crates/*/tests/**", "!core/crates/*/benches/**", tools/scripts/build-core-xcframework.sh, tools/scripts/repair-swift-integer-reader.py, tools/mg.d/bridge.sh]
    budget_s: 1800
  - id: swift-test-core-profile
    job: swift-test
    args: [--package, MeguriCore, --config, Profile, --, --filter, nativeGeneratedCountedTreeLiftAndValueConversionUnderFiveMilliseconds]
    tier: T0
    placement: host
    class: perf
    triggers: [app/Packages/MeguriCore/, core/crates/, core/Cargo.lock, core/Cargo.toml, "!core/crates/meguri-testkit/**", "!core/crates/*/tests/**", "!core/crates/*/benches/**", tools/scripts/build-core-xcframework.sh, tools/scripts/repair-swift-integer-reader.py, tools/mg.d/bridge.sh]
    budget_s: 1800
  - id: swift-test-kit
    job: swift-test
    args: [--package, MeguriKit]
    tier: T0
    placement: host
    class: unit
    triggers: [app/Packages/, core/crates/, core/Cargo.lock, core/Cargo.toml, "!core/crates/meguri-testkit/**", "!core/crates/*/tests/**", "!core/crates/*/benches/**", tools/mg.d/bridge.sh]
    budget_s: 1800
  - id: build-app-ios
    job: build-app
    args: [--platform, ios-sim]
    tier: T0
    placement: host
    class: tooling
    triggers: [app/, core/crates/, core/Cargo.lock, "!core/crates/meguri-testkit/**", "!core/crates/*/tests/**", "!core/crates/*/benches/**", tools/mg.d/app.sh, tools/scripts/build-core-xcframework.sh, tools/scripts/repair-swift-integer-reader.py]
    budget_s: 1800
  - id: build-app-mac
    job: build-app
    args: [--platform, mac]
    tier: T0
    placement: host
    class: tooling
    triggers: [app/, core/crates/, core/Cargo.lock, "!core/crates/meguri-testkit/**", "!core/crates/*/tests/**", "!core/crates/*/benches/**", tools/mg.d/app.sh, tools/scripts/build-core-xcframework.sh, tools/scripts/repair-swift-integer-reader.py]
    budget_s: 1800
  - id: xcode-check
    job: xcode-check
    tier: T0
    placement: [host, vm]
    needs: [simulator]
    class: tooling
    triggers: [app/, tools/tests/xcode_project_check.sh, tools/mg.d/xcode.sh]
    budget_s: 3600
  - id: snapshots
    job: snapshots
    tier: T0
    placement: [vm, docker:image-tools]
    needs: [simulator, image-diff]
    class: ui
    triggers: [app/Meguri/, app/Packages/MeguriKit/, app/MeguriSnapshotTests/, app/Snapshots/, tools/mg.d/snapshots.sh, tools/scripts/image-diff/]
    budget_s: 3600
  - id: a11y-iphone
    job: a11y
    args: [--platform, iphone]
    tier: T0
    placement: vm
    needs: [simulator]
    class: ui
    triggers: [app/Meguri/, app/Packages/MeguriKit/, app/MeguriUITests/, tools/mg.d/a11y.sh]
    budget_s: 1800
  - id: a11y-mac
    job: a11y
    args: [--platform, mac]
    tier: T0
    placement: vm
    needs: [mac-ui]
    class: ui
    triggers: [app/Meguri/, app/Packages/MeguriKit/, app/MeguriUITests/, tools/mg.d/a11y.sh]
    budget_s: 1800
  # U150/U70: shell layouts and native card behaviors share a build and UI
  # test invocation on each platform. Remaining VoiceOver scripts are optional
  # follow-up (Antoine, 2026-10-20); keep every non-VoiceOver card test here.
  # The four VoiceOver methods remain directly callable through ui-test.
  - id: ui-test-iphone
    job: ui-test
    args: [--platform, iphone, --suite, NavigationLayoutTests, --suite, CardWebViewBehaviorUITests/testNativeConfirmAndAcceptedEmptyPrompt, --suite, CardWebViewBehaviorUITests/testResizeKeyboardTypedTextAndForegroundKeepDocumentThenCallbackRecoversIt, --suite, CardWebViewBehaviorUITests/testNativeZoomFrameAndSameDocumentLinks, --suite, CardWebViewBehaviorUITests/testCardSurfaceAccessibilityAudit]
    tier: T0
    placement: vm
    needs: [simulator]
    class: ui
    triggers: &ui-test [app/Meguri/, app/Packages/MeguriKit/, app/MeguriUITests/, tools/mg.d/uitest.sh]
    budget_s: 1800
  - id: ui-test-ipad
    job: ui-test
    args: [--platform, ipad, --suite, NavigationLayoutTests, --suite, CardWebViewBehaviorUITests/testNativeConfirmAndAcceptedEmptyPrompt, --suite, CardWebViewBehaviorUITests/testResizeKeyboardTypedTextAndForegroundKeepDocumentThenCallbackRecoversIt, --suite, CardWebViewBehaviorUITests/testNativeZoomFrameAndSameDocumentLinks, --suite, CardWebViewBehaviorUITests/testCardSurfaceAccessibilityAudit]
    tier: T0
    placement: vm
    needs: [simulator]
    class: ui
    triggers: *ui-test
    budget_s: 1800
  - id: ui-test-mac
    job: ui-test
    args: [--platform, mac, --suite, NavigationLayoutTests, --suite, CardWebViewBehaviorUITests/testNativeConfirmAndAcceptedEmptyPrompt, --suite, CardWebViewBehaviorUITests/testResizeKeyboardTypedTextAndForegroundKeepDocumentThenCallbackRecoversIt, --suite, CardWebViewBehaviorUITests/testNativeZoomFrameAndSameDocumentLinks, --suite, CardWebViewBehaviorUITests/testCardSurfaceAccessibilityAudit]
    tier: T0
    placement: vm
    needs: [mac-ui]
    class: ui
    triggers: *ui-test
    budget_s: 1800
  # U66: the card runtime suites on iOS simulators in the VM (swift-test-kit
  # runs them on this Mac), from a build-for-testing of the Unit plan.
  - id: unit-sim-iphone
    job: unit-sim
    args: [--platform, iphone]
    tier: T0
    placement: [host, vm]
    needs: [simulator]
    class: unit
    triggers: &unit-sim [app/Packages/MeguriKit/Package.swift, app/Packages/MeguriKit/Sources/CardRendering/, app/Packages/MeguriKit/Sources/DesignSystem/, app/Packages/MeguriKit/Tests/CardRenderingTests/, app/Packages/MeguriCore/Sources/Instrumentation/, app/TestPlans/Unit.xctestplan, tools/mg.d/unit-sim.sh]
    budget_s: 1800
  - id: unit-sim-ipad
    job: unit-sim
    args: [--platform, ipad]
    tier: T0
    placement: [host, vm]
    needs: [simulator]
    class: unit
    triggers: *unit-sim
    budget_s: 1800
  - id: mac-ui
    job: mac-ui
    tier: T0
    placement: vm
    needs: [mac-ui]
    class: ui
    # Default suites include replay-native; it cannot use the host override.
