utilities:
  - {job: meguri-native-route, why: "Explicit single leased-guest route/TLS/health diagnostic only; no app/T12, UI, account, bootstrap, review, Mobile, compatibility or gate credit"}
  - {job: sync-server-mobile-smoke, why: "Explicit temporary synthetic phone endpoint; no formal Mobile or compatibility credit"}
