  # specs/notetypes/structure-changes.md S4 and field-rename.md F3: a field
  # rename or removal edits only the tags that name the field; Anki writes
  # every tag of every text in canonical form, drops the alternate-delimiter
  # directive and gives every empty browser front the first field.
  - id: template-rewrite-keeps-text
    requirement: R923
    summary: After renaming Extra to Note, Spaced keeps its spaced tags and extra braces, Alt keeps its alternate delimiters (so {{x}} stays text), every browser text stays empty, and only the tags naming Extra are rewritten.
    test: notetypes/structure/rewrite-format
    scenarios: [notetypes/structure/rewrite-format]
    pointer: /steps/4/notetype_templates/Styled
    transform:
      replace:
        - {name: Spaced, front: "{{ Front }} {{{Back}}} {{text:Note}}", back: "{{# Front }}x{{/ Front }}{{Back}}", browser_front: "", browser_back: ""}
        - {name: Alt, front: "{{=<% %>=}}<%Back%> {{x}} <%Note%>", back: "{{=<% %>=}}<%Front%>", browser_front: "", browser_back: ""}
        - {name: Broken, front: "{{Note}}{{Front}}", back: "{{#Extra}}{{Back}}", browser_front: "", browser_back: ""}
