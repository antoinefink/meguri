    transform: {replace: {reparent_decks: {count: 1}}}
  - id: decks-move-prefix-sibling-rows
    requirement: R63
    summary: After the drop a::b is a::bc::b, stamped; Anki leaves it as a::b.
    test: decks/move/prefix-sibling
    scenarios: [decks/move/prefix-sibling]
    pointer: /steps/2/db_exec/rows
    transform: {replace: [["Default", 0], ["a", 1894701600], ["a::bc::b", 1894701660], ["a::bc", 1894701600]]}
  # specs/render/type-answer.md A9 (R964): Meguri reads `ci` and combined type-in
  # modifiers from the question template. Anki 26.09.3 reads these chains as the
  # plain marker, so its answers compare case-sensitively, with combining
  # characters, against the whole field. The questions are equal.
  - id: type-answer-ci-lowercase
    requirement: R964
    summary: "With {{type:ci:Answer}}, typing the answer in lower case is correct: Meguri shows the expected text as one good token where Anki marks the case differences."
    test: render/type-answer/meguri-modifiers
    scenarios: [render/type-answer/meguri-modifiers]
    pointer: /steps/0/review_html/1/answer
    transform: {replace: "<style></style>1 qavprompt<hr id=answer>\n<div style=\"font-family: 'Arial'; font-size: 20px\"><code id=typeans><span class=typeGood>Qavru Vexal</span></code></div>Qavru Vexal"}
  - id: type-answer-ci-mistake
    requirement: R964
    summary: "With {{type:ci:Answer}}, a typed text that differs in case and in one letter shows only the letter as wrong; case differences count as good."
    test: render/type-answer/meguri-modifiers
    scenarios: [render/type-answer/meguri-modifiers]
    pointer: /steps/0/review_html/2/answer
    transform: {replace: "<style></style>1 qavprompt<hr id=answer>\n<div style=\"font-family: 'Arial'; font-size: 20px\"><code id=typeans><span class=typeGood>qavru vex</span><span class=typeBad>u</span><span class=typeGood>l</span><br><span id=typearrow>&darr;</span><br><span class=typeGood>Qavru Vex</span><span class=typeMissed>a</span><span class=typeGood>l</span></code></div>Qavru Vexal"}
  - id: type-answer-ci-nc
    requirement: R964
    summary: "With {{type:nc:ci:Answer}}, a typed text without accents and in upper case is correct; Anki compares it as the plain marker."
    test: render/type-answer/meguri-modifiers
    scenarios: [render/type-answer/meguri-modifiers]
    pointer: /steps/0/review_html/3/answer
    transform: {replace: "<style></style>2 zexprompt<hr id=answer>\n<div style=\"font-family: 'Arial'; font-size: 20px\"><code id=typeans><span class=typeGood>Qëvax</span></code></div>Qëvax"}
  - id: type-answer-ci-nc-order
    requirement: R964
    summary: "With {{type:ci:nc:Answer}} (modifiers in the other order), a typed text without accents is correct; Anki compares it as the plain marker."
    test: render/type-answer/meguri-modifiers
    scenarios: [render/type-answer/meguri-modifiers]
    pointer: /steps/0/review_html/4/answer
    transform: {replace: "<style></style>3 zexprompt<hr id=answer>\n<div style=\"font-family: 'Arial'; font-size: 20px\"><code id=typeans><span class=typeGood>Qëvax</span></code></div>Qëvax"}
  - id: type-answer-cloze-nc
    requirement: R964
    summary: "With {{type:cloze:nc:Text}}, the card's cloze answers are expected without combining characters; Anki compares the plain marker against the whole field."
    test: render/type-answer/meguri-modifiers
    scenarios: [render/type-answer/meguri-modifiers]
    pointer: /steps/0/review_html/5/answer
    transform: {replace: "<style></style><span class=\"cloze\" data-ordinal=\"1\">café</span> y <span class=\"cloze\" data-ordinal=\"1\">té</span><hr id=answer>\n<div style=\"font-family: 'Arial'; font-size: 20px\"><code id=typeans><span class=typeGood>café, té</span></code></div>"}
  - id: type-answer-cloze-ci
    requirement: R964
    summary: "With {{type:ci:cloze:Text}}, the card's cloze answer is expected regardless of case; Anki compares the plain marker against the whole field."
    test: render/type-answer/meguri-modifiers
    scenarios: [render/type-answer/meguri-modifiers]
    pointer: /steps/0/review_html/6/answer
    transform: {replace: "<style></style><span class=\"cloze\" data-ordinal=\"1\">Paris</span> is big<hr id=answer>\n<div style=\"font-family: 'Arial'; font-size: 20px\"><code id=typeans><span class=typeGood>Paris</span></code></div>"}
