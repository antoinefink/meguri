  # specs/notes/card-generation.md G5: one card of ordinal 499 per
  # generation, however many cloze numbers of 500 and above are new; Anki
  # makes one per number.
  - id: cloze-ordinal-499-once-cards
    requirement: R786
    summary: A note with c1, c500, c501 and c999 gets two cards (ordinals 0 and 499), not four.
    test: cardgen/cloze/above-500
    scenarios: [cardgen/cloze/above-500]
    pointer: /steps/1/add_note/cards
    transform: {replace: ["#c2", "#c3"]}
  - id: cloze-ordinal-499-once-rows
    requirement: R786
    summary: The note with c1, c500, c501 and c999 has one card of ordinal 499.
    test: cardgen/cloze/above-500
    scenarios: [cardgen/cloze/above-500]
    pointer: /steps/2/db_exec/rows
    transform:
      replace:
        - ["{{c700::z}}", 499, 1]
        - ["{{c1::a}} {{c500::p}} {{c501::q}} {{c999::r}}", 0, 2]
        - ["{{c1::a}} {{c500::p}} {{c501::q}} {{c999::r}}", 499, 2]
