    pointer: /steps/5/db_exec/rows
    transform:
      replace:
        - ["{{c700::z}} {{c800::y}} {{c2::b}}", 1, 1]
        - ["{{c700::z}} {{c800::y}} {{c2::b}}", 499, 1]
        - ["{{c1::a}} {{c500::p}} {{c501::q}} {{c999::r}}", 0, 2]
        - ["{{c1::a}} {{c500::p}} {{c501::q}} {{c999::r}}", 499, 2]
