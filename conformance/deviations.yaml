# Known deviations from the oracle (R1889; specs/conformance/dsl.md D13,
# schema/deviations.schema.json). The runner applies only the transforms listed
# here; any other difference from a golden fails. Every entry names the
# requirement and a scenario or test that asserts Meguri's own behavior.
deviations:
  - id: card-data-unknown-keys
    requirement: R1461
    summary: When a card row is rewritten, Meguri keeps unknown keys of the card data JSON after the known keys, with their exact value text; Anki drops them (specs/model/card-data-json.md C3, C4).
    test: core/crates/meguri-model/tests/card_data_json.rs unknown_keys_survive_rewrite
    scenarios: [model/card-data/unknown-keys]
    pointer: /steps/7/db_exec/rows
    transform:
      replace:
        - ['{"pos":0,"s":0.212,"d":0.212,"dr":0.21,"decay":0.212,"lrt":5,"zz":1}']
        - ['{"pos":3,"s":1.0,"d":5.0,"dr":0.9,"decay":0.154,"lrt":1894701600,"cd":"{\"x\":1}","zz":7}']
        - ['{"s":1.0,"d":2.0,"zz":2}']
        - ['{"s":3.5,"d":6.25,"cd":"{\"k\":true}","xyz":[1,2]}']
        - ['{"pos":1,"zz":{"b":1,"a":[1, 2]}}']
        - ['{"zz":null}']
  - id: card-data-unknown-keys-range
    requirement: R1461
    summary: An unknown card data key whose value holds a number beyond the 64-bit float range is kept with its exact text, as any unknown key; Anki skips such values and drops the key (specs/model/card-data-json.md C3 rule 7, specs/model/json-numbers.md N10).
    test: core/crates/meguri-model/tests/card_data_json.rs unknown_keys_skip_range_check
    scenarios: [model/card-data/out-of-range]
    pointer: /steps/26/db_exec/rows
    transform:
      replace:
        - ['{"pos":5,"zz":1e400}']
        - ['{"pos":5,"s":1.5,"d":2.0,"zz":1e400}']
        - ['{"pos":5,"s":1.0,"d":2.0,"zz":[1,{"b":-1e400}]}']
  - id: storage-v1-scheduler-refused
    requirement: R1482
    summary: Meguri refuses to open a collection still on the v1 scheduler (specs/storage/open-and-connections.md C2.2); Anki opens it and upgrades the scheduler in place.
    test: core/crates/meguri-storage/tests/open_refuse.rs v1_scheduler_refused_and_untouched
    scenarios: [storage/open/v1-scheduler]
    pointer: /steps/*
    transform: {replace: {open: {error: v1_scheduler}}}
  # specs/storage/ids-usn-mtime.md I3: no id more than one day ahead. Where
  # Anki's largest-plus-one passes now + 1 day, Meguri takes the smallest free
  # id above now.
  - id: ids-future-cap-notes
    requirement: R1470
    summary: After the clock moves back two days, the third note and its card take now + 1 ms instead of Anki's largest id + 1, two days ahead.
    test: storage/ids/clock-back-cap
    scenarios: [storage/ids/clock-back-cap]
    pointer: /steps/6/ids
    transform: {replace: {"#c3": 1894788000001, "#n3": 1894788000001}}
  - id: ids-future-cap-boundary
    requirement: R1470
    summary: When Anki's largest id + 1 lies one millisecond past now + 1 day, the note and its card take now + 1 ms.
    test: storage/ids/cap-boundary
    scenarios: [storage/ids/cap-boundary]
    pointer: /steps/6/ids
    transform: {replace: {"#c3": 1894701600001, "#n3": 1894701600001}}
  - id: ids-future-cap-revlog
    requirement: R1470
    summary: After the clock moves back two days, the third review-log row takes now + 1 ms instead of Anki's largest id + 1, two days ahead.
    test: storage/ids/revlog-clock-back-cap
    scenarios: [storage/ids/revlog-clock-back-cap]
    pointer: "/steps/6/revlog/#c3/0/id"
    transform: {replace: 1894788000001}
  # specs/storage/config-table.md C4: writing the value a key already holds
  # writes nothing, even when the stored bytes have another layout; Anki
  # rewrites them in compact form, stamps the row and moves col.mod.
  - id: config-same-value-other-bytes
    requirement: R1472
    summary: Writing heatmap's stored value again through the config API keeps the other client's bytes, usn, mtime_secs and col.mod.
    test: storage/config/rewrite-same-value
    scenarios: [storage/config/rewrite-same-value]
    pointer: /steps/4/db_exec/rows
    transform: {replace: [[0, 1700000000, '{"weeks": 52, "mode":"year" , "streak":true}', 1894701600000]]}
  - id: config-same-value-other-bytes-add-note
    requirement: R1472
    summary: Adding a note writes the note type's last deck again with the value already stored in another layout; the row keeps its bytes, usn and mtime_secs.
    test: storage/config/other-bytes-kept
    scenarios: [storage/config/other-bytes-kept]
    pointer: /steps/4/db_exec/rows
    transform: {replace: [[3, 1700000000, 1]]}
  # specs/notetypes/records.md N3.1: saving a note type that did not change
  # writes nothing; Anki stamps it (mtime_secs now, usn -1) and moves col.mod.
  - id: notetype-unchanged-save
    requirement: R906
    summary: Saving the note type Pair with no edit keeps its synced stamps (mtime_secs 1700000000, usn 5) and col.mod.
    test: notetypes/records/stamps
    scenarios: [notetypes/records/stamps]
    pointer: /steps/4/db_exec/rows
    transform: {replace: [[1700000000, 5, 1700000000000, 1600000000000, 1700000000000]]}
  # specs/notetypes/records.md N1, N3.2 and specs/model/protobuf-records.md P4:
  # unknown protobuf fields of a note type, its fields and its templates
  # survive a save; Anki drops them from every row of the saved note type.
  - id: notetype-unknown-fields-kept
    requirement: R1485
    summary: After a styling change, the note type's, its first field's and its first template's config still end with the unknown fields the scenario appended.
    test: notetypes/records/preserve-on-edit
    scenarios: [notetypes/records/preserve-on-edit]
    pointer: /steps/7/db_exec/rows
    transform: {replace: [[1, 1, 1]]}
  # specs/engine/undo.md A8: a redo whose rows changed outside the undo
  # history (here a trigger took the answer's review-log id) is refused by
  # Meguri's check (M4.2) and dropped; Anki applies it, keeps the other row
  # and answers the card again.
  - id: undo-revlog-taken-id-redo
    requirement: R1796
    summary: Meguri refuses the redo of an answer whose review-log id another writer took after the undo, with changed_externally; Anki redoes it.
    test: undo/revlog-taken-id
    scenarios: [undo/revlog-taken-id]
    pointer: /steps/9
    transform: {replace: {redo: {error: changed_externally}}}
  - id: undo-revlog-taken-id-status
    requirement: R1796
    summary: After the refused redo Meguri has nothing to undo or redo; Anki can undo the redone answer.
    test: undo/revlog-taken-id
    scenarios: [undo/revlog-taken-id]
    pointer: /steps/10/undo_status
    transform: {replace: {undo: null, redo: null}}
  - id: undo-revlog-taken-id-card
    requirement: R1796
    summary: After the refused redo the card is still new on Meguri; Anki answered it again.
    test: undo/revlog-taken-id
    scenarios: [undo/revlog-taken-id]
    pointer: /steps/11/db_exec/rows
    transform: {replace: [[0, 0, 0]]}
  # specs/conformance/float-determinism.md F8, F9 (KTD24): Meguri uses the
  # platform math library, as Anki does. On macOS the expected FSRS next-state
  # values come from the Apple oracle's overlay (conformance/goldens-apple/)
  # where it differs from the Linux golden inside this class; on Linux the
  # transform does nothing.
  - id: fp-libm-boundary
    requirement: R1889
    summary: On macOS, an FSRS next-state interval may differ from the Linux oracle's golden by one day at a rounding boundary, a stability by up to relative 1e-4 or 1e-5 days, and a difficulty by up to relative 1e-5, as Anki on macOS does; the runner expects the Apple oracle's value there.
    test: core/crates/meguri-testkit/tests/overlay.rs overlay_applies_on_macos_only
    scenarios: ["*"]
    pointer: /steps/*
    transform: {apple_overlay: true}
  # specs/sched/day-clock.md D6, D12: Meguri computes the day afresh when the
  # UTC offset, rollover, creationOffset or crt changed since it computed it;
  # Anki keeps the computed day until its boundary passes.
  - id: day-clock-offset-change-before-boundary
    requirement: R464
    summary: One second before 04:00 CEST on the day Paris moves its clocks forward, Meguri's next boundary is 04:00 CEST (02:00Z); Anki keeps the boundary it computed with +01:00 (03:00Z).
    test: sched/day/offset-change-recompute
    scenarios: [sched/day/offset-change-recompute]
    pointer: /steps/4/timing
    transform: {replace: {days_elapsed: 1, next_day_at: 1901152800, now: 1901152799, utc_offset_secs: 7200}}
  - id: day-clock-offset-change-at-boundary
    requirement: R464
    summary: At 04:00:00 CEST Meguri starts day 2; Anki stays on day 1 until 05:00 CEST.
    test: sched/day/offset-change-recompute
    scenarios: [sched/day/offset-change-recompute]
    pointer: /steps/6/timing
    transform: {replace: {days_elapsed: 2, next_day_at: 1901239200, now: 1901152800, utc_offset_secs: 7200}}
  - id: day-clock-offset-change-after-boundary
    requirement: R464
    summary: At 04:00:01 CEST Meguri is on day 2; Anki stays on day 1 until 05:00 CEST.
    test: sched/day/offset-change-recompute
    scenarios: [sched/day/offset-change-recompute]
    pointer: /steps/8/timing
    transform: {replace: {days_elapsed: 2, next_day_at: 1901239200, now: 1901152801, utc_offset_secs: 7200}}
  - id: day-clock-config-change-rollover-later
    requirement: R597
    summary: Right after rollover moves from 4 to 12 at 10:00, Meguri is back on day 4 until 12:00; Anki keeps day 5 and its 04:00 boundary until that boundary passes.
    test: sched/day/rollover-change-recompute
    scenarios: [sched/day/rollover-change-recompute]
    pointer: /steps/4/timing
    transform: {replace: {days_elapsed: 4, next_day_at: 1895137200, now: 1895130000, utc_offset_secs: 3600}}
  - id: day-clock-config-change-new-boundary
    requirement: R597
    summary: At 12:00 Meguri starts day 5 again with its next boundary at 12:00 the next day; Anki still reports the 04:00 boundary it computed before the change.
    test: sched/day/rollover-change-recompute
    scenarios: [sched/day/rollover-change-recompute]
    pointer: /steps/6/timing
    transform: {replace: {days_elapsed: 5, next_day_at: 1895223600, now: 1895137200, utc_offset_secs: 3600}}
  # specs/sched/day-clock.md D4, D12.3: Meguri never adds creationOffset to a
  # legacy collection; Anki's desktop layer adds it when it opens one.
  - id: legacy-timing-kept-on-reopen-day
    requirement: R595
    summary: After a reopen the legacy collection keeps legacy timing (day 138) in Meguri; Anki switches it to new timing (day 139).
    test: sched/day/legacy-timing-kept-on-reopen
    scenarios: [sched/day/legacy-timing-kept-on-reopen]
    pointer: /steps/7/timing
    transform: {replace: {days_elapsed: 138, next_day_at: 1906682400, now: 1906617600, utc_offset_secs: 7200}}
  - id: legacy-timing-kept-on-reopen-config
    requirement: R595
    summary: After the reopen Meguri's config has no creationOffset and lastUnburied stays 138; Anki adds creationOffset -60 and records day 139.
    test: sched/day/legacy-timing-kept-on-reopen
    scenarios: [sched/day/legacy-timing-kept-on-reopen]
    pointer: /steps/8/db_exec/rows
    transform:
      replace:
        - [lastUnburied, -1, 1906617600, "138"]
        - [localOffset, -1, 1906531200, "-120"]
        - [rollover, -1, 1906531200, "4"]
