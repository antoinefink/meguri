# Known deviations from the oracle (R1889; specs/conformance/dsl.md D13,
# schema/deviations.schema.json). The runner applies only the transforms listed
# here; any other difference from a golden fails. Every entry names the
# requirement and a scenario or test that asserts Meguri's own behavior.
# C5-only contract differences: specs/sched/review-session.md P11.
# That register requires production test identities/evidence; it changes no transform.
# stats graph register (no transform): specs/stats/graphs-revlog.md V9.
# render display register (no transform): specs/render/display-transform.md D11
# (the blank notices' wording; no scenario or golden holds display HTML).
deviations:
  - id: card-data-unknown-keys
    requirement: R1461
    summary: When a card row is rewritten, Meguri keeps unknown keys of the card data JSON after the known keys, with their exact value text; Anki drops them (specs/model/card-data-json.md C3, C4).
    test: core/crates/meguri-model/tests/card_data_json.rs unknown_keys_survive_rewrite
    scenarios: [model/card-data/unknown-keys]
    pointer: /steps/7/db_exec/rows
    transform:
      replace:
        - ['{"pos":0,"s":0.212,"d":0.212,"dr":0.21,"decay":0.212,"lrt":5,"zz":1}']
        - ['{"pos":3,"s":1.0,"d":5.0,"dr":0.9,"decay":0.154,"lrt":1894701600,"cd":"{\"x\":1}","zz":7}']
        - ['{"s":1.0,"d":2.0,"zz":2}']
        - ['{"s":3.5,"d":6.25,"cd":"{\"k\":true}","xyz":[1,2]}']
        - ['{"pos":1,"zz":{"b":1,"a":[1, 2]}}']
        - ['{"zz":null}']
  - id: card-data-unknown-keys-range
    requirement: R1461
    summary: An unknown card data key whose value holds a number beyond the 64-bit float range is kept with its exact text, as any unknown key; Anki skips such values and drops the key (specs/model/card-data-json.md C3 rule 7, specs/model/json-numbers.md N10).
    test: core/crates/meguri-model/tests/card_data_json.rs unknown_keys_skip_range_check
    scenarios: [model/card-data/out-of-range]
    pointer: /steps/26/db_exec/rows
    transform:
      replace:
        - ['{"pos":5,"zz":1e400}']
        - ['{"pos":5,"s":1.5,"d":2.0,"zz":1e400}']
        - ['{"pos":5,"s":1.0,"d":2.0,"zz":[1,{"b":-1e400}]}']
  - id: card-data-unknown-keys-answer
    requirement: R1461
    summary: An answer rewrites the scheduling keys of the card data and keeps every unknown key with its value; Anki drops them (specs/sched/card-data.md K5, specs/model/card-data-json.md C3 rule 7).
    test: core/crates/meguri-sched/tests/card_data_roundtrip.rs unknown_keys_survive_answer
    scenarios: [sched/data/answer-keeps-cd]
    pointer: /steps/7/db_exec/rows
    transform:
      replace:
        - [4, '{"k":true}', '[1,2]', 'x']
  - id: storage-v1-scheduler-refused
    requirement: R1482
    summary: Meguri refuses to open a collection still on the v1 scheduler (specs/storage/open-and-connections.md C2.2); Anki opens it and upgrades the scheduler in place.
    test: core/crates/meguri-storage/tests/open_refuse.rs v1_scheduler_refused_and_untouched
    scenarios: [storage/open/v1-scheduler]
    pointer: /steps/*
    transform: {replace: {open: {error: v1_scheduler}}}
  # specs/storage/ids-usn-mtime.md I3: no id more than one day ahead. Where
  # Anki's largest-plus-one passes now + 1 day, Meguri takes the smallest free
  # id above now.
  - id: ids-future-cap-notes
    requirement: R1470
    summary: After the clock moves back two days, the third note and its card take now + 1 ms instead of Anki's largest id + 1, two days ahead.
    test: storage/ids/clock-back-cap
    scenarios: [storage/ids/clock-back-cap]
    pointer: /steps/6/ids
    transform: {replace: {"#c3": 1894788000001, "#n3": 1894788000001}}
  - id: ids-future-cap-boundary
    requirement: R1470
    summary: When Anki's largest id + 1 lies one millisecond past now + 1 day, the note and its card take now + 1 ms.
    test: storage/ids/cap-boundary
    scenarios: [storage/ids/cap-boundary]
    pointer: /steps/6/ids
    transform: {replace: {"#c3": 1894701600001, "#n3": 1894701600001}}
  - id: ids-future-cap-revlog
    requirement: R1470
    summary: After the clock moves back two days, the third review-log row takes now + 1 ms instead of Anki's largest id + 1, two days ahead.
    test: storage/ids/revlog-clock-back-cap
    scenarios: [storage/ids/revlog-clock-back-cap]
    pointer: "/steps/6/revlog/#c3/0/id"
    transform: {replace: 1894788000001}
  # specs/storage/config-table.md C4: writing the value a key already holds
  # writes nothing, even when the stored bytes have another layout; Anki
  # rewrites them in compact form, stamps the row and moves col.mod.
  - id: config-same-value-other-bytes
    requirement: R1472
    summary: Writing heatmap's stored value again through the config API keeps the other client's bytes, usn, mtime_secs and col.mod.
    test: storage/config/rewrite-same-value
    scenarios: [storage/config/rewrite-same-value]
    pointer: /steps/4/db_exec/rows
    transform: {replace: [[0, 1700000000, '{"weeks": 52, "mode":"year" , "streak":true}', 1894701600000]]}
  - id: config-same-value-other-bytes-add-note
    requirement: R1472
    summary: Adding a note writes the note type's last deck again with the value already stored in another layout; the row keeps its bytes, usn and mtime_secs.
    test: storage/config/other-bytes-kept
    scenarios: [storage/config/other-bytes-kept]
    pointer: /steps/4/db_exec/rows
    transform: {replace: [[3, 1700000000, 1]]}
  # specs/search/case-folding.md C2, C5, C7: in Meguri's Unicode fold mode,
  # plain, field, sc: and nc: searches fold case for every alphabet; Anki folds
  # only ASCII there. Conformance runs are always in Unicode mode (C1), so
  # these entries always apply; AsciiCompat is only for U91's live differential.
  - id: search-unicode-umlaut
    requirement: R1036
    summary: The plain search über finds the field Über in Unicode mode (AE49); Anki finds nothing.
    test: search/folding/umlaut
    scenarios: [search/folding/umlaut]
    pointer: /steps/0/search/0/ids
    transform: {replace: ["#n1"]}
  - id: search-unicode-differential
    requirement: R1036
    summary: "The differential folding table's searches whose results depend on the fold mode, with Meguri's Unicode-mode results (simple case folding, nc: included)."
    test: search/folding/differential
    scenarios: [search/folding/differential]
    pointer: /steps/1/search
    transform:
      replace:
        - {ids: ["#n1", "#n15"]}
        - {ids: ["#n2", "#n3"]}
        - {ids: ["#n5", "#n6", "#n7"]}
        - {ids: ["#n8"]}
        - {ids: ["#n9"]}
        - {ids: ["#n13"]}
        - {ids: ["#n4", "#n14"]}
        - {ids: ["#n17"]}
        - {ids: ["#n1"]}
        - {ids: ["#n5", "#n6", "#n7"]}
        - {ids: ["#n15"]}
        - {ids: ["#n8"]}
        - {ids: ["#n5", "#n6", "#n7"]}
  - id: search-unicode-ignore-accents
    requirement: R1036
    summary: With ignoreAccentsInSearch on, the plain search привет finds Привет in Unicode mode; Anki finds nothing.
    test: search/folding/ignore-accents
    scenarios: [search/folding/ignore-accents]
    pointer: /steps/0/search/0/ids
    transform: {replace: ["#n1"]}
  # specs/search/text-matching.md T12.2, T12.3: Meguri compiles every regular
  # expression while it builds the plan; Anki compiles one only when a row
  # reaches its test and returns results when none does.
  - id: search-invalid-regex-unreached
    requirement: R1075
    summary: An invalid regular expression is invalid_regex even when no row would be tested (no notes, or a field no note type has); Anki returns no ids.
    test: search/regex/invalid-unreached
    scenarios: [search/regex/invalid-unreached]
    pointer: /steps/*/search/*
    transform: {replace: {error: invalid_regex}}
  # specs/search/text-matching.md T3.3, T12.3: the pattern size limit has the
  # same timing difference. Two entries, so that the dog search of step 3 and
  # the search of step 5 (search_failed on both sides) keep their golden.
  - id: search-pattern-limit-unreached
    requirement: R1075
    summary: A field pattern over the 50,000-byte limit is search_failed even on a collection without notes; Anki returns no ids.
    test: search/text/pattern-limit-unreached
    scenarios: [search/text/pattern-limit-unreached]
    pointer: /steps/0/search/0
    transform: {replace: {error: search_failed}}
  - id: search-pattern-limit-unreached-runs
    requirement: R1075
    summary: An excluded-field run pattern over the 50,000-byte limit is search_failed even when only a note type without notes has it; Anki returns no ids.
    test: search/text/pattern-limit-unreached
    scenarios: [search/text/pattern-limit-unreached]
    pointer: /steps/3/search/0
    transform: {replace: {error: search_failed}}
  # specs/decks/decks.md D6 step 4, D15.1 (R62): Meguri refuses to rename a
  # deck under one of its own descendants; Anki renames it there and creates
  # new empty decks for the names the subtree left.
  - id: decks-rename-under-descendant-refused
    requirement: R62
    summary: Renaming A to A::B::A while A::B exists is refused with under_descendant; Anki renames it.
    test: decks/rename/under-descendant
    scenarios: [decks/rename/under-descendant]
    pointer: /steps/1
    transform: {replace: {rename_deck: {error: under_descendant}}}
  - id: decks-rename-under-descendant-rows
    requirement: R62
    summary: After the refused rename the decks are as before; Anki has A::B::A, A::B::A::B and new A and A::B.
    test: decks/rename/under-descendant
    scenarios: [decks/rename/under-descendant]
    pointer: /steps/2/db_exec/rows
    transform: {replace: [["Default", 0], ["A", 1894701600], ["A::B", 1894701600]]}
  # specs/decks/decks.md D7 step 2.2, D15.2 (R62, R63): Meguri skips a drop
  # only onto the deck itself or one of its descendants; Anki compares the
  # stored names as byte strings and also skips a drop onto a sibling whose
  # name starts with the dragged deck's name.
  - id: decks-move-prefix-sibling-count
    requirement: R63
    summary: Dropping a::b onto its sibling a::bc moves it (count 1); Anki skips it (count 0).
    test: decks/move/prefix-sibling
    scenarios: [decks/move/prefix-sibling]
