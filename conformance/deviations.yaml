# Known deviations from the oracle (R1889; specs/conformance/dsl.md D13,
# schema/deviations.schema.json). The runner applies only the transforms listed
# here; any other difference from a golden fails. Every entry names the
# requirement and a scenario or test that asserts Meguri's own behavior.
deviations:
  - id: card-data-unknown-keys
    requirement: R1461
    summary: When a card row is rewritten, Meguri keeps unknown keys of the card data JSON after the known keys, with their exact value text; Anki drops them (specs/model/card-data-json.md C3, C4).
    test: core/crates/meguri-model/tests/card_data_json.rs unknown_keys_survive_rewrite
    scenarios: [model/card-data/unknown-keys]
    pointer: /steps/7/db_exec/rows
    transform:
      replace:
        - ['{"pos":0,"s":0.212,"d":0.212,"dr":0.21,"decay":0.212,"lrt":5,"zz":1}']
        - ['{"pos":3,"s":1.0,"d":5.0,"dr":0.9,"decay":0.154,"lrt":1894701600,"cd":"{\"x\":1}","zz":7}']
        - ['{"s":1.0,"d":2.0,"zz":2}']
        - ['{"s":3.5,"d":6.25,"cd":"{\"k\":true}","xyz":[1,2]}']
        - ['{"pos":1,"zz":{"b":1,"a":[1, 2]}}']
        - ['{"zz":null}']
  - id: card-data-unknown-keys-range
    requirement: R1461
    summary: An unknown card data key whose value holds a number beyond the 64-bit float range is kept with its exact text, as any unknown key; Anki skips such values and drops the key (specs/model/card-data-json.md C3 rule 7, specs/model/json-numbers.md N10).
    test: core/crates/meguri-model/tests/card_data_json.rs unknown_keys_skip_range_check
    scenarios: [model/card-data/out-of-range]
    pointer: /steps/26/db_exec/rows
    transform:
      replace:
        - ['{"pos":5,"zz":1e400}']
        - ['{"pos":5,"s":1.5,"d":2.0,"zz":1e400}']
        - ['{"pos":5,"s":1.0,"d":2.0,"zz":[1,{"b":-1e400}]}']
  - id: storage-v1-scheduler-refused
    requirement: R1482
    summary: Meguri refuses to open a collection still on the v1 scheduler (specs/storage/open-and-connections.md C2.2); Anki opens it and upgrades the scheduler in place.
    test: core/crates/meguri-storage/tests/open_refuse.rs v1_scheduler_refused_and_untouched
    scenarios: [storage/open/v1-scheduler]
    pointer: /steps/*
    transform: {replace: {open: {error: v1_scheduler}}}
  # specs/storage/ids-usn-mtime.md I3: no id more than one day ahead. Where
  # Anki's largest-plus-one passes now + 1 day, Meguri takes the smallest free
  # id above now.
  - id: ids-future-cap-notes
    requirement: R1470
    summary: After the clock moves back two days, the third note and its card take now + 1 ms instead of Anki's largest id + 1, two days ahead.
    test: storage/ids/clock-back-cap
    scenarios: [storage/ids/clock-back-cap]
    pointer: /steps/6/ids
    transform: {replace: {"#c3": 1894788000001, "#n3": 1894788000001}}
  - id: ids-future-cap-boundary
    requirement: R1470
    summary: When Anki's largest id + 1 lies one millisecond past now + 1 day, the note and its card take now + 1 ms.
    test: storage/ids/cap-boundary
    scenarios: [storage/ids/cap-boundary]
    pointer: /steps/6/ids
    transform: {replace: {"#c3": 1894701600001, "#n3": 1894701600001}}
  - id: ids-future-cap-revlog
    requirement: R1470
    summary: After the clock moves back two days, the third review-log row takes now + 1 ms instead of Anki's largest id + 1, two days ahead.
    test: storage/ids/revlog-clock-back-cap
    scenarios: [storage/ids/revlog-clock-back-cap]
    pointer: "/steps/6/revlog/#c3/0/id"
    transform: {replace: 1894788000001}
  # specs/storage/config-table.md C4: writing the value a key already holds
  # writes nothing, even when the stored bytes have another layout; Anki
  # rewrites them in compact form, stamps the row and moves col.mod.
  - id: config-same-value-other-bytes
    requirement: R1472
    summary: Writing heatmap's stored value again through the config API keeps the other client's bytes, usn, mtime_secs and col.mod.
    test: storage/config/rewrite-same-value
    scenarios: [storage/config/rewrite-same-value]
    pointer: /steps/4/db_exec/rows
    transform: {replace: [[0, 1700000000, '{"weeks": 52, "mode":"year" , "streak":true}', 1894701600000]]}
  - id: config-same-value-other-bytes-add-note
    requirement: R1472
    summary: Adding a note writes the note type's last deck again with the value already stored in another layout; the row keeps its bytes, usn and mtime_secs.
    test: storage/config/other-bytes-kept
    scenarios: [storage/config/other-bytes-kept]
    pointer: /steps/4/db_exec/rows
    transform: {replace: [[3, 1700000000, 1]]}
  # specs/conformance/float-determinism.md F8, F9 (KTD24): Meguri uses the
  # platform math library, as Anki does. On macOS the expected FSRS next-state
  # values come from the Apple oracle's overlay (conformance/goldens-apple/)
  # where it differs from the Linux golden inside this class; on Linux the
  # transform does nothing.
  - id: fp-libm-boundary
    requirement: R1889
    summary: On macOS, an FSRS next-state interval may differ from the Linux oracle's golden by one day at a rounding boundary, a stability by up to relative 1e-4 or 1e-5 days, and a difficulty by up to relative 1e-5, as Anki on macOS does; the runner expects the Apple oracle's value there.
    test: core/crates/meguri-testkit/tests/overlay.rs overlay_applies_on_macos_only
    scenarios: ["*"]
    pointer: /steps/*
    transform: {apple_overlay: true}
  # specs/media/media-files.md M14: Meguri treats media names
  # case-insensitively on every volume (R984, R1570) and keeps every trashed
  # version (R2018). Anki on the oracle's case-sensitive volume creates case
  # variants and keeps one trashed version per name.
  - id: media-case-variant-same-content
    requirement: R984
    summary: Adding mixedcase.png or MIXEDCASE.PNG with the bytes of the present MixedCase.png reuses MixedCase.png; Anki writes a second file mixedcase.png.
    test: media/case/same-content-variant
    scenarios: [media/case/same-content-variant]
    pointer: /steps/*/add_media/name
    transform: {replace: MixedCase.png}
  - id: media-case-variant-same-content-dir
    requirement: R984
    summary: The folder keeps the single MixedCase.png.
    test: media/case/same-content-variant
    scenarios: [media/case/same-content-variant]
    pointer: /steps/3/media_dir
    transform: {replace: {MixedCase.png: {sha1: "b746d79201944bf54f6a239c59d0b4a71be42873", size: 5}}}
  - id: media-case-variant-same-content-pending
    requirement: R984
    summary: Only MixedCase.png is pending for media sync.
    test: media/case/same-content-variant
    scenarios: [media/case/same-content-variant]
    pointer: /steps/3/media_pending
    transform: {replace: {MixedCase.png: "b746d79201944bf54f6a239c59d0b4a71be42873"}}
  - id: media-case-variant-other-content
    requirement: R1570
    summary: Other bytes added as MixedCase.png get the hash name mixedcase-<sha1>.png, since mixedcase.png would be the same name on a case-insensitive volume; Anki writes mixedcase.png.
    test: media/case/other-content-variant
    scenarios: [media/case/other-content-variant]
    pointer: /steps/0/add_media/name
    transform: {replace: "mixedcase-37c6c57bedf4305ef41249c1794760b5cb8fad17.png"}
  - id: media-case-variant-other-content-dir
    requirement: R1570
    summary: The folder holds MixedCase.png and the hash-named file.
    test: media/case/other-content-variant
    scenarios: [media/case/other-content-variant]
    pointer: /steps/1/media_dir
    transform:
      replace:
        MixedCase.png: {sha1: "b746d79201944bf54f6a239c59d0b4a71be42873", size: 5}
        "mixedcase-37c6c57bedf4305ef41249c1794760b5cb8fad17.png": {sha1: "37c6c57bedf4305ef41249c1794760b5cb8fad17", size: 7}
  - id: media-case-variant-other-content-pending
    requirement: R1570
    summary: MixedCase.png and the hash-named file are pending for media sync.
    test: media/case/other-content-variant
    scenarios: [media/case/other-content-variant]
    pointer: /steps/1/media_pending
    transform:
      replace:
        MixedCase.png: "b746d79201944bf54f6a239c59d0b4a71be42873"
        "mixedcase-37c6c57bedf4305ef41249c1794760b5cb8fad17.png": "37c6c57bedf4305ef41249c1794760b5cb8fad17"
  - id: media-restore-case-variant
    requirement: R1570
    summary: Restoring the trashed Pic.png while pic.png holds other bytes adds the old bytes as pic-<sha1>.png; Anki moves Pic.png back beside pic.png.
    test: media/case/restore-variant
    scenarios: [media/case/restore-variant]
    pointer: /steps/4/media_dir
    transform:
      replace:
        pic.png: {sha1: "55272cbcd7edc90cfa9a192aaba646deb9b7c438", size: 10}
        "pic-c278a732fd3e5d6b7d0cafa6b3a97fa45849ff20.png": {sha1: "c278a732fd3e5d6b7d0cafa6b3a97fa45849ff20", size: 9}
  - id: media-restore-case-variant-pending
    requirement: R1570
    summary: Pic.png stays deleted for media sync, and pic.png and the hash-named file are pending.
    test: media/case/restore-variant
    scenarios: [media/case/restore-variant]
    pointer: /steps/4/media_pending
    transform:
      replace:
        Pic.png: null
        pic.png: "55272cbcd7edc90cfa9a192aaba646deb9b7c438"
        "pic-c278a732fd3e5d6b7d0cafa6b3a97fa45849ff20.png": "c278a732fd3e5d6b7d0cafa6b3a97fa45849ff20"
  - id: media-trash-keeps-versions
    requirement: R2018
    summary: a.jpg trashed twice with different bytes leaves two trash entries; Anki keeps only the newer one.
    test: media/trash/twice
    scenarios: [media/trash/twice]
    pointer: /steps/4/media_trash
    transform:
      replace:
        - {name: a.jpg, sha1: "6d6efa518bdaba281c68518bd20ab7d447555bbd", size: 7}
        - {name: a.jpg, sha1: "fa048a40dc97077f6ac1356629394ff2e566207c", size: 8}
  - id: media-trash-keeps-versions-dir
    requirement: R2018
    summary: The restore puts the newer a.jpg back and adds the older bytes under their hash name.
    test: media/trash/twice
    scenarios: [media/trash/twice]
    pointer: /steps/6/media_dir
    transform:
      replace:
        a.jpg: {sha1: "fa048a40dc97077f6ac1356629394ff2e566207c", size: 8}
        "a-6d6efa518bdaba281c68518bd20ab7d447555bbd.jpg": {sha1: "6d6efa518bdaba281c68518bd20ab7d447555bbd", size: 7}
  - id: media-trash-keeps-versions-pending
    requirement: R2018
    summary: Both restored files are pending for media sync.
    test: media/trash/twice
    scenarios: [media/trash/twice]
    pointer: /steps/6/media_pending
    transform:
      replace:
        a.jpg: "fa048a40dc97077f6ac1356629394ff2e566207c"
        "a-6d6efa518bdaba281c68518bd20ab7d447555bbd.jpg": "6d6efa518bdaba281c68518bd20ab7d447555bbd"
