# Known deviations from the oracle (R1889; specs/conformance/dsl.md D13,
# schema/deviations.schema.json). The runner applies only the transforms listed
# here; any other difference from a golden fails. Every entry names the
# requirement and a scenario or test that asserts Meguri's own behavior.
deviations:
  - id: card-data-unknown-keys
    requirement: R1461
    summary: When a card row is rewritten, Meguri keeps unknown keys of the card data JSON after the known keys, with their exact value text; Anki drops them (specs/model/card-data-json.md C3, C4).
    test: core/crates/meguri-model/tests/card_data_json.rs unknown_keys_survive_rewrite
    scenarios: [model/card-data/unknown-keys]
    pointer: /steps/7/db_exec/rows
    transform:
      replace:
        - ['{"pos":0,"s":0.212,"d":0.212,"dr":0.21,"decay":0.212,"lrt":5,"zz":1}']
        - ['{"pos":3,"s":1.0,"d":5.0,"dr":0.9,"decay":0.154,"lrt":1894701600,"cd":"{\"x\":1}","zz":7}']
        - ['{"s":1.0,"d":2.0,"zz":2}']
        - ['{"s":3.5,"d":6.25,"cd":"{\"k\":true}","xyz":[1,2]}']
        - ['{"pos":1,"zz":{"b":1,"a":[1, 2]}}']
        - ['{"zz":null}']
  - id: card-data-unknown-keys-range
    requirement: R1461
    summary: An unknown card data key whose value holds a number beyond the 64-bit float range is kept with its exact text, as any unknown key; Anki skips such values and drops the key (specs/model/card-data-json.md C3 rule 7, specs/model/json-numbers.md N10).
    test: core/crates/meguri-model/tests/card_data_json.rs unknown_keys_skip_range_check
    scenarios: [model/card-data/out-of-range]
    pointer: /steps/26/db_exec/rows
    transform:
      replace:
        - ['{"pos":5,"zz":1e400}']
        - ['{"pos":5,"s":1.5,"d":2.0,"zz":1e400}']
        - ['{"pos":5,"s":1.0,"d":2.0,"zz":[1,{"b":-1e400}]}']
  - id: storage-v1-scheduler-refused
    requirement: R1482
    summary: Meguri refuses to open a collection still on the v1 scheduler (specs/storage/open-and-connections.md C2.2); Anki opens it and upgrades the scheduler in place.
    test: core/crates/meguri-storage/tests/open_refuse.rs v1_scheduler_refused_and_untouched
    scenarios: [storage/open/v1-scheduler]
    pointer: /steps/*
    transform: {replace: {open: {error: v1_scheduler}}}
  # specs/storage/ids-usn-mtime.md I3: no id more than one day ahead. Where
  # Anki's largest-plus-one passes now + 1 day, Meguri takes the smallest free
  # id above now.
  - id: ids-future-cap-notes
    requirement: R1470
    summary: After the clock moves back two days, the third note and its card take now + 1 ms instead of Anki's largest id + 1, two days ahead.
    test: storage/ids/clock-back-cap
    scenarios: [storage/ids/clock-back-cap]
    pointer: /steps/6/ids
    transform: {replace: {"#c3": 1894788000001, "#n3": 1894788000001}}
  - id: ids-future-cap-boundary
    requirement: R1470
    summary: When Anki's largest id + 1 lies one millisecond past now + 1 day, the note and its card take now + 1 ms.
    test: storage/ids/cap-boundary
    scenarios: [storage/ids/cap-boundary]
    pointer: /steps/6/ids
    transform: {replace: {"#c3": 1894701600001, "#n3": 1894701600001}}
  - id: ids-future-cap-revlog
    requirement: R1470
    summary: After the clock moves back two days, the third review-log row takes now + 1 ms instead of Anki's largest id + 1, two days ahead.
    test: storage/ids/revlog-clock-back-cap
    scenarios: [storage/ids/revlog-clock-back-cap]
    pointer: "/steps/6/revlog/#c3/0/id"
    transform: {replace: 1894788000001}
  # specs/storage/config-table.md C4: writing the value a key already holds
  # writes nothing, even when the stored bytes have another layout; Anki
  # rewrites them in compact form, stamps the row and moves col.mod.
  - id: config-same-value-other-bytes
    requirement: R1472
    summary: Writing heatmap's stored value again through the config API keeps the other client's bytes, usn, mtime_secs and col.mod.
    test: storage/config/rewrite-same-value
    scenarios: [storage/config/rewrite-same-value]
    pointer: /steps/4/db_exec/rows
    transform: {replace: [[0, 1700000000, '{"weeks": 52, "mode":"year" , "streak":true}', 1894701600000]]}
  - id: config-same-value-other-bytes-add-note
    requirement: R1472
    summary: Adding a note writes the note type's last deck again with the value already stored in another layout; the row keeps its bytes, usn and mtime_secs.
    test: storage/config/other-bytes-kept
    scenarios: [storage/config/other-bytes-kept]
    pointer: /steps/4/db_exec/rows
    transform: {replace: [[3, 1700000000, 1]]}
  # specs/notes/note-records.md U2: Meguri compares a note save after
  # normalizing fields and tags; an edit that only differs before
  # normalization writes nothing. Anki compares before and stamps the note.
  - id: note-save-same-after-normalizing-nfd
    requirement: R1472
    summary: Saving decomposed text for a stored NFC field leaves the note's mod, usn and col.mod unchanged.
    test: notes/save/same-after-normalizing
    scenarios: [notes/save/same-after-normalizing]
    pointer: /steps/4/db_exec/rows
    transform: {replace: [["636166C3A91F78", " alpha beta ", 1894701600, 7, 1894701600000]]}
  - id: note-save-same-after-normalizing-control
    requirement: R1472
    summary: Saving a field with a control character the save removes leaves the note's mod, usn and col.mod unchanged.
    test: notes/save/same-after-normalizing
    scenarios: [notes/save/same-after-normalizing]
    pointer: /steps/8/db_exec/rows
    transform: {replace: [["636166C3A91F78", " alpha beta ", 1894701600, 7, 1894701600000]]}
  - id: note-save-same-after-normalizing-tag-order
    requirement: R1472
    summary: Saving the stored tags in another order leaves the note's mod, usn and col.mod unchanged.
    test: notes/save/same-after-normalizing
    scenarios: [notes/save/same-after-normalizing]
    pointer: /steps/12/db_exec/rows
    transform: {replace: [["636166C3A91F78", " alpha beta ", 1894701600, 7, 1894701600000]]}
  - id: note-save-same-after-normalizing-tag-case
    requirement: R1472
    summary: Saving another letter case of a registered tag leaves the note's mod, usn and col.mod unchanged.
    test: notes/save/same-after-normalizing
    scenarios: [notes/save/same-after-normalizing]
    pointer: /steps/16/db_exec/rows
    transform: {replace: [["636166C3A91F78", " alpha beta ", 1894701600, 7, 1894701600000]]}
  # specs/notes/card-generation.md G5: one card of ordinal 499 per
  # generation, however many cloze numbers of 500 and above are new; Anki
  # makes one per number.
  - id: cloze-ordinal-499-once-cards
    requirement: R786
    summary: A note with c1, c500, c501 and c999 gets two cards (ordinals 0 and 499), not four.
    test: cardgen/cloze/above-500
    scenarios: [cardgen/cloze/above-500]
    pointer: /steps/1/add_note/cards
    transform: {replace: ["#c2", "#c3"]}
  - id: cloze-ordinal-499-once-rows
    requirement: R786
    summary: The note with c1, c500, c501 and c999 has one card of ordinal 499.
    test: cardgen/cloze/above-500
    scenarios: [cardgen/cloze/above-500]
    pointer: /steps/2/db_exec/rows
    transform:
      replace:
        - ["{{c700::z}}", 499, 1]
        - ["{{c1::a}} {{c500::p}} {{c501::q}} {{c999::r}}", 0, 2]
        - ["{{c1::a}} {{c500::p}} {{c501::q}} {{c999::r}}", 499, 2]
  - id: cloze-ordinal-499-once-rows-after-edit
    requirement: R786
    summary: After the edit the note with c1, c500, c501 and c999 still has one card of ordinal 499.
    test: cardgen/cloze/above-500
    scenarios: [cardgen/cloze/above-500]
    pointer: /steps/5/db_exec/rows
    transform:
      replace:
        - ["{{c700::z}} {{c800::y}} {{c2::b}}", 1, 1]
        - ["{{c700::z}} {{c800::y}} {{c2::b}}", 499, 1]
        - ["{{c1::a}} {{c500::p}} {{c501::q}} {{c999::r}}", 0, 2]
        - ["{{c1::a}} {{c500::p}} {{c501::q}} {{c999::r}}", 499, 2]
  # specs/notes/deck-placement-and-position.md D2, D3: Meguri walks the list
  # of candidate decks (R791, R792, AE32); Anki 26.09.3 goes to Default as
  # soon as its first pick is not a usable deck.
  - id: deck-placement-chain-override-missing
    requirement: R791
    summary: A card whose template override names a deleted deck goes to the Add screen's deck Culture, not to Default (AE32).
    test: cardgen/placement/new-note
    scenarios: [cardgen/placement/new-note]
    pointer: /steps/19/db_exec/rows/3/2
    transform: {replace: Culture}
  - id: deck-placement-chain-override-filtered
    requirement: R791
    summary: A card whose template override names a filtered deck goes to the Add screen's deck Culture, not to Default.
    test: cardgen/placement/new-note
    scenarios: [cardgen/placement/new-note]
    pointer: /steps/19/db_exec/rows/5/2
    transform: {replace: Culture}
  - id: deck-placement-chain-existing-shared-missing
    requirement: R792
    summary: A card added to a note whose cards share a deleted deck goes to the note type's last deck Other, not to Default.
    test: cardgen/placement/existing-note
    scenarios: [cardgen/placement/existing-note]
    pointer: /steps/25/db_exec/rows/8/2
    transform: {replace: Other}
  - id: deck-placement-chain-existing-override-missing
    requirement: R792
    summary: A card added to a note whose template override names a deleted deck goes to the deck its cards share, Inbox, not to Default.
    test: cardgen/placement/existing-note
    scenarios: [cardgen/placement/existing-note]
    pointer: /steps/25/db_exec/rows/23/2
    transform: {replace: Inbox}
  # specs/notetypes/records.md N3.1: saving a note type that did not change
  # writes nothing; Anki stamps it (mtime_secs now, usn -1) and moves col.mod.
  - id: notetype-unchanged-save
    requirement: R906
    summary: Saving the note type Pair with no edit keeps its synced stamps (mtime_secs 1700000000, usn 5) and col.mod.
    test: notetypes/records/stamps
    scenarios: [notetypes/records/stamps]
    pointer: /steps/4/db_exec/rows
    transform: {replace: [[1700000000, 5, 1700000000000, 1600000000000, 1700000000000]]}
  # specs/notetypes/records.md N1, N3.2 and specs/model/protobuf-records.md P4:
  # unknown protobuf fields of a note type, its fields and its templates
  # survive a save; Anki drops them from every row of the saved note type.
  - id: notetype-unknown-fields-kept
    requirement: R1485
    summary: After a styling change, the note type's, its first field's and its first template's config still end with the unknown fields the scenario appended.
    test: notetypes/records/preserve-on-edit
    scenarios: [notetypes/records/preserve-on-edit]
    pointer: /steps/7/db_exec/rows
    transform: {replace: [[1, 1, 1]]}
  # specs/engine/undo.md A8: a redo whose rows changed outside the undo
  # history (here a trigger took the answer's review-log id) is refused by
  # Meguri's check (M4.2) and dropped; Anki applies it, keeps the other row
  # and answers the card again.
  - id: undo-revlog-taken-id-redo
    requirement: R1796
    summary: Meguri refuses the redo of an answer whose review-log id another writer took after the undo, with changed_externally; Anki redoes it.
    test: undo/revlog-taken-id
    scenarios: [undo/revlog-taken-id]
    pointer: /steps/9
    transform: {replace: {redo: {error: changed_externally}}}
  - id: undo-revlog-taken-id-status
    requirement: R1796
    summary: After the refused redo Meguri has nothing to undo or redo; Anki can undo the redone answer.
    test: undo/revlog-taken-id
    scenarios: [undo/revlog-taken-id]
    pointer: /steps/10/undo_status
    transform: {replace: {undo: null, redo: null}}
  - id: undo-revlog-taken-id-card
    requirement: R1796
    summary: After the refused redo the card is still new on Meguri; Anki answered it again.
    test: undo/revlog-taken-id
    scenarios: [undo/revlog-taken-id]
    pointer: /steps/11/db_exec/rows
    transform: {replace: [[0, 0, 0]]}
  # specs/tags/tags.md T7, T8: after a rename or a reparent, Meguri writes into
  # the notes the spelling it gives every new tag (T3, after removing the old
  # rows); Anki writes the text it built, spelled from the old rows or as
  # typed, and only its registry rows take T3's spelling.
  - id: tags-rename-new-casing
    requirement: R1176
    summary: Renaming verbs to Verbs::regular stores Verbs::regular in the note; Anki spells the new name from the old row and stores verbs::regular.
    test: tags/rename/new-casing
    scenarios: [tags/rename/new-casing]
    pointer: /steps/3/db_exec/rows
    transform: {replace: [[" Verbs::regular Verbs::regular::x "]]}
  - id: tags-rename-new-casing-registry
    requirement: R1176
    summary: Renaming verbs to Verbs::regular registers Verbs::regular and Verbs::regular::x; Anki registers verbs::regular and verbs::regular::x.
    test: tags/rename/new-casing
    scenarios: [tags/rename/new-casing]
    pointer: /steps/4/db_dump/tags
    transform:
      replace:
        "Verbs::regular": {collapsed: 1, config: null, tag: "Verbs::regular", usn: -1}
        "Verbs::regular::x": {collapsed: 1, config: null, tag: "Verbs::regular::x", usn: -1}
  - id: tags-rename-existing-spelling
    requirement: R892
    summary: Renaming foo to bar while Bar is registered stores Bar and Bar::c in the note, as the registry spells them; Anki's note keeps bar and bar::c.
    test: tags/rename/existing-spelling
    scenarios: [tags/rename/existing-spelling]
    pointer: /steps/5/db_exec/rows
    transform: {replace: [[" Bar Bar::c "], [" Bar::x "], [" Bar "]]}
  - id: tags-reparent-existing-spelling
    requirement: R892
    summary: Moving foo onto bar while bar::FOO is registered stores bar::FOO in the note, as the registry spells it; Anki's note keeps bar::foo.
    test: tags/reparent/existing-spelling
    scenarios: [tags/reparent/existing-spelling]
    pointer: /steps/4/db_exec/rows
    transform: {replace: [[" bar::FOO "], [" bar::FOO "]]}
  # specs/tags/tags.md T7 step 5, T14 (R1467): the row Meguri registers for a
  # renamed or moved tag takes the collapsed state and config of the row the
  # tag came from, with usn -1; Anki's is a new row, collapsed with config
  # NULL.
  - id: tags-rename-carries-columns
    requirement: R1467
    summary: Renaming foo to bar gives the new row bar::a the expanded state of foo::a; Anki's bar::a is collapsed. The merged row bar keeps its own columns on both.
    test: tags/rename/rows
    scenarios: [tags/rename/rows]
    pointer: /steps/7/db_dump/tags
    transform:
      replace:
        "bar": {collapsed: 0, config: {sha256: "4bf5122f344554c53bde2ebb8cd2b7e3d1600ad631c385a5d7cce23c7785459a"}, tag: "bar", usn: -1}
        "bar::a": {collapsed: 0, config: null, tag: "bar::a", usn: -1}
  - id: tags-rename-carries-columns-case-only
    requirement: R1467
    summary: Renaming Verbs to VERBS keeps each row's collapsed state and config (Verbs and Verbs::x expanded, Verbs and Verbs::y with a config) and stamps usn -1; Anki's VERBS rows are collapsed with config NULL.
    test: tags/rename/case-only
    scenarios: [tags/rename/case-only]
    pointer: /steps/12/db_dump/tags
    transform:
      replace:
        "VERBS": {collapsed: 0, config: {sha256: "fb8da7eb5b1b399e7321179dac9e9f65773d7331e1e30554e3911e4325e1ef19"}, tag: "VERBS", usn: -1}
        "VERBS::x": {collapsed: 0, config: null, tag: "VERBS::x", usn: -1}
        "VERBS::y": {collapsed: 1, config: {sha256: "fb8da7eb5b1b399e7321179dac9e9f65773d7331e1e30554e3911e4325e1ef19"}, tag: "VERBS::y", usn: -1}
  # specs/tags/tags.md T1, T3 (R892): a new tag takes the tree spelling of
  # the longest leading part of it that the tag tree shows, implicit parents
  # included; Anki spells only from rows equal to the tag or to an ancestor.
  - id: tags-implicit-parent-spelling
    requirement: R892
    summary: Saved tags take the spelling of implicit parents (Bar::y beside Bar::x, zz after zz::Q, X::Y::z below X::Y::q, German::noun beside German::Verb, Bar alone, GEO::eu::it after rows GEO::eu::de and geo::EU::fr); Anki keeps the typed bar::y, ZZ, X::y::z, german::noun, BAR and Geo::Eu::it.
    test: tags/canon/spelling
    scenarios: [tags/canon/spelling]
    pointer: /steps/20/db_exec/rows
    transform:
      replace:
        - [""]
        - [" German::Verb::modal "]
        - [" German::Verb "]
        - [" Bar::x "]
        - [" Bar::x Bar::y "]
        - [" A b "]
        - [" Straße "]
        - [" [ _x Y z "]
        - [" LANG LANG::DE LANG::DE::noun "]
        - [" zz zz::Q "]
        - [" X "]
        - [" X::Y::q "]
        - [" X::Y::z "]
        - [" German::noun "]
        - [" Bar "]
        - [" GEO::eu::it "]
  - id: tags-implicit-parent-spelling-registry
    requirement: R892
    summary: The rows registered for those tags have the implicit parents' spellings (Bar::y, zz, X::Y::z, German::noun, Bar, GEO::eu::it); Anki registers bar::y, ZZ, X::y::z, german::noun, BAR and Geo::Eu::it.
    test: tags/canon/spelling
    scenarios: [tags/canon/spelling]
    pointer: /steps/21/db_dump/tags
    transform:
      replace:
        "A": {collapsed: 1, config: null, tag: "A", usn: -1}
        "Bar": {collapsed: 1, config: null, tag: "Bar", usn: -1}
        "Bar::x": {collapsed: 1, config: null, tag: "Bar::x", usn: -1}
        "Bar::y": {collapsed: 1, config: null, tag: "Bar::y", usn: -1}
        "GEO::eu::de": {collapsed: 1, config: null, tag: "GEO::eu::de", usn: 0}
        "GEO::eu::it": {collapsed: 1, config: null, tag: "GEO::eu::it", usn: -1}
        "German::Verb": {collapsed: 0, config: {sha256: "a12871fee210fb8619291eaea194581cbd2531e4b23759d225f6806923f63222"}, tag: "German::Verb", usn: -1}
        "German::Verb::modal": {collapsed: 1, config: null, tag: "German::Verb::modal", usn: -1}
        "German::noun": {collapsed: 1, config: null, tag: "German::noun", usn: -1}
        "LANG": {collapsed: 1, config: null, tag: "LANG", usn: -1}
        "LANG::DE": {collapsed: 1, config: null, tag: "LANG::DE", usn: -1}
        "LANG::DE::noun": {collapsed: 1, config: null, tag: "LANG::DE::noun", usn: -1}
        "Straße": {collapsed: 1, config: null, tag: "Straße", usn: -1}
        "X": {collapsed: 1, config: null, tag: "X", usn: -1}
        "X::Y::q": {collapsed: 1, config: null, tag: "X::Y::q", usn: -1}
        "X::Y::z": {collapsed: 1, config: null, tag: "X::Y::z", usn: -1}
        "Y": {collapsed: 1, config: null, tag: "Y", usn: -1}
        "[": {collapsed: 1, config: null, tag: "[", usn: -1}
        "_x": {collapsed: 1, config: null, tag: "_x", usn: -1}
        "b": {collapsed: 1, config: null, tag: "b", usn: -1}
        "geo::EU::fr": {collapsed: 1, config: null, tag: "geo::EU::fr", usn: 0}
        "z": {collapsed: 1, config: null, tag: "z", usn: -1}
        "zz": {collapsed: 1, config: null, tag: "zz", usn: -1}
        "zz::Q": {collapsed: 1, config: null, tag: "zz::Q", usn: -1}
  - id: tags-implicit-parent-collapse
    requirement: R892
    summary: Expanding bar while only Bar::x is registered registers the implicit parent as Bar, its tree spelling; Anki registers bar as given.
    test: tags/collapse/set
    scenarios: [tags/collapse/set]
    pointer: /steps/11/db_dump/tags
    transform:
      replace:
        "Bar": {collapsed: 0, config: null, tag: "Bar", usn: -1}
