# Lowercasing new names (specs/media/media-files.md M2, M3): the case key is
# the full Unicode lowercase mapping with the final-sigma rule, and the
# lowercase candidate goes through the name transform again, so a name that
# lowercasing lengthens is cut back to 120 bytes. Case variants with the
# same bytes reuse the stored name; other bytes get the hash name.
