# specs/render/image-occlusion-format.md F4: value escapes (`\\` and `\:`),
# keys taken as written, and characters that need no escape (R1003).
id: render/image-occlusion/format/parse-escapes
description: "escapes in shape texts"
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
steps:
  - observe:
      - image_occlusion:
          fns: [parse]
          inputs:
            - "{{c0::image-occlusion:text:left=.1:top=.1:text=a\\:b\\\\c:scale=1.:fs=.05}}<br>"
            - "{{c0::image-occlusion:text:left=.1:top=.1:text=\\:edge\\::scale=1.:fs=.05}}<br>"
            - "{{c0::image-occlusion:text:left=.1:top=.1:text=\\\\\\\\:scale=1.}}<br>"
            - "{{c0::image-occlusion:text:left=.1:top=.1:text=ratio 3\\:2 \\\\ path C\\:\\\\tmp:scale=1.}}<br>"
            - "{{c0::image-occlusion:text:left=.1:top=.1:text=東京\\:大阪 → café:scale=1.:fs=.05}}<br>"
            - "{{c0::image-occlusion:text:left=.1:top=.1:text=first line\nsecond\tline:scale=1.}}<br>"
            - "{{c0::image-occlusion:text:left=.1:top=.1:text=a=b {x} <i>y</i> &amp; z:scale=1.}}<br>"
            - "{{c0::image-occlusion:text:left=.1:top=.1:text=::double::colons:scale=1.}}<br>"
            - "{{c0::image-occlusion:text:left=.1:top=.1:text=h\\:m\\:s:scale=1.}}<br>"
            - "{{c0::image-occlusion:text:left=.1:top=.1:text=x\\:y:z:scale=1.:fs=.05}}<br>"
            - "{{c1::image-occlusion:rect:left=.1:top=.1:width=.1:height=.1:note\\=key=v:pa\\th=1}}<br>"
            - "{{c1::image-occlusion:rect:left=.1:top=.1:width=.1:height=.1:fill=rgb(1\\:2)}}<br>"
