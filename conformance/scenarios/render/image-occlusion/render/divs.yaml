# Image-occlusion shape elements in the `cloze:` output (specs/render/
# image-occlusion-render.md I2-I5, render/cloze#C11, R539 inputs): the class
# by number, side and activity; the data attributes and which values they
# skip; values copied as stored except the label text; points rewritten;
# unknown keys and shape names; no shape at all; number lists, number 0 and
# nesting; a card with no active shape; the MathJax pass over the output.
id: render/image-occlusion/render/divs
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
steps:
  - observe:
      - cloze:
          fns: [front, back]
          inputs:
            # Hide All, three masks and a label: each card, and a fourth with
            # no shape of its own.
            - ["{{c1::image-occlusion:rect:left=.1:top=.2:width=.3:height=.4:oi=1}}<br>{{c2::image-occlusion:ellipse:left=.5:top=.5:rx=.1:ry=.2:oi=1}}<br>{{c3::image-occlusion:polygon:left=.6:top=.1:points=.6,.1 .9,.1 .75,.3:oi=1}}<br>{{c0::image-occlusion:text:left=.1:top=.8:text=Label:scale=1.:fs=.05:oi=1}}<br>", 1]
            - ["{{c1::image-occlusion:rect:left=.1:top=.2:width=.3:height=.4:oi=1}}<br>{{c2::image-occlusion:ellipse:left=.5:top=.5:rx=.1:ry=.2:oi=1}}<br>{{c3::image-occlusion:polygon:left=.6:top=.1:points=.6,.1 .9,.1 .75,.3:oi=1}}<br>{{c0::image-occlusion:text:left=.1:top=.8:text=Label:scale=1.:fs=.05:oi=1}}<br>", 2]
            - ["{{c1::image-occlusion:rect:left=.1:top=.2:width=.3:height=.4:oi=1}}<br>{{c2::image-occlusion:ellipse:left=.5:top=.5:rx=.1:ry=.2:oi=1}}<br>{{c3::image-occlusion:polygon:left=.6:top=.1:points=.6,.1 .9,.1 .75,.3:oi=1}}<br>{{c0::image-occlusion:text:left=.1:top=.8:text=Label:scale=1.:fs=.05:oi=1}}<br>", 3]
            - ["{{c1::image-occlusion:rect:left=.1:top=.2:width=.3:height=.4:oi=1}}<br>{{c2::image-occlusion:ellipse:left=.5:top=.5:rx=.1:ry=.2:oi=1}}<br>{{c3::image-occlusion:polygon:left=.6:top=.1:points=.6,.1 .9,.1 .75,.3:oi=1}}<br>{{c0::image-occlusion:text:left=.1:top=.8:text=Label:scale=1.:fs=.05:oi=1}}<br>", 4]
            # Hide One, with a group (two masks share number 2) and a fill.
            - ["{{c1::image-occlusion:rect:left=.05:top=.05:width=.2:height=.1}}<br>{{c2::image-occlusion:rect:left=.4:top=.05:width=.2:height=.1:fill=#ff0000}}<br>{{c2::image-occlusion:ellipse:left=.4:top=.5:rx=.1:ry=.1}}<br>", 2]
            # Values that are skipped: empty left/top/angle/fill/oi/text/fs,
            # and empty or exactly 0 width/height/rx/ry/scale.
            - ["{{c1::image-occlusion:rect:left=:top=0:width=0:height=.5:angle=0:fill=:oi=}}", 1]
            - ["{{c1::image-occlusion:ellipse:left=.1:top=.1:width=.2:height=0.0:rx=.1:ry=0:angle=2500}}", 1]
            - ["{{c1::image-occlusion:text:left=.1:top=.1:text=:scale=0:fs=}}", 1]
            - ["{{c1::image-occlusion:text:left=.1:top=.1:text=x:scale=00:fs=0}}", 1]
            # Repeated keys, unknown keys, keys of another kind.
            - ["{{c1::image-occlusion:rect:left=.1:left=.2:zz=9:top=.3:points=1,2:text=t}}", 1]
            # Shape names: unknown, wrong case, empty, none at all.
            - ["{{c1::image-occlusion:star:left=.1:top=.2}}{{c1::image-occlusion:Rect:left=.3:top=.4}}{{c1::image-occlusion::left=.5}}{{c1::image-occlusion:rect}}{{c1::image-occlusion:}}", 1]
            # Points rewritten pair by pair.
            - ["{{c1::image-occlusion:polygon:left=0:top=0:points=.1,.2  .3 .4,.5,.6 ,.7 .8,}}", 1]
            - ["{{c1::image-occlusion:polygon:left=0:top=0:points=abc}}{{c1::image-occlusion:polygon:points= }}", 1]
            # Values copied as stored; only the label text is encoded.
            - ["{{c1::image-occlusion:rect:left=<b>:top=\"x\":fill=a&b 'c'}}", 1]
            - ["{{c1::image-occlusion:text:left=.1:top=.1:text=a\\:b<c>\"d\"&e 'f' 日本\\\\x\nline 2:scale=1.5:fs=.0667}}", 1]
            # Number lists, number 0 inside a list, nesting inside a shape.
            - ["{{c1,3::image-occlusion:rect:left=.1:top=.1:width=.1:height=.1}}", 2]
            - ["{{c1,3::image-occlusion:rect:left=.1:top=.1:width=.1:height=.1}}", 3]
            - ["{{c1::image-occlusion:rect:left=.15:top=.12:width=.1:height=.1}}{{c0,2::image-occlusion:rect:left=.5:top=.5:width=.1:height=.1}}", 1]
            - ["{{c0,2::image-occlusion:rect:left=.5:top=.5:width=.1:height=.1}}", 1]
            - ["{{c1::image-occlusion:rect:left=.1{{c2::x}}:top=.2}}", 2]
            - ["{{c1::image-occlusion:rect:left=.1{{c2::x}}:top=.2}}", 1]
            # Text around the shapes, and the MathJax pass over the output.
            - ["before {{c1::image-occlusion:rect:left=.15:top=.12:width=.1:height=.1}} after {{c2::word}}", 1]
            - ["{{c1::image-occlusion:rect:left=.1:top=.1:fill=\\\\(}}<br>{{c1::image-occlusion:rect:left=.2:top=.2:fill=\\\\)}}", 1]
