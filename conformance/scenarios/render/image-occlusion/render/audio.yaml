# AE16, core part (specs/render/image-occlusion-render.md I6, R1020, R545):
# per-mask audio in hidden cloze fields. On the question of the card for mask
# 3 no play marker appears (the active cloze's content is attribute-encoded);
# on the answer exactly one, a:0, inside the hidden element; the other masks'
# audio fields render nothing on that card. The audio tag lists are
# render/image-occlusion/render/audio-tags.
id: render/image-occlusion/render/audio
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Mask audio
      kind: cloze
      fields: [Occlusion, Image, A01, A02, A03]
      templates:
        - name: Mask
          front: "<div class=io hidden>{{cloze:Occlusion}}</div>{{Image}}<div style=\"display:none\">{{cloze:A01}}{{cloze:A02}}{{cloze:A03}}</div>"
          back: "<div class=io hidden>{{cloze:Occlusion}}</div>{{Image}}<div style=\"display:none\">{{cloze:A01}}{{cloze:A02}}{{cloze:A03}}</div>"
  notes:
    # #c1-#c3
    - notetype: Mask audio
      fields:
        - "{{c1::image-occlusion:rect:left=.15:top=.12:width=.2:height=.1}}<br>{{c2::image-occlusion:rect:left=.4:top=.1:width=.2:height=.1}}<br>{{c3::image-occlusion:rect:left=.7:top=.1:width=.2:height=.1}}<br>"
        - "<img src=\"chart.png\">"
        - "{{c1::[sound:a.mp3]}}"
        - "{{c2::[sound:b.mp3]}}"
        - "{{c3::[sound:x.mp3]}}"
steps:
  - observe:
      - review_html:
          - {card: "#c3"}
          - {card: "#c1"}
