# specs/render/cloze.md C1, C6, C9 and filters.md F1, F8: the cloze filters run
# inside card templates. The question template renders the front and the answer
# template the back, FrontSide carries the front's markup, the card number is
# the ordinal plus one, chains apply nearest the key first, and the filters work
# on any text: other fields, specials, standard note types.
id: render/cloze/templates
description: "cloze: and cloze-only: inside card templates"
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
steps:
  - observe:
      - template:
          notetype: {name: Gap Probe, kind: cloze, fields: [Text, Extra]}
          cases:
            - {front: "{{cloze:Text}}", back: "{{FrontSide}}<hr id=answer>{{cloze:Text}}", fields: ["{{c1::Paris::capital}} in {{c2::France}}", ""]}
            - {front: "{{cloze:Text}}", back: "{{FrontSide}}<hr id=answer>{{cloze:Text}}", ord: 1, fields: ["{{c1::Paris::capital}} in {{c2::France}}", ""]}
            - {front: "{{cloze-only:Text}}|{{type:cloze:Text}}", back: "{{cloze-only:Text}}|{{type:cloze:Text}}", fields: ["{{c1::a::h}} {{c1::b}} {{c2::c}}", ""]}
            - {front: "{{text:cloze:Text}}", back: "{{text:cloze:Text}}", fields: ["{{c1::<b>a</b>::h}} &amp; b", ""]}
            - {front: "{{cloze:text:Text}}", back: "{{cloze:text:Text}}", fields: ["<b>{{c1::a}}</b> &amp; b", ""]}
            - {front: "{{cloze:cloze:Text}}", back: "{{cloze:cloze:Text}}", fields: ["{{c1::a}} b", ""]}
            - {front: "{{cloze-only:cloze:Text}}", back: "{{cloze:cloze-only:Text}}", fields: ["{{c1::a}} b", ""]}
            - {front: "{{edit:cloze:Text}}", back: "{{cloze:edit:Text}}", fields: ["{{c1::a}} b", ""]}
            - {front: "{{cloze:Text}}|{{cloze:Extra}}", back: "{{cloze:Text}}|{{cloze:Extra}}", ord: 1, fields: ["{{c1::a}} {{c2::b}}", "{{c1::only one}}"]}
            - {front: "{{cloze:Text}}{{#Extra}}|{{cloze:Extra}}{{/Extra}}", back: "{{cloze-only:Extra}}", fields: ["{{c1::a}}", "{{c1::e::eh}}"]}
            - {front: "{{cloze:Text}}|{{cloze:Tags}}|{{cloze:Card}}", back: "{{cloze:Tags}}|{{cloze:Card}}", name: "{{c1::n}}", fields: ["{{c1::a}}", ""], tags: ["{{c1::t}}"]}
            - {front: "{{cloze:Text}}", back: "{{cloze:Text}}", ord: 2, fields: ["\\({{c3::x}}\\) <b>{{c3::y}}</b>", ""]}
  - observe:
      - template:
          notetype: {name: Plain Probe, fields: [Front, Back]}
          cases:
            - {front: "{{cloze:Front}}", back: "{{FrontSide}}|{{cloze:Front}}", ord: 1, fields: ["{{c2::x}} {{c1::y}}", ""]}
            - {front: "{{cloze:Front}}", back: "{{cloze:Front}}", fields: ["{{c2::x}}", ""]}
            - {front: "{{cloze:Back}}", back: "{{cloze:Back}}", fields: [f, ""]}
            - {front: "{{cloze-only:Front}}", back: "{{cloze-only:Front}}", ord: 4, fields: ["{{c5::x::h}}", ""]}
