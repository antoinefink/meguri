# Two new templates at the end, one without an id (specs/package/
# notetype-merge.md J3, J4.1, J4.3, J5 step 4, J7, J9; apkg-import.md I11;
# package-ops.md E6). The package's Pair has Forward, Reverse (id 2004) and
# Both (no id), and the note's three cards; the target's has Forward only,
# with an older mtime. The merge appends Reverse and Both in the incoming
# order, Both keeping no id; the note has cards at ordinals 0, 1 and 2,
# one per template; col.scm is set.
id: package/notetype-merge/align/new-templates
description: New incoming templates are appended in order, an id-less one keeping no id.
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {rollover: 4}
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Pair, deck: Lang, fields: [sun, star]}
steps:
  - observe: [timing]
  # Field and template ids pinned (the merge matches by id).
  - legacy_update:
      notetype: Pair
      patch:
        flds:
          - {name: Front, ord: 0, sticky: false, rtl: false, font: Arial, size: 20, id: 1001}
          - {name: Back, ord: 1, sticky: false, rtl: false, font: Arial, size: 20, id: 1002}
        tmpls:
          - {name: Forward, ord: 0, qfmt: "{{Front}}", afmt: "{{Back}}", id: 2001}
  - advance: 1m
  - update_notetype: {notetype: Pair, edits: [{add_template: {name: Reverse, front: "{{Back}}", back: "{{Front}}"}}, {add_template: {name: Both, front: "{{Front}} {{Back}}", back: "{{Front}}"}}]}
  # Reverse pinned to 2004; Both stored without an id.
  - legacy_update:
      notetype: Pair
      patch:
        tmpls:
          - {name: Forward, ord: 0, qfmt: "{{Front}}", afmt: "{{Back}}", id: 2001}
          - {name: Reverse, ord: 1, qfmt: "{{Back}}", afmt: "{{Front}}", id: 2004}
          - {name: Both, ord: 2, qfmt: "{{Front}} {{Back}}", afmt: "{{Front}}", id: null}
  - observe:
      - legacy_json: {notetypes: [Pair]}
  - db_exec: {sql: "SELECT n.sfld, c.ord, c.queue FROM cards c JOIN notes n ON n.id = c.nid ORDER BY n.sfld, c.ord"}
  - export: {format: apkg, name: pair.apkg, limit: collection, scheduling: true, presets: false, media: false}
  - advance: 1m
  - update_notetype: {notetype: Pair, edits: [{remove_template: Reverse}, {remove_template: Both}]}
  - db_exec: {sql: "UPDATE notetypes SET mtime_secs = 1894701600 WHERE name = 'Pair'"}
  - db_exec: {sql: "UPDATE col SET ls = scm"}
  - reopen: {}
  - advance: 1m
  - import: {format: apkg, name: pair.apkg, merge_notetypes: true, update_notes: never, update_notetypes: if_newer, with_scheduling: true, with_deck_configs: false}
  - observe:
      - notetype_structure: {notetypes: [Pair]}
  - db_exec: {sql: "SELECT m.name, m.ord FROM templates m JOIN notetypes t ON t.id = m.ntid WHERE t.name = 'Pair' ORDER BY m.ord"}
  - db_exec: {sql: "SELECT n.sfld, c.ord FROM cards c JOIN notes n ON n.id = c.nid ORDER BY n.sfld, c.ord"}
  - db_exec: {sql: "SELECT scm = ls FROM col"}
  - observe:
      - legacy_json: {notetypes: [Pair]}
