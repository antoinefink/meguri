# FSRS parameter lists in a package's presets (specs/package/apkg-export.md
# A3, A6, A7, A13; legacy-export.md L4, L12; package-ops.md E7, E8, E11;
# model-ops.md L7). Field uses the preset Tuned, which holds all three
# parameter lists (17, 19 and 21 values; the first two saved through
# legacy_update); Trail uses Brisk, which holds none, and the default deck's
# note stays on the default preset. The whole collection goes out with
# presets, with and without scheduling, in both formats. In the legacy
# packages the presets are readable JSON (dconf): without scheduling Tuned is
# there with all three lists empty and every other option kept; with
# scheduling it holds all three lists as stored. The latest-format packages
# hold the same presets as protobuf rows: their digests show Tuned's row
# differing between the two packages and Brisk's row equal.
id: package/apkg-export/fsrs-params-gathered
description: Presets in a package exported without scheduling hold no FSRS parameter list.
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {rollover: 4}
  presets:
    - {name: Tuned, new_per_day: 12, desired_retention: 0.85, fsrs_params: [0.25, 1.3, 2.4, 8.3, 6.4, 0.83, 3.0, 0.001, 1.9, 0.2, 0.8, 1.5, 0.06, 0.26, 1.6, 0.6, 1.9, 0.6, 0.12, 0.15, 0.1]}
    - {name: Brisk, new_per_day: 40}
  decks: [{name: Field, preset: Tuned}, {name: Trail, preset: Brisk}]
  notetypes:
    - name: Term
      fields: [Word, Meaning]
      templates: [{name: Card, front: "{{Word}}", back: "{{Meaning}}"}]
  notes:
    - {notetype: Term, deck: Field, fields: [maple, oak]}
    - {notetype: Term, deck: Trail, fields: [elm, hazel]}
    - {notetype: Term, fields: [gate, way in]}
steps:
  - observe: [timing]
  - legacy_update:
      preset: Tuned
      patch:
        fsrsWeights: [0.5, 0.9, 2.5, 6.0, 4.8, 0.9, 0.8, 0.02, 1.5, 0.15, 0.9, 2.2, 0.06, 0.3, 1.3, 0.3, 2.6]
        fsrsParams5: [0.45, 1.1, 3.2, 15.0, 7.0, 0.55, 1.5, 0.006, 1.6, 0.13, 1.05, 1.95, 0.12, 0.31, 2.25, 0.24, 2.95, 0.52, 0.66]
  - observe:
      - legacy_json: {presets: [Tuned, Brisk]}
  - advance: 1m
  - export: {format: apkg, name: plain-old.apkg, limit: collection, scheduling: false, presets: true, media: false, legacy: true}
  - export: {format: apkg, name: kept-old.apkg, limit: collection, scheduling: true, presets: true, media: false, legacy: true}
  - export: {format: apkg, name: plain.apkg, limit: collection, scheduling: false, presets: true, media: false}
  - export: {format: apkg, name: kept.apkg, limit: collection, scheduling: true, presets: true, media: false}
  - observe:
      - package_col: {name: plain-old.apkg, columns: [dconf]}
  - observe:
      - package_col: {name: kept-old.apkg, columns: [dconf]}
  - observe:
      - package_db_dump: {name: plain.apkg, tables: [deck_config]}
  - observe:
      - package_db_dump: {name: kept.apkg, tables: [deck_config]}
