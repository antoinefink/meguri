# What a deck limit selects (specs/package/apkg-export.md A2, A3;
# package-ops.md E7, E11). n1 has c1 in A and c2 in B: exporting A takes c2
# and deck B too. n2's card belongs to A but sits in the filtered deck Cram
# (fixed id 900) outside A: only the card's current deck counts, so n2 stays
# out, as does n3 in B.
id: package/apkg-export/deck-limit-reach
description: A deck limit reaches other decks through a note's cards, but not through a filtered card's home deck.
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {rollover: 4}
  decks: [A, B]
  notetypes:
    - name: Both
      fields: [Front, Back]
      templates:
        - {name: Forward, front: "{{Front}}", back: "{{Back}}"}
        - {name: Reverse, front: "{{Back}}", back: "{{Front}}"}
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
    - {notetype: Both, deck: A, fields: [one, a]}
    - {notetype: Pair, deck: A, fields: [two, b]}
    - {notetype: Pair, deck: B, fields: [three, c]}
steps:
  - observe: [timing]
  - db_exec:
      sql: "UPDATE cards SET did = (SELECT id FROM decks WHERE name = 'B') WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1)"
  - db_exec:
      sql: "INSERT INTO decks (id, name, mtime_secs, usn, common, kind) VALUES (900, 'Cram', 0, 0, X'08011001', X'12130801120a0a066465636b3a78106428d804383c')"
  - db_exec:
      sql: "UPDATE cards SET odid = did, did = 900, odue = due, due = -100000 WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2)"
  - reopen: {}
  - advance: 1m
  - export: {format: apkg, name: a.apkg, limit: {deck: A}, scheduling: true, presets: false, media: false}
  - observe:
      - package_db_dump: {name: a.apkg, tables: [notes, cards, decks]}
