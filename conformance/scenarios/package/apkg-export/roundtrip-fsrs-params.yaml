# FSRS parameter lists through an export and an import (specs/package/
# apkg-export.md A6, A7, A13; legacy-export.md L12; apkg-import.md I10.1;
# model/schema11-json.md for the fsrsWeights, fsrsParams5 and fsrsParams6
# keys; package-ops.md E6, E7, E8). Study uses the preset Tuned, which holds
# all three parameter lists (17, 19 and 21 values; the first two saved
# through legacy_update). The whole collection goes out with presets: without
# scheduling in the latest and in the legacy format, and with scheduling in
# the latest format. Then the note, Study and Tuned are removed. Each package
# is imported with progress and presets on, the target emptied again in
# between: from both packages without scheduling, Tuned comes back with all
# three lists empty and its other options as they were; from the package with
# scheduling, it comes back with all three lists as stored.
id: package/apkg-export/roundtrip-fsrs-params
description: A preset exported without scheduling imports with every FSRS parameter list empty.
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {rollover: 4}
  presets:
    - {name: Tuned, new_per_day: 12, desired_retention: 0.85, fsrs_params: [0.25, 1.3, 2.4, 8.3, 6.4, 0.83, 3.0, 0.001, 1.9, 0.2, 0.8, 1.5, 0.06, 0.26, 1.6, 0.6, 1.9, 0.6, 0.12, 0.15, 0.1]}
  decks: [{name: Study, preset: Tuned}]
  notetypes:
    - name: Term
      fields: [Word, Meaning]
      templates: [{name: Card, front: "{{Word}}", back: "{{Meaning}}"}]
  notes:
    - {notetype: Term, deck: Study, fields: [quill, nib]}
steps:
  - observe: [timing]
  - legacy_update:
      preset: Tuned
      patch:
        fsrsWeights: [0.5, 0.9, 2.5, 6.0, 4.8, 0.9, 0.8, 0.02, 1.5, 0.15, 0.9, 2.2, 0.06, 0.3, 1.3, 0.3, 2.6]
        fsrsParams5: [0.45, 1.1, 3.2, 15.0, 7.0, 0.55, 1.5, 0.006, 1.6, 0.13, 1.05, 1.95, 0.12, 0.31, 2.25, 0.24, 2.95, 0.52, 0.66]
  - observe:
      - legacy_json: {presets: [Tuned]}
  - advance: 1m
  - export: {format: apkg, name: plain.apkg, limit: collection, scheduling: false, presets: true, media: false}
  - export: {format: apkg, name: plain-old.apkg, limit: collection, scheduling: false, presets: true, media: false, legacy: true}
  - export: {format: apkg, name: kept.apkg, limit: collection, scheduling: true, presets: true, media: false}
  - delete_notes: {notes: ["#n1"]}
  - delete_decks: {decks: [Study]}
  - remove_preset: {preset: Tuned, fallback: Default}
  - db_exec: {sql: "SELECT (SELECT count() FROM notes), (SELECT group_concat(name, '|') FROM decks), (SELECT group_concat(name, '|') FROM deck_config)"}
  - advance: 1m
  - import: {format: apkg, name: plain.apkg, merge_notetypes: true, update_notes: if_newer, update_notetypes: if_newer, with_scheduling: true, with_deck_configs: true}
  - observe:
      - legacy_json: {presets: [Tuned]}
  # Empty the target again.
  - delete_notes: {notes: ["#n1"]}
  - delete_decks: {decks: [Study]}
  - remove_preset: {preset: Tuned, fallback: Default}
  - db_exec: {sql: "SELECT (SELECT count() FROM notes), (SELECT group_concat(name, '|') FROM decks), (SELECT group_concat(name, '|') FROM deck_config)"}
  - advance: 1m
  - import: {format: apkg, name: plain-old.apkg, merge_notetypes: true, update_notes: if_newer, update_notetypes: if_newer, with_scheduling: true, with_deck_configs: true}
  - observe:
      - legacy_json: {presets: [Tuned]}
  # And again, for the package with scheduling.
  - delete_notes: {notes: ["#n1"]}
  - delete_decks: {decks: [Study]}
  - remove_preset: {preset: Tuned, fallback: Default}
  - db_exec: {sql: "SELECT (SELECT count() FROM notes), (SELECT group_concat(name, '|') FROM decks), (SELECT group_concat(name, '|') FROM deck_config)"}
  - advance: 1m
  - import: {format: apkg, name: kept.apkg, merge_notetypes: true, update_notes: if_newer, update_notetypes: if_newer, with_scheduling: true, with_deck_configs: true}
  - observe:
      - legacy_json: {presets: [Tuned]}
