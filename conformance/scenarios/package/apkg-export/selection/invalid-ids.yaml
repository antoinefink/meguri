# Id check before a deck package is written (specs/package/apkg-export.md
# A8 rule 1, R1623; package-ops.md E7, E11). The step instant is
# 2030-01-15T10:01:00Z, so the bound is 1894788060000 ms. A note id scaled to
# microseconds refuses a whole-collection export, while a deck export that
# leaves that note out succeeds. A note id equal to the bound passes and one
# millisecond past it refuses. A card id past the bound refuses without
# scheduling too. A review-log id past the bound refuses only with
# scheduling, since the log is not gathered without it.
id: package/apkg-export/selection/invalid-ids
description: Selected note, card and review-log ids past the export instant plus a day refuse the export.
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {rollover: 4}
  decks: [A, B]
  notetypes:
    - name: Duo
      fields: [Prompt, Reply]
      templates: [{name: Ask, front: "{{Prompt}}", back: "{{Reply}}"}]
  notes:
    - {notetype: Duo, deck: A, fields: [one, a]}
    - {notetype: Duo, deck: A, fields: [two, b]}
    - {notetype: Duo, deck: B, fields: [three, c]}
steps:
  - observe: [timing]
  - advance: 1m
  # The note id scaled by 1000, its card following.
  - db_exec: {sql: "UPDATE cards SET nid = nid * 1000 WHERE nid = (SELECT id FROM notes WHERE sfld = 'one')"}
  - db_exec: {sql: "UPDATE notes SET id = id * 1000 WHERE sfld = 'one'"}
  - export: {format: apkg, name: scaled.apkg, limit: collection, scheduling: false, presets: false, media: false}
  - export: {format: apkg, name: b.apkg, limit: {deck: B}, scheduling: false, presets: false, media: false}
  # The note id set exactly to the bound.
  - db_exec: {sql: "UPDATE cards SET nid = 1894788060000 WHERE nid = (SELECT id FROM notes WHERE sfld = 'one')"}
  - db_exec: {sql: "UPDATE notes SET id = 1894788060000 WHERE sfld = 'one'"}
  - export: {format: apkg, name: at-bound.apkg, limit: collection, scheduling: false, presets: false, media: false}
  - observe:
      - package_db_dump: {name: at-bound.apkg, tables: [notes]}
  # One millisecond past the bound.
  - db_exec: {sql: "UPDATE cards SET nid = 1894788060001 WHERE nid = 1894788060000"}
  - db_exec: {sql: "UPDATE notes SET id = 1894788060001 WHERE id = 1894788060000"}
  - export: {format: apkg, name: past-bound.apkg, limit: collection, scheduling: false, presets: false, media: false}
  # Note id back in the past; a card id past the bound instead.
  - db_exec: {sql: "UPDATE cards SET nid = 1894700000000 WHERE nid = 1894788060001"}
  - db_exec: {sql: "UPDATE notes SET id = 1894700000000 WHERE id = 1894788060001"}
  - db_exec: {sql: "UPDATE cards SET id = 1894788060001 WHERE nid = (SELECT id FROM notes WHERE sfld = 'two')"}
  - export: {format: apkg, name: card-ahead.apkg, limit: collection, scheduling: false, presets: false, media: false}
  # Card id back in the past; a review-log row past the bound instead.
  - db_exec: {sql: "UPDATE cards SET id = 1894700000001 WHERE id = 1894788060001"}
  - db_exec: {sql: "INSERT INTO revlog VALUES (1894788060001, 1894700000001, -1, 3, 1, 0, 2500, 4000, 0)"}
  - export: {format: apkg, name: log-ahead.apkg, limit: collection, scheduling: true, presets: false, media: false}
  - export: {format: apkg, name: log-unread.apkg, limit: collection, scheduling: false, presets: false, media: false}
  - observe:
      - package_db_dump: {name: log-unread.apkg, tables: [notes, cards, revlog]}
