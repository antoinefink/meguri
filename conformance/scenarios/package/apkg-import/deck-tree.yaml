# Missing parents (specs/package/apkg-import.md I10.2 step 5; package-ops.md
# E4, E6). The fixture is storage/schema-11.anki2 in a legacy 2 package with
# its decks Lang renamed A::B and Lang::Verbs renamed F::x
# (oracle/fixtures/package/apkg.py): neither A nor F is in the package. The
# target has a filtered deck F (fixed id 900). The import creates the normal
# parent A for A::B; F::x cannot go under the filtered F, so a normal deck F
# with the time suffix is added first and F::x is placed under it.
id: package/apkg-import/deck-tree
description: A missing parent is created; a filtered ancestor gets a suffixed normal deck.
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {rollover: 4}
steps:
  - observe: [timing]
  - db_exec:
      sql: "INSERT INTO decks (id, name, mtime_secs, usn, common, kind) VALUES (900, 'F', 0, 0, X'08011001', X'12130801120a0a066465636b3a78106428d804383c')"
  - reopen: {}
  - advance: 1m
  - import: {format: apkg, fixture: package/apkg/deck-tree.apkg, merge_notetypes: false, update_notes: if_newer, update_notetypes: if_newer, with_scheduling: false, with_deck_configs: false}
  - observe:
      - decks
      - deck_tree
  - db_exec: {sql: "SELECT n.sfld, d.name FROM cards c JOIN notes n ON n.id = c.nid JOIN decks d ON d.id = c.did ORDER BY c.id"}
