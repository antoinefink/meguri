# specs/browser/sorting.md S4, S5 (noteCrt): cards mode by note id, then
# ordinal (a cloze note's cards by cloze number), both reversed when
# descending; notes mode by note id (R1127, R1143).
id: browser/sort/created
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Solo
      fields: [Word, Gloss]
      templates:
        - {name: Recall, front: "{{Word}}", back: "{{Gloss}}"}
      css: ".card { margin: 0; }"
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Forward, front: "{{Front}}", back: "{{Back}}"}
        - {name: Backward, front: "{{Back}}", back: "{{Front}}"}
      css: ".card { margin: 0; }"
    - name: Gap
      kind: cloze
      fields: [Text, Extra]
      templates:
        - {name: Gap, front: "{{cloze:Text}}", back: "{{cloze:Text}}<br>{{Extra}}"}
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Solo, fields: [first, g]}
    - {notetype: Pair, fields: [second, x]}
    - {notetype: Gap, fields: ["{{c1::third}} {{c3::cloze}}", ""]}
    - {notetype: Solo, fields: [fourth, g]}
steps:
  - observe:
      - search:
          - {query: '', order: {column: noteCrt}}
          - {query: '', order: {column: noteCrt, reverse: true}}
          - {query: '', kind: notes, order: {column: noteCrt}}
          - {query: '', kind: notes, order: {column: noteCrt, reverse: true}}
