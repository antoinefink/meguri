# The browser and search config keys a new collection holds
# (specs/browser/config-keys.md K1): sortType "noteFld" and sortBackwards
# false, none of the others, and neither of the two keys Meguri does not use
# (K9). Stamps of new-collection keys are the new collection's (U28), so only
# the key, the value text and its storage class are read. Needs db_exec
# (specs/conformance/record-ops.md W1).
id: browser/config/new-collection
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
steps:
  - db_exec:
      sql: "SELECT KEY, CAST(val AS TEXT), typeof(val) FROM config WHERE KEY IN ('activeCols', 'activeNoteCols', 'sortType', 'noteSortType', 'sortBackwards', 'browserNoteSortBackwards', 'browserTableShowNotesMode', 'savedFilters', 'flagLabels', 'collapseSavedSearches', 'collapseToday', 'collapseFlags', 'collapseCardState', 'collapseDecks', 'collapseNotetypes', 'collapseTags', 'previewBothSides', 'setDueBrowser', 'defaultSearchText', 'ignoreAccentsInSearch', 'restorePositionBrowser', 'resetCountsBrowser', 'normalize_note_text', 'randomOrderReposition', 'shiftPositionOfExistingCards') ORDER BY KEY"
