# specs/browser/result-sets.md H13 (R1776-R1778) against H3: the one-shot id
# search returns the same set as Browse, and the same error kind, provided and
# context (specs/conformance/search-ops.md S3; message text and ranges are
# not observed, so the identical message and UTF-16 range of H13 and H15 are
# Meguri's own tests, H16). Each query runs unsorted and sorted by its mode's
# default column (specs/browser/config-keys.md K5.1). The observations are
# search runs (search-ops S1, browser-ops B1), recorded with ids by logical
# number, so H13's ascending order is not observed; whether Meguri's executor
# answers the unsorted ones through search_ids is its own concern (H16). The
# empty text returns every id of the mode; deck:current reads curDeck in
# both (H9). Parse errors (unclosed group, bad id list, an unknown state and
# a bad number whose texts hold characters outside the BMP) and a run error
# (invalid regex) are the same kinds either way (browser-ops B1). Needs the
# regex, id and deck terms (U81, U82).
id: browser/modes/one-shot
tags: [needs-text, needs-ids, needs-deck]
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  decks: [Lang]
  notetypes:
    - name: Duo
      fields: [Front, Back]
      templates:
        - {name: Forward, front: "{{Front}}", back: "{{Back}}"}
        - {name: Reverse, front: "{{Back}}", back: "{{Front}}"}
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Duo, deck: Lang, fields: [plum, x]}
    - {notetype: Duo, fields: [fig, y]}
    - {notetype: Duo, deck: Lang, fields: [lime, z]}
steps:
  - set_current_deck: {deck: Lang}
  - observe:
      - search:
          - {query: ''}
          - {query: '', order: {column: noteFld}}
          - {query: '', kind: notes}
          - {query: '', kind: notes, order: {column: noteCrt}}
          - {query: 'deck:current'}
          - {query: 'deck:current', order: {column: noteFld}}
          - {query: 'deck:current', kind: notes}
          - {query: 'deck:current', kind: notes, order: {column: noteCrt}}
          - {query: '('}
          - {query: '(', order: {column: noteFld}}
          - {query: '(', kind: notes}
          - {query: '(', kind: notes, order: {column: noteCrt}}
          - {query: 'nid:1,a'}
          - {query: 'nid:1,a', order: {column: noteFld}}
          - {query: 'nid:1,a', kind: notes}
          - {query: 'nid:1,a', kind: notes, order: {column: noteCrt}}
          - {query: '"re:("'}
          - {query: '"re:("', order: {column: noteFld}}
          - {query: '"re:("', kind: notes}
          - {query: '"re:("', kind: notes, order: {column: noteCrt}}
          - {query: 'is:😴'}
          - {query: 'is:😴', order: {column: noteFld}}
          - {query: 'is:😴', kind: notes}
          - {query: 'is:😴', kind: notes, order: {column: noteCrt}}
          - {query: 'prop:ivl>𝟙'}
          - {query: 'prop:ivl>𝟙', order: {column: noteFld}}
          - {query: 'prop:ivl>𝟙', kind: notes}
          - {query: 'prop:ivl>𝟙', kind: notes, order: {column: noteCrt}}
