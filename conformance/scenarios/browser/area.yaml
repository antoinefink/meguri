# Active cases use the real browser adapter. Config cases follow K13;
# question/deck excerpts use the read-only U85a engine path (columns C16).
# T1 runs the live chain; new-collection starts from the U28 bootstrap.
# U84: the browser_rows observation and sorted searches (browser-ops B1 to
# B4). browser/modes/ is U85's (result-sets H16): every search of a browser
# scenario runs through the core's result sets. The streamed scenarios wait
# for Q10's streaming path.
