# The long time span of specs/browser/columns.md C12 (unit choice and the
# rounded amount) through the Interval and Stability cells (C7.7, R1125).
# Every card is a review card due on day 10 with a memory state. Interval
# gives whole days: 364 days stay in months and round to 12, 365 days are one
# year (the month/year boundary of C12), 912 days are about 2.5 years, 30
# days stay in days, 31 days are 1 month, 75 days are 2.5 months, 182 days
# round to 6 months, 730 and 3650 days are 2 and 10 years. Stability (days)
# reaches the small units: 7 s, 47.4 s (a fractional number of seconds),
# 59.6 s (still seconds), 150 s (2.5 minutes), 125 s (2.1 minutes, one
# decimal kept), 3,599 s (still minutes), 1.5 hours, 0.9999 days (still
# hours), 2.4 days, 364 days (months) and 912.5 days (years).
id: browser/columns/time-span-units
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  decks: [Spans]
  notetypes:
    - name: Plain
      fields: [Front, Back]
      templates:
        - {name: Card A, front: "{{Front}}", back: "{{Back}}"}
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Plain, deck: Spans, fields: [one, x]}
    - {notetype: Plain, deck: Spans, fields: [two, x]}
    - {notetype: Plain, deck: Spans, fields: [three, x]}
    - {notetype: Plain, deck: Spans, fields: [four, x]}
    - {notetype: Plain, deck: Spans, fields: [five, x]}
    - {notetype: Plain, deck: Spans, fields: [six, x]}
    - {notetype: Plain, deck: Spans, fields: [seven, x]}
    - {notetype: Plain, deck: Spans, fields: [eight, x]}
    - {notetype: Plain, deck: Spans, fields: [nine, x]}
    - {notetype: Plain, deck: Spans, fields: [ten, x]}
    - {notetype: Plain, deck: Spans, fields: [eleven, x]}
steps:
  - db_exec:
      sql: |
        UPDATE cards SET type = 2, queue = 2, due = 10, factor = 2500, reps = 3, ivl = v.column2, data = v.column3
        FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n FROM cards) AS c
        JOIN (VALUES
          (1, 364, '{"s":0.0000810185,"d":5.0}'),
          (2, 365, '{"s":0.0005486111,"d":5.0}'),
          (3, 912, '{"s":0.0006898148,"d":5.0}'),
          (4, 30, '{"s":0.0017361111,"d":5.0}'),
          (5, 31, '{"s":0.0014467593,"d":5.0}'),
          (6, 182, '{"s":0.0416550926,"d":5.0}'),
          (7, 730, '{"s":0.0625,"d":5.0}'),
          (8, 3650, '{"s":0.9999,"d":5.0}'),
          (9, 2, '{"s":2.4,"d":5.0}'),
          (10, 1, '{"s":364.0,"d":5.0}'),
          (11, 75, '{"s":912.5,"d":5.0}')
        ) AS v ON v.column1 = c.n
        WHERE cards.id = c.cid
  - observe:
      - browser_rows:
          columns: [cardIvl, stability]
          rows: ["#c1", "#c2", "#c3", "#c4", "#c5", "#c6", "#c7", "#c8", "#c9", "#c10", "#c11"]
