# Flags in notes mode (R1117, R1195; specs/browser/bulk-actions.md B1, B5).
# Selecting n1 and n2 targets their four cards. The current card (n1's
# Forward card) has no flag, so Flag 1 sets 1 on all four; #c3 already has
# it and is not written (count 3). Choosing Flag 1 again, now the current
# card's flag, sets 0 on all four (count 4). No Flag on n3 clears #c5's
# flag 2 and leaves #c6 unwritten (count 1). Every write keeps mod, sets
# usn -1 and keeps the bits above the low three (tags/flags-and-marked F2).
# Needs set_flag (specs/conformance/tag-ops.md G8), db_exec and
# undo_status.
id: browser/bulk/flag-notes-mode
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Forward, front: "{{Front}}", back: "{{Back}}"}
        - {name: Reverse, front: "{{Back}}", back: "{{Front}}"}
  notes:
    - {notetype: Pair, fields: [a, a2]}
    - {notetype: Pair, fields: [b, b2]}
    - {notetype: Pair, fields: [c, c2]}
steps:
  - db_exec: {sql: "UPDATE cards SET usn = 0"}
  - db_exec: {sql: "UPDATE cards SET flags = 129 WHERE nid = (SELECT id FROM notes WHERE sfld = 'b') AND ord = 0"}
  - db_exec: {sql: "UPDATE cards SET flags = 2 WHERE nid = (SELECT id FROM notes WHERE sfld = 'c') AND ord = 0"}
  - advance: 1m
  - set_flag: {cards: ["#c1", "#c2", "#c3", "#c4"], flag: 1}
  - db_exec: {sql: "SELECT flags, mod, usn FROM cards ORDER BY id"}
  - set_flag: {cards: ["#c1", "#c2", "#c3", "#c4"], flag: 0}
  - db_exec: {sql: "SELECT flags, mod, usn FROM cards ORDER BY id"}
  - set_flag: {cards: ["#c5", "#c6"], flag: 0}
  - db_exec: {sql: "SELECT flags, mod, usn FROM cards ORDER BY id"}
  - observe: [undo_status]
