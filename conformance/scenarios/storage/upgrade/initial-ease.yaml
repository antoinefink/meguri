# specs/storage/schema-upgrade.md U8, U13. The schema-15 fixture stores
# starting eases x100 (Default 250, Slow 230, Above 131), at the 1.3 boundary
# (Edge 130) and already divided (Fresh 2.5); see the U16 ease cases.
id: storage/upgrade/initial-ease
description: Starting eases are divided by 100 at schema 16, presets at or below 1.3 reset to 2.5, and low card eases of their decks raised to 2500.
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
steps:
  - open: {fixture: storage/schema-15.anki2}
  - db_exec: {sql: "SELECT id, name, mtime_secs, usn FROM deck_config ORDER BY id"}
  - db_exec: {sql: "SELECT c.id, d.name, o.name, c.factor, c.usn, c.mod FROM cards c JOIN decks d ON d.id = c.did LEFT JOIN decks o ON o.id = c.odid WHERE d.name LIKE 'Ease%' OR o.name LIKE 'Ease%' OR c.factor = 1400 ORDER BY c.id"}
  - observe: [{db_dump: {tables: [deck_config, cards]}}, schema_objects]
