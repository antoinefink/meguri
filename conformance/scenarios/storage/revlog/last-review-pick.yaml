      params: [2, 2, -5, 15, 2350, 3, 0, 0, "{\"s\":10.0,\"d\":5.0}"]
  - db_exec:
      sql: "INSERT INTO revlog SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 5), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1768989600006, 3, -600, -60, 0, 0), (1770285600006, 3, 10, 1, 2500, 1), (1771754400006, 3, 12, 10, 2500, 3)) AS v"
