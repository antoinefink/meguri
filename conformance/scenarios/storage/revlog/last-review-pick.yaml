# The instant that stands in for a missing lrt when the scheduler computes
# FSRS elapsed days (specs/sched/memory-state.md M3; sched/fsrs-transitions
# T2.3; R649, R650): the card's newest review-log row with a button (ease 1
# to 4) that is not a cram row (type 3 with factor 0). Every card is a review
# card with a stored memory state (s 10, d 5), so its rows are read for this
# instant only. Cards come in pairs: a card without lrt and a card whose lrt
# is the instant the rule picks must show the same Good memory state; a wrong
# pick moves the elapsed days and changes it. Load balancer off, UTC,
# rollover 4: next_day_at is 2026-03-03 04:00. Rows are at 10:00 UTC, N days
# before 2026-03-02, each card's row ids offset by its number in ms.
# c1: rated rows only, the newest a Hard review 15 days back; no lrt.
# c2: c1's rows, lrt at that Hard review.
# c3: a Good review 25 days back, then only unrated rows: a Set Due Date row
#     (type 4, factor 2500) 10 days back, a Rescheduled row 6 days back, a
#     Reset marker (type 4, factor 0) 5 days back and a Review row with
#     ease 0 3 days back; no lrt.
# c4: the Learn and Good rows only, lrt at the Good review 25 days back.
# c5: the Good review 25 days back, then a rated cram row (type 3, factor 0)
#     5 days back; no lrt.
# c6: the Good review 25 days back, then a rated early review in a filtered
#     deck (type 3, factor 2500) 8 days back; no lrt.
# c7: the Learn and Good rows only, lrt 8 days back.
# c8: the Good review 25 days back, then a Manual row rated Again (type 4,
#     ease 1) 12 days back; no lrt.
# c9: the Learn and Good rows only, lrt 12 days back.
# c10: only unrated rows (a Set Due Date row 20 days back, a Review row with
#     ease 0 10 days back); no lrt.
# c11: no review-log rows, no lrt.
# Expected pairs: c1 = c2; c3 = c4 = c5 (unrated and cram rows never
# count); c6 = c7 (a filtered row with a nonzero factor counts); c8 = c9 (a
# rated Manual row counts); c10 = c11 (no qualifying row: 0 elapsed days).
# Computing the states writes no card data on either side.
id: storage/revlog/last-review-pick
clock: {tz: UTC, start: "2026-03-02T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  notetypes:
    - name: Duo
      fields: [Side A, Side B]
      templates: [{name: Card A, front: "{{Side A}}", back: "{{Side B}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Duo, fields: [one, back]}
    - {notetype: Duo, fields: [two, back]}
    - {notetype: Duo, fields: [three, back]}
    - {notetype: Duo, fields: [four, back]}
    - {notetype: Duo, fields: [five, back]}
    - {notetype: Duo, fields: [six, back]}
    - {notetype: Duo, fields: [seven, back]}
    - {notetype: Duo, fields: [eight, back]}
    - {notetype: Duo, fields: [nine, back]}
    - {notetype: Duo, fields: [ten, back]}
    - {notetype: Duo, fields: [eleven, back]}
steps:
  # c1
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"
      params: [2, 2, -5, 15, 2350, 3, 0, 0, "{\"s\":10.0,\"d\":5.0}"]
  - db_exec:
      sql: "INSERT INTO revlog SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1768989600001, 3, -600, -60, 0, 0), (1769853600001, 3, 10, 1, 2500, 1), (1771149600001, 2, 15, 10, 2350, 1)) AS v"
  # c2
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1)"
      params: [2, 2, -5, 15, 2350, 3, 0, 0, "{\"s\":10.0,\"d\":5.0,\"lrt\":1771149600}"]
  - db_exec:
      sql: "INSERT INTO revlog SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1768989600002, 3, -600, -60, 0, 0), (1769853600002, 3, 10, 1, 2500, 1), (1771149600002, 2, 15, 10, 2350, 1)) AS v"
  # c3
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2)"
      params: [2, 2, -5, 15, 2350, 3, 0, 0, "{\"s\":10.0,\"d\":5.0}"]
  - db_exec:
      sql: "INSERT INTO revlog SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1768989600003, 3, -600, -60, 0, 0), (1770285600003, 3, 10, 1, 2500, 1), (1771581600003, 0, 10, 10, 2500, 4), (1771927200003, 0, 12, 10, 2500, 5), (1772013600003, 0, 0, 12, 0, 4), (1772186400003, 0, 12, 12, 2500, 1)) AS v"
