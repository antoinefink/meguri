# Deleting a filtered deck (specs/decks/decks.md D8, D9; R54): no card is
# removed (count 0); every card returns to its home deck with its original
# due, odid and odue cleared, and its queue set from its type (new, a
# relearning card with a day due, a learning card with a timestamp due) unless
# the card is suspended; each returned card is stamped. Only the filtered deck
# gets a grave. Cards are moved into the filtered deck with db_exec as Anki's
# build leaves them (specs/conformance/deck-ops.md K13).
id: decks/delete/filtered
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: One, front: "{{Front}}", back: "{{Back}}"}]
  decks: [Home, Other]
  notes:
    - {notetype: Pair, deck: Home, fields: [h1, a]}
    - {notetype: Pair, deck: Home, fields: [h2, a]}
    - {notetype: Pair, deck: Other, fields: [o1, a]}
    - {notetype: Pair, deck: Other, fields: [o2, a]}
steps:
  - db_exec:
      sql: >-
        INSERT INTO decks (id, name, mtime_secs, usn, common, kind)
        VALUES (100, 'Filt', 0, 0, X'08011001', X'12130801120a0a066465636b3a78106428d804383c')
  - db_exec:
      sql: >-
        UPDATE cards SET odid = did, odue = due, did = 100, due = -100000
        WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1)
  - db_exec:
      sql: >-
        UPDATE cards SET type = 3, queue = 3, ivl = 4, odid = did, odue = 5, did = 100, due = -99999
        WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1)
  - db_exec:
      sql: >-
        UPDATE cards SET type = 1, queue = 1, left = 1001, odid = did, odue = 1894701000, did = 100, due = -99998
        WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2)
  - db_exec:
      sql: >-
        UPDATE cards SET type = 2, queue = -1, ivl = 10, odid = did, odue = 12, did = 100, due = -99997
        WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 3)
  - advance: 1m
  - delete_decks: {decks: [Filt]}
  - observe: [card, decks]
  - db_exec: {sql: "SELECT oid, type, usn FROM graves ORDER BY type, oid"}
