# Moving decks by drag and drop (specs/decks/decks.md D7; R63, R64, R65):
# several decks in one operation, each with the name earlier moves left it
# (a listed subdeck moves on its own); drops onto the deck itself, its
# descendant or its current parent are skipped and not counted; the "+" rule
# for the top level; a filtered deck can be moved but nothing goes under one,
# which refuses the whole operation. The filtered deck is inserted with
# db_exec (specs/conformance/deck-ops.md K13).
id: decks/move/rules
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  decks: [a, x, "x::y", ab, b, "q::b", "m::n"]
steps:
  - db_exec:
      sql: >-
        INSERT INTO decks (id, name, mtime_secs, usn, common, kind)
        VALUES (100, 'Filt', 0, 0, X'08011001', X'12130801120a0a066465636b3a78106428d804383c')
  - advance: 1m
  - reparent_decks: {decks: [x, "x::y"], parent: a}
  - reparent_decks: {decks: ["a::y"], parent: a}
  - reparent_decks: {decks: [a], parent: a}
  - reparent_decks: {decks: [a], parent: "a::x"}
  - reparent_decks: {decks: [a], parent: ab}
  - reparent_decks: {decks: ["q::b"], parent: ""}
  - reparent_decks: {decks: ["m::n", ab], parent: Filt}
  - reparent_decks: {decks: [Filt], parent: m}
  - observe: [decks, deck_tree]
