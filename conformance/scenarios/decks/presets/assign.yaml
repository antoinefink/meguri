# Assigning a preset (specs/decks/deck-presets.md P9; R731, R732): to one deck,
# or to a deck and every normal deck of its subtree ("Save to all subdecks"),
# leaving a filtered subdeck alone; a deck that already uses the preset is not
# written; a filtered deck is refused. The filtered subdeck is inserted with
# db_exec (specs/conformance/deck-ops.md K13).
id: decks/presets/assign
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  decks: ["Lang::Es", "Lang::De", Solo]
steps:
  - db_exec:
      sql: >-
        INSERT INTO decks (id, name, mtime_secs, usn, common, kind)
        VALUES (100, 'Lang' || char(31) || 'Filt', 0, 0, X'08011001',
        X'12130801120a0a066465636b3a78106428d804383c')
  - add_preset: {name: Langs}
  - advance: 1m
  - set_deck_preset: {deck: Lang, preset: Langs, subtree: true}
  - observe: [decks]
  - advance: 1m
  - set_deck_preset: {deck: Solo, preset: Langs}
  - set_deck_preset: {deck: Solo, preset: Langs}
  - set_deck_preset: {deck: "Lang::Es", preset: Default}
  - set_deck_preset: {deck: "Lang::Filt", preset: Default}
  - observe: [decks]
