# A redo of an answer puts its review-log row back under its id. Here another
# writer, an SQL trigger, takes that id as soon as the undo deletes the row.
# Anki then inserts nothing and keeps the other writer's row, and applies the
# rest of the redo: the card is answered again (specs/engine/undo.md A8,
# specs/storage/ids-usn-mtime.md I4). Meguri's undo check refuses that redo
# instead: deviations undo-revlog-taken-id-redo, -status and -card. Needs
# db_exec, answer, undo, redo and undo_status
# (specs/conformance/record-ops.md W1, specs/conformance/undo-ops.md).
id: undo/revlog-taken-id
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: false, loadBalancerEnabled: false}
  notetypes:
    - name: Single
      fields: [Front, Back]
      templates: [{name: One, front: "{{Front}}", back: "{{Back}}"}]
  decks: [Inbox]
  notes:
    - {notetype: Single, deck: Inbox, fields: [sun, sol]}
steps:
  # When a pending review-log row is deleted, a row with the same id and
  # card, from elsewhere (usn 9), takes its place.
  - db_exec:
      sql: "CREATE TRIGGER occupy AFTER DELETE ON revlog WHEN old.usn = -1 BEGIN INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (old.id, old.cid, 9, 4, 4, 0, 2500, 1500, 0); END"
  - advance: 1h
  - answer: {card: "#c1", rating: good, time_ms: 2000}
  - observe: ["revlog(#c1)", undo_status]
  - advance: 1m
  - undo: {}
  - observe: ["card(#c1)", "revlog(#c1)", undo_status]
  - db_exec: {sql: "SELECT mod FROM col"}
  - advance: 1m
  - redo: {}
  - observe: ["revlog(#c1)", undo_status]
  - db_exec: {sql: "SELECT type, queue, reps FROM cards"}
