# After 31 undoable steps only the newest 30 are kept: 30 undos succeed,
# the 31st is refused, and the note keeps the first edit's text. Edits 1 m
# apart never merge (specs/engine/undo.md A2, A3; R719). Needs db_exec,
# edit_note, undo, redo and undo_status (specs/conformance/undo-ops.md).
id: undo/thirty-steps
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Single
      fields: [Front, Back]
      templates: [{name: One, front: "{{Front}}", back: "{{Back}}"}]
  decks: [Inbox]
  notes:
    - {notetype: Single, deck: Inbox, fields: [cat, v0]}
steps:
  - db_exec: {sql: "UPDATE notes SET usn = 7"}
