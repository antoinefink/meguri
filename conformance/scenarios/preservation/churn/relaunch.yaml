# AE66 (the part Anki shares), R1586, R1590, R2017 (normalized-dump.md N6,
# N10): a synced collection opened and closed 100 times over eight idle days,
# with day rollovers between opens, has nothing pending for sync: no row with
# usn -1, no grave, col.mod not after the last sync, and every stored value
# as before. The pending-change query is N6.1's.
