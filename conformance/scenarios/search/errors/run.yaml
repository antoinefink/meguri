# specs/search/errors.md E3: searches that parse but cannot run fail with
# search_failed (negated operator words, ids with non-ASCII digits); parse
# errors come back from search as from canonical_search.
id: search/errors/run
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Single
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Single, fields: [dog, x]}
steps:
  - observe:
      - canonical_search: ["-and", "-or", "a -and b", "nid:\u0661", "cid:\u0661,2", "did:\u0663"]
      - search:
          - {query: '-and'}
          - {query: '-and', kind: notes}
          - {query: '-OR'}
          - {query: '-OR', kind: notes}
          - {query: 'a -and b'}
          - {query: 'a -and b', kind: notes}
          - {query: '(-or)'}
          - {query: '(-or)', kind: notes}
          - {query: 'nid:١'}
          - {query: 'nid:١', kind: notes}
          - {query: 'cid:١,2'}
          - {query: 'cid:١,2', kind: notes}
          - {query: 'did:٣'}
          - {query: 'did:٣', kind: notes}
          - {query: '(a'}
          - {query: '(a', kind: notes}
          - {query: 'is:foo'}
          - {query: 'is:foo', kind: notes}
          - {query: 'prop:ivl>x'}
          - {query: 'prop:ivl>x', kind: notes}
          - {query: 'nid:1,a'}
          - {query: 'nid:1,a', kind: notes}
