# specs/conformance/dsl.md D9.1. Active: Meguri must pass them in T0 through
# the testkit's search adapter (meguri-search). errors/run and
# structure/whole-collection have no setup: they open the schema-18 storage
# fixture and write their notes and cards with db_exec. The other result
# scenarios need the notetypes and notes setup sections (U29, U27) and, where
# tagged needs-*, the terms of U81 and U82; they become active as those land.
area: search
active:
  - "canonical/*"
  # U82 names and ids (specs/search/names-and-ids.md). tags/hierarchy and
  # tags/regex-and-nc stay inactive: their setup note `Animal` is stored as
  # `animal` beside `animal::mammal` (tags T3, deviation
  # tags-implicit-parent-spelling), which changes their dumps and one search.
  - "decks/*"
  - "dupe/*"
  - "extractors/*"
  - "errors/ae42"
  - "errors/arguments"
  - "errors/escapes"
  - "errors/kinds"
  - "errors/order"
  - "errors/run"
  - "ids/lists"
  - "notetypes/names"
  - "regex/glob-size"
  - "lexing/*"
  - "structure/groups"
  - "structure/negation"
  - "structure/operators"
  - "structure/whole-collection"
