# specs/conformance/dsl.md D9.1. Active: Meguri must pass them in T0 through
# the testkit's search adapter (meguri-search). errors/run and
# structure/whole-collection have no setup: they open the schema-18 storage
# fixture and write their notes and cards with db_exec. The other result
# scenarios need the notetypes and notes setup sections (U29, U27) and, where
# tagged needs-*, the terms of U81 and U82; they become active as those land.
area: search
active:
  - "canonical/*"
  # U82: decks, dupe, errors/ae42, history/added-edited, ids,
  # notetypes/names, props, regex/glob-size and state, after the R1881
  # search-data scan (similarity/20261120T222836Z-26053) flagged none of
  # them. history/answers, dst-new-york, dst-paris and odd-ease stay inactive
  # until their flagged regions have a disposition (R1881).
  # tags/hierarchy and tags/regex-and-nc stay inactive: their setup note
  # `Animal` is stored as `animal` beside `animal::mammal` (tags T3,
  # deviation tags-implicit-parent-spelling), which changes their dumps and
  # one search.
  # U81: fields, folding, notetypes/glob-escapes, reference/examples, regex,
  # the needs-text structure scenarios and text, which the same scan
  # covered and did not flag. matrix/combined and unsorted wait for sorted
  # search (U84).
  - "decks/*"
  - "dupe/*"
  - "extractors/*"
  - "errors/ae42"
  - "errors/arguments"
  - "errors/escapes"
  - "errors/kinds"
  - "errors/order"
  - "errors/run"
  - "fields/*"
  - "folding/*"
  - "history/added-edited"
  - "ids/lists"
  - "notetypes/*"
  - "props/*"
  - "reference/examples"
  - "regex/*"
  - "state/*"
  - "lexing/*"
  - "structure/*"
  - "text/*"
