# specs/conformance/dsl.md D9.1. Active: Meguri must pass them in T0 through
# the testkit's search adapter (meguri-search). errors/run and
# structure/whole-collection have no setup: they open the schema-18 storage
# fixture and write their notes and cards with db_exec. The other result
# scenarios need the notetypes and notes setup sections (U29, U27) and, where
# tagged needs-*, the terms of U81 and U82; they become active as those land.
area: search
active:
  - "canonical/*"
  # U82: decks, dupe, errors/ae42, history/added-edited, ids,
  # notetypes/names, props, regex/glob-size and state, after the R1881
  # search-data scan (similarity/20261120T222836Z-26053) flagged none of
  # them. The rest of history and tags followed once their scenarios were
  # rewritten (2026-11-21): the history revlog inserts name their columns in
  # Meguri's own order (R1881), and the tags scenarios write note three's tag
  # with db_exec so that tags T3 spelling does not apply.
  - "decks/*"
  - "dupe/*"
  - "extractors/*"
  - "errors/ae42"
  - "errors/arguments"
  - "errors/escapes"
  - "errors/kinds"
  - "errors/order"
  - "errors/run"
  - "history/*"
  - "ids/lists"
  - "notetypes/names"
  - "props/*"
  - "regex/glob-size"
  - "state/*"
  - "lexing/*"
  - "structure/groups"
  - "structure/negation"
  - "structure/operators"
  - "structure/whole-collection"
  - "tags/*"
