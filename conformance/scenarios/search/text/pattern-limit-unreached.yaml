# specs/search/text-matching.md T3.3, T7.2, T12.3; fields.md F4: the
# wildcard pattern size limit (50,000 bytes of UTF-8) where no row reaches
# the test. Anki checks the limit only when a row is tested, so it returns no
# ids for front: with 49,999 `a` on a collection without notes (pattern
# 50,001 bytes: the value, then U+001F and `%` for Front, the first of two
# fields), and for plain text of 49,997 `a` whose excluded-field run patterns
# are too long only for a note type without notes (Wide: fields A, B, C, B
# excluded; each of the runs A and C gives 50,003 bytes, and Wide's clause is
# tested only for Wide notes). Meguri checks every pattern of the plan while
# it builds it and reports search_failed for each (deviation
# search-pattern-limit-unreached, at the first search of steps 0 and 3). The
# last step adds a Wide note: then both report search_failed. Single's own
# pattern for that text is 49,999 bytes.
id: search/text/pattern-limit-unreached
tags: [needs-text]
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Single
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
    - name: Wide
      fields: [A, B, C]
      templates: [{name: Forward, front: "{{A}}", back: "{{C}}"}]
      css: ".card { margin: 0; }"
steps:
  - observe:
      - search:
          - {query: "front:"}
  - legacy_update:
      notetype: Wide
      patch:
        flds:
          - {name: A, ord: 0, sticky: false, rtl: false, font: Arial, size: 20}
          - {name: B, ord: 1, sticky: false, rtl: false, font: Arial, size: 20, excludeFromSearch: true}
          - {name: C, ord: 2, sticky: false, rtl: false, font: Arial, size: 20}
  - add_note: {notetype: Single, fields: [dog, x]}
  - observe:
      - search:
          - {query: "", kind: notes}
          - {query: dog, kind: notes}
  - add_note: {notetype: Wide, fields: [x, y, z]}
  - observe:
      - search:
          - {query: "", kind: notes}
