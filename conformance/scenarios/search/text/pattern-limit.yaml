# specs/search/text-matching.md T3.3: a wildcard pattern longer than 50,000
# bytes (UTF-8) fails the search with search_failed. The limit counts the whole
# pattern Meguri tests: the `*` added around plain text, and the separators
# and wildcards a field search adds for the field's position. Queries:
# 49,998 `a` (pattern 50,000 bytes), 49,999 `a` (50,001 bytes), and Front:
# with 49,999 `a` (49,999 bytes of value plus 2 for Front's position: 50,001).
id: search/text/pattern-limit
tags: [needs-text]
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Single
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Single, fields: [dog, x]}
steps:
  - observe:
      - search:
          - {query: ""}
          - {query: ""}
          - {query: "front:"}
