# U81, U82, U84, U91; specs/search/*.md and specs/browser/sorting.md on one
# collection, so the term families run side by side over the same notes.
# The card states come from real ops (answer, set_due, suspend, bury,
# set_flag); tags change through add_note_tags and remove_note_tags, a sort
# field through edit_note, and a day passes before a later note and later
# answers. Sections: note types, templates and fields (names-and-ids N4,
# fields F2-F4); decks with subdecks and trimmed levels (N3.3); ids (N5);
# plain text, phrases and HTML in the sort field (text-matching T2, T5);
# states and flags, including invalid values (state-and-flags S5, S6);
# properties (properties P2-P4); tags with hierarchy, one-character and run
# wildcards, escaped and literal characters, quoted spaces and nc: (N2.2,
# N2.4); AND before OR and negated groups (grammar G2, G4, G5); notes mode
# (query-model Q4); added: and rated: after the day (history H3, H5); and
# results sorted by several columns (browser/sorting). Pair has two
# templates; its note with an empty first field has only the second card.
# Ids come from the frozen clock: 1930395600000 + note (card) number - 1.
# FSRS is on and the load balancer off, as in the sched/answer scenarios
# (specs/sched/answering.md "FSRS" and A9): Meguri answers only with
# FSRS on, so a golden recorded with FSRS off cannot match its card rows.
id: search/matrix/combined
tags: [needs-text, needs-tag, needs-deck, needs-notetype, needs-template, needs-ids, needs-state, needs-prop, needs-history]
clock: {tz: UTC, start: "2031-03-04T13:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  decks: [Lang, "Lang::Verbs", "Lang::Verbs::Past", Sums]
  notetypes:
    - name: Pair
      fields: [Word, Meaning]
      templates:
        - {name: Forward, front: "{{Word}}", back: "{{Meaning}}"}
        - {name: Reverse, front: "{{Meaning}}", back: "{{Word}}"}
      css: ".card { margin: 0; }"
    - name: Single
      fields: [Word, Extra]
      templates: [{name: Prompt, front: "{{Word}}", back: "{{Extra}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Pair, deck: Lang, fields: [seven, a number], tags: ["colour::red", cat]}
    - {notetype: Single, deck: "Lang::Verbs", fields: [walked, past of walk], tags: [cot, "a*b", élan]}
    - {notetype: Single, deck: "Lang::Verbs::Past", fields: ["<i>tea</i>pot", yellow], tags: [colt, axb, Zoë]}
    - {notetype: Pair, deck: Sums, fields: [eleven, "<i>tea</i>pot"], tags: ["colour::blue", "50%"]}
    - {notetype: Pair, deck: Sums, fields: ["", plus]}
    - {notetype: Single, fields: [nine, odd number], tags: ["x::colour", "5x%"]}
steps:
  - observe: [ids]
  # c1 review (easy), c3 learning, c5 review due today then easy, c6 review
  # then a lapse (relearning), c2 suspended, c8 buried by the user, flags on
  # c2, c4 and c7; the card rows show the values the prop: terms compare
  - answer: {card: "#c1", rating: easy}
  - answer: {card: "#c3", rating: good}
  - set_due: {cards: ["#c5"], days: "0"}
  - set_due: {cards: ["#c6"], days: "6"}
  - answer: {card: "#c5", rating: easy}
  - answer: {card: "#c6", rating: again}
  - suspend: {cards: ["#c2"]}
  - bury: {cards: ["#c8"]}
  - set_flag: {cards: ["#c2"], flag: 1}
  - set_flag: {cards: ["#c4"], flag: 4}
  - set_flag: {cards: ["#c7"], flag: 7}
  - observe:
      - "card(#c1, #c3, #c5, #c6)"
      - search:
          # note types
          - {query: 'note:pair'}
          - {query: 'note:SINGLE'}
          - {query: 'note:p*'}
          - {query: 'note:pai'}
          - {query: '-note:pair'}
          # templates by name and number
          - {query: 'card:reverse'}
          - {query: 'card:2'}
          - {query: 'card:1'}
          - {query: '"card:Forward"'}
          - {query: 'card:p*'}
          - {query: 'card:3'}
          # fields
          - {query: 'word:seven'}
          - {query: 'word:sev'}
          - {query: 'word:sev*'}
          - {query: 'word:'}
          - {query: 'word:_*'}
          - {query: 'meaning:*'}
          - {query: '-meaning:*'}
          - {query: 'extra:yellow'}
          - {query: '-extra:yellow'}
          - {query: 'wo*:eleven'}
          - {query: 'colour:red'}
          # decks
          - {query: 'deck:lang'}
          - {query: 'deck:lang::verbs'}
          - {query: 'deck:lang::*'}
          - {query: 'deck:lang -deck:lang::*'}
          - {query: 'deck:*past'}
          - {query: 'deck:l_ng*'}
          - {query: 'deck:verbs'}
          - {query: '"deck:lang :: verbs"'}
          - {query: 'deck:SUMS'}
          - {query: '-deck:sums'}
          - {query: 'deck:default'}
          # ids
          - {query: 'nid:1930395600001,1930395600003'}
          - {query: 'nid:01930395600005'}
          - {query: 'nid:7'}
          - {query: 'cid:1930395600005'}
          - {query: '-nid:1930395600000'}
          # plain text and phrases
          - {query: 'seven'}
          - {query: 'number'}
          - {query: 'number -odd'}
          - {query: '"a number"'}
          - {query: '"seven a"'}
          - {query: 'seven*number'}
          - {query: 'w_lked'}
          - {query: 'elev*'}
          # HTML in the sort field and in another field
          - {query: 'teapot'}
          - {query: 'tea*pot'}
          # states
          - {query: 'is:new'}
          - {query: 'is:learn'}
          - {query: 'is:review'}
          - {query: 'is:learn is:review'}
          - {query: 'is:due'}
          - {query: '-is:due'}
          - {query: 'is:suspended'}
          - {query: 'is:buried'}
          - {query: 'is:buried-manually'}
          - {query: 'is:new -is:suspended -is:buried'}
          # flags
          - {query: 'flag:1'}
          - {query: 'flag:4'}
          - {query: 'flag:0'}
          - {query: '-flag:0'}
          # invalid state and flag values
          - {query: 'is:learned'}
          - {query: 'flag:blue'}
          # properties; under FSRS #c1 has interval 7 and #c5 interval 8,
          # so ivl>=8 takes only #c5 at its bound and due=7 only #c1
          - {query: 'prop:ivl=0'}
          - {query: 'prop:ivl>0'}
          - {query: 'prop:ivl>=8'}
          - {query: 'prop:due=7'}
          - {query: 'prop:due>0'}
          - {query: 'prop:due=0'}
          - {query: 'prop:reps=1'}
          - {query: 'prop:reps<1'}
          - {query: 'prop:lapses=1'}
          - {query: 'prop:ease=2.5'}
          - {query: 'prop:ease>2.5'}
          - {query: 'prop:ease<1'}
          # tags
          - {query: 'tag:colour'}
          - {query: 'tag:colour::*'}
          - {query: 'tag:*colour'}
          - {query: 'tag:red'}
          - {query: 'tag:*::red'}
          - {query: 'tag:c_t'}
          - {query: 'tag:c\_t'}
          - {query: 'tag:co*t'}
          - {query: 'tag:a\*b'}
          - {query: 'tag:a*b'}
          - {query: 'tag:50%'}
          - {query: 'tag:5_%'}
          - {query: 'tag:none'}
          - {query: 'tag:*'}
          - {query: 'tag:_*'}
          - {query: '"tag:cat cot"'}
          - {query: 'tag:elan'}
          - {query: 'tag:nc:elan'}
          - {query: 'tag:nc:ZOE'}
          - {query: 'tag:ÉLAN'}
          - {query: 'tag:cat tag:colour'}
          # AND before OR, groups and negated groups
          - {query: 'tag:cot OR is:suspended'}
          - {query: 'deck:sums or note:single'}
          - {query: '-(deck:sums OR note:single)'}
          - {query: 'deck:lang (card:2 OR flag:4)'}
          - {query: 'is:new or is:review flag:0'}
          - {query: '(is:new or is:review) flag:0'}
          # notes mode
          - {query: 'card:2', kind: notes}
          - {query: '-card:2', kind: notes}
          - {query: 'is:suspended', kind: notes}
          - {query: 'flag:7', kind: notes}
          - {query: 'cid:1930395600005', kind: notes}
          - {query: 'deck:lang -deck:lang::*', kind: notes}
  # bulk tag ops
  - add_note_tags: {notes: ["#n2", "#n5"], tags: "later Batch"}
  - remove_note_tags: {notes: ["#n1"], tags: "colour::red"}
  - observe:
      - search:
          - {query: 'tag:later'}
          - {query: 'tag:batch'}
          - {query: 'tag:none'}
          - {query: 'tag:colour'}
          - {query: 'tag:*::red'}
          - {query: 'tag:cat'}
  # the sort field loses its HTML
  - edit_note: {note: "#n3", fields: [tea pot, yellow]}
  - observe:
      - search:
          - {query: 'teapot'}
          - {query: '"tea pot"'}
          - {query: 'tea*pot'}
  # the next day: a new note and two answers
  - advance: 1d
  - add_note: {notetype: Single, deck: Lang, fields: [ten, after a day]}
  - observe:
      - timing
      - search:
          - {query: 'added:1'}
          - {query: 'added:0'}
          - {query: 'added:2'}
          - {query: 'is:buried'}
          # #c1 is now due in 6 days, one less than before the day
          - {query: 'prop:due=6'}
          - {query: 'rated:1'}
          - {query: 'rated:2'}
          - {query: 'rated:2:4'}
          - {query: 'rated:2:1'}
          - {query: 'rated:2:3'}
  - answer: {card: "#c9", rating: good}
  - answer: {card: "#c4", rating: hard}
  - observe:
      - search:
          - {query: 'rated:1'}
          - {query: 'rated:1:2'}
          - {query: 'rated:1:3'}
          - {query: 'rated:2:3'}
          - {query: '-rated:2 deck:lang'}
          - {query: 'rated:1', kind: notes}
  # sorted results
  - observe:
      - search:
          - {query: '', order: {column: noteFld}}
          - {query: 'note:pair', order: {column: template, reverse: true}}
          - {query: '', order: {column: cardIvl, reverse: true}}
          - {query: '', order: {column: cardReps}}
          - {query: 'is:review', order: {column: cardEase}}
          - {query: '', order: {column: deck}}
          - {query: '', kind: notes, order: {column: noteTags}}
          - {query: '', kind: notes, order: {column: note, reverse: true}}
