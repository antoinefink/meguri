# specs/search/grammar.md G3: quoted, partly quoted and unquoted terms and where
# they end; spaces are optional where the boundary is clear.
id: search/lexing/terms
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
steps:
  - observe:
      - canonical_search:
          # term boundaries
          - 'p"q"(r)'
          - '"k l m"no'
          - 'a(b)'
          - '(x)(y)'
          - '"x""y"'
          - '"x"(y)'
          - 'a "b" c'
          - 'a b'
          # quoted terms
          - '"a b"'
          - '"a"'
          - '"(a)"'
          - '"a-b"'
          - '"-"'
          - '"a\"b"'
          - 'a\"b'
          - '"\("'
          - '"x\)\(y"'
          - '")x("'
          - '"a:b c"'
          - '"a\:b c"'
          - '"日本 語"'
          - 'ü'
          - '"cedar" "p q r"'
          - '"stem:le\"af"'
          # partly quoted terms: the quote must follow the first colon directly
          - 'key:"value with spaces"'
          - 'key: "value"'
          - 'a:"b"c'
          - 'deck:"a b"c'
          - 'x:"a" y'
          - 'a:b:"c"'
          - 'stem:"oak"'
          - 'stem:"le\"af"'
          - 'DECK:"a b"'
          - 'a\":"b"'
          # keys inside quotes are still keys
          - '"deck:a b"'
          - 'deck:a b'
          - '"my field:x"'
          - '"f:"'
          - '"and"'
          - '"OR"'
          - '"Or"'
          - '"Or"  "aND"'
