# R1065, R1066, R1067, R1068; specs/search/properties.md P3-P6. prop:ivl,
# reps and lapses compare the columns; prop:ease the stored factor (operand
# times 1000 in 32-bit floats, truncated); prop:due days relative to today for
# review and interday learning cards and (due - next day boundary) / 86400,
# truncated toward zero, for intraday learning and preview cards, on the
# original due of a filtered card; prop:pos the position of new cards (type 0).
# Day 10 (2030-01-25, rollover 4 UTC): one second before the boundary of
# 2030-01-26 04:00 UTC, then at it (day 11). Card ids come from the frozen
# clock (1894701600000 + note number - 1).
id: search/props/scheduling
tags: [needs-prop]
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Memo
      fields: [Front, Back]
      templates: [{name: Recall, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Memo, fields: [c1, "review due day 9"]}
    - {notetype: Memo, fields: [c2, "review due day 10"]}
    - {notetype: Memo, fields: [c3, "review due day 11"]}
    - {notetype: Memo, fields: [c4, "interday learning due day 9"]}
    - {notetype: Memo, fields: [c5, "learning due 1 s before the previous boundary"]}
    - {notetype: Memo, fields: [c6, "learning due 10 min after 03:50 on day 10"]}
    - {notetype: Memo, fields: [c7, "learning due at the previous boundary"]}
    - {notetype: Memo, fields: [c8, "filtered review, home due day 9"]}
    - {notetype: Memo, fields: [c9, "filtered learning"]}
    - {notetype: Memo, fields: [c10, "new position 3"]}
    - {notetype: Memo, fields: [c11, "filtered new, position 2"]}
    - {notetype: Memo, fields: [c12, "suspended new position 5"]}
    - {notetype: Memo, fields: [c13, "suspended review due day 9"]}
    - {notetype: Memo, fields: [c14, "preview"]}
    - {notetype: Memo, fields: [c15, "relearning"]}
steps:
  - observe: [ids]
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = 2, due = 9, odue = 0, ivl = 10, reps = 5, lapses = 0, factor = 2500 WHERE id = 1894701600000"}
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = 2, due = 10, odue = 0, ivl = 3, reps = 2, lapses = 1, factor = 1300 WHERE id = 1894701600001"}
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = 2, due = 11, odue = 0, ivl = 30, reps = 12, lapses = 3, factor = 2300 WHERE id = 1894701600002"}
  - db_exec: {sql: "UPDATE cards SET type = 1, queue = 3, due = 9, odue = 0, ivl = 0, reps = 1, lapses = 0, factor = 0 WHERE id = 1894701600003"}
  - db_exec: {sql: "UPDATE cards SET type = 1, queue = 1, due = 1895543999, odue = 0, ivl = 0, reps = 1, lapses = 0, factor = 0 WHERE id = 1894701600004"}
  - db_exec: {sql: "UPDATE cards SET type = 1, queue = 1, due = 1895630999, odue = 0, ivl = 0, reps = 1, lapses = 0, factor = 0 WHERE id = 1894701600005"}
  - db_exec: {sql: "UPDATE cards SET type = 1, queue = 1, due = 1895544000, odue = 0, ivl = 0, reps = 1, lapses = 0, factor = 0 WHERE id = 1894701600006"}
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = 2, due = -100000, odue = 9, ivl = 10, reps = 5, lapses = 0, factor = 2500 WHERE id = 1894701600007"}
  - db_exec: {sql: "UPDATE cards SET type = 1, queue = 1, due = 1895630999, odue = 1895543999, ivl = 0, reps = 1, lapses = 0, factor = 0 WHERE id = 1894701600008"}
  - db_exec: {sql: "UPDATE cards SET type = 0, queue = 0, due = 3, odue = 0, ivl = 0, reps = 0, lapses = 0, factor = 0 WHERE id = 1894701600009"}
  - db_exec: {sql: "UPDATE cards SET type = 0, queue = 0, due = -100000, odue = 2, ivl = 0, reps = 0, lapses = 0, factor = 0 WHERE id = 1894701600010"}
  - db_exec: {sql: "UPDATE cards SET type = 0, queue = -1, due = 5, odue = 0, ivl = 0, reps = 0, lapses = 0, factor = 0 WHERE id = 1894701600011"}
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = -1, due = 9, odue = 0, ivl = 10, reps = 5, lapses = 0, factor = 2500 WHERE id = 1894701600012"}
  - db_exec: {sql: "UPDATE cards SET type = 1, queue = 4, due = 1895630999, odue = 0, ivl = 0, reps = 1, lapses = 0, factor = 0 WHERE id = 1894701600013"}
  - db_exec: {sql: "UPDATE cards SET type = 3, queue = 1, due = 1895543999, odue = 0, ivl = 10, reps = 8, lapses = 2, factor = 2500 WHERE id = 1894701600014"}
  - set_clock: "2030-01-26T03:59:59"
  - observe:
      - timing
      - search:
          - {query: 'prop:ivl>=10'}
          - {query: 'prop:ivl=0'}
          - {query: 'prop:ivl<=+3'}
          - {query: 'prop:reps>3'}
          - {query: 'prop:lapses=0'}
          - {query: 'prop:lapses>=1'}
          - {query: 'prop:ease=2.5'}
          - {query: 'prop:ease!=2.5'}
          - {query: 'prop:ease=1.3'}
          - {query: 'prop:ease=2.3'}
          - {query: 'prop:ease<1'}
          - {query: 'prop:ease>=1.2999'}
          - {query: 'prop:ease>inf'}
          - {query: 'prop:ease>nan'}
          - {query: 'prop:ease<-1'}
          - {query: 'prop:due=-1'}
          - {query: 'prop:due=0'}
          - {query: 'prop:due=1'}
          - {query: 'prop:due>=0'}
          - {query: 'prop:due<0'}
          - {query: 'prop:due!=0'}
          - {query: 'prop:due=+1'}
          - {query: 'prop:due=-0'}
          - {query: 'prop:pos<=3'}
          - {query: 'prop:pos=5'}
          - {query: 'prop:pos>0'}
          - {query: '-prop:pos>0'}
  - set_clock: "2030-01-26T04:00:00"
  - observe:
      - timing
      - search:
          - {query: 'prop:due=-2'}
          - {query: 'prop:due=-1'}
          - {query: 'prop:due=0'}
          - {query: 'prop:due<2147483647'}
          - {query: 'prop:due>-2147483648'}
