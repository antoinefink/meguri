    - {notetype: Ledger, fields: [e34, "product beyond the largest finite elsewhere"]}
    - {notetype: Ledger, fields: [e35, "twenty one digit integer"]}
    - {notetype: Ledger, fields: [e36, "exact halfway text"]}
    - {notetype: Ledger, fields: [e37, "exponent below -308"]}
    - {notetype: Ledger, fields: [e38, "zero with exponent 400"]}
    - {notetype: Ledger, fields: [e39, "exponent -400"]}
