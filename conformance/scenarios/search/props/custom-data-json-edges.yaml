    - {notetype: Ledger, fields: [e12, "smallest signed 64-bit"]}
    - {notetype: Ledger, fields: [e13, "one below signed 64-bit"]}
    - {notetype: Ledger, fields: [e14, "exponent 1e-7"]}
    - {notetype: Ledger, fields: [e15, "fraction 0.0001"]}
    - {notetype: Ledger, fields: [e16, "seventeen digits"]}
    - {notetype: Ledger, fields: [e17, "nested arrays with spaces"]}
