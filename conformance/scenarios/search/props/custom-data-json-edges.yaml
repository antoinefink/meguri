# specs/search/properties.md P12 (R1071): where the custom data text
# stops parsing as JSON (a number beyond the 64-bit float range, a lone
# surrogate escape, nesting deeper than 127 arrays and objects, text after
# the value), and the text C gives for numbers that are not plain
# integers (exponents, minus zero, integers beyond 64 bits). Notes e31 to
# e42 pick numbers where the reader's one-step scaling and dropped digits
# give a different float from the correctly rounded one. Each case puts
# the key k beside the edge so that has-cd:k shows whether the whole text
# parsed. Card ids come from the frozen clock (1894701600000 + note
# number - 1).
id: search/props/custom-data-json-edges
tags: [needs-prop]
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Ledger
      fields: [Alpha, Beta]
      templates: [{name: Card A, front: "{{Alpha}}", back: "{{Beta}}"}]
      css: ".card { padding: 2px; }"
  notes:
    - {notetype: Ledger, fields: [e1, "overflowing number elsewhere"]}
    - {notetype: Ledger, fields: [e2, "minus zero integer"]}
    - {notetype: Ledger, fields: [e3, "exponent 1e2"]}
    - {notetype: Ledger, fields: [e4, "exponent 1e15"]}
    - {notetype: Ledger, fields: [e5, "exponent 1e16"]}
    - {notetype: Ledger, fields: [e6, "lone surrogate elsewhere"]}
    - {notetype: Ledger, fields: [e7, "surrogate pair"]}
    - {notetype: Ledger, fields: [e8, "depth 127"]}
    - {notetype: Ledger, fields: [e9, "depth 128"]}
    - {notetype: Ledger, fields: [e10, "largest unsigned 64-bit"]}
