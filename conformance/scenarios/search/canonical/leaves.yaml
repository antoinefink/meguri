# specs/search/canonical-form.md F5: the canonical text of every term family.
id: search/canonical/leaves
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
steps:
  - observe:
      - canonical_search:
          # deck, note type, preset
          - 'deck:a'
          - 'deck:*'
          - 'deck:current'
          - 'deck:filtered'
          - 'deck:a::b'
          - 'deck:a*'
          - 'note:Basic'
          - '"note:my type"'
          - 'note:a*'
          - 'preset:Default'
          - '"preset:my preset"'
          # tags
          - 'tag:x'
          - 'tag:none'
          - 'tag:*'
          - 'tag:a::b'
          - 'tag:re:^x$'
          - 'tag:nc:x'
          - 'tag:x*'
          # templates
          - 'card:1'
          - 'card:2'
          - 'card:0'
          - 'card:+1'
          - 'card:01'
          - 'card:65535'
          - 'card:65536'
          - 'card:-1'
          - 'card:Forward'
          - '"card:Card 1"'
          - 'card:\-1'
          - 'card:F*'
          # flags and states
          - 'flag:0'
          - 'flag:7'
          - 'flag:+1'
          - 'flag:007'
          - 'is:new'
          - 'is:review'
          - 'is:learn'
          - 'is:due'
          - 'is:buried'
          - 'is:buried-manually'
          - 'is:buried-sibling'
          - 'is:suspended'
          # history
          - 'added:1'
          - 'added:0'
          - 'added:+3'
          - 'added:4294967295'
          - 'edited:0'
          - 'edited:5'
          - 'introduced:0'
          - 'introduced:5'
          - 'rated:0'
          - 'rated:1'
          - 'rated:2:+3'
          - 'rated:2:04'
          - 'rated:7:1'
          - 'rated:0:4'
          - 'resched:0'
          - 'resched:5'
          - 'resched:+2'
          # ids
          - 'did:1'
          - 'did:1,2'
          - 'nid:007'
          - 'nid:1,2,3'
          - 'cid:12345678901234567890'
          - 'nid:١٢'
          - 'mid:+5'
          - 'mid:-5'
          - 'mid:007'
          - 'mid:9223372036854775807'
          - 'mid:-9223372036854775808'
          # text families
          - 'a'
          - 're:\d'
          - 're:a\"b'
          - '"re:a b"'
          - 're:\('
          - '"re:("'
          - 'nc:x'
          - 'sc:x'
          - 'w:x'
          - '"w:a b"'
          - 'has-cd:r'
          - 'f:x'
          - 'f:re:x'
          - 'f:nc:x'
          - 'f*:x'
          - '*:x'
          - '"my field:x y"'
          - 'f:'
          # duplicates
          - 'dupe:1,a'
          - 'dupe:+1,a'
          - 'dupe:1,'
          - 'dupe:-5,x'
          - 'dupe:1,a,b'
          # properties
          - 'prop:ivl>3'
          - 'prop:ivl>=+5'
          - 'prop:due=-1'
          - 'prop:due>-3'
          - 'prop:due=-0'
          - 'prop:reps<10'
          - 'prop:lapses!=2'
          - 'prop:pos<=3'
          - 'prop:pos=+3'
          - 'prop:ease<=3.3'
          - 'prop:ease>1.0'
          - 'prop:s>1.0'
          - 'prop:d<=1'
          - 'prop:d>0.5'
          - 'prop:r<0.9'
          - 'prop:rated=0:1'
          - 'prop:rated=-1'
          - 'prop:rated=-0'
          - 'prop:rated<=-1:1'
          - 'prop:resched=-2'
          - 'prop:cdn:abc<=1'
          - 'prop:cdn:abc>1.5'
          - 'prop:cdn:k!=1e3'
          - 'prop:cds:abc=foo'
          - 'prop:cds:k='
          - 'prop:cds:k>=x'
          - 'prop:cds:k=a\"b'
