# R1054, R1055, R1056, R1268; specs/search/names-and-ids.md N3.2, N3.3, N3.7.
# deck: matches a deck and its subdecks by full path from the top, ignoring
# letter case (simple case folding), on the card's deck or, for a card in a
# filtered deck, on its home deck. Wildcards may cross a level. Each level of
# the value is normalized like a deck name (trimmed, empty becomes "blank").
# The filtered deck Cram (id 100) is written with db_exec as
# specs/conformance/deck-ops.md K13 (U28) gives it; one card of Home is moved
# into it.
id: search/decks/names
tags: [needs-deck]
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  decks:
    - French
    - "French::Verbs"
    - "Languages::French"
    - Frame
    - "a::b"
    - axb
    - STRASSE
    - über
    - blank
    - "Home::Child"
    - Home
    - a
    - "x:y"
  notetypes:
    - name: Memo
      fields: [Front, Back]
      templates: [{name: Recall, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Memo, deck: French, fields: [french, x]}
    - {notetype: Memo, deck: "French::Verbs", fields: [verbs, x]}
    - {notetype: Memo, deck: "Languages::French", fields: [languages-french, x]}
    - {notetype: Memo, deck: Frame, fields: [frame, x]}
    - {notetype: Memo, deck: "a::b", fields: [a-b, x]}
    - {notetype: Memo, deck: axb, fields: [axb, x]}
    - {notetype: Memo, deck: STRASSE, fields: [strasse, x]}
    - {notetype: Memo, deck: über, fields: [uber, x]}
    - {notetype: Memo, deck: blank, fields: [blank, x]}
    - {notetype: Memo, deck: "Home", fields: [home, x]}
    - {notetype: Memo, deck: "Home::Child", fields: [child, x]}
    - {notetype: Memo, deck: "Home", fields: [home-filtered, x]}
    - {notetype: Memo, fields: [default, x]}
    - {notetype: Memo, deck: "a", fields: [a, x]}
    - {notetype: Memo, deck: "x:y", fields: [x-colon-y, x]}
steps:
  - db_exec: {sql: "INSERT INTO decks (id, name, mtime_secs, usn, common, kind) VALUES (100, 'Cram', 0, 0, X'08011001', X'12130801120a0a066465636b3a78106428d804383c')"}
  - db_exec: {sql: "UPDATE cards SET odid = did, did = 100, odue = due, due = -100000 WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 11)"}
  - db_exec: {sql: "SELECT replace(d.name, char(31), '::'), count(c.id) FROM decks d LEFT JOIN cards c ON c.did = d.id GROUP BY d.id ORDER BY d.name"}
  - observe:
      - search:
          - {query: 'deck:french'}
          - {query: 'deck:FRENCH::verbs'}
          - {query: 'deck:french -deck:french::*'}
          - {query: 'deck:french::*'}
          - {query: 'deck:languages::french'}
          - {query: 'deck:*french'}
          - {query: 'deck:*::french'}
          - {query: 'deck:fr*'}
          - {query: 'deck:fr_nch'}
          - {query: 'deck:a_b'}
          - {query: 'deck:a::b'}
          - {query: '"deck:a :: b"'}
          - {query: 'deck:a:'}
          - {query: 'deck:a::'}
          - {query: 'deck:'}
          - {query: 'deck:x:y'}
          - {query: 'deck:x\:y'}
          - {query: 'deck:straße'}
          - {query: 'deck:strasse'}
          - {query: 'deck:ÜBER'}
          - {query: 'deck:*'}
          - {query: 'deck:**'}
          - {query: 'deck:filtered'}
          - {query: 'deck:Filtered'}
          - {query: 'deck:cram'}
          - {query: 'deck:home'}
          - {query: 'deck:home -deck:filtered'}
          - {query: 'deck:home::child'}
          - {query: 'deck:default'}
          - {query: 'deck:current'}
          - {query: 'deck:Current'}
          - {query: 'deck:nosuchdeck'}
          - {query: 'deck:french', kind: notes}
          - {query: 'deck:filtered', kind: notes}
