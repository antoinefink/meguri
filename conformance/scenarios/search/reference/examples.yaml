# R1093; specs/search/syntax-reference.md Y1, Y11: every example of the
# search field's syntax reference is its own canonical text and runs with no
# error, in cards mode and in notes mode, on a collection with a standard
# note type (with a field whose name holds a space) and a cloze note type.
# The examples are listed in Y2 to Y9 order. Draft: recorded, not in
# area.yaml; its tags are every needs-* of specs/conformance/search-ops.md S4.
id: search/reference/examples
tags: [needs-text, needs-tag, needs-deck, needs-notetype, needs-template, needs-ids, needs-dupe, needs-state, needs-prop, needs-history]
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Memo
      fields: [Front, Back, my field]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
    - name: Gap
      kind: cloze
      fields: [Text, Extra]
      templates: [{name: Cloze, front: "{{cloze:Text}}", back: "{{cloze:Text}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Memo, fields: [dog, a dog and a cat, dog], tags: [animal]}
    - {notetype: Memo, fields: ["über", "3:30 a_b", ""], tags: ["animal::mammal"]}
    - {notetype: Memo, fields: [drag, "123", fish]}
    - {notetype: Gap, fields: ["{{c1::capital}} city", ""], tags: [geo]}
steps:
  - observe:
      - canonical_search:
          - 'dog cat'
          - 'dog OR cat'
          - '(dog OR cat) fish'
          - '-cat'
          - 'dog -(cat OR fish)'
          - '"a dog"'
          - '"or"'
          - '"-dog"'
          - 'dog'
          - 'd*g'
          - 'd_g'
          - 'a\_b'
          - '3\:30'
          - 'w:dog'
          - 'nc:uber'
          - 're:\d{3}'
          - 'sc:capital'
          - 'front:dog'
          - 'front:*dog*'
          - 'front:'
          - 'front:_*'
          - 'front:re:^d'
          - 'front:nc:uber'
          - '"my field:dog"'
          - 'tag:animal'
          - 'tag:animal::*'
          - 'tag:none'
          - 'tag:re:^ani'
          - 'deck:Japanese'
          - '"deck:Japanese Core"'
          - 'deck:current'
          - 'deck:filtered'
          - 'deck:*'
