# specs/search/text-matching.md T12; specs/search/errors.md E3: a pattern
# that does not parse (a syntax error, or groups nested 250 deep, while 249
# are accepted) is invalid_regex; one that parses but compiles beyond the size
# limit is search_failed. An unquoted `re:(` is a grammar error (the `(` opens
# a group). Here notes exist, so Anki tests a row and reports the error;
# search/regex/invalid-unreached covers the searches where it tests none.
