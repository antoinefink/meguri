            - {id: pos-negative-zero, data: '{"pos":-0}', due: 35, ivl: 10, today: 30, now: 1897293600}
            - {id: pos-fraction, data: '{"pos":3.0}', due: 0, ivl: 0, today: 30, now: 1897293600}
            - {id: pos-exponent, data: '{"pos":1e2}', due: 35, ivl: 10, today: 30, now: 1897293600}
            - {id: pos-string, data: '{"pos":"7","s":5,"d":5}', due: 35, ivl: 10, today: 30, now: 1897293600}
            - {id: pos-null, data: '{"pos":null,"s":5,"d":5}', due: 35, ivl: 10, today: 30, now: 1897293600}
            # The array form: pos, s, d, dr, decay, lrt, cd by position.
            - {id: array, data: '[1,2,3]', due: 35, ivl: 20, today: 30, now: 1897293600}
            - {id: array-single, data: '[7]', due: 0, ivl: 0, today: 30, now: 1897293600}
