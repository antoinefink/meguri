            - {id: array-null-cd, data: '[1,2,3,4,5,6,null]', due: 35, ivl: 10, today: 30, now: 1897293600}
            - {id: array-eight, data: '[1,2,3,4,5,6,"x",8]', due: 35, ivl: 10, today: 30, now: 1897293600}
