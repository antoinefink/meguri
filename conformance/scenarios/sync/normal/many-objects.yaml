# More rows than one request carries (specs/sync/normal-sync.md N4.2, N7, N8;
# wire-format.md W5.2, W7.2; R1522, R1529, R1530). The Meguri actor holds 260
# pending graves (for ids no collection holds: 86 cards, 87 notes, 87 decks)
# and 600 pending review rows of card #c1, written with db_exec, then adds a
# note so that its collection is newer. Its round sends the graves in two
# applyGraves requests (250 and 10) and the 602 objects in three applyChunk
# requests (250, 250, 102, done on the last); the server accepts them all and
# the sanity counts agree. client_a then receives every row.
id: sync/normal/many-objects
clock: {tz: UTC, start: "2030-01-15T10:00:00", mode: step}
actors: [client_a, meguri]
setup:
  decks: [Words]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes: [{notetype: Pair, deck: Words, fields: [sun, sol]}]
steps:
  - advance: 1m
  - sync: {kind: login}
  - sync: {kind: full_upload}
  - actor: meguri
  - advance: 1m
  - sync: {kind: login}
  - sync: {kind: full_download}
  - advance: 1m
  - db_exec:
      sql: "WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 260) INSERT INTO graves (oid, type, usn) SELECT 1800000000000 + i, i % 3, -1 FROM n"
  - db_exec:
      sql: "WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 600) INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT 1800000000000 + i, (SELECT min(id) FROM cards), -1, 3, i % 30, 0, 2500, 1000 + i, 1 FROM n"
  - add_note: {notetype: Pair, deck: Words, fields: [moon, luna]}
  - sync: {kind: normal}
  - db_exec: {sql: "SELECT type, count(*), min(usn), max(usn) FROM graves GROUP BY type ORDER BY type"}
  - db_exec: {sql: "SELECT count(*), min(usn), max(usn), sum(ivl), sum(time) FROM revlog"}
  - observe:
      - db_dump: {tables: [col, notes, cards]}
  - actor: client_a
  - advance: 1m
  - sync: {kind: normal}
  - db_exec: {sql: "SELECT type, count(*), min(usn), max(usn) FROM graves GROUP BY type ORDER BY type"}
  - db_exec: {sql: "SELECT count(*), min(usn), max(usn), sum(ivl), sum(time) FROM revlog"}
  - observe:
      - db_dump: {tables: [col, notes, cards]}
