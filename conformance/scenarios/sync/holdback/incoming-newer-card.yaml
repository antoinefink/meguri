# A newer remote change to a held-back card wins, and the held-back run is
# dropped (specs/sync/hold-back.md H10.2, H11; KTD7; R1527). In a session the
# Meguri actor answers #c1 at 10:03, held back. client_a answers #c1 at 10:04
# and syncs. In the Meguri actor's round the incoming card is newer than the
# pending local one, so it replaces it; the Meguri actor's answer can no
# longer be undone; its review row stays pending and goes up with the next
# sync, which leaves every party with client_a's card and both review rows.
# The oracle playing the Meguri actor sends its review row in the first
# round; deviations sync-holdback-incoming-newer-card-* give Meguri's values
# (R726).
id: sync/holdback/incoming-newer-card
clock: {tz: UTC, start: "2030-01-15T10:00:00", mode: step}
actors: [client_a, meguri, client_c]
setup:
  decks: [Words]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes: [{notetype: Pair, deck: Words, fields: [sun, sol]}]
steps:
  - advance: 1m
  - sync: {kind: login}
  - sync: {kind: full_upload}
  - actor: meguri
  - advance: 1m
  - sync: {kind: login}
  - sync: {kind: full_download}
  - advance: 1m
  - review_session: begin
  - answer: {card: "#c1", rating: good, time_ms: 3000}
  - actor: client_a
  - advance: 1m
  - answer: {card: "#c1", rating: easy, time_ms: 6000}
  - sync: {kind: normal}
  - actor: meguri
  - advance: 1m
  - sync: {kind: normal}
  - observe: [undo_status, "card(#c1)"]
  - db_exec: {sql: "SELECT count(*) FROM revlog WHERE usn = -1"}
  - sync: {kind: status}
  - actor: client_c
  - advance: 1m
  - sync: {kind: login}
  - sync: {kind: full_download}
  - db_exec: {sql: "SELECT count(*) FROM revlog"}
  - actor: meguri
  - advance: 1m
  - sync: {kind: normal}
  - db_exec: {sql: "SELECT count(*) FROM revlog WHERE usn = -1"}
  - review_session: end
  - actor: client_c
  - advance: 1m
  - sync: {kind: normal}
  - db_exec: {sql: "SELECT count(*) FROM revlog"}
  - observe: ["card(#c1)"]
