  - observe: [undo_status]
  - sync: {kind: status}
  - actor: client_c
  - advance: 1m
  - sync: {kind: login}
  - sync: {kind: full_download}
  - db_exec: {sql: "SELECT count(*) FROM revlog"}
  - db_exec: {sql: "SELECT reps, type, queue FROM cards ORDER BY id DESC LIMIT 1"}
  - actor: meguri
  - advance: 1m
  - review_session: end
  - sync: {kind: normal}
  - observe: [undo_status]
  - sync: {kind: status}
  - actor: client_c
  - advance: 1m
  - sync: {kind: normal}
  - db_exec: {sql: "SELECT count(*) FROM revlog"}
  - db_exec: {sql: "SELECT reps, type, queue FROM cards ORDER BY id DESC LIMIT 1"}
