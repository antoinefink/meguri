# AE63 (R1515; specs/sync/meta-status.md M2): the server's clock runs 360 s
# behind the device's, so the status check of a normal sync refuses with
# clock_incorrect before any other request, for the Meguri actor and for
# client_a alike, and nothing changes: the Meguri actor's collection dumps the
# same before and after, and a fresh client's download still matches both
# actors. One-way syncs make no status check, so the upload and the download
# that prepare the collections succeed.
id: sync/meta/clock-behind
clock: {tz: UTC, start: "2030-01-15T10:00:00", mode: step}
actors: [client_a, meguri]
server: {clock_offset_secs: -360}
setup:
  decks: [Words]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes: [{notetype: Pair, deck: Words, fields: [sun, sol]}]
steps:
  - advance: 1m
  - sync: {kind: login}
  - sync: {kind: full_upload}
  - actor: meguri
  - advance: 1m
  - sync: {kind: login}
  - sync: {kind: full_download}
  - advance: 1m
  - observe: [db_dump]
  - sync: {kind: normal}
  - observe: [db_dump]
  - actor: client_a
  - sync: {kind: normal}
  - converge: {}
