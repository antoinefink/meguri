# AE61 (R1527, R1529; specs/sync/normal-sync.md N6.2, N6.4): card #c1 is
# answered on the Meguri actor at 10:03:00 (pending) while client_a changes
# the same card with the same modification time and syncs. (A flag change
# keeps a card's `mod`, tags/flags-and-marked.md F2, so client_a's change is
# written with db_exec: flag 1, `mod` 10:03, pending.) When the Meguri actor
# syncs, the incoming card has the same `mod` as its pending card, so the
# local card wins the tie and goes up. The server applies the same rule from
# its side: its own card changed since the actor's last sync and has the same
# `mod`, so it keeps it. Each side keeps its own version: client_a's next
# round brings nothing, and converge reports the Meguri actor's card as the
# only difference. This is Anki's result; AE61's last clause (the server
# ending with the phone's version) does not hold against Anki's server.
# 10:03 is epoch second 1894701780.
id: sync/conflicts/tie-local-wins
clock: {tz: UTC, start: "2030-01-15T10:00:00", mode: step}
actors: [client_a, meguri]
setup:
  decks: [Words]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes: [{notetype: Pair, deck: Words, fields: [sun, sol]}]
steps:
  - advance: 1m
  - sync: {kind: login}
  - sync: {kind: full_upload}
  - actor: meguri
  - advance: 1m
  - sync: {kind: login}
  - sync: {kind: full_download}
  - advance: 1m
  - answer: {card: "#c1", rating: good, time_ms: 4000}
  - actor: client_a
  - db_exec: {sql: "UPDATE cards SET flags = 1, mod = 1894701780, usn = -1 WHERE id = (SELECT min(id) FROM cards)"}
  - advance: 1m
  - sync: {kind: normal}
  - observe: ["card(#c1)"]
  - actor: meguri
  - advance: 1m
  - sync: {kind: normal}
  - observe: ["card(#c1)", "revlog(#c1)"]
  - actor: client_a
  - advance: 1m
  - sync: {kind: normal}
  - observe: ["card(#c1)", "revlog(#c1)"]
  - converge: {}
