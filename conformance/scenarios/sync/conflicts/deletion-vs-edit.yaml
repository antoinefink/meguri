# Deletions beat edits in both directions (specs/sync/normal-sync.md N4.3, N7;
# R1521, R1522, R1527):
# - client_a deletes note #n1 and edits note #n2, then syncs;
# - the Meguri actor edits #n1 (pending) and deletes #n2, then syncs: its
#   graves go up first, so the server removes #n2 and sends nothing of it;
#   the server's graves then remove #n1 and its card although the local edit
#   is pending, and their graves take the round's usn.
# client_a receives the Meguri actor's graves. Grave stamps differ by party,
# so the parties are compared by their dumps (sync-ops.md S12).
id: sync/conflicts/deletion-vs-edit
clock: {tz: UTC, start: "2030-01-15T10:00:00", mode: step}
actors: [client_a, meguri]
setup:
  decks: [Words]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
    - {notetype: Pair, deck: Words, fields: [sun, sol]}
    - {notetype: Pair, deck: Words, fields: [moon, luna]}
    - {notetype: Pair, deck: Words, fields: [star, estrella]}
steps:
  - advance: 1m
  - sync: {kind: login}
  - sync: {kind: full_upload}
  - actor: meguri
  - advance: 1m
  - sync: {kind: login}
  - sync: {kind: full_download}
  - actor: client_a
  - advance: 1m
  - delete_notes: {notes: ["#n1"]}
  - edit_note: {note: "#n2", fields: [moon, "luna (desktop)"]}
  - sync: {kind: normal}
  - actor: meguri
  - advance: 1m
  - edit_note: {note: "#n1", fields: [sun, "sol (meguri)"]}
  - delete_notes: {notes: ["#n2"]}
  - sync: {kind: normal}
  - observe:
      - db_dump: {tables: [col, notes, cards, graves]}
  - actor: client_a
  - advance: 1m
  - sync: {kind: normal}
  - observe:
      - db_dump: {tables: [col, notes, cards, graves]}
