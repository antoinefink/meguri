# stats/graphs-revlog V5.1: hour edges in a +05:45 zone (now 2026-10-12 12:00
# +05:45): rows 1 ms before and at 09:00 and at 23:00 and 00:00 local.
# Expected hours 9, 10, 23 and 0, one each, in every range.
id: stats/graphs/hourly/kathmandu-edges
clock: {tz: Asia/Kathmandu, start: "2026-10-12T12:00:00"}
setup:
  config: {"rollover": 4}
steps:
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791778499999, 1000, -1, 3, 1, 30, 2500, 0, 1), (1791778500000, 1000, -1, 3, 1, 30, 2500, 0, 1), (1791742499999, 1000, -1, 3, 1, 30, 2500, 0, 1), (1791742500000, 1000, -1, 3, 1, 30, 2500, 0, 1)"}}
  - {"observe": [{"stats": [{"scope": "collection", "history": "year", "parts": ["hours"]}, {"scope": "collection", "history": "all", "parts": ["hours"]}]}]}
