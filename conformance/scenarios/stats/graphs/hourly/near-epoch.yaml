# stats/graphs-revlog V5.1, V9: a row half an hour after the epoch in
# America/New_York (now 2026-10-12 12:00 -04:00, history all): t + offset is
# -1,800 s, which Anki puts in hour 0. Expected all_time hour 0 {total 1,
# correct 1}; every hour of the other three ranges {}.
id: stats/graphs/hourly/near-epoch
clock: {tz: America/New_York, start: "2026-10-12T12:00:00"}
setup:
  config: {"rollover": 4}
steps:
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (12600000, 1000, -1, 3, 1, 30, 2500, 0, 1)"}}
  - {"observe": [{"stats": [{"scope": "collection", "history": "all", "parts": ["hours"]}]}]}
