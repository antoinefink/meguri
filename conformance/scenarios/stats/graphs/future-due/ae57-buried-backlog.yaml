# stats/graphs-cards C13 AE57 (C3.3 to C3.5): 30 review cards due 1 to 3 days
# ago (10 on each day), 5 buried review cards due today and 3 due tomorrow,
# all with ivl 2. The collection is created at the clock start, so today is
# day 0 and dues are day numbers around it. Expected future_due {-3: 10,
# -2: 10, -1: 10, 1: 3}, have_backlog true, daily_load 19.
id: stats/graphs/future-due/ae57-buried-backlog
clock: {tz: Europe/Paris, start: "2026-10-12T12:00:00"}
setup:
  config: {"rollover": 4}
  decks: ["Lang"]
  notetypes:
    - {"name": "Pair", "fields": ["Front", "Back"], "templates": [{"name": "Forward", "front": "{{Front}}", "back": "{{Back}}"}]}
