  - {"db_exec": {"sql": "UPDATE cards SET type = 1, queue = 1, due = 1791131400, id = 1791046800000 WHERE nid = (SELECT id FROM notes WHERE sfld = 'n2')"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 1, queue = 1, due = 1791046799, id = 1791046801000 WHERE nid = (SELECT id FROM notes WHERE sfld = 'n3')"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 1, queue = 1, due = 1791219600, id = 1790960400001 WHERE nid = (SELECT id FROM notes WHERE sfld = 'n4')"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 3, due = 1, data = '{\"s\":5.0,\"d\":5.0,\"lrt\":1790989200}' WHERE nid = (SELECT id FROM notes WHERE sfld = 'n5')"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 21, due = 0, data = '{\"s\":10.0,\"d\":3.0}' WHERE nid = (SELECT id FROM notes WHERE sfld = 'n6')"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 1, queue = 1, due = 1790961000, id = 1790961000000 WHERE nid = (SELECT id FROM notes WHERE sfld = 'n7')"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 1, queue = 1, due = 1790960400, id = 1790960400000 WHERE nid = (SELECT id FROM notes WHERE sfld = 'n8')"}}
  - {"observe": ["timing", {"stats": [{"scope": "collection", "history": "year", "parts": ["future_due", "card_counts", "intervals", "stability", "difficulty", "retrievability", "added"]}, {"scope": {"deck": "Lang"}, "history": "year", "parts": ["future_due", "card_counts", "intervals", "stability", "difficulty", "retrievability", "added"]}]}]}
