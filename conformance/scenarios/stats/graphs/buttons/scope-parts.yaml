# stats/graphs-revlog V10 (G2, R1446): a card in deck Lang with a mature Good
# and an Again row today, and a deleted card's Good row. Expected Collection
# buttons mature [1, 0, 2, 0], true_retention today {mature_passed 2,
# mature_failed 1}, hour 12 {total 3, correct 2}; Deck Lang and Search
# deck:Lang buttons mature [1, 0, 1, 0], today {mature_passed 1,
# mature_failed 1}, hour 12 {total 2, correct 1}.
id: stats/graphs/buttons/scope-parts
clock: {tz: Europe/Paris, start: "2026-10-12T12:00:00"}
setup:
  config: {"rollover": 4}
  decks: ["Lang"]
  notetypes:
    - {"name": "Pair", "fields": ["Front", "Back"], "templates": [{"name": "Forward", "front": "{{Front}}", "back": "{{Back}}"}]}
  notes:
    - {"notetype": "Pair", "deck": "Lang", "fields": ["one", "x"]}
steps:
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791799200000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 1, 30, 2500, 0, 1), (1791799200001, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 1, 1, 30, 2500, 0, 1), (1791799200002, 1000, -1, 3, 1, 30, 2500, 0, 1)"}}
  - {"observe": [{"stats": [{"scope": "collection", "history": "year", "parts": ["buttons", "true_retention", "hours"]}, {"scope": {"deck": "Lang"}, "history": "year", "parts": ["buttons", "true_retention", "hours"]}, {"scope": {"search": "deck:Lang"}, "history": "year", "parts": ["buttons", "true_retention", "hours"]}]}]}
