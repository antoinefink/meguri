# stats/graphs-revlog V10 (V2.1, V9): Reviews time sums of one kind on one
# day. On a deleted card's id: today at 12:00 two Learn rows of 2,200,000,000
# ms, one young Review row (lastIvl 10) of 3,000,000,000 ms and two mature
# Review rows of 3,000,000,000 ms; yesterday at 12:00 one mature Review row of
# 3,000,000,000 ms. Anki keeps each sum in 32 bits: day 0 time learn
# 105,032,704 and mature 1,705,032,704 (wrapped), young 3,000,000,000; day -1
# mature 3,000,000,000. Meguri gives learn 4,400,000,000 and mature
# 6,000,000,000 (deviation stats-review-time-no-wrap). Europe/Paris,
# rollover 4.
id: stats/graphs/reviews/time-wrap
clock: {tz: Europe/Paris, start: "2026-10-12T12:00:00"}
setup:
  config: {"rollover": 4}
steps:
  - {"db_exec": {"sql": "INSERT INTO revlog VALUES (1791799200000, 1000, -1, 3, 1, 30, 2500, 2200000000, 0), (1791799200001, 1000, -1, 3, 1, 30, 2500, 2200000000, 0), (1791799200002, 1000, -1, 3, 1, 10, 2500, 3000000000, 1), (1791799200003, 1000, -1, 3, 1, 30, 2500, 3000000000, 1), (1791799200004, 1000, -1, 3, 1, 30, 2500, 3000000000, 1), (1791712800000, 1000, -1, 3, 1, 30, 2500, 3000000000, 1)"}}
  - {"observe": [{"stats": [{"scope": "collection", "history": "year", "parts": ["reviews"]}]}]}
