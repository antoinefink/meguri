# stats/graphs-revlog V2.1, stats/graphs-common G3: the year history starts at
# N - 366 days (1760234400000): a row 1 ms before it is read only with all.
# Expected year {-366: 1, -365: 1}, all {-366: 2, -365: 1}.
id: stats/graphs/reviews/window-start
clock: {tz: Europe/Paris, start: "2026-10-12T12:00:00"}
setup:
  config: {"rollover": 4}
steps:
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1760234399999, 1000, -1, 3, 1, 30, 2500, 0, 1), (1760234400000, 1000, -1, 3, 1, 30, 2500, 0, 1), (1760234401000, 1000, -1, 3, 1, 30, 2500, 0, 1)"}}
  - {"observe": [{"stats": [{"scope": "collection", "history": "year", "parts": ["reviews"]}, {"scope": "collection", "history": "all", "parts": ["reviews"]}]}]}
