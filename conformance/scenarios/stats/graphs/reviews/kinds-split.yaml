# stats/graphs-revlog V10 (V1, V2.1, R1385, R1386): which kind each row
# counts as in Reviews and Hourly Breakdown. Ten rows today at 12:00 (a
# millisecond apart) on a deleted card's id: Learn, Relearn Again, Review
# young (lastIvl 20), mature (21), learning-interval (-600), Filtered
# reschedule-off cram (factor 0), unrated Filtered, Manual, Rescheduled and
# an unrated Review. Expected count {0: learn 1, relearn 1, young 2, mature 2,
# filtered 2}, hour 12 {total 6, correct 4}. Europe/Paris, rollover 4.
id: stats/graphs/reviews/kinds-split
clock: {tz: Europe/Paris, start: "2026-10-12T12:00:00"}
setup:
  config: {"rollover": 4}
steps:
  - {"db_exec": {"sql": "INSERT INTO revlog VALUES (1791799200000, 1000, -1, 3, 1, 30, 2500, 1000, 0), (1791799200001, 1000, -1, 1, 1, 30, 2500, 2000, 2), (1791799200002, 1000, -1, 3, 1, 20, 2500, 3000, 1), (1791799200003, 1000, -1, 3, 1, 21, 2500, 4000, 1), (1791799200004, 1000, -1, 3, 1, -600, 2500, 5000, 1), (1791799200005, 1000, -1, 3, 1, 30, 0, 6000, 3), (1791799200006, 1000, -1, 0, 1, 30, 2500, 7000, 3), (1791799200007, 1000, -1, 0, 1, 30, 2500, 8000, 4), (1791799200008, 1000, -1, 0, 1, 30, 2500, 500, 5), (1791799200009, 1000, -1, 0, 1, 30, 2500, 9000, 1)"}}
  - {"observe": [{"stats": [{"scope": "collection", "history": "year", "parts": ["reviews", "hours"]}, {"scope": "collection", "history": "all", "parts": ["reviews", "hours"]}]}]}
