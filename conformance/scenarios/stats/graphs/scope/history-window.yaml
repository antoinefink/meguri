# stats/graphs-common G15 (G3): the history window. Rows at the year start
# (N - 366 days) - 1 ms, at it and 1 ms after it, at now, at N + 1 day, and a
# row with id -5. Expected year reads 4 of them, all 5 (never the negative
# id).
id: stats/graphs/scope/history-window
clock: {tz: Europe/Paris, start: "2026-10-12T12:00:00"}
setup:
  config: {"rollover": 4}
steps:
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1760234399999, 1000, -1, 3, 1, 30, 2500, 0, 1), (1760234400000, 1000, -1, 3, 1, 30, 2500, 0, 1), (1760234400001, 1000, -1, 3, 1, 30, 2500, 0, 1), (1791799200000, 1000, -1, 3, 1, 30, 2500, 0, 1), (1791943200000, 1000, -1, 3, 1, 30, 2500, 0, 1), (-5, 1000, -1, 3, 1, 30, 2500, 0, 1)"}}
  - {"observe": [{"stats": [{"scope": "collection", "history": "year", "parts": ["reviews"]}, {"scope": "collection", "history": "all", "parts": ["reviews"]}]}]}
