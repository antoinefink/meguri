# stats/graphs-common G15 AE53, graph side (G2): 5 Review rows today on a card
# in Lang and 2 on a deleted card's id. Expected reviews count for day 0: 7 in
# Collection and in Search "  " (white space is the Collection scope), 5 in
# Deck Lang and in Search deck:* (deleted cards' rows left out).
id: stats/graphs/scope/deleted-card-rows
clock: {tz: Europe/Paris, start: "2026-10-12T12:00:00"}
setup:
  config: {"rollover": 4}
  decks: ["Lang"]
  notetypes:
    - {"name": "Pair", "fields": ["Front", "Back"], "templates": [{"name": "Forward", "front": "{{Front}}", "back": "{{Back}}"}]}
  notes:
    - {"notetype": "Pair", "deck": "Lang", "fields": ["one", "x"]}
steps:
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791799200000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 1, 30, 2500, 0, 1), (1791799200001, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 1, 30, 2500, 0, 1), (1791799200002, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 1, 30, 2500, 0, 1), (1791799200003, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 1, 30, 2500, 0, 1), (1791799200004, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 1, 30, 2500, 0, 1), (1791799200005, 1000, -1, 3, 1, 30, 2500, 0, 1), (1791799200006, 1000, -1, 3, 1, 30, 2500, 0, 1)"}}
  - {"observe": [{"stats": [{"scope": "collection", "history": "year", "parts": ["reviews"]}, {"scope": {"search": "  "}, "history": "year", "parts": ["reviews"]}, {"scope": {"deck": "Lang"}, "history": "year", "parts": ["reviews"]}, {"scope": {"search": "deck:*"}, "history": "year", "parts": ["reviews"]}]}]}
