# stats/graphs-common G15 (G2, R1282): a row belongs to its card as the card
# is now. Three rows while the card is in A; then the card moves to B.
# Expected before: Deck A 3, Deck B none; after: Deck B 3, Deck A none, with
# both histories.
id: stats/graphs/scope/moved-card
clock: {tz: Europe/Paris, start: "2026-10-12T12:00:00"}
setup:
  config: {"rollover": 4}
  decks: ["A", "B"]
  notetypes:
    - {"name": "Pair", "fields": ["Front", "Back"], "templates": [{"name": "Forward", "front": "{{Front}}", "back": "{{Back}}"}]}
  notes:
    - {"notetype": "Pair", "deck": "A", "fields": ["n1", "x"]}
steps:
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791799200000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 1, 30, 2500, 0, 1), (1791799200001, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 1, 30, 2500, 0, 1), (1791799200002, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 1, 30, 2500, 0, 1)"}}
  - {"observe": [{"stats": [{"scope": {"deck": "A"}, "history": "year", "parts": ["reviews"]}, {"scope": {"deck": "A"}, "history": "all", "parts": ["reviews"]}, {"scope": {"deck": "B"}, "history": "year", "parts": ["reviews"]}, {"scope": {"deck": "B"}, "history": "all", "parts": ["reviews"]}]}]}
  - {"db_exec": {"sql": "UPDATE cards SET did = (SELECT id FROM decks WHERE name = 'B')"}}
  - {"observe": [{"stats": [{"scope": {"deck": "A"}, "history": "year", "parts": ["reviews"]}, {"scope": {"deck": "A"}, "history": "all", "parts": ["reviews"]}, {"scope": {"deck": "B"}, "history": "year", "parts": ["reviews"]}, {"scope": {"deck": "B"}, "history": "all", "parts": ["reviews"]}]}]}
