# stats/graphs-common G15 (G4): a row Anki cannot read fails the request only
# when its history reads it. A Good row today and a row 400 days ago with
# ease 300: year returns data, all unreadable_row; then the same with that
# row's factor -1, and with a lastIvl beyond the 32-bit range (the revlog
# table refuses a NULL lastIvl, NOT NULL).
id: stats/graphs/scope/unreadable-row
clock: {tz: Europe/Paris, start: "2026-10-12T12:00:00"}
setup:
  config: {"rollover": 4}
steps:
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791799200000, 1000, -1, 3, 1, 30, 2500, 0, 1), (1757239200000, 1000, -1, 300, 1, 30, 2500, 0, 1)"}}
  - {"observe": [{"stats": [{"scope": "collection", "history": "year", "parts": ["reviews"]}, {"scope": "collection", "history": "all", "parts": ["reviews"]}]}]}
  - {"db_exec": {"sql": "UPDATE revlog SET ease = 3, factor = -1 WHERE id = 1757239200000"}}
  - {"observe": [{"stats": [{"scope": "collection", "history": "year", "parts": ["reviews"]}, {"scope": "collection", "history": "all", "parts": ["reviews"]}]}]}
  - {"db_exec": {"sql": "UPDATE revlog SET factor = 2500, lastIvl = 3000000000 WHERE id = 1757239200000"}}
  - {"observe": [{"stats": [{"scope": "collection", "history": "year", "parts": ["reviews"]}, {"scope": "collection", "history": "all", "parts": ["reviews"]}]}]}
