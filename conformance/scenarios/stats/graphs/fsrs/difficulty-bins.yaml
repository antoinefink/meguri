# stats/graphs-cards C13 (C8): difficulty keys and median. Review cards with
# s 5 and the eight d values of C8.1 (1, 1.09, 2.08, 4.6, 5.5, 10, 11, 0.5).
# Expected {0: 2, 1: 1, 11: 1, 39: 1, 50: 1, 99: 1, 111: 1}, average 26.
id: stats/graphs/fsrs/difficulty-bins
clock: {tz: Europe/Paris, start: "2026-10-12T12:00:00"}
setup:
  config: {"rollover": 4}
  decks: ["Lang"]
  notetypes:
    - {"name": "Pair", "fields": ["Front", "Back"], "templates": [{"name": "Forward", "front": "{{Front}}", "back": "{{Back}}"}]}
  notes:
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n1", "x"]}
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n2", "x"]}
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n3", "x"]}
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n4", "x"]}
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n5", "x"]}
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n6", "x"]}
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n7", "x"]}
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n8", "x"]}
steps:
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 5, due = 5, data = '{\"s\":5.0,\"d\":1.0}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 5, due = 5, data = '{\"s\":5.0,\"d\":1.09}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1)"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 5, due = 5, data = '{\"s\":5.0,\"d\":2.08}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2)"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 5, due = 5, data = '{\"s\":5.0,\"d\":4.6}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 3)"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 5, due = 5, data = '{\"s\":5.0,\"d\":5.5}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 4)"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 5, due = 5, data = '{\"s\":5.0,\"d\":10.0}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 5)"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 5, due = 5, data = '{\"s\":5.0,\"d\":11.0}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 6)"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 5, due = 5, data = '{\"s\":5.0,\"d\":0.5}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 7)"}}
  - {"observe": [{"stats": [{"scope": "collection", "history": "year", "parts": ["difficulty"]}]}]}
