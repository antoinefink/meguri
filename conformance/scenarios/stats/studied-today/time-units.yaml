# stats/studied-today T2 (R1297, R1279) through stored review-log rows: the
# Home line at totals of 59 s, 60 s, 90 minutes and 5 hours, on 2026-10-12 in
# Europe/Paris, rollover 4. Seconds below 60 s, minutes from 60 s on, never
# hours. The rows hold times far above any answer-time limit (89 and 210
# minutes), which count as stored. They belong to a card id no card has.
id: stats/studied-today/time-units
clock: {tz: Europe/Paris, start: "2026-10-10T12:00:00"}
steps:
  - set_config: {key: rollover, value: 4}
  - set_clock: "2026-10-12T20:00:00"
  #   08:00: ease 3, type 1, time 59,000 ms (total 59 s)
  - db_exec: {sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791784800000, 1000, -1, 3, 1, 0, 2500, 59000, 1)"}
  - observe: [studied_today_text, studied_today_raw]
  #   08:01: ease 3, type 1, time 1,000 ms (total 60 s)
  - db_exec: {sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791784860000, 1000, -1, 3, 1, 0, 2500, 1000, 1)"}
  - observe: [studied_today_text, studied_today_raw]
  #   08:02: ease 3, type 1, time 5,340,000 ms (total 90 minutes)
  - db_exec: {sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791784920000, 1000, -1, 3, 1, 0, 2500, 5340000, 1)"}
  - observe: [studied_today_text, studied_today_raw]
  #   08:03: ease 3, type 1, time 12,600,000 ms (total 5 hours)
  - db_exec: {sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791784980000, 1000, -1, 3, 1, 0, 2500, 12600000, 1)"}
  - observe: [studied_today_text, studied_today_raw]
