# stats/widget-snapshot W4 (studied-today instant, legacy timing): Europe/Paris,
# rollover 4, a collection without creationOffset (sched/day-clock D4), built
# 2026-10-12 12:00 +02:00 with two answers that day. at(2026-10-13) = e(D) =
# 04:00 +02:00 = 02:00Z, the day's boundary. During that second D4 gives a
# next_day_at equal to now, so Anki still counts the answers of 10-12; one
# second later it shows the zero line. upcoming[0] holds the zero line, the
# values from one second after e(D). No reopen: the oracle's open would add
# creationOffset (D12.3). Observed at the build, one second before, at and
# one second after the boundary.
id: stats/widget/day-start-legacy
clock: {tz: Europe/Paris, start: "2026-10-12T12:00:00"}
steps:
  - {"set_config": {"key": "rollover", "value": 4}}
  - {"db_exec": {"sql": "DELETE FROM config WHERE KEY = 'creationOffset'"}}
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791788400000, 1000, -1, 3, 10, 5, 2500, 4000, 1), (1791797400000, 1000, -1, 3, 10, 5, 2500, 6000, 1)"}}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
  - {"set_clock": "2026-10-13T01:59:59Z"}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
  - {"set_clock": "2026-10-13T02:00:00Z"}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
  - {"set_clock": "2026-10-13T02:00:01Z"}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
