# stats/widget-snapshot W4 (rollover instant after a gap, Anki's day starting
# before at(D)): Europe/Paris, rollover 4, built 2026-03-28 21:00 +01:00 with
# two answers that day. at(2026-03-29) is local midnight (+01:00) plus four
# hours of elapsed time: 05:00 +02:00 = 03:00Z (W4's table); hour 4 under
# +02:00 is 02:00Z, so e(D) is 03:00Z. The 21:00 build's day ends at 04:00
# +01:00 = 03:00Z and Anki would keep it across the offset change, while
# Meguri recomputes (sched/day-clock D6, D12.1). The reopen at 01:30Z, after
# the change, makes both compute afresh under +02:00 (D14.2): Anki's day
# 2026-03-29 then starts at 02:00Z, before at(D), so between 02:00Z and 03:00Z
# Anki shows the zero line while the widget still shows the old values; at
# e(D) = 03:00Z both are on the new day. Observed at the reopen, one second
# before and at 02:00Z, and one second before and at 03:00Z.
id: stats/widget/day-start-spring-forward-r4
clock: {tz: Europe/Paris, start: "2026-03-28T21:00:00"}
steps:
  - {"set_config": {"key": "rollover", "value": 4}}
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1774688400000, 1000, -1, 3, 10, 5, 2500, 5000, 1), (1774717200000, 1000, -1, 3, 10, 5, 2500, 7000, 1)"}}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
  - {"set_clock": "2026-03-29T01:30:00Z"}
  - reopen: {}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
  - {"set_clock": "2026-03-29T01:59:59Z"}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
  - {"set_clock": "2026-03-29T02:00:00Z"}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
  - {"set_clock": "2026-03-29T02:59:59Z"}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
  - {"set_clock": "2026-03-29T03:00:00Z"}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
