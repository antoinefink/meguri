# stats/widget-snapshot W4, W5 (rows dated after the build): Europe/Paris,
# rollover 4, built 2026-10-12 12:00 +02:00 with one answer that day and one
# stamped 2026-10-13 10:00Z, as a device with a fast clock would write it.
# The studied-today window has no upper end (stats/day-buckets B2): at the
# build both count; at e(2026-10-13) = 02:00Z only the later one does, so a
# snapshot built on 10-12 holds it in upcoming[0].studiedToday; at
# e(2026-10-14) = 2026-10-14T02:00Z neither does (upcoming[1]).
id: stats/widget/day-start-future-row
clock: {tz: Europe/Paris, start: "2026-10-12T12:00:00"}
steps:
  - {"set_config": {"key": "rollover", "value": 4}}
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791795600000, 1000, -1, 3, 10, 5, 2500, 3000, 1), (1791885600000, 1000, -1, 3, 10, 5, 2500, 9000, 1)"}}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
  - {"set_clock": "2026-10-13T02:00:00Z"}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
  - {"set_clock": "2026-10-14T02:00:00Z"}
  - {"observe": ["timing", "studied_today_raw", "studied_today_text"]}
