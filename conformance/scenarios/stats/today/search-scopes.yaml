# stats/studied-today T3.2: which rows a search scope of the Today section
# covers (2026-10-12, Europe/Paris, rollover 4). An empty search and one of
# white space only are the Collection scope, so a deleted card's answers
# count; deck:* matches every existing card, so they do not. deck:Lang and
# -deck:Lang split the existing cards. Needs the deck: search term (U82).
id: stats/today/search-scopes
tags: [needs-deck]
clock: {tz: Europe/Paris, start: "2026-10-10T12:00:00"}
setup:
  config: {rollover: 4}
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
    - {notetype: Pair, deck: Lang, fields: [s1, x]}
    - {notetype: Pair, fields: [s2, x]}
steps:
  - set_clock: "2026-10-12T20:00:00"
  #   09:00, 09:01: #c1 (Lang), 2,000 ms each
  #   09:02: #c2 (Default), 3,000 ms
  #   09:03: card id 1000, which no card has, 4,000 ms
  - db_exec: {sql: "WITH c(k, id) AS (SELECT ROW_NUMBER() OVER (ORDER BY id) - 1, id FROM cards), r(i, k, t) AS (VALUES (0, 0, 2000), (1, 0, 2000), (2, 1, 3000)) INSERT INTO revlog SELECT 1791788400000 + 60000 * r.i, c.id, -1, 3, 10, 5, 2500, r.t, 1 FROM r JOIN c ON c.k = r.k"}
  - db_exec: {sql: "INSERT INTO revlog VALUES (1791788580000, 1000, -1, 3, 10, 5, 2500, 4000, 1)"}
  - observe:
      - today_stats:
          - collection
          - {search: ""}
          - {search: " \t "}
          - {search: "deck:*"}
          - {search: "deck:Lang"}
          - {search: "-deck:Lang"}
