# stats/studied-today T3.3, T4 (R1277, R1371): the Today values for a mix of
# Learn, Review, Relearn and Filtered rows, rated and unrated, with and
# without a mature last interval, on 2026-10-12 in Europe/Paris, rollover 4.
# Manual and Rescheduled rows are left out. Correct means a rating above
# Again; a Filtered row with no rating counts as an Again answer. Mature
# means a last interval of 21 days or more, whatever the row type.
id: stats/today/lines-mix
clock: {tz: Europe/Paris, start: "2026-10-10T12:00:00"}
steps:
  - set_config: {key: rollover, value: 4}
  - set_clock: "2026-10-12T20:00:00"
  # From 10:00, one minute apart, on card id 1000, which no card has
  # (type, ease, lastIvl, time ms):
  #   0, 1, 0, 2000      Learn, Again
  #   0, 3, 0, 3000      Learn
  #   0, 3, -600, 4000   Learn (a learning step's last interval, in seconds)
  #   1, 3, 21, 5000     Review, mature, correct
  #   1, 1, 30, 6000     Review, mature, Again
  #   1, 4, 100, 7000    Review, mature, correct
  #   1, 2, 20, 8000     Review, not mature
  #   2, 1, 45, 9000     Relearn, mature, Again
  #   2, 3, -600, 10000  Relearn
  #   3, 3, 25, 11000    Filtered, mature, correct
  #   3, 0, 0, 12000     Filtered, no rating
  #   4, 0, 50, 0        Manual: not counted
  #   5, 0, 30, 0        Rescheduled: not counted
  - db_exec: {sql: "INSERT INTO revlog VALUES (1791792000000, 1000, -1, 1, 0, 0, 0, 2000, 0), (1791792060000, 1000, -1, 3, 0, 0, 0, 3000, 0), (1791792120000, 1000, -1, 3, 1, -600, 0, 4000, 0), (1791792180000, 1000, -1, 3, 40, 21, 2500, 5000, 1), (1791792240000, 1000, -1, 1, 1, 30, 2300, 6000, 1), (1791792300000, 1000, -1, 4, 300, 100, 2650, 7000, 1), (1791792360000, 1000, -1, 2, 24, 20, 2350, 8000, 1), (1791792420000, 1000, -1, 1, -600, 45, 2100, 9000, 2), (1791792480000, 1000, -1, 3, 1, -600, 2100, 10000, 2), (1791792540000, 1000, -1, 3, 30, 25, 2500, 11000, 3), (1791792600000, 1000, -1, 0, 0, 0, 2500, 12000, 3), (1791792660000, 1000, -1, 0, 0, 50, 0, 0, 4), (1791792720000, 1000, -1, 0, 0, 30, 0, 0, 5)"}
  - observe: [studied_today_text, {today_stats: [collection]}]
