# stats/studied-today T2.1, T3.1 across the time zone matrix: America/St_Johns
# (-02:30 in summer), rollover 0. The Home line counts rows strictly after the
# start of Anki's day 0; the Today section also counts the row stamped exactly
# at the start. Neither has an upper bound, so rows at and after the next day
# start count too.
id: stats/today/day-start-st-johns
clock: {tz: America/St_Johns, start: "2026-06-09T12:00:00"}
steps:
  - set_config: {key: rollover, value: 0}
  - set_clock: "2026-06-10T12:00:00"
  # Answers (ease 3, type 1) on card id 1000, which no card has:
  #   2026-06-09T23:59:59-02:30 (one second before the day starts): time 1000 ms
  #   2026-06-09T23:59:59.999-02:30 (1 ms before): time 2000 ms
  #   2026-06-10T00:00:00-02:30 (exactly at the start): time 4000 ms
  #   2026-06-10T00:00:00.001-02:30 (1 ms after): time 8000 ms
  #   2026-06-11T00:00:00-02:30 (when the next day starts): time 16000 ms
  #   2026-06-11T01:00:00-02:30 (an hour after that, a future row): time 32000 ms
  - db_exec: {sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1781058599000, 1000, -1, 3, 10, 5, 2500, 1000, 1), (1781058599999, 1000, -1, 3, 10, 5, 2500, 2000, 1), (1781058600000, 1000, -1, 3, 10, 5, 2500, 4000, 1), (1781058600001, 1000, -1, 3, 10, 5, 2500, 8000, 1), (1781145000000, 1000, -1, 3, 10, 5, 2500, 16000, 1), (1781148600000, 1000, -1, 3, 10, 5, 2500, 32000, 1)"}
  - observe: [studied_today_text, studied_today_raw, {today_stats: [collection]}]
