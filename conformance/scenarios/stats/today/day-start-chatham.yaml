# stats/studied-today T2.1, T3.1 across the time zone matrix: Pacific/Chatham
# (+13:45), rollover 23: the day started at 23:00 the evening before. The Home
# line counts rows strictly after the start of Anki's day 0; the Today section
# also counts the row stamped exactly at the start. Neither has an upper
# bound, so rows at and after the next day start count too.
id: stats/today/day-start-chatham
clock: {tz: Pacific/Chatham, start: "2026-10-10T12:00:00"}
steps:
  - set_config: {key: rollover, value: 23}
  - set_clock: "2026-10-12T12:00:00"
  # Answers (ease 3, type 1) on card id 1000, which no card has:
  #   2026-10-11T22:59:59+13:45 (one second before the day starts): time 1000 ms
  #   2026-10-11T22:59:59.999+13:45 (1 ms before): time 2000 ms
  #   2026-10-11T23:00:00+13:45 (exactly at the start): time 4000 ms
  #   2026-10-11T23:00:00.001+13:45 (1 ms after): time 8000 ms
  #   2026-10-12T23:00:00+13:45 (when the next day starts): time 16000 ms
  #   2026-10-13T00:00:00+13:45 (an hour after that, a future row): time 32000 ms
  - db_exec: {sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791710099000, 1000, -1, 3, 10, 5, 2500, 1000, 1), (1791710099999, 1000, -1, 3, 10, 5, 2500, 2000, 1), (1791710100000, 1000, -1, 3, 10, 5, 2500, 4000, 1), (1791710100001, 1000, -1, 3, 10, 5, 2500, 8000, 1), (1791796500000, 1000, -1, 3, 10, 5, 2500, 16000, 1), (1791800100000, 1000, -1, 3, 10, 5, 2500, 32000, 1)"}
  - observe: [studied_today_text, studied_today_raw, {today_stats: [collection]}]
