# stats/studied-today T2.1, T3.1 across the time zone matrix: UTC, rollover 0:
# the day starts at midnight. The Home line counts rows strictly after the
# start of Anki's day 0; the Today section also counts the row stamped exactly
# at the start. Neither has an upper bound, so rows at and after the next day
# start count too.
id: stats/today/day-start-utc
clock: {tz: UTC, start: "2026-10-11T12:00:00"}
steps:
  - set_config: {key: rollover, value: 0}
  - set_clock: "2026-10-12T12:00:00"
  # Answers (ease 3, type 1) on card id 1000, which no card has:
  #   2026-10-11T23:59:59+00:00 (one second before the day starts): time 1000 ms
  #   2026-10-11T23:59:59.999+00:00 (1 ms before): time 2000 ms
  #   2026-10-12T00:00:00+00:00 (exactly at the start): time 4000 ms
  #   2026-10-12T00:00:00.001+00:00 (1 ms after): time 8000 ms
  #   2026-10-13T00:00:00+00:00 (when the next day starts): time 16000 ms
  #   2026-10-13T01:00:00+00:00 (an hour after that, a future row): time 32000 ms
  - db_exec: {sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791763199000, 1000, -1, 3, 10, 5, 2500, 1000, 1), (1791763199999, 1000, -1, 3, 10, 5, 2500, 2000, 1), (1791763200000, 1000, -1, 3, 10, 5, 2500, 4000, 1), (1791763200001, 1000, -1, 3, 10, 5, 2500, 8000, 1), (1791849600000, 1000, -1, 3, 10, 5, 2500, 16000, 1), (1791853200000, 1000, -1, 3, 10, 5, 2500, 32000, 1)"}
  - observe: [studied_today_text, studied_today_raw, {today_stats: [collection]}]
