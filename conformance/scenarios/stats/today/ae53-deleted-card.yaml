# AE53, stats/studied-today T2, T3.2: 50 reviews today (2026-10-12,
# Europe/Paris, rollover 4), ten on each of five cards of deck Lang, 8 s
# each. After the first card's note is deleted, the Home line still counts 50
# answers and the Collection scope of the Today section still has 50, while
# the Deck scope for Lang has only the 40 answers on cards that remain.
id: stats/today/ae53-deleted-card
clock: {tz: Europe/Paris, start: "2026-10-10T12:00:00"}
setup:
  config: {rollover: 4}
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
    - {notetype: Pair, deck: Lang, fields: [d1, x]}
    - {notetype: Pair, deck: Lang, fields: [d2, x]}
    - {notetype: Pair, deck: Lang, fields: [d3, x]}
    - {notetype: Pair, deck: Lang, fields: [d4, x]}
    - {notetype: Pair, deck: Lang, fields: [d5, x]}
steps:
  - set_clock: "2026-10-12T20:00:00"
  # Review i (0-49) at 08:00 + i minutes on card i / 10, 8 s each.
  - db_exec: {sql: "WITH RECURSIVE n(i) AS (SELECT 0 UNION ALL SELECT i + 1 FROM n WHERE i < 49), c(k, id) AS (SELECT ROW_NUMBER() OVER (ORDER BY id) - 1, id FROM cards) INSERT INTO revlog SELECT 1791784800000 + 60000 * n.i, c.id, -1, 3, 10, 5, 2500, 8000, 1 FROM n JOIN c ON c.k = n.i / 10"}
  - observe: [studied_today_text, {today_stats: [collection, {deck: Lang}]}]
  - delete_notes: {notes: ["#n1"]}
  - observe: [studied_today_text, {today_stats: [collection, {deck: Lang}]}]
