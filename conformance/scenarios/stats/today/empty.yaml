# stats/studied-today T2.4, T4.1: today's only rows are Manual and
# Rescheduled rows (a Set Due Date, a Forget, a bulk reschedule), and the
# answers were yesterday, so the Home line is the zero line and the Today
# section has no answers (2026-10-12, Europe/Paris, rollover 4).
id: stats/today/empty
clock: {tz: Europe/Paris, start: "2026-10-10T12:00:00"}
steps:
  - set_config: {key: rollover, value: 4}
  - set_clock: "2026-10-12T20:00:00"
  # On card id 1000, which no card has (type, ease, lastIvl, time ms):
  #   2026-10-11 10:00: 1, 3, 30, 4000
  #   2026-10-12 03:59:59: 1, 3, 30, 5000   before the day starts at 04:00
  #   2026-10-12 10:00: 4, 0, 0, 0
  #   2026-10-12 10:01: 4, 0, 0, 0
  #   2026-10-12 10:02: 5, 0, 30, 0
  - db_exec: {sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1791705600000, 1000, -1, 3, 60, 30, 2500, 4000, 1), (1791770399000, 1000, -1, 3, 60, 30, 2500, 5000, 1), (1791792000000, 1000, -1, 0, 0, 0, 0, 0, 4), (1791792060000, 1000, -1, 0, 0, 0, 2500, 0, 4), (1791792120000, 1000, -1, 0, 45, 30, 2500, 0, 5)"}
  - observe: [studied_today_text, studied_today_raw, {today_stats: [collection]}]
