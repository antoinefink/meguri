# stats/card-info C14.1 (C2, C6.1, C6.3, C6.4): one card's history, oldest
# first: two SM-2-era Review rows (factors 2500 and 2350, no Learn row, so an
# incomplete history replayed from a starting state), an FSRS Review row
# (factor 520), a Set Due Date row (Manual, unrated), an unrated Review row
# between kept rows, an Again row, a Rescheduled row, a cram row (Filtered,
# factor 0) and a last Review. The card holds a stored state and lrt.
# Expected: kinds, factors, and C6.3's per-entry states (the next kept row's
# state for the rows between kept rows).
id: stats/card-info/mixed-history
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {"fsrs": true, "loadBalancerEnabled": false, "rollover": 4}
  decks: ["Lang"]
  notetypes:
    - {"name": "Pair", "fields": ["Front", "Back"], "templates": [{"name": "Forward", "front": "{{Front}}", "back": "{{Back}}"}]}
  notes:
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n1", "x"]}
steps:
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 22, due = 0, factor = 2500, reps = 6, lapses = 1, data = '{\"s\":24.0,\"d\":6.0,\"lrt\":1892797200}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"}}
  - {"db_exec": {"sql": "INSERT INTO revlog VALUES (1887786000000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 10, 4, 2500, 6000, 1), (1888650000000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 2, 15, 10, 2350, 7000, 1), (1889946000000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 25, 15, 520, 5000, 1), (1890810000000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 0, 20, 25, 520, 0, 4), (1891242000000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 0, 20, 20, 520, 0, 1), (1891674000000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 1, 3, 20, 610, 9000, 1), (1892106000000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 0, 8, 3, 610, 0, 5), (1892451600000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 0, 0, 0, 4000, 3), (1892797200000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 22, 8, 590, 4000, 1)"}}
  - {"observe": [{"card_stats": ["#c1"]}]}
