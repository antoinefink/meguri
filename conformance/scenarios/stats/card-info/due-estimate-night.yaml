# stats/card-info C14.1 (C3.3, C5.1): rollover 4, observed at 02:00 local on
# 2030-01-16, still the scheduler day that began 2030-01-15 04:00 (day 0). A
# review card due on day 1. Expected due_date now + 86,400 (2030-01-17 02:00
# local).
id: stats/card-info/due-estimate-night
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {"fsrs": true, "loadBalancerEnabled": false, "rollover": 4}
  decks: ["Lang"]
  notetypes:
    - {"name": "Pair", "fields": ["Front", "Back"], "templates": [{"name": "Forward", "front": "{{Front}}", "back": "{{Back}}"}]}
  notes:
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n1", "x"]}
steps:
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 5, factor = 2500, reps = 2, due = 1, data = '{\"s\":6.0,\"d\":5.0,\"lrt\":1894352400}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"}}
  - {"set_clock": "2030-01-16T02:00:00"}
  - {"observe": ["timing"]}
  - {"observe": [{"card_stats": ["#c1"]}]}
