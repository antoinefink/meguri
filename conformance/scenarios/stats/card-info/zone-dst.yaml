# stats/card-info C14.1 (C2, C3.2, C3.3, C6.3; sched/fsrs-items): one review
# card in America/New_York with rollover 4, whose history crosses the end of
# daylight saving time (2029-11-04) and has rows just after and just before
# the local rollover hour: Learn rows 2029-10-30 04:30 and 04:40 EDT, Review
# 2029-11-01 04:30 EDT, Review 2029-11-07 04:30 EST, Review Hard 2029-11-22
# 03:50 EST. Data holds a stored state with an lrt (nothing is written back,
# C13.4). Expected: the per-entry states replay the history with the days the
# memory item counts from next_day_at under the zone's offsets; first and
# latest review instants; due from a day number.
id: stats/card-info/zone-dst
clock: {tz: America/New_York, start: "2030-01-15T10:00:00"}
setup:
  config: {"fsrs": true, "loadBalancerEnabled": false, "rollover": 4}
  decks: ["Lang"]
  notetypes:
    - {"name": "Pair", "fields": ["Front", "Back"], "templates": [{"name": "Forward", "front": "{{Front}}", "back": "{{Back}}"}]}
  notes:
    - {"notetype": "Pair", "deck": "Lang", "fields": ["z1", "x"]}
steps:
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 20, due = 30, factor = 2500, reps = 5, data = '{\"s\":30.0,\"d\":5.0,\"lrt\":1890031800}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"}}
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1888043400000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, -600, 0, 0, 4000, 0), (1888044000000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 2, -600, 2500, 3000, 0), (1888216200000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 6, 2, 2500, 5000, 1), (1888738200000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 15, 6, 2500, 6000, 1), (1890031800000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 2, 20, 15, 2500, 7000, 1)"}}
  - {"observe": [{"card_stats": ["#c1"]}]}
