# stats/card-info C14.1 (C3.1, C3.3): a review card and a new card moved into
# the filtered deck F (a decks row as deck-ops.md K13 writes it) from their
# home deck Lang (preset Home), with db_exec (did, odid, odue, due). Expected:
# the review card's due from odue, original_deck Lang and the home preset; the
# new card's position from its filtered due.
id: stats/card-info/filtered-card
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {"fsrs": true, "loadBalancerEnabled": false, "rollover": 4}
  presets:
    - {"name": "Home"}
  decks:
    - {"name": "Lang", "preset": "Home"}
  notetypes:
    - {"name": "Pair", "fields": ["Front", "Back"], "templates": [{"name": "Forward", "front": "{{Front}}", "back": "{{Back}}"}]}
  notes:
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n1", "x"]}
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n2", "x"]}
steps:
  - {"db_exec": {"sql": "INSERT INTO decks (id, name, mtime_secs, usn, common, kind) VALUES (900, 'F', 0, 0, X'08011001', X'12130801120a0a066465636b3a78106428d804383c')"}}
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 10, factor = 2500, reps = 3, did = 900, odid = (SELECT id FROM decks WHERE name = 'Lang'), odue = 4, due = -100000, data = '{\"s\":12.0,\"d\":5.0,\"lrt\":1894179600}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"}}
  - {"db_exec": {"sql": "UPDATE cards SET did = 900, odid = (SELECT id FROM decks WHERE name = 'Lang'), odue = 2, due = -99999, data = '{\"lrt\":0}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1)"}}
  - {"reopen": {}}
  - {"observe": [{"card_stats": ["#c1", "#c2"]}]}
