# stats/card-info C14.1 (C3.3): a learning card whose due is an epoch-seconds
# time (now + 600). Expected: due_date equals it.
id: stats/card-info/intraday-learning
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {"fsrs": true, "loadBalancerEnabled": false, "rollover": 4}
  decks: ["Lang"]
  notetypes:
    - {"name": "Pair", "fields": ["Front", "Back"], "templates": [{"name": "Forward", "front": "{{Front}}", "back": "{{Back}}"}]}
  notes:
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n1", "x"]}
steps:
  - {"db_exec": {"sql": "UPDATE cards SET type = 1, queue = 1, ivl = 0, factor = 2500, reps = 1, left = 1001, due = 1894698600, data = '{\"s\":0.5,\"d\":6.0,\"lrt\":1894697940}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"}}
  - {"db_exec": {"sql": "INSERT INTO revlog VALUES (1894697940000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, -600, 0, 0, 3000, 0)"}}
  - {"observe": [{"card_stats": ["#c1"]}]}
