# stats/card-info C14.1 AE46 (C3.4, C3.5, R1251): a review card with history
# whose data has no s, d or lrt (written {} with db_exec, C13.4). Expected: a
# memory state computed from the history; Anki gives no retrievability for it
# (deviation card-info-computed-retrievability). Anki's card stats write an
# lrt into the card's data (C13.3), which the card observation after it shows
# (deviation card-info-no-lrt-backfill); col.mod is read before and after.
id: stats/card-info/ae46-no-state
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {"fsrs": true, "loadBalancerEnabled": false, "rollover": 4}
  decks: ["Lang"]
  notetypes:
    - {"name": "Pair", "fields": ["Front", "Back"], "templates": [{"name": "Forward", "front": "{{Front}}", "back": "{{Back}}"}]}
  notes:
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n1", "x"]}
steps:
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 20, due = 11, factor = 2500, reps = 4, data = '{}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"}}
  - {"db_exec": {"sql": "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) VALUES (1892970000000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, -600, 0, 0, 4000, 0), (1892970600000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 3, -600, 2500, 3000, 0), (1893229200000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 8, 3, 2500, 5000, 1), (1893920400000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 20, 8, 2500, 6000, 1)"}}
  - {"observe": [{"card": ["#c1"]}]}
  - {"db_exec": {"sql": "SELECT mod FROM col"}}
  - {"observe": [{"card_stats": ["#c1"]}]}
  - {"observe": [{"card": ["#c1"]}]}
  - {"db_exec": {"sql": "SELECT mod FROM col"}}
