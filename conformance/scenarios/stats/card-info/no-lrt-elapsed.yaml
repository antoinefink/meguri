# stats/card-info C14.1 (C3.5 step 1): a stored memory state without lrt
# (data {"s":10.0,"d":5.0}). Rows: Learn Good 20 days ago, Review Good 10 days
# ago, a rated Manual row 6 days ago, a cram row (Filtered, factor 0) 3 days
# ago. Expected: the elapsed time runs from the Manual row, the latest rated
# row that is not a cram row; the cram row moves the latest review only.
id: stats/card-info/no-lrt-elapsed
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {"fsrs": true, "loadBalancerEnabled": false, "rollover": 4}
  decks: ["Lang"]
  notetypes:
    - {"name": "Pair", "fields": ["Front", "Back"], "templates": [{"name": "Forward", "front": "{{Front}}", "back": "{{Back}}"}]}
  notes:
    - {"notetype": "Pair", "deck": "Lang", "fields": ["n1", "x"]}
steps:
  - {"db_exec": {"sql": "UPDATE cards SET type = 2, queue = 2, ivl = 10, due = 5, factor = 2500, reps = 3, data = '{\"s\":10.0,\"d\":5.0}' WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"}}
  - {"db_exec": {"sql": "INSERT INTO revlog VALUES (1892970000000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 1, -600, 2500, 3000, 0), (1893834000000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 10, 1, 2500, 3000, 1), (1894179600000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 10, 10, 2500, 0, 4), (1894438800000, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, 3, 0, 0, 0, 2000, 3)"}}
  - {"observe": [{"card_stats": ["#c1"]}]}
