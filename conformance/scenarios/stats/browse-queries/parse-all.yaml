# stats/browse-queries Q8 (Q6, R1420): every joined text parses. The texts
# of Q3's table; each Card Counts label, plain and separated, alone
# (Collection), for Deck Lang and for Search tag:a or tag:b; Calendar items;
# and "is:new" joined with the deck names of Q6 (names that need the did:
# form use an id list). canonical_search never reads the collection.
id: stats/browse-queries/parse-all
clock: {tz: UTC, start: "2026-10-12T10:00:00"}
steps:
  - observe:
      - canonical_search:
          - '"is:new"'
          - '"is:new" OR "is:due"'
          - '(deck:"Lang") AND ("is:new" OR "is:due")'
          - '(deck:"Japanese") AND ("is:review" AND -"is:learn") AND "prop:ivl<21" AND -("is:buried" OR "is:suspended")'
          - '(deck:"a\_b\*") AND "is:new"'
          - '(deck:"x \"y\"") AND "is:buried"'
          - '(deck:"a\\b::c") AND "is:new"'
          - '(deck:"Lang::日本語") AND "prop:rated=-3"'
          - '(deck:"Current") AND "is:suspended"'
          - '(did:1700000000001,1700000000002) AND "is:suspended"'
          - '(tag:a or tag:b) AND "is:buried"'
          - '(is:due) AND "is:new"'
          - '(-"is:review" AND "is:learn")'
          - '("is:review" AND "is:learn")'
          - '("is:review" AND -"is:learn") AND "prop:ivl<21"'
          - '("is:review" AND -"is:learn") AND "prop:ivl>=21"'
          - '"is:new" AND -("is:buried" OR "is:suspended")'
          - '(-"is:review" AND "is:learn") AND -("is:buried" OR "is:suspended")'
          - '("is:review" AND "is:learn") AND -("is:buried" OR "is:suspended")'
          - '("is:review" AND -"is:learn") AND "prop:ivl<21" AND -("is:buried" OR "is:suspended")'
          - '("is:review" AND -"is:learn") AND "prop:ivl>=21" AND -("is:buried" OR "is:suspended")'
          - '"is:suspended"'
          - '"is:buried"'
          - '(deck:"Lang") AND "is:new"'
          - '(deck:"Lang") AND (-"is:review" AND "is:learn")'
          - '(deck:"Lang") AND ("is:review" AND "is:learn")'
          - '(deck:"Lang") AND ("is:review" AND -"is:learn") AND "prop:ivl<21"'
          - '(deck:"Lang") AND ("is:review" AND -"is:learn") AND "prop:ivl>=21"'
          - '(deck:"Lang") AND "is:new" AND -("is:buried" OR "is:suspended")'
          - '(deck:"Lang") AND (-"is:review" AND "is:learn") AND -("is:buried" OR "is:suspended")'
          - '(deck:"Lang") AND ("is:review" AND "is:learn") AND -("is:buried" OR "is:suspended")'
          - '(deck:"Lang") AND ("is:review" AND -"is:learn") AND "prop:ivl<21" AND -("is:buried" OR "is:suspended")'
          - '(deck:"Lang") AND ("is:review" AND -"is:learn") AND "prop:ivl>=21" AND -("is:buried" OR "is:suspended")'
          - '(deck:"Lang") AND "is:suspended"'
          - '(deck:"Lang") AND "is:buried"'
          - '(tag:a or tag:b) AND "is:new"'
          - '(tag:a or tag:b) AND (-"is:review" AND "is:learn")'
          - '(tag:a or tag:b) AND ("is:review" AND "is:learn")'
          - '(tag:a or tag:b) AND ("is:review" AND -"is:learn") AND "prop:ivl<21"'
          - '(tag:a or tag:b) AND ("is:review" AND -"is:learn") AND "prop:ivl>=21"'
          - '(tag:a or tag:b) AND "is:new" AND -("is:buried" OR "is:suspended")'
          - '(tag:a or tag:b) AND (-"is:review" AND "is:learn") AND -("is:buried" OR "is:suspended")'
          - '(tag:a or tag:b) AND ("is:review" AND "is:learn") AND -("is:buried" OR "is:suspended")'
          - '(tag:a or tag:b) AND ("is:review" AND -"is:learn") AND "prop:ivl<21" AND -("is:buried" OR "is:suspended")'
          - '(tag:a or tag:b) AND ("is:review" AND -"is:learn") AND "prop:ivl>=21" AND -("is:buried" OR "is:suspended")'
          - '(tag:a or tag:b) AND "is:suspended"'
          - '"prop:rated=0"'
          - '"prop:rated=-7304"'
          - '(deck:"Lang") AND "prop:rated=0"'
          - '(tag:a or tag:b) AND "prop:rated=-1"'
          - '(deck:"a\_b") AND "is:new"'
          - '(deck:"a\*b") AND "is:new"'
          - '(deck:"a\"b") AND "is:new"'
          - '(deck:"a\\b") AND "is:new"'
          - '(deck:"(x)") AND "is:new"'
          - '(deck:"-x") AND "is:new"'
          - '(deck:"x::current") AND "is:new"'
          - '(deck:"Filtered") AND "is:new"'
          - '(deck:"Current") AND "is:new"'
          - '(deck:"日本語::子") AND "is:new"'
          - '(deck:"a b") AND "is:new"'
          - '(did:1700000000001) AND "is:new"'
