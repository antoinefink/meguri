# U35 (specs/notetypes/change-notetype.md M9 step 3, Normalization): the
# change removes ASCII control characters other than TAB and LF from every
# field, and applies no NFC although normalize_note_text is absent (true).
# A raw write puts a decomposed e + U+0301 into the first field and U+0001,
# U+0007, CR and U+007F (with a TAB and an LF that stay) into the second.
# After the change to Wide, flds has the control characters removed and the
# decomposed sequence kept, and sfld and csum are computed from that text.
# The untouched note keeps its raw value, so the raw write itself is shown.
# The change runs as accepted (change-notetype-ops.md H2,
# notetypes/schema-changes.md G4).
id: notetypes/change/normalization
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Narrow
      fields: [Word, Gloss]
      templates:
        - {name: Ask, front: "{{Word}}", back: "{{Gloss}}"}
    - name: Wide
      fields: [Word, Gloss, Spare]
      templates:
        - {name: Ask, front: "{{Word}}", back: "{{Gloss}}"}
  notes:
    - {notetype: Narrow, fields: [plain, text]}
    - {notetype: Narrow, fields: [kept, raw]}
steps:
  - db_exec: {sql: "UPDATE notes SET flds = 'cafe' || char(769) || char(31) || 'x' || char(1) || 'y' || char(7) || char(13) || char(10) || 'z' || char(9) || 'w' || char(127) WHERE sfld = 'plain'"}
  - db_exec: {sql: "UPDATE notes SET flds = 'kept' || char(1) || char(31) || 'e' || char(769) WHERE sfld = 'kept'"}
  - advance: 1h
  - change_notetype_info: {notes: ["#n1"], notetype: Wide}
  # step 4
  - change_notetype: {}
  - db_exec: {sql: "SELECT t.name, hex(n.flds), hex(n.sfld), n.csum, n.mod, n.usn FROM notes n JOIN notetypes t ON t.id = n.mid ORDER BY n.id"}
  - observe: [card]
