# Template maps between standard note types (specs/notetypes/change-notetype.md
# M9.1, M9 step 3). Pair to Pair Reverse with map (none, 0): the old card
# becomes ordinal 1, same card, stamped, and a new card of ordinal 0 is created
# at its position. Pair Reverse to itself with map (0, none): the reviewed card
# 2 is deleted with a grave and, since its template still requires a card,
# created again as a new card at card 1's position: its scheduling is lost,
# its review-log row stays. Pair Reverse to Pair with the default map (0):
# card 2 is dropped. The same-type change keeps the note's fields, so the
# note rows are not observed (M9 step 3, storage/ids-usn-mtime.md S4).
# The change runs as accepted: the oracle answers no schema question and
# Meguri's change takes no confirmation input (change-notetype-ops.md H2,
# notetypes/schema-changes.md G4).
id: notetypes/change/template-map
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{Back}}"}
    - name: Pair Reverse
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{Back}}"}
        - {name: Card 2, front: "{{Back}}", back: "{{Front}}"}
  decks: [Words]
  notes:
    - {notetype: Pair, deck: Words, fields: [vexo, one]}
    - {notetype: Pair Reverse, deck: Words, fields: [zwei, two]}
    - {notetype: Pair Reverse, deck: Words, fields: [dral, tri]}
steps:
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = 2, due = 10, ivl = 5, reps = 3 WHERE ord = 1 AND nid = (SELECT id FROM notes WHERE sfld = 'zwei')"}
  - db_exec: {sql: "INSERT INTO revlog SELECT 1894700000000, id, -1, 3, 5, 1, 2500, 8000, 1 FROM cards WHERE ord = 1 AND nid = (SELECT id FROM notes WHERE sfld = 'zwei')"}
  - advance: 1h
  - change_notetype_info: {notes: ["#n1"], notetype: Pair Reverse}
  - change_notetype: {templates: [null, 0]}
  - change_notetype_info: {notes: ["#n2"], notetype: Pair Reverse}
  - change_notetype: {templates: [0, null]}
  - change_notetype_info: {notes: ["#n3"], notetype: Pair}
  - change_notetype: {}
  - observe: [card]
  - db_exec: {sql: "SELECT n.sfld, c.ord, replace(d.name, char(31), '::'), c.type, c.queue, c.due, c.ivl, c.reps, c.mod, c.usn FROM cards c JOIN notes n ON n.id = c.nid LEFT JOIN decks d ON d.id = c.did ORDER BY n.id, c.ord, c.id"}
  - db_exec: {sql: "SELECT id, ease, ivl, (SELECT count(*) FROM cards WHERE cards.id = revlog.cid) FROM revlog ORDER BY id"}
  - db_exec: {sql: "SELECT type, usn, count(*) FROM graves GROUP BY type, usn ORDER BY type"}
