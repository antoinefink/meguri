# Canonical bytes of notetype, field and template config blobs
# (protobuf-records P6.1-P6.3) and the schema-11 objects (schema11-json S4-S6).
# Anki gives new fields and templates random ids, so the scenario first saves
# both note types with ids, LaTeX texts and options of its own; every value
# observed afterwards is then set by the scenario or by the frozen clock.
id: model/proto/notetype-bytes
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
    - name: Gap
      kind: cloze
      fields: [Text, Extra]
      templates: [{name: Cloze, front: "{{cloze:Text}}", back: "{{cloze:Text}}<br>{{Extra}}"}]
      css: ".card { color: navy; }"
steps:
  - legacy_update:
      notetype: Pair
      patch:
        sortf: 1
        did: 1
        latexPre: "% pre\n"
        latexPost: "% post"
        latexsvg: true
        originalId: 1234567890123
        flds:
          - {name: Front, ord: 0, sticky: true, rtl: false, font: Arial, size: 20, description: "the word", plainText: false, collapsed: true, excludeFromSearch: false, id: 1001, tag: null, preventDeletion: false}
          - {name: Back, ord: 1, sticky: false, rtl: true, font: "Noto Sans", size: 18, description: "", plainText: true, collapsed: false, excludeFromSearch: true, id: 1002, tag: 3, preventDeletion: true}
        tmpls:
          - {name: Forward, ord: 0, qfmt: "{{Front}}", afmt: "{{Back}}", bqfmt: "{{Front}} (browser)", bafmt: "{{Back}} (browser)", did: 1, bfont: Arial, bsize: 12, id: 2001}
  - legacy_update:
      notetype: Gap
      patch:
        latexPre: "% cloze pre\n"
        latexPost: "% cloze post"
        flds:
          - {name: Text, ord: 0, sticky: false, rtl: false, font: Arial, size: 20, id: 1101}
          - {name: Extra, ord: 1, sticky: false, rtl: false, font: Arial, size: 20, id: 1102}
        tmpls:
          - {name: Cloze, ord: 0, qfmt: "{{cloze:Text}}", afmt: "{{cloze:Text}}<br>{{Extra}}", id: 2101}
  - db_exec: {sql: "SELECT name, mtime_secs, usn, hex(config) FROM notetypes WHERE name IN ('Pair', 'Gap') ORDER BY name"}
  - db_exec: {sql: "SELECT n.name, f.ord, f.name, hex(f.config) FROM fields f JOIN notetypes n ON n.id = f.ntid WHERE n.name IN ('Pair', 'Gap') ORDER BY n.name, f.ord"}
  - db_exec: {sql: "SELECT n.name, t.ord, t.name, t.mtime_secs, t.usn, hex(t.config) FROM templates t JOIN notetypes n ON n.id = t.ntid WHERE n.name IN ('Pair', 'Gap') ORDER BY n.name, t.ord"}
  - observe:
      - legacy_json: {notetypes: [Pair, Gap]}
