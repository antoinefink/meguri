# A synthetic add-on block in the Default preset's other (R1464, R1486;
# schema11-json S3, S10.5), written for this scenario in the style of a
# scheduling add-on's legacy keys: flat keys, nested objects and arrays, zeros,
# false, null, a fraction, a non-ASCII string, and extra keys inside new and
# lapse. Record -> object puts every member at the top level (new and lapse
# extras inside those objects). Saving the object back (object -> record) and
# reading it again keeps them all; so does a later save that changes only
# fsrsParams6, which also leaves fsrsWeights and fsrsParams5 as they were.
# Only legacy_json is observed: Anki writes several top-level members of other
# in no set order, so the stored bytes are not deterministic.
id: model/schema11/preset-addon-roundtrip
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
steps:
  - db_exec:
      sql: "UPDATE deck_config SET config = CAST(config || X'' AS BLOB) WHERE name = 'Default'"
  - observe:
      - legacy_json: {presets: [Default]}
  - legacy_update:
      preset: Default
      patch:
        fsrsWeights: [0.4, 0.6, 2.4, 5.8]
        fsrsParams5: [0.40255, 1.18385, 3.173, 15.69105]
  - observe:
      - legacy_json: {presets: [Default]}
  - legacy_update:
      preset: Default
      patch:
        fsrsParams6: [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542]
  - observe:
      - legacy_json: {presets: [Default]}
