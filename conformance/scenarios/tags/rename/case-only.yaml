# A rename that changes only letter case (specs/tags/tags.md T7, R1176):
# the old rows go first, so the new spelling is stored in the notes and the
# registry, descendants included.
id: tags/rename/case-only
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Plain
      fields: [Text]
      templates: [{name: Card, front: "{{Text}}", back: "{{Text}}"}]
steps:
  - add_note: {notetype: Plain, fields: ["n1"], tags: [verbs, "verbs::x"]}
  - add_note: {notetype: Plain, fields: ["n2"], tags: ["verbs::y"]}
  - advance: 1h
  - rename_tag: {from: verbs, to: Verbs}
  - db_exec: {sql: "SELECT tags, mod, usn FROM notes ORDER BY id"}
  - observe: [{db_dump: {tables: [tags]}}]
