# Renaming onto a tag registered with another spelling (specs/tags/tags.md
# T7, R892, R1467): `foo` → `bar` with a row `Bar`. Both store the rows
# `Bar` and `Bar::c`. Meguri writes that spelling into the note too; Anki's
# note keeps the typed `bar` and `bar::c` (deviation
# tags-rename-existing-spelling).
id: tags/rename/existing-spelling
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Plain
      fields: [Text]
      templates: [{name: Card, front: "{{Text}}", back: "{{Text}}"}]
steps:
  - add_note: {notetype: Plain, fields: ["n1"], tags: [foo, "foo::c"]}
  - add_note: {notetype: Plain, fields: ["n2"], tags: ["Bar::x"]}
  - add_note: {notetype: Plain, fields: ["n3"], tags: [Bar]}
  - advance: 1h
  - rename_tag: {from: foo, to: bar}
  - db_exec: {sql: "SELECT tags FROM notes ORDER BY id"}
  - observe: [{db_dump: {tables: [tags]}}]
