# Moving a tag onto a name registered with another spelling (specs/tags/
# tags.md T8, R892, R1467): `foo` onto `bar` with a row `bar::FOO`. Both keep
# the single row `bar::FOO`. Meguri writes that spelling into #n1; Anki's
# note keeps the built `bar::foo` (deviation tags-reparent-existing-spelling).
id: tags/reparent/existing-spelling
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Plain
      fields: [Text]
      templates: [{name: Card, front: "{{Text}}", back: "{{Text}}"}]
steps:
  - add_note: {notetype: Plain, fields: ["n1"], tags: [foo]}
  - add_note: {notetype: Plain, fields: ["n2"], tags: ["bar::FOO"]}
  - advance: 1h
  - reparent_tags: {tags: [foo], parent: bar}
  - db_exec: {sql: "SELECT tags FROM notes ORDER BY id"}
  - observe: [{db_dump: {tables: [tags]}}]
