# Adding tags to listed notes (specs/tags/tags.md T10 Add). The text splits
# at spaces and U+3000, each name is normalized and takes a registered
# spelling. A note that gains a tag is deduplicated and sorted (#n4, stored
# unsorted with a duplicate by another client); a note that gains nothing is
# untouched, even unsorted (#n5). Empty text or text of separators adds
# nothing.
id: tags/bulk/add
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  notetypes:
    - name: Plain
      fields: [Text]
      templates: [{name: Card, front: "{{Text}}", back: "{{Text}}"}]
steps:
  - add_note: {notetype: Plain, fields: ["n1"], tags: ["VERB", kaNA, art]}
  - add_note: {notetype: Plain, fields: ["n2"]}
  - add_note: {notetype: Plain, fields: ["n3"], tags: [kana, verb, idiom]}
  - add_note: {notetype: Plain, fields: ["n4"], tags: [zz, a]}
  - db_exec: {sql: "UPDATE notes SET tags = ' zz a zz ' WHERE id = (SELECT id FROM notes ORDER BY id LIMIT 1 OFFSET 3)"}
  - add_note: {notetype: Plain, fields: ["n5"], tags: [b]}
  - db_exec: {sql: "UPDATE notes SET tags = ' b a ' WHERE id = (SELECT id FROM notes ORDER BY id LIMIT 1 OFFSET 4)"}
  - advance: 1h
  - add_note_tags: {notes: ["#n1", "#n2", "#n3", "#n4"], tags: "verb idiom KANA mix\tup"}
  - db_exec: {sql: "SELECT tags, mod, usn FROM notes ORDER BY id"}
  - observe: [{db_dump: {tables: [tags]}}]
  - advance: 1h
  - add_note_tags: {notes: ["#n5"], tags: "A"}
  - add_note_tags: {notes: ["#n5"], tags: ""}
  - add_note_tags: {notes: ["#n5"], tags: " 　 "}
  - add_note_tags: {notes: ["#n2"], tags: "q Q q"}
  - add_note_tags: {notes: ["#n2"], tags: "r::"}
  - db_exec: {sql: "SELECT tags, mod, usn FROM notes ORDER BY id"}
  - observe: [{db_dump: {tables: [tags]}}]
