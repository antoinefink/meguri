# K4.2 backend fact only: a note type last deck is normal, filtered, deleted or missing, with both addToCur modes. The UI rule about keeping the selected deck is covered by Meguri model tests, not this oracle observation.
# Spec: editor/config-keys K4/K7; notes/add-defaults D7.
{
  "id": "editor/config-keys/notetype-change",
  "clock": {
    "tz": "UTC",
    "start": "2030-01-15T10:00:00"
  },
  "setup": {
    "decks": [
      "Current",
      "Destination",
      "Retired"
    ],
    "notetypes": [
      {
        "name": "ToNormal",
        "fields": [
          "Question",
          "Answer"
        ],
        "templates": [
          {
            "name": "Prompt",
            "front": "{{Question}}",
            "back": "{{Answer}}"
          }
        ],
        "css": ".card { font-family: sans-serif; }"
      },
      {
        "name": "ToFiltered",
        "fields": [
          "Question",
          "Answer"
        ],
        "templates": [
          {
            "name": "Prompt",
            "front": "{{Question}}",
            "back": "{{Answer}}"
          }
        ],
        "css": ".card { font-family: sans-serif; }"
      },
      {
        "name": "ToDeleted",
        "fields": [
          "Question",
          "Answer"
        ],
        "templates": [
          {
            "name": "Prompt",
            "front": "{{Question}}",
            "back": "{{Answer}}"
          }
        ],
        "css": ".card { font-family: sans-serif; }"
      },
      {
        "name": "NoLastDeck",
        "fields": [
          "Question",
          "Answer"
        ],
        "templates": [
          {
            "name": "Prompt",
            "front": "{{Question}}",
            "back": "{{Answer}}"
          }
        ],
        "css": ".card { font-family: sans-serif; }"
      }
    ]
  },
  "steps": [
    {
      "db_exec": {
        "sql": "DELETE FROM config WHERE KEY LIKE '_deck_%_lastNotetype' OR KEY LIKE '_nt_%_lastDeck'"
      }
    },
    {
      "db_exec": {
        "sql": "INSERT INTO decks (id, name, mtime_secs, usn, common, kind) VALUES (900, 'Practice', 0, 0, X'08011001', X'12130801120a0a066465636b3a78106428d804383c')"
      }
    },
    {
      "db_exec": {
        "sql": "INSERT OR REPLACE INTO config (KEY, usn, mtime_secs, val) SELECT '_nt_' || o.id || '_lastDeck', 0, 0, CAST(v.id AS BLOB) FROM notetypes o, decks v WHERE o.name = 'ToNormal' AND v.name = 'Destination'"
      }
    },
    {
      "db_exec": {
        "sql": "INSERT OR REPLACE INTO config (KEY, usn, mtime_secs, val) SELECT '_nt_' || o.id || '_lastDeck', 0, 0, CAST(v.id AS BLOB) FROM notetypes o, decks v WHERE o.name = 'ToFiltered' AND v.name = 'Practice'"
      }
    },
    {
      "db_exec": {
        "sql": "INSERT OR REPLACE INTO config (KEY, usn, mtime_secs, val) SELECT '_nt_' || o.id || '_lastDeck', 0, 0, CAST(v.id AS BLOB) FROM notetypes o, decks v WHERE o.name = 'ToDeleted' AND v.name = 'Retired'"
      }
    },
    {
      "db_exec": {
        "sql": "DELETE FROM decks WHERE name = 'Retired'"
      }
    },
    {
      "set_config": {
        "key": "addToCur",
        "value": true
      }
    },
    {
      "observe": [
        {
          "notetype_last_deck": {
            "notetype": "ToNormal"
          }
        }
      ]
    },
    {
      "observe": [
        {
          "notetype_last_deck": {
            "notetype": "ToFiltered"
          }
        }
      ]
    },
    {
      "observe": [
        {
          "notetype_last_deck": {
            "notetype": "ToDeleted"
          }
        }
      ]
    },
    {
      "observe": [
        {
          "notetype_last_deck": {
            "notetype": "NoLastDeck"
          }
        }
      ]
    },
    {
      "set_config": {
        "key": "addToCur",
        "value": false
      }
    },
    {
      "observe": [
        {
          "notetype_last_deck": {
            "notetype": "ToNormal"
          }
        }
      ]
    },
    {
      "observe": [
        {
          "notetype_last_deck": {
            "notetype": "ToFiltered"
          }
        }
      ]
    },
    {
      "observe": [
        {
          "notetype_last_deck": {
            "notetype": "ToDeleted"
          }
        }
      ]
    },
    {
      "observe": [
        {
          "notetype_last_deck": {
            "notetype": "NoLastDeck"
          }
        }
      ]
    }
  ]
}
