    {
      "db_exec": {
        "sql": "INSERT OR REPLACE INTO config (KEY, usn, mtime_secs, val) SELECT '_deck_' || o.id || '_lastNotetype', 0, 0, CAST(v.id AS BLOB) FROM decks o, notetypes v WHERE o.name = 'First' AND v.name = 'Beta'"
