# The unicase comparison (specs/text/unicode-primitives.md U2): full case
# folding from the pinned table, three-character folds in their pinned order,
# code-point order after folding.
id: text/fold/unicase
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
steps:
