            - ["Ǆ", "ǆ"]
            - ["İ", "i"]
            - ["İ", "i\u0307"]
            - ["ı", "I"]
            - ["\uFB03", "ffi"]
            - ["\uFB03", "iff"]
            - ["ΐ", "ι\u0308\u0301"]
            - ["ΐ", "\u0301ι\u0308"]
            - ["\u212A", "k"]
            - ["Σ", "ς"]
            - ["σ", "ς"]
            - ["Ꭰ", "ꭰ"]
            - ["ᲀ", "в"]
