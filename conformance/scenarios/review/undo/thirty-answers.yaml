# Every answer is one undo step, and at most 30 are kept
# (specs/review/answer-flow.md F6.1; R367; engine/undo A2). Default deck,
# its preset allowing 40 new cards a day; 31 new cards of a one-template note
# type, so no siblings. Each card is answered Easy at the head, so it leaves
# the queue. The 31st answer drops the step of the first: 30 undos bring
# #c31 to #c2 back, newest first, each to the front of the queue, and the
# 31st undo is refused with nothing_to_undo; #c1 stays answered.
# The no-op write empties both histories and comes before the queue is held
# (answer-ops.md H4 rule 5; session-ops.md E3 rules 1 and 7).
# Draft: recorded, not active.
id: review/undo/thirty-answers
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  presets:
    - {name: Default, new_per_day: 40}
  notetypes:
    - name: QX_NT01
      fields: [QX_F01, QX_F02]
      templates: [{name: QX_T01, front: "{{QX_F01}}", back: "{{QX_F02}}"}]
  notes:
