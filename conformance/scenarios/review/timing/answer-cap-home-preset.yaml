# The stored answer time is capped by the card's home preset, not by the
# preset of the deck being studied (specs/review/answer-flow.md F2 row 3;
# R330, R359; sched/answering A1, A5). Parent deck QX_D01 uses QX_P01
# (maximum answer seconds 60, the default); its subdeck QX_D01::QX_D02 uses
# QX_P02 with 30. QX_D01 is the current deck and the queue is held on it, so
# the answers come from a study of the parent deck (session-ops.md E2, E3).
# New cards are gathered deck by deck, the studied deck first
# (sched/orders O2, sched/queue-building B2): the queue is [#c2, #c3, #c1].
# Each Good answer makes the card a learning card due in 10 minutes, which
# waits behind the main list, so each answer is at the head.
# #c2 (parent) is answered with 45 s, #c3 (parent) with 95 s, #c1 (subdeck)
# with 45 s: stored 45 000, 60 000 and 30 000 ms.
# Draft: recorded, not active.
id: review/timing/answer-cap-home-preset
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  presets:
    - {name: QX_P01}
    - {name: QX_P02}
  decks:
    - {name: QX_D01, preset: QX_P01}
    - {name: "QX_D01::QX_D02", preset: QX_P02}
  notetypes:
    - name: QX_NT01
      fields: [QX_F01, QX_F02]
      templates: [{name: QX_T01, front: "{{QX_F01}}", back: "{{QX_F02}}"}]
  notes:
    - {notetype: QX_NT01, deck: "QX_D01::QX_D02", fields: [QX_V01, QX_V02]}
    - {notetype: QX_NT01, deck: QX_D01, fields: [QX_V03, QX_V04]}
    - {notetype: QX_NT01, deck: QX_D01, fields: [QX_V05, QX_V06]}
steps:
  - legacy_update: {preset: QX_P02, patch: {maxTaken: 30}}
  - set_current_deck: {deck: QX_D01}
  - observe: [queue]
  - answer: {card: "#c2", rating: good, time_ms: 45000}
  - advance: 1m
  - answer: {card: "#c3", rating: good, time_ms: 95000}
  - advance: 1m
  - answer: {card: "#c1", rating: good, time_ms: 45000}
  - observe: [queue, "revlog(#c1, #c2, #c3)"]
