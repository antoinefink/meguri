steps:
  - db_exec:
      sql: |
        UPDATE cards SET type = v.column2, queue = v.column3, due = v.column4, ivl = v.column5, reps = 3, left = v.column6
        FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n FROM cards) AS c
        JOIN (VALUES
          (1, 2, 2, 0, 5, 0),
          (6, 2, 2, 0, 5, 0), (7, 2, 2, -1, 6, 0), (8, 2, 2, 0, 7, 0), (9, 0, -3, 9, 0, 0),
          (10, 2, 2, 0, 5, 0), (11, 2, 2, -2, 5, 0), (12, 2, -2, 0, 5, 0),
          (16, 2, 2, 0, 5, 0), (17, 2, 2, 0, 6, 0), (18, 2, 2, 1, 7, 0), (19, 1, 1, 1894703400, 0, 1), (20, 1, 3, 1, 0, 1),
          (21, 2, 2, 0, 5, 0), (22, 2, 2, 0, 6, 0), (23, 2, 2, -1, 5, 0), (24, 2, 2, 0, 9, 0), (25, 2, 2, -3, 5, 0), (26, 2, 2, 0, 3, 0)
        ) AS v ON v.column1 = c.n
        WHERE cards.id = c.cid
  - legacy_update: {deck: "Delta::Beta", patch: {reviewLimit: 3}}
  - legacy_update: {deck: "Delta::Beta::Inner", patch: {newLimitToday: {limit: 1, today: 0}}}
  - legacy_update: {deck: Bravo, patch: {revToday: [0, 195]}}
  - observe: [timing, deck_counts]
  - set_clock: "2030-01-16T03:59:59"
  - observe: [timing, deck_counts]
  - set_clock: "2030-01-16T04:00:01"
  - observe: [timing, deck_counts]
  - set_config: {key: applyAllParentLimits, value: true}
  - observe: [deck_counts]
