# Original synthetic labels; the recorded card states, tree shape and limits are retained.
id: sched/counts/limits-tree
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true, applyAllParentLimits: false}
  presets:
    - {name: Default, new_per_day: 20, reviews_per_day: 200}
    - {name: Focus, new_per_day: 5, reviews_per_day: 8}
  decks:
    - {name: Delta, preset: Focus}
    - "Delta::Alpha"
    - "Delta::Beta"
    - "Delta::Beta::Inner"
    - Bravo
  notetypes:
    - name: CountProbe
      fields: [Prompt, Reply]
      templates: [{name: Face, front: "{{Prompt}}", back: "{{Reply}}"}]
  notes:
    - {notetype: CountProbe, deck: Delta, fields: ["sample 01", "reply"]}
    - {notetype: CountProbe, deck: "Delta::Alpha", fields: ["sample 02", "reply"]}
