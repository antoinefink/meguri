    - {notetype: CountProbe, deck: "Delta::Alpha", fields: ["sample 06", "reply"]}
    - {notetype: CountProbe, deck: "Delta::Alpha", fields: ["sample 07", "reply"]}
    - {notetype: CountProbe, deck: "Delta::Alpha", fields: ["sample 08", "reply"]}
    - {notetype: CountProbe, deck: "Delta::Alpha", fields: ["sample 09", "reply"]}
    - {notetype: CountProbe, deck: "Delta::Beta", fields: ["sample 10", "reply"]}
