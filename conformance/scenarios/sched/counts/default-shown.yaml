# The Default deck stays in the tree when it has a child deck, or holds a card
# (R39; specs/sched/counts.md C2). Step 0: Default has the child Default::Sub
# and no card of its own. After Default::Sub's card moves to Default and the
# subdeck is removed: Default holds a card, next to the deck Other.
id: sched/counts/default-shown
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true}
  decks: ["Default::Sub", Other]
  notetypes:
    - name: Card
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
    - {notetype: Card, deck: "Default::Sub", fields: [s, a]}
steps:
  - observe: [deck_counts]
  - db_exec: {sql: "UPDATE cards SET did = 1"}
  - db_exec: {sql: "DELETE FROM decks WHERE name = 'Default' || char(31) || 'Sub'"}
  - observe: [deck_counts]
