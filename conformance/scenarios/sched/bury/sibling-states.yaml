id: sched/bury/sibling-states
clock:
  tz: UTC
  start: '2030-01-15T10:00:00'
setup:
  config:
    fsrs: true
    loadBalancerEnabled: false
  presets:
  - name: A0013
    bury_new: true
    bury_reviews: true
    bury_interday_learning: true
  - name: X0140
  decks:
  - name: X0035
    preset: A0013
  - name: X0166
    preset: X0140
  notetypes:
  - name: X0027
    fields:
    - A0001
    - A0004
    - A0014
    - A0027
    - X0002
    templates:
    - name: X0159
      front: '{{A0001}}'
      back: '{{A0004}}'
    - name: X0160
      front: '{{A0004}}'
      back: '{{A0001}}'
    - name: X0161
      front: '{{A0014}}'
      back: '{{A0001}}'
    - name: X0162
      front: '{{A0027}}'
      back: '{{A0001}}'
    - name: X0163
      front: '{{X0002}}'
      back: '{{A0001}}'
  notes:
  - notetype: X0027
    deck: X0035
    fields:
    - x0147
    - a0005
    - a0015
    - a0028
    - x0003
  - notetype: X0027
    deck: X0166
    fields:
    - x0148
    - a0006
    - a0016
    - a0029
    - x0009
steps:
- observe:
  - timing
- db_exec:
    sql: UPDATE cards SET type = v.column2, queue = v.column3, due = v.column4, ivl = v.column5, factor = v.column6,
      reps = v.column7, left = v.column8, data = v.column9 FROM (SELECT id AS cid, row_number() OVER (ORDER BY id)
      AS n FROM cards) AS c JOIN (VALUES (1, 2, 2, 0, 4, 2500, 3, 0, '{"s":4.5,"d":5.0,"lrt":1894356000}'), (3,
      2, -1, 0, 4, 2500, 3, 0, '{"s":4.5,"d":5.0,"lrt":1894356000}'), (4, 0, -3, 1, 0, 0, 0, 0, ''), (5, 2, -2,
      30, 34, 2500, 5, 0, '{"s":30.0,"d":5.0,"lrt":1894356000}'), (6, 2, 2, 0, 4, 2500, 3, 0, '{"s":4.5,"d":5.0,"lrt":1894356000}'),
      (8, 2, 2, 3, 7, 2500, 3, 0, '{"s":7.0,"d":5.0,"lrt":1894356000}'), (9, 1, 3, 1, 0, 0, 1, 1, '{"s":1.0,"d":5.0,"lrt":1894615200}'),
      (10, 1, 1, 1894703400, 0, 0, 1, 1, '{"s":0.5,"d":5.0,"lrt":1894700400}') ) AS v ON v.column1 = c.n WHERE cards.id
      = c.cid
- db_exec:
    sql: UPDATE cards SET did = (SELECT id FROM decks WHERE name = 'X0166') WHERE id = (SELECT id FROM cards ORDER
      BY id LIMIT 1 OFFSET 1)
- db_exec:
    sql: UPDATE cards SET did = (SELECT id FROM decks WHERE name = 'X0035') WHERE id IN (SELECT id FROM cards ORDER
      BY id LIMIT 4 OFFSET 6)
- advance: 1h
- observe:
  - card
- answer:
    card: '#c1'
    rating: good
    time_ms: 1000
- answer:
    card: '#c6'
    rating: good
    time_ms: 1000
- observe:
  - card
