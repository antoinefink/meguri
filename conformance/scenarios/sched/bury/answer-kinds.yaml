steps:
- observe:
  - timing
- db_exec:
    sql: UPDATE cards SET type = v.column2, queue = v.column3, due = v.column4, ivl = v.column5, factor = v.column6,
      reps = v.column7, left = v.column8, data = v.column9 FROM (VALUES (2, 2, 2, 5, 9, 2500, 4, 0, '{"s":9.0,"d":5.0,"lrt":1894356000}'),
      (3, 1, 3, 1, 0, 0, 1, 1, '{"s":1.0,"d":5.0,"lrt":1894615200}'), (4, 1, 1, 1894703400, 0, 0, 1, 1, '{"s":0.5,"d":5.0,"lrt":1894700400}')
      ) AS v WHERE cards.ord = v.column1
- db_exec:
    sql: UPDATE cards SET type = v.column2, queue = v.column3, due = v.column4, ivl = v.column5, factor = v.column6,
      reps = v.column7, left = v.column8, data = v.column9 FROM notes JOIN (VALUES ('x0042', 2, 2, 0, 4, 2500, 3,
      0, '{"s":4.5,"d":5.0,"lrt":1894356000}'), ('x0039', 1, 3, 0, 0, 0, 1, 1, '{"s":1.0,"d":5.0,"lrt":1894615200}'),
      ('x0040', 1, 1, 1894702200, 0, 0, 1, 1, '{"s":0.5,"d":5.0,"lrt":1894701000}'), ('x0043', 2, -1, 0, 4, 2500,
      3, 0, '{"s":4.5,"d":5.0,"lrt":1894356000}') ) AS v ON v.column1 = notes.sfld WHERE cards.nid = notes.id AND
      cards.ord = 0
