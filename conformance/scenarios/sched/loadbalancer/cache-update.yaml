      (14, 2, 2, 24, 9, 2500, 2, '{"s":9.0,"d":5.0,"lrt":1894356000}'), (15, 2, 2, 25, 9, 2500, 2, '{"s":9.0,"d":5.0,"lrt":1894356000}'),
      (16, 2, 2, 26, 9, 2500, 2, '{"s":9.0,"d":5.0,"lrt":1894356000}'), (17, 2, 2, 70, 9, 2500, 2, '{"s":9.0,"d":5.0,"lrt":1894356000}')
      ) AS v ON v.column1 = c.n WHERE cards.id = c.cid
