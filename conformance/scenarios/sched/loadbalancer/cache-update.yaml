      (8, 2, 2, 15, 9, 2500, 2, '{"s":9.0,"d":5.0,"lrt":1894356000}'), (9, 2, 2, 17, 9, 2500, 2, '{"s":9.0,"d":5.0,"lrt":1894356000}'),
