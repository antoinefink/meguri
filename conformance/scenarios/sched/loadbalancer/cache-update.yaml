- db_exec:
    sql: UPDATE cards SET type = v.column2, queue = v.column3, due = v.column4, ivl = v.column5, factor = v.column6,
      reps = v.column7, left = 0, data = v.column8 FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n
      FROM cards) AS c JOIN (VALUES (1, 2, 2, 0, 10, 2500, 13, '{"s":10.0,"d":5.0,"lrt":1894269600}'), (2, 2, 2,
      5, 10, 2500, 6, '{"s":10.0,"d":5.0,"lrt":1893924000}'), (3, 2, 2, 5, 10, 2500, 6, '{"s":10.0,"d":5.0,"lrt":1893924000}'),
