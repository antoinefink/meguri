    - {notetype: Card, deck: "Lang::b", fields: [r17, a]}
    - {notetype: Card, deck: "Lang::A", fields: [r18, a]}
    - {notetype: Card, deck: "Lang", fields: [r19, a]}
    - {notetype: Card, deck: "Lang::b", fields: [r20, a]}
    - {notetype: Card, deck: "Lang::A", fields: [r21, a]}
    - {notetype: Card, deck: "Lang", fields: [r22, a]}
    - {notetype: Card, deck: "Lang::A", fields: [r23, a]}
    - {notetype: Card, deck: "Lang::b", fields: [r24, a]}
