# The thirteen review sort orders with FSRS on (R611, R616, R617, R618, R1896;
# specs/sched/orders.md O4). Lang, Lang::b and Lang::A (created in that order,
# so deck ids and names disagree) hold, on day 200: 22 reviews with memory
# states (stability, difficulty, desired retention, decay 0.1542, 0.5 or
# missing, last review time or missing), two reviews tied on due date,
# interval and difficulty (one with another modification time), four reviews
# with no memory state (one whose interval is longer than its due day), four
# interday learning or relearning cards and two reviews due tomorrow. New
# cards are off (0 a day), so the queue is the reviews and interday learning
# mixed. Each order in turn: 0 due date then random, 1 due date then deck, 2
# deck then due date, 3 ascending intervals, 4 descending intervals, 5
# ascending ease (descending difficulty), 6 descending ease (ascending
# difficulty), 7 ascending retrievability, 11 descending retrievability, 12
# relative overdueness, 9 order added, 10 reverse order added, 8 random. Then
# the next day: the random order of the cards already due stays.
id: sched/queue/order/review-orders
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  presets:
    - {name: Default, new_per_day: 0, reviews_per_day: 200}
  decks: ["Lang::b", "Lang::A", Lang]
  notetypes:
    - name: Card
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
    - {notetype: Card, deck: "Lang", fields: [r1, a]}
    - {notetype: Card, deck: "Lang::b", fields: [r2, a]}
    - {notetype: Card, deck: "Lang::A", fields: [r3, a]}
    - {notetype: Card, deck: "Lang", fields: [r4, a]}
    - {notetype: Card, deck: "Lang::b", fields: [r5, a]}
    - {notetype: Card, deck: "Lang::A", fields: [r6, a]}
    - {notetype: Card, deck: "Lang", fields: [r7, a]}
    - {notetype: Card, deck: "Lang::b", fields: [r8, a]}
    - {notetype: Card, deck: "Lang::A", fields: [r9, a]}
    - {notetype: Card, deck: "Lang", fields: [r10, a]}
    - {notetype: Card, deck: "Lang::b", fields: [r11, a]}
    - {notetype: Card, deck: "Lang::A", fields: [r12, a]}
    - {notetype: Card, deck: "Lang", fields: [r13, a]}
    - {notetype: Card, deck: "Lang::b", fields: [r14, a]}
    - {notetype: Card, deck: "Lang::A", fields: [r15, a]}
