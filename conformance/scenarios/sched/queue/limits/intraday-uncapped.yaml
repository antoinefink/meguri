# Intraday learning is never limited (R609; specs/sched/limits.md L4). Default
# allows 0 new cards and 0 reviews. Lang holds intraday learning cards due 10
# minutes ago (#c1), in 10 minutes (#c2) and in 40 minutes (#c3), an interday
# learning card due today (#c4), a review due today (#c5) and a new card (#c6).
# The queue shows #c1 now and #c2 inside the 20-minute learn-ahead limit;
# nothing else.
id: sched/queue/limits/intraday-uncapped
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true}
  presets:
    - {name: Default, new_per_day: 0, reviews_per_day: 0}
  decks: [Lang]
  notetypes:
    - name: Card
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
    - {notetype: Card, deck: Lang, fields: [i1, a]}
    - {notetype: Card, deck: Lang, fields: [i2, a]}
    - {notetype: Card, deck: Lang, fields: [i3, a]}
    - {notetype: Card, deck: Lang, fields: [d1, a]}
    - {notetype: Card, deck: Lang, fields: [r1, a]}
    - {notetype: Card, deck: Lang, fields: [n1, a]}
steps:
  - db_exec:
      sql: |
        UPDATE cards SET type = v.column2, queue = v.column3, due = v.column4, ivl = v.column5, reps = v.column6, left = v.column7
        FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n FROM cards) AS c
        JOIN (VALUES
          (1, 1, 1, 1894701000, 0, 2, 1),
          (2, 1, 1, 1894702200, 0, 1, 2),
          (3, 3, 1, 1894704000, 0, 4, 1),
          (4, 1, 3, 0, 0, 2, 1),
          (5, 2, 2, 0, 3, 3, 0)
        ) AS v ON v.column1 = c.n
        WHERE cards.id = c.cid
  - set_current_deck: {deck: Lang}
  - observe: [queue, deck_counts, congrats]
