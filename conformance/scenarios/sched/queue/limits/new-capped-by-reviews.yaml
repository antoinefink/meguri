# New cards also use up the review limit (R608; specs/sched/limits.md L2, L4).
# Default allows 20 new cards and 10 reviews. Lang holds 6 reviews due today
# and 15 new cards. Reviews are taken first, so 4 new cards fit; after 3 new
# cards were studied today only 1 fits; with "New cards ignore review limit"
# on, all 15 do.
id: sched/queue/limits/new-capped-by-reviews
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true, newCardsIgnoreReviewLimit: false}
  presets:
    - {name: Default, new_per_day: 20, reviews_per_day: 10}
  decks: [Lang]
  notetypes:
    - name: Card
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
    - {notetype: Card, deck: Lang, fields: [r1, a]}
    - {notetype: Card, deck: Lang, fields: [r2, a]}
    - {notetype: Card, deck: Lang, fields: [r3, a]}
    - {notetype: Card, deck: Lang, fields: [r4, a]}
    - {notetype: Card, deck: Lang, fields: [r5, a]}
    - {notetype: Card, deck: Lang, fields: [r6, a]}
    - {notetype: Card, deck: Lang, fields: [n1, a]}
    - {notetype: Card, deck: Lang, fields: [n2, a]}
    - {notetype: Card, deck: Lang, fields: [n3, a]}
    - {notetype: Card, deck: Lang, fields: [n4, a]}
    - {notetype: Card, deck: Lang, fields: [n5, a]}
    - {notetype: Card, deck: Lang, fields: [n6, a]}
    - {notetype: Card, deck: Lang, fields: [n7, a]}
    - {notetype: Card, deck: Lang, fields: [n8, a]}
    - {notetype: Card, deck: Lang, fields: [n9, a]}
    - {notetype: Card, deck: Lang, fields: [n10, a]}
    - {notetype: Card, deck: Lang, fields: [n11, a]}
    - {notetype: Card, deck: Lang, fields: [n12, a]}
    - {notetype: Card, deck: Lang, fields: [n13, a]}
    - {notetype: Card, deck: Lang, fields: [n14, a]}
    - {notetype: Card, deck: Lang, fields: [n15, a]}
steps:
  - db_exec:
      sql: |
        UPDATE cards SET type = 2, queue = 2, due = 0, ivl = v.column2, reps = 3
        FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n FROM cards) AS c
        JOIN (VALUES (1, 3), (2, 4), (3, 5), (4, 6), (5, 7), (6, 8)) AS v ON v.column1 = c.n
        WHERE cards.id = c.cid
  - legacy_update: {preset: Default, patch: {reviewOrder: 3, newMix: 1}}
  - set_current_deck: {deck: Lang}
  - observe: [queue, deck_counts]
  - legacy_update: {deck: Lang, patch: {newToday: [0, 3]}}
  - set_current_deck: {deck: Lang}
  - observe: [queue, deck_counts]
  - set_config: {key: newCardsIgnoreReviewLimit, value: true}
  - set_current_deck: {deck: Default}
  - set_current_deck: {deck: Lang}
  - observe: [queue, deck_counts]
