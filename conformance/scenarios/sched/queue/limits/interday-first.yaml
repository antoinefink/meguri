# Interday learning shares the review limit and is taken before reviews; new
# cards are capped by the reviews left unless "New cards ignore review limit"
# is on (R608, R609, R610; specs/sched/limits.md L4, specs/sched/queue-building.md
# B4). Default allows 4 reviews and 20 new cards a day. Lang holds 3 interday
# learning cards due today or earlier (#c1 to #c3), 3 reviews due today (#c4 to
# #c6), 2 intraday learning cards due a minute ago (#c7, #c8) and 3 new cards.
# Interday learning is shown before reviews (interday learning/review order
# 2); reviews sort by ascending interval.
id: sched/queue/limits/interday-first
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true, newCardsIgnoreReviewLimit: false}
  presets:
    - {name: Default, new_per_day: 20, reviews_per_day: 4}
  decks: [Lang]
  notetypes:
    - name: Card
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
    - {notetype: Card, deck: Lang, fields: [d1, a]}
    - {notetype: Card, deck: Lang, fields: [d2, a]}
    - {notetype: Card, deck: Lang, fields: [d3, a]}
    - {notetype: Card, deck: Lang, fields: [r1, a]}
    - {notetype: Card, deck: Lang, fields: [r2, a]}
    - {notetype: Card, deck: Lang, fields: [r3, a]}
    - {notetype: Card, deck: Lang, fields: [i1, a]}
    - {notetype: Card, deck: Lang, fields: [i2, a]}
    - {notetype: Card, deck: Lang, fields: [n1, a]}
    - {notetype: Card, deck: Lang, fields: [n2, a]}
    - {notetype: Card, deck: Lang, fields: [n3, a]}
steps:
  - db_exec:
      sql: |
        UPDATE cards SET type = v.column2, queue = v.column3, due = v.column4, ivl = v.column5, reps = v.column6, left = v.column7
        FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n FROM cards) AS c
        JOIN (VALUES
          (1, 1, 3, -2, 0, 2, 1),
          (2, 1, 3, -1, 0, 2, 1),
          (3, 3, 3, 0, 0, 5, 1),
          (4, 2, 2, 0, 3, 3, 0),
          (5, 2, 2, 0, 4, 3, 0),
          (6, 2, 2, 0, 5, 3, 0),
          (7, 1, 1, 1894701540, 0, 1, 2),
          (8, 3, 1, 1894701540, 0, 6, 1)
        ) AS v ON v.column1 = c.n
        WHERE cards.id = c.cid
  - legacy_update: {preset: Default, patch: {reviewOrder: 3, interdayLearningMix: 2}}
  - set_current_deck: {deck: Lang}
  - observe: [queue, deck_counts]
  - set_config: {key: newCardsIgnoreReviewLimit, value: true}
  - set_current_deck: {deck: Default}
  - set_current_deck: {deck: Lang}
  - observe: [queue, deck_counts]
