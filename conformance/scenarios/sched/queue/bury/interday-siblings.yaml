# Burying interday learning siblings while gathering (R630;
# specs/sched/queue-building.md B5). Default has "Bury interday learning
# siblings" on and the others off.
#   n1: #c1 intraday learning, #c2 interday learning -> #c1 only
#   n2: #c3, #c4 interday learning due days -1 and 0 -> #c3 only
#   n3: #c5 interday learning, #c6 review           -> both
#   n4: #c7 review, #c8 new                         -> both
id: sched/queue/bury/interday-siblings
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true}
  presets:
    - {name: Default, new_per_day: 20, reviews_per_day: 200, bury_interday_learning: true}
  decks: [Lang]
  notetypes:
    - name: Duo
      fields: [A, B]
      templates:
        - {name: One, front: "{{A}}", back: "{{A}}"}
        - {name: Two, front: "{{B}}", back: "{{B}}"}
  notes:
    - {notetype: Duo, deck: Lang, fields: [n1a, n1b]}
    - {notetype: Duo, deck: Lang, fields: [n2a, n2b]}
    - {notetype: Duo, deck: Lang, fields: [n3a, n3b]}
    - {notetype: Duo, deck: Lang, fields: [n4a, n4b]}
steps:
  - db_exec:
      sql: |
        UPDATE cards SET type = v.column2, queue = v.column3, due = v.column4, ivl = v.column5, reps = v.column6, left = v.column7
        FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n FROM cards) AS c
        JOIN (VALUES (1, 1, 1, 1894701600, 0, 1, 1), (2, 1, 3, 0, 0, 1, 1), (3, 1, 3, -1, 0, 1, 1), (4, 1, 3, 0, 0, 1, 1),
                     (5, 1, 3, 0, 0, 1, 1), (6, 2, 2, 0, 5, 3, 0), (7, 2, 2, 0, 6, 3, 0)) AS v ON v.column1 = c.n
        WHERE cards.id = c.cid
  - legacy_update: {preset: Default, patch: {reviewOrder: 3}}
  - set_current_deck: {deck: Lang}
  - observe: [queue, deck_counts]
