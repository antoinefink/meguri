# New cards mixed with reviews (R619; specs/sched/orders.md O5). Lang holds 7
# reviews due on days -6 to 0 (#c1 to #c7, shown in that order) and 3 new
# cards (#c8 to #c10). New/review order 0 spreads the new cards evenly among
# the reviews; 1 shows them after the reviews; 2 before.
id: sched/queue/mix/new-review
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true}
  decks: [Lang]
  notetypes:
    - name: Card
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
    - {notetype: Card, deck: Lang, fields: [r1, a]}
    - {notetype: Card, deck: Lang, fields: [r2, a]}
    - {notetype: Card, deck: Lang, fields: [r3, a]}
    - {notetype: Card, deck: Lang, fields: [r4, a]}
    - {notetype: Card, deck: Lang, fields: [r5, a]}
    - {notetype: Card, deck: Lang, fields: [r6, a]}
    - {notetype: Card, deck: Lang, fields: [r7, a]}
    - {notetype: Card, deck: Lang, fields: [n1, a]}
    - {notetype: Card, deck: Lang, fields: [n2, a]}
    - {notetype: Card, deck: Lang, fields: [n3, a]}
steps:
  - db_exec:
      sql: |
        UPDATE cards SET type = 2, queue = 2, due = v.column2, ivl = 5, reps = 3
        FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n FROM cards) AS c
        JOIN (VALUES (1, -6), (2, -5), (3, -4), (4, -3), (5, -2), (6, -1), (7, 0)) AS v ON v.column1 = c.n
        WHERE cards.id = c.cid
  - legacy_update: {preset: Default, patch: {newMix: 0}}
  - set_current_deck: {deck: Lang}
  - observe: [queue]
  - legacy_update: {preset: Default, patch: {newMix: 1}}
  - observe: [queue]
  - legacy_update: {preset: Default, patch: {newMix: 2}}
  - observe: [queue]
