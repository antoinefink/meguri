    - {notetype: Card, deck: G, fields: [gn3, a]}
    - {notetype: Card, deck: G, fields: [gn4, a]}
    - {notetype: Card, deck: H, fields: [hr1, a]}
    - {notetype: Card, deck: H, fields: [hr2, a]}
    - {notetype: Card, deck: H, fields: [hr3, a]}
