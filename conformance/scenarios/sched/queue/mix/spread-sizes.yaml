steps:
  - db_exec:
      sql: |
        UPDATE cards SET type = 2, queue = 2, due = v.column2, ivl = 5, reps = 3
        FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n FROM cards) AS c
        JOIN (VALUES (1, -3), (2, -2), (3, -1), (7, -3), (8, -2), (9, -1), (12, -3), (13, -2), (14, -1), (21, -3), (22, -2), (23, -1), (32, -10), (33, -9), (34, -8), (35, -7), (36, -6), (37, -5), (38, -4), (39, -3), (40, -2), (41, -1), (43, -1), (58, -4), (59, -3), (60, -2), (61, -1)) AS v ON v.column1 = c.n
        WHERE cards.id = c.cid
  - set_current_deck: {deck: A}
  - observe: [queue]
  - set_current_deck: {deck: B}
  - observe: [queue]
  - set_current_deck: {deck: C}
  - observe: [queue]
  - set_current_deck: {deck: D}
  - observe: [queue]
  - set_current_deck: {deck: E}
  - observe: [queue]
  - set_current_deck: {deck: F}
  - observe: [queue]
  - set_current_deck: {deck: G}
  - observe: [queue]
  - set_current_deck: {deck: H}
  - observe: [queue]
