# The even spreading of new cards among reviews for several sizes (R619;
# specs/sched/orders.md O5, O8). Each deck holds reviews due on consecutive
# past days (shown oldest first) followed by new cards: A 3 and 3, B 3 and 2,
# C 3 and 6, D 3 and 8, E 10 and 1, F 1 and 10, G none and 4, H 4 and none.
# The same rule spreads interday learning among reviews.
id: sched/queue/mix/spread-sizes
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true}
  presets:
    - {name: Default, new_per_day: 20, reviews_per_day: 200}
  decks: [A, B, C, D, E, F, G, H]
  notetypes:
    - name: Card
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
    - {notetype: Card, deck: A, fields: [ar1, a]}
    - {notetype: Card, deck: A, fields: [ar2, a]}
    - {notetype: Card, deck: A, fields: [ar3, a]}
    - {notetype: Card, deck: A, fields: [an1, a]}
    - {notetype: Card, deck: A, fields: [an2, a]}
    - {notetype: Card, deck: A, fields: [an3, a]}
    - {notetype: Card, deck: B, fields: [br1, a]}
    - {notetype: Card, deck: B, fields: [br2, a]}
    - {notetype: Card, deck: B, fields: [br3, a]}
    - {notetype: Card, deck: B, fields: [bn1, a]}
    - {notetype: Card, deck: B, fields: [bn2, a]}
    - {notetype: Card, deck: C, fields: [cr1, a]}
    - {notetype: Card, deck: C, fields: [cr2, a]}
    - {notetype: Card, deck: C, fields: [cr3, a]}
    - {notetype: Card, deck: C, fields: [cn1, a]}
    - {notetype: Card, deck: C, fields: [cn2, a]}
    - {notetype: Card, deck: C, fields: [cn3, a]}
    - {notetype: Card, deck: C, fields: [cn4, a]}
    - {notetype: Card, deck: C, fields: [cn5, a]}
    - {notetype: Card, deck: C, fields: [cn6, a]}
    - {notetype: Card, deck: D, fields: [dr1, a]}
    - {notetype: Card, deck: D, fields: [dr2, a]}
    - {notetype: Card, deck: D, fields: [dr3, a]}
    - {notetype: Card, deck: D, fields: [dn1, a]}
    - {notetype: Card, deck: D, fields: [dn2, a]}
    - {notetype: Card, deck: D, fields: [dn3, a]}
    - {notetype: Card, deck: D, fields: [dn4, a]}
    - {notetype: Card, deck: D, fields: [dn5, a]}
    - {notetype: Card, deck: D, fields: [dn6, a]}
    - {notetype: Card, deck: D, fields: [dn7, a]}
    - {notetype: Card, deck: D, fields: [dn8, a]}
    - {notetype: Card, deck: E, fields: [er1, a]}
    - {notetype: Card, deck: E, fields: [er2, a]}
    - {notetype: Card, deck: E, fields: [er3, a]}
    - {notetype: Card, deck: E, fields: [er4, a]}
    - {notetype: Card, deck: E, fields: [er5, a]}
    - {notetype: Card, deck: E, fields: [er6, a]}
    - {notetype: Card, deck: E, fields: [er7, a]}
    - {notetype: Card, deck: E, fields: [er8, a]}
    - {notetype: Card, deck: E, fields: [er9, a]}
    - {notetype: Card, deck: E, fields: [er10, a]}
    - {notetype: Card, deck: E, fields: [en1, a]}
    - {notetype: Card, deck: F, fields: [fr1, a]}
    - {notetype: Card, deck: F, fields: [fn1, a]}
    - {notetype: Card, deck: F, fields: [fn2, a]}
    - {notetype: Card, deck: F, fields: [fn3, a]}
    - {notetype: Card, deck: F, fields: [fn4, a]}
