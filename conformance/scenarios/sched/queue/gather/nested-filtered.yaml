# A filtered deck inside the studied deck (R612, R706, R707;
# specs/sched/queue-building.md B2.2, deviation queue-nested-filtered-deck).
# Lang::Cram is a filtered deck holding, from Lang: a review due today (#c3),
# a new card (#c4), an interday learning card due today (#c5) and a
# preview-repeat card (queue 4) due a minute ago (#c6). Anki gathers all four
# when Lang is studied; Meguri gathers none (it does not study filtered decks)
# and its queue is #c1 (review due yesterday), #c7 (new), #c2 (review due
# today). The deck list counts them under Lang::Cram and Lang on both.
id: sched/queue/gather/nested-filtered
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true}
  decks: [Lang]
  notetypes:
    - name: Card
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
    - {notetype: Card, deck: Lang, fields: [c1, a]}
    - {notetype: Card, deck: Lang, fields: [c2, a]}
    - {notetype: Card, deck: Lang, fields: [c3, a]}
    - {notetype: Card, deck: Lang, fields: [c4, a]}
    - {notetype: Card, deck: Lang, fields: [c5, a]}
    - {notetype: Card, deck: Lang, fields: [c6, a]}
    - {notetype: Card, deck: Lang, fields: [c7, a]}
steps:
  - db_exec:
      sql: |
        UPDATE cards SET type = v.column2, queue = v.column3, due = v.column4, ivl = v.column5, reps = v.column6, left = v.column7
        FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n FROM cards) AS c
        JOIN (VALUES
          (1, 2, 2, -1, 5, 3, 0),
          (2, 2, 2, 0, 6, 3, 0),
          (3, 2, 2, 0, 7, 3, 0),
          (5, 1, 3, 0, 0, 1, 1),
          (6, 1, 4, 1894701540, 0, 1, 0)
        ) AS v ON v.column1 = c.n
        WHERE cards.id = c.cid
  - db_exec:
      sql: "INSERT INTO decks (id, name, mtime_secs, usn, common, kind) VALUES (900, 'Lang' || char(31) || 'Cram', 0, 0, X'08011001', X'12130801120a0a066465636b3a78106428d804383c')"
  # #c3 to #c6 move to Lang::Cram as building it would leave them: home deck
  # in odid; the new card's position in odue and due -100000 + position.
  - db_exec:
      sql: |
        UPDATE cards SET odid = did, did = 900, odue = due,
          due = CASE WHEN queue = 0 THEN -100000 + due ELSE due END
        WHERE id IN (SELECT id FROM cards ORDER BY id LIMIT 4 OFFSET 2)
  - set_current_deck: {deck: Lang}
  - observe: [queue, deck_counts]
