# R596 (specs/sched/day-clock.md D11): a collection created at 03:30 local
# starts its day 0 at the previous day's 04:00. Then a day count clamped at 0
# before crt, computed afresh after a reopen.
id: sched/day/creation-before-rollover
clock: {tz: Europe/Paris, start: "2030-01-15T03:30:00", mode: step}
steps:
  - observe: [timing]
  - db_exec: {sql: "SELECT crt FROM col"}
  - db_exec: {sql: "SELECT KEY, usn, mtime_secs, CAST(val AS TEXT) FROM config WHERE KEY IN ('creationOffset', 'lastUnburied', 'localOffset', 'rollover') ORDER BY KEY"}
  - set_clock: "2030-01-15T03:59:59"
  - observe: [timing]
  - advance: 1s
  - observe: [timing]
  - set_clock: "2030-01-12T10:00:00"
  - reopen: {}
  - observe: [timing]
