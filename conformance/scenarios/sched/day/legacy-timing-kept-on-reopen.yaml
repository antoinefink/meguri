# R595 (D4, D12.3): a legacy collection (no creationOffset) whose crt is
# 2030-01-14 23:30 CET, studied in summer (+02:00). Opening it again does not
# change its timing mode in Meguri. Anki's desktop layer adds creationOffset
# (the offset at crt, -60) when it opens such a collection, which moves the
# day count from 138 to 139. Deviation legacy-timing-kept-on-reopen-* in
# conformance/deviations.yaml.
id: sched/day/legacy-timing-kept-on-reopen
clock: {tz: Europe/Paris, start: "2030-06-01T10:00:00", mode: step}
steps:
  - observe: [timing]
  - db_exec: {sql: "DELETE FROM config WHERE KEY = 'creationOffset'"}
  - db_exec: {sql: "UPDATE col SET crt = 1894660200"}
  - set_clock: "2030-06-02T10:00:00"
  - observe: [timing]
  - db_exec: {sql: "SELECT KEY, usn, mtime_secs, CAST(val AS TEXT) FROM config WHERE KEY IN ('creationOffset', 'lastUnburied', 'localOffset', 'rollover') ORDER BY KEY"}
  - reopen: {}
  - observe: [timing]
  - db_exec: {sql: "SELECT KEY, usn, mtime_secs, CAST(val AS TEXT) FROM config WHERE KEY IN ('creationOffset', 'lastUnburied', 'localOffset', 'rollover') ORDER BY KEY"}
