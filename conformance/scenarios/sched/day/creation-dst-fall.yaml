# R596 (D11): created at 03:30 CET, after Paris moved its clocks back. crt is
# the previous day's 04:00 taken with +01:00, an instant at which the offset
# was +02:00, so creationOffset is -120.
id: sched/day/creation-dst-fall
clock: {tz: Europe/Paris, start: "2030-10-27T03:30:00", mode: step}
steps:
  - observe: [timing]
  - db_exec: {sql: "SELECT crt FROM col"}
  - db_exec: {sql: "SELECT KEY, usn, mtime_secs, CAST(val AS TEXT) FROM config WHERE KEY IN ('creationOffset', 'lastUnburied', 'localOffset', 'rollover') ORDER BY KEY"}
  - set_clock: "2030-10-27T03:59:59"
  - observe: [timing]
  - advance: 1s
  - observe: [timing]
