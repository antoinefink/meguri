id: sched/answer/custom-data
clock:
  tz: UTC
  start: '2030-01-15T10:00:00'
setup:
  config:
    fsrs: true
    loadBalancerEnabled: false
  decks:
  - X0038
  notetypes:
  - name: X0152
    fields:
    - X0032
    - A0010
    templates:
    - name: X0059
      front: '{{X0032}}'
      back: '{{A0010}}'
  notes:
  - notetype: X0152
    deck: X0038
    fields:
    - x0031
    - x0052
  - notetype: X0152
    deck: X0038
    fields:
    - x0044
    - x0145
steps:
- observe:
  - timing
- db_exec:
    sql: UPDATE cards SET data = '{"cd":"{\"src\":\"other client\", \"n\":1}"}' WHERE nid = (SELECT id FROM notes
      WHERE sfld = 'x0031')
- db_exec:
    sql: UPDATE cards SET type = 2, queue = 2, ivl = 4, due = 0, factor = 2500, reps = 3, data = '{"s":4.5,"d":5.0,"lrt":1894356000,"cd":"{\"a_long_key\":\"0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789\"}"}'
      WHERE nid = (SELECT id FROM notes WHERE sfld = 'x0044')
- db_exec:
    sql: SELECT data FROM cards ORDER BY id
- advance: 1h
- answer:
    card: '#c1'
    rating: good
    time_ms: 2000
- answer:
    card: '#c2'
    rating: good
    time_ms: 2000
- db_exec:
    sql: SELECT data FROM cards ORDER BY id
- observe:
  - 'card(#c1, #c2)'
