# Histories without a learning row, as SM-2-era collections and truncated
# imports have them (specs/sched/fsrs-items.md I4, I6; R650, R689): the first
# graded interday row gives a starting state through the SM-2 conversion with
# the preset's historical retention, and the rows after it are replayed.
# States are observed with historical retention 0.9 (the default), then 0.8.
# H without its learning rows:
#   2025-10-02T10:00:00     type 1 ease 3 ivl      3 lastIvl      1 factor 2500
#   2025-10-05T10:00:00     type 1 ease 3 ivl      9 lastIvl      3 factor 2500
#   2025-10-14T10:00:00     type 1 ease 1 ivl   -600 lastIvl      9 factor 2300
#   2025-10-14T10:10:00     type 2 ease 3 ivl      2 lastIvl   -600 factor 2300
#   2025-10-16T10:00:00     type 1 ease 3 ivl      6 lastIvl      2 factor 2300
#   2025-10-22T10:00:00     type 1 ease 4 ivl     20 lastIvl      6 factor 2450
#   2025-11-11T10:00:00     type 1 ease 2 ivl     25 lastIvl     20 factor 2300
# c1: H without its learning rows; starts from the 3-day row.
# c2: one review row (100 days, factor 2500): the starting state alone.
# c3: no review log, the card 100 days, factor 2500: the card's own SM-2
#     values give the same current state as c2.
# c4: c2 with factor 0, which reads as 2500: the same state as c2.
# c5: c2 with factor 820, a difficulty FSRS wrote: difficulty 7.48.
# c6: graded rows within a day first (Again, ivl -600 s), then interday ones:
#     the history starts at the first interday one, so c6 has the memory states of c7.
# c7: c6 without its first row.
# c8: the first graded row is a 2-day step stored as -172800 s: interday,
#     with an interval of 1 day for the conversion.
id: sched/memory/sm2-history
clock: {tz: UTC, start: "2026-03-02T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Pair, fields: [one, back]}
    - {notetype: Pair, fields: [two, back]}
    - {notetype: Pair, fields: [three, back]}
    - {notetype: Pair, fields: [four, back]}
    - {notetype: Pair, fields: [five, back]}
    - {notetype: Pair, fields: [six, back]}
    - {notetype: Pair, fields: [seven, back]}
    - {notetype: Pair, fields: [eight, back]}
steps:
  # c1: H without its learning rows
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759399200001, 3, 3, 1, 2500, 1), (1759658400001, 3, 9, 3, 2500, 1), (1760436000001, 1, -600, 9, 2300, 1), (1760436600001, 3, 2, -600, 2300, 2), (1760608800001, 3, 6, 2, 2300, 1), (1761127200001, 4, 20, 6, 2450, 1), (1762855200001, 2, 25, 20, 2300, 1)) AS v"
  # c2: one review row, 100 days, factor 2500
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1)"
      params: [2, 2, 14, 100, 2500, 1, 0, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1762855200002, 3, 100, 40, 2500, 1)) AS v"
  # c3: no review log; the card itself: 100 days, factor 2500
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2)"
      params: [2, 2, 14, 100, 2500, 1, 0, 0, "{}"]
  # c4: one review row, factor 0
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 3)"
      params: [2, 2, 14, 100, 0, 1, 0, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 3), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1762855200004, 3, 100, 40, 0, 1)) AS v"
  # c5: one review row, factor 820 (a difficulty written by FSRS)
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 4)"
      params: [2, 2, 14, 100, 820, 1, 0, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 4), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1762855200005, 3, 100, 40, 820, 1)) AS v"
  # c6: first graded rows within a day, then interday ones
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 5)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 5), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1760436000006, 1, -600, 9, 2300, 1), (1760436600006, 3, 2, -600, 2300, 2), (1760608800006, 3, 6, 2, 2300, 1), (1761127200006, 4, 20, 6, 2450, 1), (1762855200006, 2, 25, 20, 2300, 1)) AS v"
  # c7: the same from the 2-day relearning row on
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 6)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 6), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1760436600007, 3, 2, -600, 2300, 2), (1760608800007, 3, 6, 2, 2300, 1), (1761127200007, 4, 20, 6, 2450, 1), (1762855200007, 2, 25, 20, 2300, 1)) AS v"
  # c8: first graded row a 2-day step stored in seconds
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 7)"
      params: [2, 2, -86, 25, 2500, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 7), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1762682400008, 3, -172800, -600, 2500, 2), (1762855200008, 3, 25, 2, 2500, 1)) AS v"
  - observe: ["next_states(#c1, #c2, #c3, #c4, #c5, #c6, #c7, #c8)"]
  # Historical retention 0.9 (the default) -> 0.8.
  - legacy_update: {preset: Default, patch: {sm2Retention: 0.8}}
  - observe: ["next_states(#c1, #c2, #c3, #c4, #c5, #c6, #c7, #c8)"]
