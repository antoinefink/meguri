# Rows that do not count (specs/sched/fsrs-items.md I2; R685): manual rows
# (set due date, type 4) and rescheduled rows (type 5) have no button, and
# cram rows (type 3 with factor 0) are filtered-deck reviews that did not
# reschedule. A filtered-deck row with a factor (an early review that did
# reschedule) counts like a review.
# H as in sched/memory/on-the-fly. Added rows:
#   2025-10-07T10:00:00     type 4 ease 0 ivl      5 lastIvl      9 factor 2500
#   2025-10-18T10:00:00     type 5 ease 0 ivl      8 lastIvl      6 factor 2300
#   2025-10-20T10:00:00     type 3 ease 3 ivl      0 lastIvl      0 factor    0
#   2025-11-01T10:00:00     type 3 ease 3 ivl     22 lastIvl     20 factor 2450
# c1: H with all four: only the early review counts, so c1 has the memory
#     states of c2.
# c2: H with the early review only.
# c3: H with a cram row between its learning rows (09:05): the cram row is
#     not part of anything, so c3 has the memory states of c4.
# c4: H.
# c5: H with a set-due-date row between its learning rows (09:05, type 4,
#     factor 2500): it ends the run of learning rows, so the history starts
#     at the second one: c5 has the memory states of c6.
# c6: H without its first learning row.
id: sched/memory/skipped-rows
clock: {tz: UTC, start: "2026-03-02T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Pair, fields: [one, back]}
    - {notetype: Pair, fields: [two, back]}
    - {notetype: Pair, fields: [three, back]}
    - {notetype: Pair, fields: [four, back]}
    - {notetype: Pair, fields: [five, back]}
    - {notetype: Pair, fields: [six, back]}
steps:
  # c1: H with a set-due-date, a rescheduled, a cram and an early filtered row
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200001, 3, -600, -60, 0, 0), (1759309800001, 3, 1, -600, 2500, 0), (1759399200001, 3, 3, 1, 2500, 1), (1759658400001, 3, 9, 3, 2500, 1), (1759831200001, 0, 5, 9, 2500, 4), (1760436000001, 1, -600, 9, 2300, 1), (1760436600001, 3, 2, -600, 2300, 2), (1760608800001, 3, 6, 2, 2300, 1), (1760781600001, 0, 8, 6, 2300, 5), (1760954400001, 3, 0, 0, 0, 3), (1761127200001, 4, 20, 6, 2450, 1), (1761991200001, 3, 22, 20, 2450, 3), (1762855200001, 2, 25, 20, 2300, 1)) AS v"
  # c2: H with the early filtered row only
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200002, 3, -600, -60, 0, 0), (1759309800002, 3, 1, -600, 2500, 0), (1759399200002, 3, 3, 1, 2500, 1), (1759658400002, 3, 9, 3, 2500, 1), (1760436000002, 1, -600, 9, 2300, 1), (1760436600002, 3, 2, -600, 2300, 2), (1760608800002, 3, 6, 2, 2300, 1), (1761127200002, 4, 20, 6, 2450, 1), (1761991200002, 3, 22, 20, 2450, 3), (1762855200002, 2, 25, 20, 2300, 1)) AS v"
  # c3: H with a cram row between its two learning rows
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200003, 3, -600, -60, 0, 0), (1759309500003, 3, 0, 0, 0, 3), (1759309800003, 3, 1, -600, 2500, 0), (1759399200003, 3, 3, 1, 2500, 1), (1759658400003, 3, 9, 3, 2500, 1), (1760436000003, 1, -600, 9, 2300, 1), (1760436600003, 3, 2, -600, 2300, 2), (1760608800003, 3, 6, 2, 2300, 1), (1761127200003, 4, 20, 6, 2450, 1), (1762855200003, 2, 25, 20, 2300, 1)) AS v"
  # c4: H
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 3)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 3), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200004, 3, -600, -60, 0, 0), (1759309800004, 3, 1, -600, 2500, 0), (1759399200004, 3, 3, 1, 2500, 1), (1759658400004, 3, 9, 3, 2500, 1), (1760436000004, 1, -600, 9, 2300, 1), (1760436600004, 3, 2, -600, 2300, 2), (1760608800004, 3, 6, 2, 2300, 1), (1761127200004, 4, 20, 6, 2450, 1), (1762855200004, 2, 25, 20, 2300, 1)) AS v"
  # c5: H with a set-due-date row between its two learning rows
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 4)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 4), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200005, 3, -600, -60, 0, 0), (1759309500005, 0, 1, -600, 2500, 4), (1759309800005, 3, 1, -600, 2500, 0), (1759399200005, 3, 3, 1, 2500, 1), (1759658400005, 3, 9, 3, 2500, 1), (1760436000005, 1, -600, 9, 2300, 1), (1760436600005, 3, 2, -600, 2300, 2), (1760608800005, 3, 6, 2, 2300, 1), (1761127200005, 4, 20, 6, 2450, 1), (1762855200005, 2, 25, 20, 2300, 1)) AS v"
  # c6: H without its first learning row
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 5)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 5), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309800006, 3, 1, -600, 2500, 0), (1759399200006, 3, 3, 1, 2500, 1), (1759658400006, 3, 9, 3, 2500, 1), (1760436000006, 1, -600, 9, 2300, 1), (1760436600006, 3, 2, -600, 2300, 2), (1760608800006, 3, 6, 2, 2300, 1), (1761127200006, 4, 20, 6, 2450, 1), (1762855200006, 2, 25, 20, 2300, 1)) AS v"
  - observe: ["next_states(#c1, #c2, #c3, #c4, #c5, #c6)"]
