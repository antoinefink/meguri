# Rows no Anki client writes, which other tools can leave (specs/sched/
# fsrs-items.md I2): the classes go by ease, type and factor alone.
# H as in sched/memory/on-the-fly; L as in sched/memory/reset.
# c1: H whose first learning row is stored with type 7, an unknown kind,
#     which reads as 0 (learning, specs/model/row-records.md R5): c1 has
#     the memory states of c2.
# c2: H.
# c3: H with a type-4 row that has a button (2025-11-01, ease 3, factor
#     2450): it counts as a graded review, so c3 has the memory states of c4.
# c4: H with the same row stored as a review (type 1).
# c5: H with a type-0 row without a button (09:05, ease 0) between its
#     learning rows: it ends the run of learning rows, so c5 has the memory
#     states of c6.
# c6: H without its first learning row.
# c7: H, a Reset row (type 4, factor 0) that has ease 3, then L: it is a
#     Reset marker all the same, so c7 has the memory states of c8.
# c8: L alone.
id: sched/memory/crafted-rows
clock: {tz: UTC, start: "2026-03-02T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Pair, fields: [one, back]}
    - {notetype: Pair, fields: [two, back]}
    - {notetype: Pair, fields: [three, back]}
    - {notetype: Pair, fields: [four, back]}
    - {notetype: Pair, fields: [five, back]}
    - {notetype: Pair, fields: [six, back]}
    - {notetype: Pair, fields: [seven, back]}
    - {notetype: Pair, fields: [eight, back]}
steps:
  # c1: H with its first learning row stored as type 7
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200001, 3, -600, -60, 0, 7), (1759309800001, 3, 1, -600, 2500, 0), (1759399200001, 3, 3, 1, 2500, 1), (1759658400001, 3, 9, 3, 2500, 1), (1760436000001, 1, -600, 9, 2300, 1), (1760436600001, 3, 2, -600, 2300, 2), (1760608800001, 3, 6, 2, 2300, 1), (1761127200001, 4, 20, 6, 2450, 1), (1762855200001, 2, 25, 20, 2300, 1)) AS v"
  # c2: H
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200002, 3, -600, -60, 0, 0), (1759309800002, 3, 1, -600, 2500, 0), (1759399200002, 3, 3, 1, 2500, 1), (1759658400002, 3, 9, 3, 2500, 1), (1760436000002, 1, -600, 9, 2300, 1), (1760436600002, 3, 2, -600, 2300, 2), (1760608800002, 3, 6, 2, 2300, 1), (1761127200002, 4, 20, 6, 2450, 1), (1762855200002, 2, 25, 20, 2300, 1)) AS v"
  # c3: H with a type-4 row that has a button (ease 3, factor 2450)
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200003, 3, -600, -60, 0, 0), (1759309800003, 3, 1, -600, 2500, 0), (1759399200003, 3, 3, 1, 2500, 1), (1759658400003, 3, 9, 3, 2500, 1), (1760436000003, 1, -600, 9, 2300, 1), (1760436600003, 3, 2, -600, 2300, 2), (1760608800003, 3, 6, 2, 2300, 1), (1761127200003, 4, 20, 6, 2450, 1), (1761991200003, 3, 22, 20, 2450, 4), (1762855200003, 2, 25, 20, 2300, 1)) AS v"
  # c4: the same row as a review (type 1)
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 3)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 3), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200004, 3, -600, -60, 0, 0), (1759309800004, 3, 1, -600, 2500, 0), (1759399200004, 3, 3, 1, 2500, 1), (1759658400004, 3, 9, 3, 2500, 1), (1760436000004, 1, -600, 9, 2300, 1), (1760436600004, 3, 2, -600, 2300, 2), (1760608800004, 3, 6, 2, 2300, 1), (1761127200004, 4, 20, 6, 2450, 1), (1761991200004, 3, 22, 20, 2450, 1), (1762855200004, 2, 25, 20, 2300, 1)) AS v"
  # c5: H with a type-0 row without a button between its learning rows
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 4)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 4), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200005, 3, -600, -60, 0, 0), (1759309500005, 0, -600, -600, 0, 0), (1759309800005, 3, 1, -600, 2500, 0), (1759399200005, 3, 3, 1, 2500, 1), (1759658400005, 3, 9, 3, 2500, 1), (1760436000005, 1, -600, 9, 2300, 1), (1760436600005, 3, 2, -600, 2300, 2), (1760608800005, 3, 6, 2, 2300, 1), (1761127200005, 4, 20, 6, 2450, 1), (1762855200005, 2, 25, 20, 2300, 1)) AS v"
  # c6: H without its first learning row
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 5)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 5), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309800006, 3, 1, -600, 2500, 0), (1759399200006, 3, 3, 1, 2500, 1), (1759658400006, 3, 9, 3, 2500, 1), (1760436000006, 1, -600, 9, 2300, 1), (1760436600006, 3, 2, -600, 2300, 2), (1760608800006, 3, 6, 2, 2300, 1), (1761127200006, 4, 20, 6, 2450, 1), (1762855200006, 2, 25, 20, 2300, 1)) AS v"
  # c7: H, a Reset row with ease 3, then L
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 6)"
      params: [2, 2, -74, 14, 2500, 4, 0, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 6), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200007, 3, -600, -60, 0, 0), (1759309800007, 3, 1, -600, 2500, 0), (1759399200007, 3, 3, 1, 2500, 1), (1759658400007, 3, 9, 3, 2500, 1), (1760436000007, 1, -600, 9, 2300, 1), (1760436600007, 3, 2, -600, 2300, 2), (1760608800007, 3, 6, 2, 2300, 1), (1761127200007, 4, 20, 6, 2450, 1), (1762855200007, 2, 25, 20, 2300, 1), (1764576000007, 3, 0, 25, 0, 4), (1764579600007, 3, -600, -60, 0, 0), (1764580200007, 3, 1, -600, 2500, 0), (1764669600007, 3, 4, 1, 2500, 1), (1765015200007, 3, 14, 4, 2500, 1)) AS v"
  # c8: L alone
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 7)"
      params: [2, 2, -74, 14, 2500, 4, 0, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog (id, cid, usn, ease, ivl, lastIvl, factor, time, type) SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 7), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1764579600008, 3, -600, -60, 0, 0), (1764580200008, 3, 1, -600, 2500, 0), (1764669600008, 3, 4, 1, 2500, 1), (1765015200008, 3, 14, 4, 2500, 1)) AS v"
  - observe: ["next_states(#c1, #c2, #c3, #c4, #c5, #c6, #c7, #c8)"]
