# A row at exactly the cutoff instant (specs/sched/fsrs-items.md I1.3, I3,
# I4): a learning row there is not before the cutoff and still starts the
# history; a review row there is not after it and cannot be the first row of
# a history without a learning row. Observed without dates, then with
# JanFirst at 2026-01-01 and JanSecond at 2026-01-02.
# c1 (deck First, preset JanFirst):
#   2026-01-01T00:00:00     type 0 ease 3 ivl   -600 lastIvl    -60 factor    0
#   2026-01-01T00:10:00     type 0 ease 3 ivl      1 lastIvl   -600 factor 2500
#   2026-01-02T10:00:00     type 1 ease 3 ivl      4 lastIvl      1 factor 2500
#   2026-01-20T10:00:00     type 1 ease 3 ivl     15 lastIvl      4 factor 2500
#     The first row's id is 1767225600000, the cutoff itself: unchanged by the
#     date.
# c2 (deck Second, preset JanSecond):
#   2026-01-02T00:00:00     type 1 ease 3 ivl     10 lastIvl      4 factor 2500
#   2026-01-20T10:00:00     type 1 ease 3 ivl     30 lastIvl     10 factor 2500
#   2026-02-20T10:00:00     type 1 ease 3 ivl     60 lastIvl     30 factor 2500
#     The first row's id is 1767312000000, the cutoff itself: with the date,
#     the history starts at the 2026-01-20 row, so c2 then has the memory
#     states of c3.
# c3 (deck Second): c2 without its first row.
id: sched/memory/ignore-before-boundary
clock: {tz: UTC, start: "2026-03-02T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  presets: [{name: JanFirst}, {name: JanSecond}]
  decks: [{name: First, preset: JanFirst}, {name: Second, preset: JanSecond}]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Pair, deck: First, fields: [one, back]}
    - {notetype: Pair, deck: Second, fields: [two, back]}
    - {notetype: Pair, deck: Second, fields: [three, back]}
steps:
  # c1: First: a learning row at exactly 2026-01-01T00:00:00.000Z, then more
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"
      params: [2, 2, -27, 15, 2500, 4, 0, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1767225600000, 3, -600, -60, 0, 0), (1767226200001, 3, 1, -600, 2500, 0), (1767348000001, 3, 4, 1, 2500, 1), (1768903200001, 3, 15, 4, 2500, 1)) AS v"
  # c2: Second: a review row at exactly 2026-01-02T00:00:00.000Z, then two
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1)"
      params: [2, 2, 48, 60, 2500, 3, 0, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1767312000000, 3, 10, 4, 2500, 1), (1768903200002, 3, 30, 10, 2500, 1), (1771581600002, 3, 60, 30, 2500, 1)) AS v"
  # c3: Second: c2 without its first row
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2)"
      params: [2, 2, 48, 60, 2500, 3, 0, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1768903200003, 3, 30, 10, 2500, 1), (1771581600003, 3, 60, 30, 2500, 1)) AS v"
  - observe: ["next_states(#c1, #c2, #c3)"]
  - legacy_update: {preset: JanFirst, patch: {ignoreRevlogsBeforeDate: "2026-01-01"}}
  - legacy_update: {preset: JanSecond, patch: {ignoreRevlogsBeforeDate: "2026-01-02"}}
  - observe: ["next_states(#c1, #c2, #c3)"]
