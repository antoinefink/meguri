# A card that is not new and has no memory state (imported, moved, or answered
# by a client without FSRS) gets one from its review log before its states are
# computed (specs/sched/memory-state.md M2; specs/sched/fsrs-items.md; R650,
# R649). next_states shows it as the memory state of the current state;
# nothing is written until the card is answered. Load balancer off.
# H, the history of c1 to c3 (each card's row ids differ by a millisecond):
#   2025-10-01T09:00:00     type 0 ease 3 ivl   -600 lastIvl    -60 factor    0
#   2025-10-01T09:10:00     type 0 ease 3 ivl      1 lastIvl   -600 factor 2500
#   2025-10-02T10:00:00     type 1 ease 3 ivl      3 lastIvl      1 factor 2500
#   2025-10-05T10:00:00     type 1 ease 3 ivl      9 lastIvl      3 factor 2500
#   2025-10-14T10:00:00     type 1 ease 1 ivl   -600 lastIvl      9 factor 2300
#   2025-10-14T10:10:00     type 2 ease 3 ivl      2 lastIvl   -600 factor 2300
#   2025-10-16T10:00:00     type 1 ease 3 ivl      6 lastIvl      2 factor 2300
#   2025-10-22T10:00:00     type 1 ease 4 ivl     20 lastIvl      6 factor 2450
#   2025-11-11T10:00:00     type 1 ease 2 ivl     25 lastIvl     20 factor 2300
# c1: H, no memory state, no lrt: FSRS's elapsed days count from the last
#     graded row, 2025-11-11 10:00 (111 days before next_day_at, 2026-03-03
#     04:00).
# c2: as c1 with lrt 2026-02-20 10:00, which counts instead (10 days).
# c3: as c1 with a stored memory state, which is used as stored.
# c4: a learning card one step in, with the one learning row it has.
# c1 is then answered Good, which stores the state the answer gives.
id: sched/memory/on-the-fly
clock: {tz: UTC, start: "2026-03-02T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Pair, fields: [one, back]}
    - {notetype: Pair, fields: [two, back]}
    - {notetype: Pair, fields: [three, back]}
    - {notetype: Pair, fields: [four, back]}
steps:
  # c1: H, no memory state, no lrt
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 0), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200001, 3, -600, -60, 0, 0), (1759309800001, 3, 1, -600, 2500, 0), (1759399200001, 3, 3, 1, 2500, 1), (1759658400001, 3, 9, 3, 2500, 1), (1760436000001, 1, -600, 9, 2300, 1), (1760436600001, 3, 2, -600, 2300, 2), (1760608800001, 3, 6, 2, 2300, 1), (1761127200001, 4, 20, 6, 2450, 1), (1762855200001, 2, 25, 20, 2300, 1)) AS v"
  # c2: H, lrt 2026-02-20 10:00
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{\"lrt\":1771581600}"]
  - db_exec:
      sql: "INSERT INTO revlog SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 1), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200002, 3, -600, -60, 0, 0), (1759309800002, 3, 1, -600, 2500, 0), (1759399200002, 3, 3, 1, 2500, 1), (1759658400002, 3, 9, 3, 2500, 1), (1760436000002, 1, -600, 9, 2300, 1), (1760436600002, 3, 2, -600, 2300, 2), (1760608800002, 3, 6, 2, 2300, 1), (1761127200002, 4, 20, 6, 2450, 1), (1762855200002, 2, 25, 20, 2300, 1)) AS v"
  # c3: H, a stored memory state
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2)"
      params: [2, 2, -86, 25, 2300, 9, 1, 0, "{\"s\":30.0,\"d\":6.0,\"dr\":0.9,\"decay\":0.154,\"lrt\":1762855200}"]
  - db_exec:
      sql: "INSERT INTO revlog SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 2), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1759309200003, 3, -600, -60, 0, 0), (1759309800003, 3, 1, -600, 2500, 0), (1759399200003, 3, 3, 1, 2500, 1), (1759658400003, 3, 9, 3, 2500, 1), (1760436000003, 1, -600, 9, 2300, 1), (1760436600003, 3, 2, -600, 2300, 2), (1760608800003, 3, 6, 2, 2300, 1), (1761127200003, 4, 20, 6, 2450, 1), (1762855200003, 2, 25, 20, 2300, 1)) AS v"
  # c4: learning card one step in, due 09:59; its one learning row
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, left = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 3)"
      params: [1, 1, 1772445540, 0, 0, 1, 0, 1, "{}"]
  - db_exec:
      sql: "INSERT INTO revlog SELECT v.column1, (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 3), -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (VALUES (1772444940004, 3, -600, -60, 0, 0)) AS v"
  # A later time on the same day, so that a write would show in mod.
  - advance: 1h
  - observe: ["next_states(#c1, #c2, #c3, #c4)"]
  # Computing the states wrote nothing.
  - db_exec: {sql: "SELECT data, mod, usn FROM cards ORDER BY id"}
  - answer: {card: "#c1", rating: good, time_ms: 4000}
  - observe: ["card(#c1)"]
