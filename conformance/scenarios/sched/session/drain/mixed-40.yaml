# A full drain under a scripted rating policy (R1894; specs/sched/
# review-session.md P2 to P6). Deck Drain and its child Drain::Part, default
# preset (steps 1m 10m, relearning 10m, 20 new and 200 reviews a day),
# learn-ahead 1,200 s, FSRS on, load balancer off, from 10:00:00 UTC. 40
# one-card notes: 16 new cards; 9 intraday learning cards due from 10 minutes
# ago to 50 minutes ahead (one in relearning, two held beyond the learn-ahead
# limit at the start); 3 interday learning cards and 12 reviews due today or
# earlier. The queue is held from the first read. Every answer is the card
# the queue presents first (each answered card was taken from the oracle's
# queue read just before it): Good, except Again on every 5th answer. The
# clock moves 10 s, 40 s and 25 s in turn between answers, so learning cards
# come due during the session. The queue (order, kinds, counts) is read after
# every answer until it presents nothing; every card has then graduated.
# Needs queue held across answers (specs/conformance/session-ops.md E2).
id: sched/session/drain/mixed-40
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  decks: [Drain, "Drain::Part"]
  notetypes:
    - name: Card
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
  notes:
