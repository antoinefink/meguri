# The preset an answer uses when the home deck names a preset that does not
# exist (specs/sched/presets.md V1): the built-in defaults, not the default
# preset. The default preset is given a desired retention of 0.8, a 21-value
# parameter list ending in 0.3 and a 10 s answer cap, so that each shows in
# the card data and the review log. Orphan's preset id is set to one no
# preset has; Home keeps the default preset for comparison.
id: sched/data/missing-preset
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true}
  presets:
    - name: Default
      desired_retention: 0.8
      fsrs_params: [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.3]
  decks: [Home, Orphan]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Pair, deck: Home, fields: [one, back]}
    - {notetype: Pair, deck: Orphan, fields: [two, back]}
steps:
  - legacy_update: {preset: Default, patch: {maxTaken: 10}}
  - legacy_update: {deck: Orphan, patch: {conf: 999}}
  - db_exec: {sql: "SELECT name, hex(kind) FROM decks ORDER BY id"}
  - answer: {card: "#c1", rating: good, time_ms: 30000}
  - answer: {card: "#c2", rating: good, time_ms: 30000}
  - db_exec: {sql: "SELECT data FROM cards ORDER BY id"}
  - db_exec: {sql: "SELECT time FROM revlog ORDER BY id"}
