# Remapping the remaining steps of learning and relearning cards when a
# deck options save changes a deck's steps (R644; specs/sched/step-remap.md
# R2, R3). A card whose remaining count changes gets the new count as its
# whole `left` and is stamped; any other card keeps its row.
# Needs save_deck_options (specs/conformance/deck-options-ops.md E1).
# Lang: learning 1m 10m 1h, relearning 10m. Other: learning 1m 10m.
# Words uses Lang, Phrases uses Other; Cram is a filtered deck.
# Cards (left before the first save):
#  c1 learning, 2 (on step 2 of 3)    c2 learning, 1 (step 3 of 3)
#  c3 learning, 3 (step 1 of 3)       c4 learning, 1002 (old two-part form: 2)
#  c5 learning, 3003 (3)              c6 relearning, 1 (its only step)
#  c7 learning in Cram from Words, 3  c8 suspended learning card, 3
#  c9 learning, 0                     c10 learning, 7 (more than the steps)
#  c11 review card, left 3            c12 interday learning (queue 3), 3
#  c13 Phrases learning, 2            c14 relearning, 0
#  c15 Phrases learning, 1
id: sched/options/remap-steps
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  presets:
    - {name: Lang, learn_steps: [1m, 10m, 1h], relearn_steps: [10m]}
    - {name: Other, learn_steps: [1m, 10m]}
  decks: [{name: Words, preset: Lang}, {name: Phrases, preset: Other}]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Pair, deck: Words, fields: [one, a]}
    - {notetype: Pair, deck: Words, fields: [two, a]}
    - {notetype: Pair, deck: Words, fields: [three, a]}
    - {notetype: Pair, deck: Words, fields: [four, a]}
    - {notetype: Pair, deck: Words, fields: [five, a]}
    - {notetype: Pair, deck: Words, fields: [six, a]}
    - {notetype: Pair, deck: Words, fields: [seven, a]}
    - {notetype: Pair, deck: Words, fields: [eight, a]}
    - {notetype: Pair, deck: Words, fields: [nine, a]}
    - {notetype: Pair, deck: Words, fields: [ten, a]}
    - {notetype: Pair, deck: Words, fields: [eleven, a]}
    - {notetype: Pair, deck: Words, fields: [twelve, a]}
    - {notetype: Pair, deck: Phrases, fields: [thirteen, a]}
    - {notetype: Pair, deck: Words, fields: [sample-n, a]}
    - {notetype: Pair, deck: Phrases, fields: [fifteen, a]}
steps:
  # Card states, matched by row number (card ids follow creation order).
  # Intraday learning cards are due in ten minutes (1894702200), the interday
  # one on day 0, the review card on day 5.
  - db_exec:
      sql: |
        UPDATE cards SET type = v.column2, queue = v.column3, due = v.column4, ivl = v.column5, reps = v.column6, left = v.column7
        FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n FROM cards) AS c
        JOIN (VALUES
          (1, 1, 1, 1894702200, 0, 2, 2),
          (2, 1, 1, 1894702200, 0, 3, 1),
          (3, 1, 1, 1894702200, 0, 1, 3),
          (4, 1, 1, 1894702200, 0, 2, 1002),
          (5, 1, 1, 1894702200, 0, 1, 3003),
          (6, 3, 1, 1894702200, 3, 5, 1),
          (7, 1, 1, 1894702200, 0, 1, 3),
          (8, 1, -1, 1894702200, 0, 1, 3),
          (9, 1, 1, 1894702200, 0, 4, 0),
          (10, 1, 1, 1894702200, 0, 1, 7),
          (11, 2, 2, 5, 5, 4, 3),
          (12, 1, 3, 0, 0, 2, 3),
          (13, 1, 1, 1894702200, 0, 1, 2),
          (14, 3, 1, 1894702200, 3, 5, 0),
          (15, 1, 1, 1894702200, 0, 2, 1)
        ) AS v ON v.column1 = c.n
        WHERE cards.id = c.cid
  - db_exec:
      sql: "INSERT INTO decks (id, name, mtime_secs, usn, common, kind) VALUES (900, 'Cram', 0, 0, X'08011001', X'12130801120a0a066465636b3a78106428d804383c')"
  # c7 sits in Cram, its home deck Words in odid.
  - db_exec:
      sql: "UPDATE cards SET odid = did, did = 900, odue = due WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET 6)"
  # Every card stamped long ago with a server usn, so that a card a save
  # writes shows mod = now and usn -1.
  - db_exec: {sql: "UPDATE cards SET usn = 5, mod = 1700000000"}
  - advance: 1h
  # A. Lang's learning steps 1m 10m 1h -> 5m 2h, from the Words screen.
  - save_deck_options: {deck: Words, options: {learn_steps: [5m, 2h]}}
  - observe: ["card(#c1, #c3, #c5, #c7, #c9, #c11, #c13, #c15, #c2, #c4, #c6, #c8, #c10, #c12, #c14)"]
  - advance: 1h
  # B. Lang's relearning steps 10m -> 5m 30m 2h: only relearning cards.
  - save_deck_options: {deck: Words, options: {relearn_steps: [5m, 30m, 2h]}}
  - observe: ["card(#c1, #c3, #c5, #c7, #c9, #c11, #c13, #c15, #c2, #c4, #c6, #c8, #c10, #c12, #c14)"]
  - advance: 1h
  # C. Lang's learning steps 5m 2h -> none.
  - save_deck_options: {deck: Words, options: {learn_steps: []}}
  - observe: ["card(#c1, #c3, #c5, #c7, #c9, #c11, #c13, #c15, #c2, #c4, #c6, #c8, #c10, #c12, #c14)"]
  - advance: 1h
  # D. Lang's learning steps none -> 1m 10m: no step was passed, nothing moves.
  - save_deck_options: {deck: Words, options: {learn_steps: [1m, 10m]}}
  - observe: ["card(#c1, #c3, #c5, #c7, #c9, #c11, #c13, #c15, #c2, #c4, #c6, #c8, #c10, #c12, #c14)"]
  - advance: 1h
  # E. Phrases switches from Other (1m 10m) to Lang, whose learning steps
  # become 1m 5m 20m in the same save: Words' learning cards map from Lang's
  # old steps, Phrases' from Other's.
  - save_deck_options: {deck: Phrases, preset: Lang, options: {learn_steps: [1m, 5m, 20m]}}
  - observe: ["card(#c1, #c3, #c5, #c7, #c9, #c11, #c13, #c15, #c2, #c4, #c6, #c8, #c10, #c12, #c14)"]
