# A deck options save is one undoable "Deck Options" step (R737;
# specs/sched/deck-options.md O7): undo puts back the preset, the
# recomputed memory states and the remapped steps, redo applies them again.
# Lang's desired retention 0.90 -> 0.85 and learning steps 1m 10m 1h ->
# 5m 2h, from the Words screen. c1 (Words) is a review card with a history
# and no memory state: it gets s, d, dr 0.85 and decay, no due date or
# interval change. c2 (Words) is a learning card on its first step: 3 -> 2.
# c3 (Phrases, which has its own retention 80 %) and c4 (a new card in
# Words) are untouched.
# Needs save_deck_options (specs/conformance/deck-options-ops.md E1).
id: sched/options/undo-save
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  presets: [{name: Lang, desired_retention: 0.9, learn_steps: [1m, 10m, 1h]}]
  decks: [{name: Words, preset: Lang}, {name: Phrases, preset: Lang}]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Pair, deck: Words, fields: [one, a]}
    - {notetype: Pair, deck: Words, fields: [two, a]}
    - {notetype: Pair, deck: Phrases, fields: [three, a]}
    - {notetype: Pair, deck: Words, fields: [four, a]}
steps:
  - legacy_update: {deck: Phrases, patch: {desiredRetention: 80}}
  - db_exec:
      sql: |
        UPDATE cards SET type = v.column2, queue = v.column3, due = v.column4, ivl = v.column5, factor = v.column6, reps = v.column7, left = v.column8, data = '{}'
        FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n FROM cards) AS c
        JOIN (VALUES
          (1, 2, 2, 5, 20, 2500, 3, 0),
          (2, 1, 1, 1894702200, 0, 0, 1, 3),
          (3, 2, 2, 5, 20, 2500, 3, 0)
        ) AS v ON v.column1 = c.n
        WHERE cards.id = c.cid
  # c1 and c3: a learning run on 2030-01-01, then two reviews.
  - db_exec:
      sql: "INSERT INTO revlog SELECT v.column1 + c.n, c.cid, -1, v.column2, v.column3, v.column4, v.column5, 5000, v.column6 FROM (SELECT id AS cid, row_number() OVER (ORDER BY id) AS n FROM cards) AS c JOIN (VALUES (1893492000000, 3, -600, -60, 0, 0), (1893492600000, 3, 1, -600, 2500, 0), (1893578400000, 3, 4, 1, 2500, 1), (1893924000000, 3, 20, 4, 2500, 1)) AS v WHERE c.n IN (1, 3)"
  - db_exec: {sql: "UPDATE cards SET usn = 5, mod = 1700000000"}
  - advance: 1h
  - observe: ["card(#c1, #c2, #c3, #c4)", undo_status]
  - save_deck_options: {deck: Words, options: {desired_retention: 0.85, learn_steps: [5m, 2h]}}
  - observe: ["card(#c1, #c2, #c3, #c4)", undo_status]
  - undo: {}
  - observe: ["card(#c1, #c2, #c3, #c4)", undo_status]
  - redo: {}
  - observe: ["card(#c1, #c2, #c3, #c4)", undo_status]
  - observe: [{legacy_json: {presets: [Lang]}}]
