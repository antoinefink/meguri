# The "Ignore cards reviewed before" date of a preset, saved through the deck
# options save: a date before today's date, today's date itself and the empty
# text are stored as given (R690, R697; specs/sched/deck-options.md O1 today's
# date, O3, O4.2; specs/sched/fsrs-items.md I1.3).
# Today's date is the local date of the day's start: at 02:00, before the
# 04:00 rollover, it is the previous calendar day.
# Needs save_deck_options (specs/conformance/deck-options-ops.md E1) and
# legacy_json (specs/conformance/model-ops.md L1).
id: sched/options/ignore-date/kept
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true}
  presets: [{name: Main}]
  decks: [{name: Deck A, preset: Main}]
steps:
  - advance: 1h
  # A. A date well before today.
  - save_deck_options: {deck: Deck A, options: {ignore_reviews_before: "2029-11-03"}}
  - observe: [{legacy_json: {presets: [Main]}}]
  - advance: 1m
  # B. The day before today.
  - save_deck_options: {deck: Deck A, options: {ignore_reviews_before: "2030-01-14"}}
  - observe: [{legacy_json: {presets: [Main]}}]
  - advance: 1m
  # C. Today's date.
  - save_deck_options: {deck: Deck A, options: {ignore_reviews_before: "2030-01-15"}}
  - observe: [{legacy_json: {presets: [Main]}}]
  - advance: 1m
  # D. The empty text: no cutoff.
  - save_deck_options: {deck: Deck A, options: {ignore_reviews_before: ""}}
  - observe: [{legacy_json: {presets: [Main]}}]
  # E. 02:00 on 2030-01-17, before the rollover: today's date is 2030-01-16,
  # and that date is kept.
  - set_clock: "2030-01-17T02:00:00"
  - save_deck_options: {deck: Deck A, options: {ignore_reviews_before: "2030-01-16"}}
  - observe: [{legacy_json: {presets: [Main]}}]
