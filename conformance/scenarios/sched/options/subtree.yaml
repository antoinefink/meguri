# "Save to all subdecks" (R732; specs/sched/deck-options.md O7.2 step 3):
# the deck and every normal descendant get the saved preset and the saved
# deck's own values, which replace a descendant's own limits and desired
# retention. Filtered decks and decks outside the subtree are untouched; a
# save without the option changes only its deck.
# Lang and Lang::A use Default, Lang::A::X, Lang::B and Solo use Other.
# Lang::A has its own new limit 5 and retention 85 %; Lang::B a Today-only
# review limit of 40 for today (day 0); Lang::F is a filtered deck.
# Needs save_deck_options with subtree and limits
# (specs/conformance/deck-options-ops.md E1, E3).
id: sched/options/subtree
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  presets: [{name: Shared}, {name: Other}]
  decks:
    - Lang
    - Lang::A
    - {name: "Lang::A::X", preset: Other}
    - {name: "Lang::B", preset: Other}
    - {name: Solo, preset: Other}
steps:
  - legacy_update: {deck: "Lang::A", patch: {newLimit: 5, desiredRetention: 85}}
  - legacy_update: {deck: "Lang::B", patch: {reviewLimitToday: {limit: 40, today: 0}}}
  - db_exec:
      sql: "INSERT INTO decks (id, name, mtime_secs, usn, common, kind) VALUES (900, 'Lang' || char(31) || 'F', 0, 0, X'08011001', X'12130801120a0a066465636b3a78106428d804383c')"
  - advance: 1h
  # 1. From the Lang screen: preset Shared, new limit 15, for all subdecks.
  - save_deck_options: {deck: Lang, preset: Shared, subtree: true, limits: {new: 15}}
  - observe: [{legacy_json: {decks: [Lang, "Lang::A", "Lang::A::X", "Lang::B", "Lang::F", Solo]}}]
  - advance: 1h
  # 2. From the Lang::A screen, preset Other, without the option: Lang::A::X
  # keeps Shared.
  - save_deck_options: {deck: "Lang::A", preset: Other}
  - observe: [{legacy_json: {decks: [Lang, "Lang::A", "Lang::A::X", "Lang::B", "Lang::F", Solo]}}]
