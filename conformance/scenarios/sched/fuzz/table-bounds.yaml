# Review-interval fuzz at the bounds (R659-R662; specs/sched/fuzz.md Z1-Z4, Z6).
# The fuzz_table observation gives, for a card id and a review count (reviews
# before the answer), how much fuzz moves a whole interval, bounded by the
# maximum interval of the observed card's preset: c1 Long (36,500 days), c2
# Hundred (100), c3 Three (3), c4 One (1). The pairs [4, 0], [0, 4], [3, 1] and
# [1, 3] share the seed 4, so their rows are equal; a card with id -1 and 5
# reviews has that seed too (the id is read as an unsigned 64-bit integer and
# the sum wraps). The other pairs are a card id of another collection (no card
# of this one may have it while the oracle computes the table), the largest
# scenario card id, and the largest review count a stored card can have before
# an answer (4,294,967,294). The 10,000-pair table is fp-probe/corpus/fuzz-table.
id: sched/fuzz/table-bounds
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  presets:
    - {name: Long, max_interval_days: 36500}
    - {name: Hundred, max_interval_days: 100}
    - {name: Three, max_interval_days: 3}
    - {name: One, max_interval_days: 1}
  decks:
    - {name: Long, preset: Long}
    - {name: Hundred, preset: Hundred}
    - {name: Three, preset: Three}
    - {name: One, preset: One}
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Pair, deck: Long, fields: [c1, back]}
    - {notetype: Pair, deck: Hundred, fields: [c2, back]}
    - {notetype: Pair, deck: Three, fields: [c3, back]}
    - {notetype: Pair, deck: One, fields: [c4, back]}
steps:
  - observe:
      - fuzz_table:
          card: "#c1"
          intervals: [1, 2, 3, 4, 7, 20, 21, 98, 99, 100, 101, 36500]
          pairs: [[4, 0], [0, 4], [3, 1], [1, 3], [1894698000000, 0], [1894698000000, 1], [9007199254740991, 0], [9007199254740991, 4294967294], [1, 4294967294]]
  - observe:
      - fuzz_table:
          card: "#c2"
          intervals: [1, 2, 3, 4, 7, 20, 21, 98, 99, 100, 101, 36500]
          pairs: [[4, 0], [0, 4], [3, 1], [1, 3], [1894698000000, 0], [1894698000000, 1], [9007199254740991, 0], [9007199254740991, 4294967294], [1, 4294967294]]
  - observe:
      - fuzz_table:
          card: "#c3"
          intervals: [1, 2, 3, 4, 7, 20, 21, 98, 99, 100, 101, 36500]
          pairs: [[4, 0], [0, 4], [3, 1], [1, 3], [1894698000000, 0], [1894698000000, 1], [9007199254740991, 0], [9007199254740991, 4294967294], [1, 4294967294]]
  - observe:
      - fuzz_table:
          card: "#c4"
          intervals: [1, 2, 3, 4, 7, 20, 21, 98, 99, 100, 101, 36500]
          pairs: [[4, 0], [0, 4], [3, 1], [1, 3], [1894698000000, 0], [1894698000000, 1], [9007199254740991, 0], [9007199254740991, 4294967294], [1, 4294967294]]
