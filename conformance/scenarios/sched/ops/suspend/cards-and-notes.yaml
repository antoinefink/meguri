# Suspend and unsuspend (specs/sched/manual-ops.md M1, M3, M4; R717, R683;
# AE45's core part). Suspending three active cards is one "Suspend" step and
# one undo restores all three, stamps included. A user-buried and a
# scheduler-buried card can be suspended; an already suspended card is not
# written; a card in the filtered deck Cram stays there. Suspend Note
# suspends the note's other card. Unsuspend gives each card the queue of its
# type (intraday learning 1, interday relearning 3, review 2, new 0), also to
# a buried card, keeps the Cram card in Cram, and leaves an active card
# unwritten. No step writes a review-log row. Needs suspend and unsuspend
# (specs/conformance/sched-ops.md J3, J4, J10), db_exec, undo and
# undo_status.
id: sched/ops/suspend/cards-and-notes
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Forward, front: "{{Front}}", back: "{{Back}}"}
        - {name: Reverse, front: "{{Back}}", back: "{{Front}}"}
  decks: [Home]
  notes:
    - {notetype: Pair, deck: Home, fields: [a, a2]}
    - {notetype: Pair, deck: Home, fields: [b, b2]}
    - {notetype: Pair, deck: Home, fields: [c, c2]}
    - {notetype: Pair, deck: Home, fields: [d, d2]}
steps:
  - observe: [timing]
  - db_exec: {sql: "INSERT INTO decks (id, name, mtime_secs, usn, common, kind) VALUES (100, 'Cram', 0, 0, X'08011001', X'12130801120a0a066465636b3a78106428d804383c')"}
  # #c1 new; #c2 review; #c3 intraday learning.
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = 2, ivl = 4, due = 2, factor = 2500, reps = 3 WHERE nid = (SELECT id FROM notes WHERE sfld = 'a') AND ord = 1"}
  - db_exec: {sql: "UPDATE cards SET type = 1, queue = 1, due = 1894702200, left = 2, reps = 1 WHERE nid = (SELECT id FROM notes WHERE sfld = 'b') AND ord = 0"}
  # #c4 new, buried by the user; #c5 relearning due on day 1; #c6 review,
  # buried by the scheduler.
  - db_exec: {sql: "UPDATE cards SET queue = -3 WHERE nid = (SELECT id FROM notes WHERE sfld = 'b') AND ord = 1"}
  - db_exec: {sql: "UPDATE cards SET type = 3, queue = 3, due = 1, ivl = 3, factor = 2500, left = 1, reps = 6, lapses = 1 WHERE nid = (SELECT id FROM notes WHERE sfld = 'c') AND ord = 0"}
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = -2, due = 4, ivl = 7, factor = 2500, reps = 4 WHERE nid = (SELECT id FROM notes WHERE sfld = 'c') AND ord = 1"}
  # #c7 a review card in Cram (home Home, due day 6 there); #c8 new and
  # already suspended.
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = 2, ivl = 5, factor = 2500, reps = 2, odid = did, did = 100, odue = 6, due = -100000 WHERE nid = (SELECT id FROM notes WHERE sfld = 'd') AND ord = 0"}
  - db_exec: {sql: "UPDATE cards SET queue = -1 WHERE nid = (SELECT id FROM notes WHERE sfld = 'd') AND ord = 1"}
  - db_exec: {sql: "UPDATE cards SET usn = 0"}
  - advance: 1m
  # AE45: three cards, one step, one undo.
  - suspend: {cards: ["#c1", "#c2", "#c3"]}
  - observe: ["card(#c1, #c2, #c3)", undo_status]
  - undo: {}
  - observe: ["card(#c1, #c2, #c3)", undo_status]
  - advance: 1m
  - suspend: {cards: ["#c4", "#c6", "#c7", "#c8"]}
  - observe: ["card(#c4, #c6, #c7, #c8)", undo_status]
  - advance: 1m
  # Suspend Note on #n2 and #n3: #c3 and #c5 are suspended, #c4 and #c6
  # already are.
  - suspend: {notes: ["#n2", "#n3"]}
  - observe: ["card(#c3, #c4, #c5, #c6)", undo_status]
  # #c2 buried by the user (a raw write: it also empties the undo history).
  - db_exec: {sql: "UPDATE cards SET queue = -3 WHERE nid = (SELECT id FROM notes WHERE sfld = 'a') AND ord = 1"}
  - advance: 1m
  - unsuspend: {cards: ["#c3", "#c4", "#c5", "#c6", "#c7", "#c8", "#c2", "#c1"]}
  - observe: [card, undo_status]
  - db_exec: {sql: "SELECT count(*) FROM revlog"}
