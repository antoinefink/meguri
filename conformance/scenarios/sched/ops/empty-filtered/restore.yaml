# Empty on a filtered deck (R706, R707; specs/sched/manual-ops.md M8). The
# filtered deck Cram (inserted as specs/conformance/deck-ops.md K13 says)
# holds cards of Home and Other as a build leaves them, plus states only
# studying or other actions make: a preview repeat card (queue 4) with a
# timestamp odue goes home to queue 1, one of a relearning card with a day
# odue to queue 3; an interday relearning card to queue 3; a new card to its
# position; a review card buried by the user in Cram (with bury) stays
# buried; a suspended card whose odue is 0 keeps its due; a damaged row with
# odid 0 keeps every value but is written. A card of Home outside Cram is
# not touched. The deck row stays as it was, no review-log row is written,
# Empty on a normal deck records not_filtered, and one "Empty" step undoes
# all of it. Needs empty_filtered and bury (specs/conformance/sched-ops.md
# J2, J9, J10), deck names (deck-ops.md K1), db_exec, undo and undo_status.
id: sched/ops/empty-filtered/restore
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  notetypes:
    - name: Single
      fields: [Front, Back]
      templates: [{name: One, front: "{{Front}}", back: "{{Back}}"}]
  decks: [Home, Other]
  notes:
    - {notetype: Single, deck: Home, fields: [new, x]}
    - {notetype: Single, deck: Home, fields: [review, x]}
    - {notetype: Single, deck: Home, fields: [preview, x]}
    - {notetype: Single, deck: Home, fields: [interday, x]}
    - {notetype: Single, deck: Home, fields: [previewday, x]}
    - {notetype: Single, deck: Home, fields: [buried, x]}
    - {notetype: Single, deck: Home, fields: [suspended, x]}
    - {notetype: Single, deck: Home, fields: [damaged, x]}
    - {notetype: Single, deck: Other, fields: [other, x]}
    - {notetype: Single, deck: Home, fields: [outside, x]}
steps:
  - observe: [timing]
  - db_exec: {sql: "INSERT INTO decks (id, name, mtime_secs, usn, common, kind) VALUES (100, 'Cram', 0, 0, X'08011001', X'12130801120a0a066465636b3a78106428d804383c')"}
  # #c1 new: its position moves to odue.
  - db_exec: {sql: "UPDATE cards SET odid = did, did = 100, odue = due, due = -100000 WHERE nid = (SELECT id FROM notes WHERE sfld = 'new')"}
  # #c2 review due on day 5 at home.
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = 2, ivl = 3, factor = 2500, reps = 3, odid = did, did = 100, odue = 5, due = -99999 WHERE nid = (SELECT id FROM notes WHERE sfld = 'review')"}
  # #c3 learning in preview repeat, home due at an epoch second.
  - db_exec: {sql: "UPDATE cards SET type = 1, queue = 4, left = 1, reps = 1, odid = did, did = 100, odue = 1894702200, due = 1894701660 WHERE nid = (SELECT id FROM notes WHERE sfld = 'preview')"}
  # #c4 relearning due on day 1 at home, interday.
  - db_exec: {sql: "UPDATE cards SET type = 3, queue = 3, ivl = 2, factor = 2500, left = 1, reps = 6, lapses = 1, odid = did, did = 100, odue = 1, due = -99998 WHERE nid = (SELECT id FROM notes WHERE sfld = 'interday')"}
  # #c5 relearning in preview repeat, home due on day 2.
  - db_exec: {sql: "UPDATE cards SET type = 3, queue = 4, ivl = 4, factor = 2500, left = 1, reps = 7, lapses = 2, odid = did, did = 100, odue = 2, due = 1894701900 WHERE nid = (SELECT id FROM notes WHERE sfld = 'previewday')"}
  # #c6 review due on day 4 at home; buried below with bury.
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = 2, ivl = 5, factor = 2500, reps = 2, odid = did, did = 100, odue = 4, due = -99997 WHERE nid = (SELECT id FROM notes WHERE sfld = 'buried')"}
  # #c7 suspended review in Cram with no odue.
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = -1, ivl = 6, factor = 2500, reps = 2, odid = did, did = 100, odue = 0, due = 2 WHERE nid = (SELECT id FROM notes WHERE sfld = 'suspended')"}
  # #c8 a damaged row: in Cram with odid 0.
  - db_exec: {sql: "UPDATE cards SET did = 100, due = 8 WHERE nid = (SELECT id FROM notes WHERE sfld = 'damaged')"}
  # #c9 review of Other due on day 6 at home.
  - db_exec: {sql: "UPDATE cards SET type = 2, queue = 2, ivl = 9, factor = 2500, reps = 4, odid = did, did = 100, odue = 6, due = -99996 WHERE nid = (SELECT id FROM notes WHERE sfld = 'other')"}
  - db_exec: {sql: "UPDATE cards SET usn = 0"}
  - advance: 1m
  - bury: {cards: ["#c6"]}
  - observe: ["card(#c6)"]
  - advance: 1m
  - empty_filtered: {deck: Home}
  - empty_filtered: {deck: Cram}
  - observe: [card, revlog, undo_status]
  - db_exec: {sql: "SELECT id, name, mtime_secs, usn, hex(common), hex(kind) FROM decks WHERE id = 100"}
  - db_exec: {sql: "SELECT mod FROM col"}
  - advance: 1m
  - undo: {}
  - observe: [card, undo_status]
