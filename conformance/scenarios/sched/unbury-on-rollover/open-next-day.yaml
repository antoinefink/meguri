# R597, R598 (D7, D8): cards buried on day 5, the collection closed and opened
# again on day 6. A review card and an interday learning card (day-number
# due) return to queues 2 and 3 at the first day query after the open: Meguri
# runs it while opening, the oracle when the timing observation asks, at the
# same instant (D14.2).
id: sched/unbury-on-rollover/open-next-day
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00", mode: step}
steps:
  - observe: [timing]
  - set_clock: "2030-01-20T21:00:00"
  - observe: [timing]
  - db_exec: {sql: "INSERT INTO notes (id, guid, mid, mod, usn, tags, flds, sfld, csum, flags, data) VALUES (1700000000000, 'g1700000000000', (SELECT id FROM notetypes ORDER BY id LIMIT 1), 1700000000, 3, '', 'one' || char(31) || 'uno', 'one', 0, 0, '')"}
  - db_exec: {sql: "INSERT INTO cards (id, nid, did, ord, mod, usn, type, queue, due, ivl, factor, reps, lapses, left, odue, odid, flags, data) VALUES (1700000000001, 1700000000000, 1, 0, 1700000001, 3, 2, -2, 5, 4, 2500, 3, 0, 0, 0, 0, 0, '')"}
  - db_exec: {sql: "INSERT INTO cards (id, nid, did, ord, mod, usn, type, queue, due, ivl, factor, reps, lapses, left, odue, odid, flags, data) VALUES (1700000000002, 1700000000000, 1, 0, 1700000002, 3, 1, -3, 6, 0, 0, 1, 0, 1, 0, 0, 0, '')"}
  - db_exec: {sql: "SELECT id, type, queue, due, ivl, mod, usn FROM cards ORDER BY id"}
  - set_clock: "2030-01-21T08:30:00"
  - reopen: {}
  - observe: [timing]
  - db_exec: {sql: "SELECT id, type, queue, due, ivl, mod, usn FROM cards ORDER BY id"}
  - db_exec: {sql: "SELECT KEY, usn, mtime_secs, CAST(val AS TEXT) FROM config WHERE KEY IN ('creationOffset', 'lastUnburied', 'localOffset', 'rollover') ORDER BY KEY"}
