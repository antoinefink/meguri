# Elapsed days given to FSRS (R649; specs/sched/fsrs-transitions.md T2.3): whole
# days from the last review time to the start of the next day (2030-01-16 04:00
# UTC), never below 0. Every card is the same review card (stability 10,
# difficulty 5, interval 10, due today) with another last review time:
#   c1 now.
#   c2 today 04:00:00, exactly a day before the next day starts.
#   c3 today 04:00:01.
#   c4 yesterday 03:59:59.
#   c5 one second before the next day starts, in the future.
#   c6 the instant the next day starts.
#   c7 after the next day starts.
#   c8 exactly three days before the next day starts.
#   c9 three days and one second before it.
id: sched/fsrs/elapsed-days
clock: {tz: UTC, start: "2030-01-15T10:00:00"}
setup:
  config: {fsrs: true, loadBalancerEnabled: false}
  presets:
    - {name: Review, relearn_steps: [10m], desired_retention: 0.9}
  decks:
    - {name: Review, preset: Review}
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates: [{name: Forward, front: "{{Front}}", back: "{{Back}}"}]
      css: ".card { margin: 0; }"
  notes:
    - {notetype: Pair, deck: Review, fields: [c1, back]}
    - {notetype: Pair, deck: Review, fields: [c2, back]}
    - {notetype: Pair, deck: Review, fields: [c3, back]}
    - {notetype: Pair, deck: Review, fields: [c4, back]}
    - {notetype: Pair, deck: Review, fields: [c5, back]}
    - {notetype: Pair, deck: Review, fields: [c6, back]}
    - {notetype: Pair, deck: Review, fields: [c7, back]}
    - {notetype: Pair, deck: Review, fields: [c8, back]}
    - {notetype: Pair, deck: Review, fields: [c9, back]}
steps:
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET ?)"
      params: [2, 2, 0, 10, 2500, 5, 0, '{"s":10.0,"d":5.0,"lrt":1894701600}', 0]
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET ?)"
      params: [2, 2, 0, 10, 2500, 6, 0, '{"s":10.0,"d":5.0,"lrt":1894680000}', 1]
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET ?)"
      params: [2, 2, 0, 10, 2500, 7, 0, '{"s":10.0,"d":5.0,"lrt":1894680001}', 2]
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET ?)"
      params: [2, 2, 0, 10, 2500, 8, 0, '{"s":10.0,"d":5.0,"lrt":1894679999}', 3]
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET ?)"
      params: [2, 2, 0, 10, 2500, 9, 0, '{"s":10.0,"d":5.0,"lrt":1894766399}', 4]
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET ?)"
      params: [2, 2, 0, 10, 2500, 10, 0, '{"s":10.0,"d":5.0,"lrt":1894766400}', 5]
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET ?)"
      params: [2, 2, 0, 10, 2500, 11, 0, '{"s":10.0,"d":5.0,"lrt":1894800000}', 6]
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET ?)"
      params: [2, 2, 0, 10, 2500, 12, 0, '{"s":10.0,"d":5.0,"lrt":1894507200}', 7]
  - db_exec:
      sql: "UPDATE cards SET type = ?, queue = ?, due = ?, ivl = ?, factor = ?, reps = ?, lapses = ?, data = ? WHERE id = (SELECT id FROM cards ORDER BY id LIMIT 1 OFFSET ?)"
      params: [2, 2, 0, 10, 2500, 13, 0, '{"s":10.0,"d":5.0,"lrt":1894507199}', 8]
  - observe: [next_states]
