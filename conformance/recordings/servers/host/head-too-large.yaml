# servers/host-security H17 `head-too-large` (declared, servers/transcripts T13):
# a request head over 65,536 bytes gets 431 on both servers (H7.2).
id: servers/host/head-too-large
description: "oversized request head: 431"
tags: [host]
server: host
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
server_config: {enabled: [ankiconnect, migaku]}
steps:
  - status: {until: {state: listening, addresses: ["127.0.0.1:8765", "[::1]:8765"]}, within_ms: 1000, server: ankiconnect}
  - status: {until: {state: listening, addresses: ["127.0.0.1:44432", "[::1]:44432"]}, within_ms: 1000, server: migaku}
  - http: {server: ankiconnect, headers: [[X-Pad, {fill: {size: 70000, byte: 97}}]]}
    expect:
      status: 431
      headers: {content-length: "0", connection: close}
      body: {empty: true}
      closed: true
  - http: {server: migaku, method: GET, target: /srs-check, headers: [[X-Pad, {fill: {size: 70000, byte: 97}}]]}
    expect:
      status: 431
      headers: {content-length: "0", connection: close}
      body: {empty: true}
      closed: true
