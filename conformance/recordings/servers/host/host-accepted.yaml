# servers/host-security H17 `host-accepted` (declared, servers/transcripts T13):
# every accepted Host form, and no Host, on both servers; a Host passes on any socket of its
# server, and spaces and tabs at both ends of the value are removed first (H6.1).
id: servers/host/host-accepted
description: "accepted Host values on both servers"
tags: [host]
server: host
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
server_config: {enabled: [ankiconnect, migaku]}
steps:
  - status: {until: {state: listening, addresses: ["127.0.0.1:8765", "[::1]:8765"]}, within_ms: 1000, server: ankiconnect}
  - status: {until: {state: listening, addresses: ["127.0.0.1:44432", "[::1]:44432"]}, within_ms: 1000, server: migaku}
  - http: {server: ankiconnect, headers: [[Host, "127.0.0.1:8765"]]}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {apiVersion: "AnkiConnect v.6"}}
  - http: {server: ankiconnect, headers: [[Host, "localhost:8765"]]}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {apiVersion: "AnkiConnect v.6"}}
  - http: {server: ankiconnect, headers: [[Host, "LocalHost:8765"]]}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {apiVersion: "AnkiConnect v.6"}}
  - http: {server: ankiconnect, headers: [[Host, "[::1]:8765"]]}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {apiVersion: "AnkiConnect v.6"}}
  - http: {server: ankiconnect, headers: [[Host, "host.docker.internal:8765"]]}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {apiVersion: "AnkiConnect v.6"}}
  - http: {server: ankiconnect, no_host: true}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {apiVersion: "AnkiConnect v.6"}}
  - http: {server: ankiconnect, address: ipv6, headers: [[Host, "localhost:8765"]]}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {apiVersion: "AnkiConnect v.6"}}
  - http: {server: ankiconnect, headers: [[Host, "\tlocalhost:8765 "]]}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {apiVersion: "AnkiConnect v.6"}}
  - http: {server: migaku, method: GET, target: /srs-check, headers: [[Host, "127.0.0.1:44432"]]}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {ok: true, version: "4"}}
  - http: {server: migaku, method: GET, target: /srs-check, headers: [[Host, "localhost:44432"]]}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {ok: true, version: "4"}}
  - http: {server: migaku, method: GET, target: /srs-check, headers: [[Host, "LocalHost:44432"]]}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {ok: true, version: "4"}}
  - http: {server: migaku, method: GET, target: /srs-check, headers: [[Host, "[::1]:44432"]]}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {ok: true, version: "4"}}
  - http: {server: migaku, method: GET, target: /srs-check, headers: [[Host, "host.docker.internal:44432"]]}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {ok: true, version: "4"}}
  - http: {server: migaku, method: GET, target: /srs-check, no_host: true}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {ok: true, version: "4"}}
  - http: {server: migaku, method: GET, target: /srs-check, address: ipv6, headers: [[Host, "localhost:44432"]]}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {ok: true, version: "4"}}
  - http: {server: migaku, method: GET, target: /srs-check, headers: [[Host, "\tlocalhost:44432 "]]}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {ok: true, version: "4"}}
