# servers/host-security H17 `bind-no-wildcard` (declared, servers/transcripts T13):
# both servers on: the process listens on the two loopback addresses of each port and nothing
# else (H4.1, H5). `expect: {output: ...}` on a step without a reply is the T13 form proposed
# with this scenario (T13 lists no check for T7.3 outputs yet).
id: servers/host/bind-no-wildcard
description: "only loopback sockets, never a wildcard"
tags: [host]
server: host
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
server_config: {enabled: [ankiconnect, migaku]}
steps:
  - status: {until: {state: listening, addresses: ["127.0.0.1:8765", "[::1]:8765"]}, within_ms: 1000, server: ankiconnect}
  - status: {until: {state: listening, addresses: ["127.0.0.1:44432", "[::1]:44432"]}, within_ms: 1000, server: migaku}
  - sockets: {}
    expect: {output: {sockets: ["127.0.0.1:44432", "127.0.0.1:8765", "[::1]:44432", "[::1]:8765"]}}
  - http: {server: ankiconnect}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {apiVersion: "AnkiConnect v.6"}}
  - http: {server: migaku, method: GET, target: /srs-check}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {ok: true, version: "4"}}
