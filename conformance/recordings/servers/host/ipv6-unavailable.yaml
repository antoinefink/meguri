# servers/host-security H17 `ipv6-unavailable` (declared, servers/transcripts T13):
# no IPv6 loopback in the namespace: the server listens on IPv4 alone (H4.2 step 4).
id: servers/host/ipv6-unavailable
description: "no IPv6 loopback: listening on 127.0.0.1 only"
tags: [host]
server: host
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
server_config: {enabled: [ankiconnect]}
host_env: {ipv6: false}
steps:
  - status: {until: {state: listening, addresses: ["127.0.0.1:8765"]}, within_ms: 1000, server: ankiconnect}
  - http: {server: ankiconnect, address: ipv4}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {apiVersion: "AnkiConnect v.6"}}
