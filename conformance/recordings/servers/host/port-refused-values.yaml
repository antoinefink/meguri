# servers/host-security H17 `port-refused-values` (declared, servers/transcripts T13):
# ankiconnect.port outside 1024..65535, 44432 or not an integer is refused, naming the member;
# nothing changes (H4.4, H10.3). Step outputs are checked with T13 `output`.
id: servers/host/port-refused-values
description: "bad ports refused, server unchanged on 8765"
tags: [host]
server: host
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
server_config: {enabled: [ankiconnect]}
steps:
  - status: {until: {state: listening, addresses: ["127.0.0.1:8765", "[::1]:8765"]}, within_ms: 1000, server: ankiconnect}
  - apply_config: {ankiconnect: {port: 80}}
    expect: {output: {refused: {member: ankiconnect.port}}}
  - apply_config: {ankiconnect: {port: 1023}}
    expect: {output: {refused: {member: ankiconnect.port}}}
  - apply_config: {ankiconnect: {port: 44432}}
    expect: {output: {refused: {member: ankiconnect.port}}}
  - apply_config: {ankiconnect: {port: 65536}}
    expect: {output: {refused: {member: ankiconnect.port}}}
  - apply_config: {ankiconnect: {port: "8765"}}
    expect: {output: {refused: {member: ankiconnect.port}}}
  - status: {until: {state: listening, addresses: ["127.0.0.1:8765", "[::1]:8765"]}, within_ms: 1000, server: ankiconnect}
  - status: {until: {state: listening, port: 8765}, within_ms: 1000, server: ankiconnect}
  - http: {server: ankiconnect}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {apiVersion: "AnkiConnect v.6"}}
