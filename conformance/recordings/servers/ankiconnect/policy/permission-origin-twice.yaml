# servers/ankiconnect-envelope E19.2 `policy/permission-origin-twice`: requestPermission with two Origin headers (E9 row 2, E7.3 row 5, E18).
# Meguri's own behavior (declared, servers/transcripts T13); all values are synthetic.
# No permission answer is scripted: a prompt would be a run error (T7.2).
id: servers/ankiconnect/policy/permission-origin-twice
description: requestPermission with two Origin headers is denied with no prompt
tags: [policy]
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      headers: [[Origin, "chrome-extension://abc"], [Origin, "https://evil.example"]]
      body: {json: {action: requestPermission, version: 6}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "http://localhost", access-control-allow-headers: "*"}
      body: {json: {result: {permission: denied}, error: null}}
