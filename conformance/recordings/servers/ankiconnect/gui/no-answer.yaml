# specs/servers/ankiconnect-gui G12 `no-answer` (G2 rule 3, G8).
# Meguri's own behavior (declared, servers/transcripts T13); all values are synthetic.
# Collection of G3's examples: n1, n2 in deck Lang (cards c1 < c2), n3 in Default (c3).
# The `events` step lists only the two interaction types: the timeout's reply also posts activity
# appended, whose place relative to interaction cancelled H11.2 does not fix (servers/transcripts T7.3).
# The request event carries G8's GuiBrowse payload; the cancelled event comes at the timeout, and a
# later answer is not accepted (the last resolve returns false).
id: servers/ankiconnect/gui/no-answer
description: "a GUI interaction with no answer times out after 10 s"
tags: [gui]
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {activeCols: [noteFld, template, cardDue, deck, noteCrt]}
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{FrontSide}}<hr id=answer>{{Back}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Pair, deck: Lang, fields: {Front: alpha, Back: first}}
    - {notetype: Pair, deck: Lang, fields: {Front: beta, Back: second}}
    - {notetype: Pair, deck: Default, fields: {Front: gamma, Back: third}}
steps:
  - interaction: {kind: GuiBrowse, answer: none}
  - http:
      body: {json: {action: guiBrowse, version: 6, params: {query: "deck:Lang"}}}
      async: b1
  - wait: 1s
  - advance: 10s
  - await: b1
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: null, error: "cannot navigate: Meguri did not respond"}}
  - events: {types: [interaction_request, interaction_cancelled]}
    expect:
      output:
        events:
          - {type: interaction_request, id: i-1, kind: GuiBrowse, payload: {query: "deck:Lang"}}
          - {type: interaction_cancelled, id: i-1}
  - resolve: {id: i-1, outcome: done}
    expect: {output: {resolved: false}}
