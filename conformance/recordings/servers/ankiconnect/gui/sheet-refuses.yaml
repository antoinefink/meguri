# specs/servers/ankiconnect-gui G12 `sheet-refuses` (G2 rule 4).
# Meguri's own behavior (declared, servers/transcripts T13); all values are synthetic.
# Collection of G3's examples: n1, n2 in deck Lang (cards c1 < c2), n3 in Default (c3).
# Each refused answer stands for an unsaved deck-options sheet (servers/transcripts T7.5).
id: servers/ankiconnect/gui/sheet-refuses
description: "every GUI action is refused while an unsaved sheet is open"
tags: [gui]
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {activeCols: [noteFld, template, cardDue, deck, noteCrt]}
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{FrontSide}}<hr id=answer>{{Back}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Pair, deck: Lang, fields: {Front: alpha, Back: first}}
    - {notetype: Pair, deck: Lang, fields: {Front: beta, Back: second}}
    - {notetype: Pair, deck: Default, fields: {Front: gamma, Back: third}}
steps:
  - interaction: {kind: GuiBrowse, answer: refused}
  - http:
      body: {json: {action: guiBrowse, version: 6, params: {query: "deck:Lang"}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: null, error: "cannot navigate: close the open sheet first"}}
      no_effect: true
  - interaction: {kind: GuiSelectCard, answer: refused}
  - http:
      body: {json: {action: guiSelectCard, version: 6, params: {card: "#c1"}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: null, error: "cannot navigate: close the open sheet first"}}
      no_effect: true
  - interaction: {kind: GuiSelectedNotes, answer: refused}
  - http:
      body: {json: {action: guiSelectedNotes, version: 6}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: null, error: "cannot navigate: close the open sheet first"}}
      no_effect: true
  - interaction: {kind: GuiAddCards, answer: refused}
  - http:
      body: {json: {action: guiAddCards, version: 6, params: {note: {deckName: Lang, modelName: Pair, fields: {Front: delta}}}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: null, error: "cannot navigate: close the open sheet first"}}
      no_effect: true
  - interaction: {kind: GuiEditNote, answer: refused}
  - http:
      body: {json: {action: guiEditNote, version: 6, params: {note: "#n1"}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: null, error: "cannot navigate: close the open sheet first"}}
      no_effect: true
