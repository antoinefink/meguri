# specs/servers/ankiconnect-gui G12 `add-payload` (G6 core work steps 2 and 3, G8 payload JSON).
# Meguri's own behavior (declared, servers/transcripts T13); all values are synthetic.
# Collection of G3's examples: n1, n2 in deck Lang (cards c1 < c2), n3 in Default (c3).
# Fields match by exact name: `back` and `Nope` name no field of Pair and are ignored, so Back
# holds only the picture's reference. The picture (conformance/fixtures/servers/ankiconnect/pixel.png,
# inlined) is stored before the interaction. The deck and note type ids of the payload are not
# checked: servers/transcripts T10 declares no id positions in `events` outputs yet.
id: servers/ankiconnect/gui/add-payload
description: "the GuiAddCards payload holds the matched fields, the picture reference and the options"
tags: [gui]
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {activeCols: [noteFld, template, cardDue, deck, noteCrt]}
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{FrontSide}}<hr id=answer>{{Back}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Pair, deck: Lang, fields: {Front: alpha, Back: first}}
    - {notetype: Pair, deck: Lang, fields: {Front: beta, Back: second}}
    - {notetype: Pair, deck: Default, fields: {Front: gamma, Back: third}}
steps:
  - http:
      body:
        json:
          action: guiAddCards
          version: 6
          params:
            note:
              deckName: Lang
              modelName: Pair
              fields: {Front: delta, back: x, Nope: y}
              tags: [t1]
              picture: {data: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAAAAAA6fptVAAAACklEQVR42mNgAAAAAgAB5Sfe/AAAAABJRU5ErkJggg==", filename: shot.png, fields: [Back]}
              options: {closeAfterAdding: true}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: 0, error: null}}
  - events: {types: [interaction_request]}
    expect:
      output_at:
        /events/0/kind: GuiAddCards
        /events/0/payload/note/fields: {Front: delta, Back: '<img src="shot.png">'}
        /events/0/payload/note/tags: [t1]
        /events/0/payload/note/close_after_adding: true
        /events/1: null
