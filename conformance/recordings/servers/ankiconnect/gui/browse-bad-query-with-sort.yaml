# specs/servers/ankiconnect-gui G12 `browse-bad-query-with-sort` (G3 checks 6 and 7, "The sort").
# Meguri's own behavior (declared, servers/transcripts T13); all values are synthetic.
# Collection of G3's examples: n1, n2 in deck Lang (cards c1 < c2), n3 in Default (c3).
# reorderCards passes every check, then the query fails to parse: the sort is written only after
# every check passed, so no sort key changes (no_effect) and no interaction is posted.
id: servers/ankiconnect/gui/browse-bad-query-with-sort
description: "guiBrowse with a valid reorderCards and a search that does not parse writes no sort"
tags: [gui]
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {activeCols: [noteFld, template, cardDue, deck, noteCrt]}
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{FrontSide}}<hr id=answer>{{Back}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Pair, deck: Lang, fields: {Front: alpha, Back: first}}
    - {notetype: Pair, deck: Lang, fields: {Front: beta, Back: second}}
    - {notetype: Pair, deck: Default, fields: {Front: gamma, Back: third}}
steps:
  - http:
      body: {json: {action: guiBrowse, version: 6, params: {query: "(", reorderCards: {order: descending, columnId: noteCrt}}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: null, error: 'This `(` is never closed by a `)`. To find the bracket itself, quote it or write `\(`.'}}
      no_effect: true
  - events: {types: [interaction_request]}
    expect: {output: {events: []}}
