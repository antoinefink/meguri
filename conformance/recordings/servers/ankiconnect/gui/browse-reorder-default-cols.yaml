# specs/servers/ankiconnect-gui G12 `browse-reorder-default-cols` (G3 check 6).
# Collection of G3's examples: n1, n2 in deck Lang (cards c1 < c2), n3 in Default (c3);
# activeCols absent, so Browse shows its default columns. All values are synthetic.
# Created (noteCrt) is not among the default cards-mode columns (browser/config-keys K1).
id: servers/ankiconnect/gui/browse-reorder-default-cols
description: "guiBrowse sorting by a column the default columns do not show"
tags: [no-origin]
server: ankiconnect
source: oracle
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{FrontSide}}<hr id=answer>{{Back}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Pair, deck: Lang, fields: {Front: alpha, Back: first}}
    - {notetype: Pair, deck: Lang, fields: {Front: beta, Back: second}}
    - {notetype: Pair, deck: Default, fields: {Front: gamma, Back: third}}
steps:
  - http:
      body: {json: {action: guiBrowse, version: 6, params: {query: "deck:Lang", reorderCards: {order: descending, columnId: noteCrt}}}}
