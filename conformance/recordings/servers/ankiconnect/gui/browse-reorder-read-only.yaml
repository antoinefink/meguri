# specs/servers/ankiconnect-gui G12 `browse-reorder-read-only` (G3 check 5, G11).
# Meguri's own behavior (declared, servers/transcripts T13); all values are synthetic.
# Collection of G3's examples: n1, n2 in deck Lang (cards c1 < c2), n3 in Default (c3).
# no_effect: the refusal writes no sort key (the db_dump covers the col config).
id: servers/ankiconnect/gui/browse-reorder-read-only
description: "guiBrowse with reorderCards in read-only mode"
tags: [gui]
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
server_config: {read_only: true}
setup:
  config: {activeCols: [noteFld, template, cardDue, deck, noteCrt]}
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{FrontSide}}<hr id=answer>{{Back}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Pair, deck: Lang, fields: {Front: alpha, Back: first}}
    - {notetype: Pair, deck: Lang, fields: {Front: beta, Back: second}}
    - {notetype: Pair, deck: Default, fields: {Front: gamma, Back: third}}
steps:
  - http:
      body: {json: {action: guiBrowse, version: 6, params: {query: "deck:Lang", reorderCards: {order: descending, columnId: noteCrt}}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: null, error: "Meguri: the API is in read-only mode"}}
      no_effect: true
