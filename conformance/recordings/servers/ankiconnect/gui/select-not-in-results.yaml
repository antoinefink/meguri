# specs/servers/ankiconnect-gui G12 `select-not-in-results` (G4, G11).
# Meguri's own behavior (declared, servers/transcripts T13); all values are synthetic.
# Collection of G3's examples: n1, n2 in deck Lang (cards c1 < c2), n3 in Default (c3).
# The scripted answers stand for the app: row c1 selected, then c3 not in the results, so the selection stays (servers/transcripts T7.5).
id: servers/ankiconnect/gui/select-not-in-results
description: "guiSelectCard on a card outside the results"
tags: [gui]
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {activeCols: [noteFld, template, cardDue, deck, noteCrt]}
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{FrontSide}}<hr id=answer>{{Back}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Pair, deck: Lang, fields: {Front: alpha, Back: first}}
    - {notetype: Pair, deck: Lang, fields: {Front: beta, Back: second}}
    - {notetype: Pair, deck: Default, fields: {Front: gamma, Back: third}}
steps:
  - http:
      body: {json: {action: guiBrowse, version: 6, params: {query: "deck:Lang"}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: ["#c1", "#c2"], error: null}}
  - interaction: {kind: GuiSelectCard, answer: {selected: true}}
  - http:
      body: {json: {action: guiSelectCard, version: 6, params: {card: "#c1"}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: true, error: null}}
  - interaction: {kind: GuiSelectCard, answer: {selected: false}}
  - http:
      body: {json: {action: guiSelectCard, version: 6, params: {card: "#c3"}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: false, error: null}}
