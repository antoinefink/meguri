# specs/servers/ankiconnect-gui G12 `add-no-config-write` (G6 core work step 4, G11).
# Meguri's own behavior (declared, servers/transcripts T13); all values are synthetic.
# Collection of G3's examples: n1, n2 in deck Lang (cards c1 < c2), n3 in Default (c3).
# no_effect: without attachments the request writes nothing, so curDeck, curModel and the Add defaults stay (the db_dump covers the col config).
id: servers/ankiconnect/gui/add-no-config-write
description: "guiAddCards changes no collection config"
tags: [gui]
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {activeCols: [noteFld, template, cardDue, deck, noteCrt]}
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{FrontSide}}<hr id=answer>{{Back}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Pair, deck: Lang, fields: {Front: alpha, Back: first}}
    - {notetype: Pair, deck: Lang, fields: {Front: beta, Back: second}}
    - {notetype: Pair, deck: Default, fields: {Front: gamma, Back: third}}
steps:
  - http:
      body: {json: {action: guiAddCards, version: 6, params: {note: {deckName: Lang, modelName: Pair, fields: {Front: delta, Back: fourth}, tags: [t1]}}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: 0, error: null}}
      no_effect: true
