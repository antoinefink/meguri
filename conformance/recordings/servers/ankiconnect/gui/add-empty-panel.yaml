# specs/servers/ankiconnect-gui G12 `add-empty-panel` (G6).
# Collection of G3's examples: n1, n2 in deck Lang (cards c1 < c2), n3 in Default (c3);
# activeCols with Created displayed. All values are synthetic.
# The picture is conformance/fixtures/servers/ankiconnect/pixel.png, inlined. Reply shape and the stored
# file only: what the Add panel shows is window behavior (G11).
id: servers/ankiconnect/gui/add-empty-panel
description: "guiAddCards with fields, tags and a picture"
tags: [no-origin]
server: ankiconnect
source: oracle
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  config: {activeCols: [noteFld, template, cardDue, deck, noteCrt]}
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{FrontSide}}<hr id=answer>{{Back}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Pair, deck: Lang, fields: {Front: alpha, Back: first}}
    - {notetype: Pair, deck: Lang, fields: {Front: beta, Back: second}}
    - {notetype: Pair, deck: Default, fields: {Front: gamma, Back: third}}
steps:
  - http:
      body:
        json:
          action: guiAddCards
          version: 6
          params:
            note:
              deckName: Lang
              modelName: Pair
              fields: {Front: delta, Back: fourth}
              tags: [t1, t2]
              picture: {data: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAAAAAA6fptVAAAACklEQVR42mNgAAAAAgAB5Sfe/AAAAABJRU5ErkJggg==", filename: shot.png, fields: [Back]}
  - observe: [{db_dump: {tables: [notes, cards]}}, media_dir]
