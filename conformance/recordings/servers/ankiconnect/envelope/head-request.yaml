# servers/ankiconnect-envelope E19.1 head-request (declared, servers/transcripts T13):
# HEAD runs the action as GET would and the reply has no body (E2, E18, R1734); Content-Length is not compared (servers/transcripts T8).
# Default settings, fresh collection (only deck Default), no Origin, so
# Access-Control-Allow-Origin is * (E7.3 row 4).
id: servers/ankiconnect/envelope/head-request
description: "HEAD: E5.1 headers, no body"
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      method: HEAD
      body: {json: {action: version, version: 6}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {empty: true}
