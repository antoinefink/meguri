# servers/ankiconnect-envelope E19.1 nan-token (declared, servers/transcripts T13):
# the token NaN is not JSON (E4, E18, R1734); sent as text.
# Default settings, fresh collection (only deck Default), no Origin, so
# Access-Control-Allow-Origin is * (E7.3 row 4).
id: servers/ankiconnect/envelope/nan-token
description: "NaN in the body: invalid JSON"
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      body: {text: '{"action":"version","version":6,"x":NaN}'}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: null, error: "invalid request: the body is not valid JSON"}}
