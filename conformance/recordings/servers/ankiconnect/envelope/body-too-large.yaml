# servers/ankiconnect-envelope E19.1 body-too-large (declared, servers/transcripts T13):
# a declared Content-Length of the limit (256 MiB) + 1: the body is not read, the error envelope, then close (E2, E3 row 3, servers/host-security H7.3, H8).
# Default settings, fresh collection (only deck Default), no Origin, so
# Access-Control-Allow-Origin is * (E7.3 row 4).
id: servers/ankiconnect/envelope/body-too-large
description: "Content-Length over the 256 MiB limit"
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      declared_length: 268435457
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*", connection: close}
      body: {json: {result: null, error: "Meguri: the request body is too large"}}
      closed: true
