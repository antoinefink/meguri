# specs/servers/ankiconnect-media X11.2 (baseline), X11.3 (the "baseline"
# rows), X11.6 table row 3, X14 external-folder tests "baseline" and "baseline
# referenced": the files present when the folder is granted are never copied
# by a scan, also after an edit; a note that references one copies that file
# alone, with its current bytes, and later scans leave it. Meguri only
# (declared). A = 61 0a, B = 62 0a; doc.pdf holds 64 0a, then 64 64 0a ("ZGQK"). All
# values are synthetic.
id: servers/ankiconnect/media/ext-baseline
description: files present at the grant are copied only when a note references them
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [D]
  notetypes:
    - name: Pair
      fields: [Term, Gloss]
      templates:
        - {name: Card 1, front: "{{Term}}", back: "{{FrontSide}}<hr>{{Gloss}}"}
      css: ".card{}"
steps:
  - media_dir_write: {name: a.mp3, text: "a\n"}
  - media_dir_write: {name: b.mp3, text: "b\n"}
  - media_dir_write: {name: doc.pdf, text: "d\n"}
  - media_dir_grant: {}
    expect:
      output: {baseline: 3}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 0, notices: []}
  - media_dir_write: {name: doc.pdf, text: "dd\n"}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 0, notices: []}
  - http:
      body: {json: {action: getMediaFilesNames, version: 6}}
    expect:
      status: 200
      body: {json: {result: [], error: null}}
  - http:
      body: {json: {action: addNote, version: 6, params: {note: {deckName: D, modelName: Pair, fields: {Term: word, Gloss: "<img src=\"doc.pdf\">"}}}}}
    expect:
      status: 200
      body: {json: {result: "#n1", error: null}}
  - http:
      body: {json: {action: getMediaFilesNames, version: 6}}
    expect:
      status: 200
      body: {json: {result: [doc.pdf], error: null}}
  - http:
      body: {json: {action: retrieveMediaFile, version: 6, params: {filename: doc.pdf}}}
    expect:
      status: 200
      body: {json: {result: "ZGQK", error: null}}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 0, notices: []}
equivalence:
  notes: ["#n1"]
