# specs/servers/ankiconnect-media X11.6 table row 2 (X11.4: exact-name write,
# no lowercasing), the hook form of the X14 test "case kept". Meguri only
# (declared). A = 61 0a. All values are synthetic.
id: servers/ankiconnect/media/ext-hook-case
description: a mixed-case external file referenced by addNote keeps its case
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [D]
  notetypes:
    - name: Pair
      fields: [Term, Gloss]
      templates:
        - {name: Card 1, front: "{{Term}}", back: "{{FrontSide}}<hr>{{Gloss}}"}
      css: ".card{}"
steps:
  - media_dir_write: {name: Clip.mp3, text: "a\n"}
  - http:
      body: {json: {action: addNote, version: 6, params: {note: {deckName: D, modelName: Pair, fields: {Term: word, Gloss: "[sound:Clip.mp3]"}}}}}
    expect:
      status: 200
      body: {json: {result: "#n1", error: null}}
  - http:
      body: {json: {action: getMediaFilesNames, version: 6}}
    expect:
      status: 200
      body: {json: {result: [Clip.mp3], error: null}}
equivalence:
  notes: ["#n1"]
