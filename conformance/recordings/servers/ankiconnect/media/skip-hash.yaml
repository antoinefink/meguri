# specs/servers/ankiconnect-media X14 `media/skip-hash` (X4 step 2, X10.2):
# skipHash is the MD5 hex of A = 61 0a. All values are synthetic.
id: servers/ankiconnect/media/skip-hash
description: addNote whose attachment skipHash matches its bytes
tags: [no-origin]
server: ankiconnect
source: oracle
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [D]
  notetypes:
    - name: Pair
      fields: [Term, Gloss]
      templates:
        - {name: Card 1, front: "{{Term}}", back: "{{FrontSide}}<hr>{{Gloss}}"}
      css: ".card{}"
steps:
  - http:
      body:
        json:
          action: addNote
          version: 6
          params:
            note:
              deckName: D
              modelName: Pair
              fields: {Term: word}
              audio: {filename: x.mp3, data: "YQo=", skipHash: "60b725f10c9c85c70d97880dfe8191b3", fields: [Term]}
  - observe: [{db_dump: {tables: [notes, cards]}}, media_dir]
