# specs/servers/ankiconnect-media X11.8 (collection_unavailable), X11.3, X14
# external-folder test "collection closed": a scan while the collection is
# closed (servers/transcripts T7.3 lifecycle) copies nothing, records the new
# file as pending and asks for a rescan; once the collection is open again the
# next scan copies it. Meguri only (declared). A = 61 0a. All values are
# synthetic.
id: servers/ankiconnect/media/ext-collection-closed
description: a scan with the collection closed records the file, and the next one copies it
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - media_dir_grant: {}
    expect:
      output: {baseline: 0}
  - lifecycle: close
  - media_dir_write: {name: clip.mp3, text: "a\n"}
  - media_dir_scan: {}
    expect:
      output: {status: collection_unavailable, rescan: true, ingested: 0, notices: []}
  - lifecycle: open
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 1, notices: []}
  - http:
      body: {json: {action: retrieveMediaFile, version: 6, params: {filename: clip.mp3}}}
    expect:
      status: 200
      body: {json: {result: "YQo=", error: null}}
