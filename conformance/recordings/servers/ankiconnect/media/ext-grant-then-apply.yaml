# specs/servers/ankiconnect-media X11.2 (second row of the order table), X11.1
# (suspension), X14 external-folder test "grant then apply": the config names
# the folder other while media-dir is granted, so the scan is suspended; once
# the config names media-dir too, only media-dir's new file is copied, never
# the file written into other. The folder other exists because apply_config
# creates it (servers/transcripts T4), and media_dir_write writes into the
# folder the config names at that step (T7.1). Meguri only (declared).
# A = 61 0a, B = 62 0a. All values are synthetic.
id: servers/ankiconnect/media/ext-grant-then-apply
description: a grant before the matching config apply keeps scans suspended until both are done
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - apply_config: {ankiconnect: {media_dir: {path: other}}}
    expect:
      output: {}
  - media_dir_grant: {path: media-dir}
    expect:
      output: {baseline: 0}
  - media_dir_write: {name: x.mp3, text: "a\n"}
  - media_dir_scan: {}
    expect:
      output: {status: suspended, rescan: false, ingested: 0, notices: []}
  - apply_config: {ankiconnect: {media_dir: {path: media-dir}}}
    expect:
      output: {}
  - media_dir_write: {name: y.mp3, text: "b\n"}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: true, ingested: 0, notices: []}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 1, notices: []}
  - http:
      body: {json: {action: getMediaFilesNames, version: 6}}
    expect:
      status: 200
      body: {json: {result: [y.mp3], error: null}}
