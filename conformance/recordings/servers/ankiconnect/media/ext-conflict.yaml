# specs/servers/ankiconnect-media X11.4 (last row of the guard, scan column),
# X11.9, X14 external-folder test "unrelated name": an external pic.png whose
# name holds unrelated content in collection media is not copied; the entry
# becomes conflict, the confirming scan reports one conflict notice (without
# its time, servers/transcripts T7.3) and posts it as a host event, and later
# scans stay quiet. The event's time is the scenario clock's start in Unix ms.
# Meguri only (declared). A = 61 0a, B = 62 0a. All values are synthetic.
id: servers/ankiconnect/media/ext-conflict
description: an external file never replaces unrelated collection media of the same name
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  media_files:
    - {name: pic.png, text: "a\n"}
steps:
  - media_dir_grant: {}
    expect:
      output: {baseline: 0}
  - media_dir_write: {name: pic.png, text: "b\n"}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: true, ingested: 0, notices: []}
  - media_dir_scan: {}
    expect:
      output:
        status: done
        rescan: false
        ingested: 0
        notices:
          - {external_name: pic.png, stored_name: null, kind: conflict}
  - events: {types: [media_ingest_notices]}
    expect:
      output:
        events:
          - type: media_ingest_notices
            notices:
              - {time: 1894698000000, external_name: pic.png, stored_name: null, kind: conflict}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 0, notices: []}
  - http:
      body: {json: {action: retrieveMediaFile, version: 6, params: {filename: pic.png}}}
    expect:
      status: 200
      body: {json: {result: "YQo=", error: null}}
  - http:
      body: {json: {action: getMediaFilesNames, version: 6}}
    expect:
      status: 200
      body: {json: {result: [pic.png], error: null}}
