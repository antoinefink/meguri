# specs/servers/ankiconnect-media X11.2 (first row of the order table), X11.1
# (suspension), X14 external-folder test "apply then grant": the config moves
# to the folder second while the index is media-dir's, so the scan is
# suspended and a file written then is in second's baseline, never copied;
# a file written after the grant is copied. The folder second exists because
# apply_config creates it (servers/transcripts T4), and media_dir_write writes
# into the folder the config names at that step (T7.1). Meguri only
# (declared). A = 61 0a, B = 62 0a. All values are synthetic.
id: servers/ankiconnect/media/ext-apply-then-grant
description: a config apply before the matching grant keeps scans suspended, and earlier files stay baseline
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - media_dir_grant: {}
    expect:
      output: {baseline: 0}
  - apply_config: {ankiconnect: {media_dir: {path: second}}}
    expect:
      output: {}
  - media_dir_write: {name: x.mp3, text: "a\n"}
  - media_dir_scan: {}
    expect:
      output: {status: suspended, rescan: false, ingested: 0, notices: []}
  - media_dir_grant: {path: second}
    expect:
      output: {baseline: 1}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 0, notices: []}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 0, notices: []}
  - media_dir_write: {name: y.mp3, text: "b\n"}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: true, ingested: 0, notices: []}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 1, notices: []}
  - http:
      body: {json: {action: getMediaFilesNames, version: 6}}
    expect:
      status: 200
      body: {json: {result: [y.mp3], error: null}}
