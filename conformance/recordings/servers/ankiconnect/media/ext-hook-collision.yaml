# specs/servers/ankiconnect-media X11.4 last row (note hook column), X11.6
# table row 6, X14 external-folder test "transformed collision": the
# transformed name ab.png holds unrelated content, so the bytes take
# media/media-files M3's hash name (M4: ab-<sha1 of B>.png) and the field
# references it. Meguri only (declared). A = 61 0a, B = 62 0a. All values are
# synthetic.
id: servers/ankiconnect/media/ext-hook-collision
description: an external file whose transformed name is taken by unrelated content gets the hash name
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [D]
  notetypes:
    - name: Pair
      fields: [Term, Gloss]
      templates:
        - {name: Card 1, front: "{{Term}}", back: "{{FrontSide}}<hr>{{Gloss}}"}
      css: ".card{}"
  media_files:
    - {name: ab.png, text: "a\n"}
steps:
  - media_dir_write: {name: "a?b.png", text: "b\n"}
  - http:
      body: {json: {action: addNote, version: 6, params: {note: {deckName: D, modelName: Pair, fields: {Term: word, Gloss: "<img src=\"a?b.png\">"}}}}}
    expect:
      status: 200
      body: {json: {result: "#n1", error: null}}
  - http:
      body: {json: {action: getMediaFilesNames, version: 6}}
    expect:
      status: 200
      body: {json: {result: [ab-89e6c98d92887913cadf06b2adb97f26cde4849b.png, ab.png], error: null}}
  - http:
      body: {json: {action: retrieveMediaFile, version: 6, params: {filename: ab.png}}}
    expect:
      status: 200
      body: {json: {result: "YQo=", error: null}}
  - http:
      body: {json: {action: notesInfo, version: 6, params: {notes: ["#n1"]}}}
    expect:
      status: 200
      body:
        json:
          error: null
          result:
            - noteId: "#n1"
              profile: "<profile>"
              modelName: Pair
              tags: []
              fields:
                Term: {value: word, order: 0}
                Gloss: {value: "<img src=\"ab-89e6c98d92887913cadf06b2adb97f26cde4849b.png\">", order: 1}
              mod: "@0"
              cards: ["#c1"]
equivalence:
  notes: ["#n1"]
