# specs/servers/ankiconnect-media X11.3 (first two rows and the "ingested,
# same" row), X11.8, X14 external-folder test "idempotent scan": after a grant
# of the empty folder, a new file is recorded by one scan and copied by the
# confirming scan; a third scan with no change copies nothing. The journal and
# index parts of that test stay Meguri's own (ankiconnect_extmedia.rs). Meguri
# only (declared). A = 61 0a. All values are synthetic.
id: servers/ankiconnect/media/ext-scan-idempotent
description: a new external file is copied by the confirming scan, and a repeated scan copies nothing
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - media_dir_grant: {}
    expect:
      output: {baseline: 0}
  - media_dir_write: {name: clip.mp3, text: "a\n"}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: true, ingested: 0, notices: []}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 1, notices: []}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 0, notices: []}
  - http:
      body: {json: {action: getMediaFilesNames, version: 6}}
    expect:
      status: 200
      body: {json: {result: [clip.mp3], error: null}}
  - http:
      body: {json: {action: retrieveMediaFile, version: 6, params: {filename: clip.mp3}}}
    expect:
      status: 200
      body: {json: {result: "YQo=", error: null}}
