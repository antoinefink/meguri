# specs/servers/ankiconnect-media X11.4 (target name: the external name when it
# is normalized; the exact-name write of media/media-files M6), X14
# external-folder test "case kept", scan form (the hook form is
# media/ext-hook-case): a scanned Clip.mp3 keeps its case. Meguri only
# (declared). A = 61 0a. All values are synthetic.
id: servers/ankiconnect/media/ext-scan-case
description: a scanned external file keeps the case of its name
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - media_dir_grant: {}
    expect:
      output: {baseline: 0}
  - media_dir_write: {name: Clip.mp3, text: "a\n"}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: true, ingested: 0, notices: []}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 1, notices: []}
  - http:
      body: {json: {action: getMediaFilesNames, version: 6}}
    expect:
      status: 200
      body: {json: {result: [Clip.mp3], error: null}}
