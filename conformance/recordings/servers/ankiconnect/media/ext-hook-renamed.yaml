# specs/servers/ankiconnect-media X11.6 table row 4 (X11.4 target name, X11.6
# step 3): an external name that text/media-filenames F1 changes is stored
# under its transformed name and the note's reference is rewritten. Meguri only
# (declared). A = 61 0a. All values are synthetic.
id: servers/ankiconnect/media/ext-hook-renamed
description: an external file whose name is not normalized is stored transformed and the field rewritten
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [D]
  notetypes:
    - name: Pair
      fields: [Term, Gloss]
      templates:
        - {name: Card 1, front: "{{Term}}", back: "{{FrontSide}}<hr>{{Gloss}}"}
      css: ".card{}"
steps:
  - media_dir_write: {name: "a?b.png", text: "a\n"}
  - http:
      body: {json: {action: addNote, version: 6, params: {note: {deckName: D, modelName: Pair, fields: {Term: word, Gloss: "<img src=\"a?b.png\">"}}}}}
    expect:
      status: 200
      body: {json: {result: "#n1", error: null}}
  - http:
      body: {json: {action: getMediaFilesNames, version: 6}}
    expect:
      status: 200
      body: {json: {result: [ab.png], error: null}}
  - http:
      body: {json: {action: notesInfo, version: 6, params: {notes: ["#n1"]}}}
    expect:
      status: 200
      body:
        json:
          error: null
          result:
            - noteId: "#n1"
              profile: "<profile>"
              modelName: Pair
              tags: []
              fields:
                Term: {value: word, order: 0}
                Gloss: {value: "<img src=\"ab.png\">", order: 1}
              mod: "@0"
              cards: ["#c1"]
equivalence:
  notes: ["#n1"]
