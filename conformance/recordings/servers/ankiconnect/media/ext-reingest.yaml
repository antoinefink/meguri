# specs/servers/ankiconnect-media X11.3 ("ingested, other" row), X11.4 (third
# row of the guard), X14 external-folder test "re-ingest": a changed external
# file is re-ingested under its stored name once stable; the old bytes go to
# the trash. The new content has another size, so the change is seen whatever
# file times the executor writes. Meguri only (declared). A = 61 0a,
# C = 62 62 0a. All values are synthetic.
id: servers/ankiconnect/media/ext-reingest
description: a changed external file replaces its earlier copy, the old bytes trashed
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - media_dir_grant: {}
    expect:
      output: {baseline: 0}
  - media_dir_write: {name: clip.mp3, text: "a\n"}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: true, ingested: 0, notices: []}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 1, notices: []}
  - media_dir_write: {name: clip.mp3, text: "bb\n"}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: true, ingested: 0, notices: []}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 1, notices: []}
  - http:
      body: {json: {action: retrieveMediaFile, version: 6, params: {filename: clip.mp3}}}
    expect:
      status: 200
      body: {json: {result: "YmIK", error: null}}
  - observe: [media_trash]
    expect:
      output:
        media_trash:
          - {name: clip.mp3, sha1: 3f786850e387550fdab836ed7e6dc881de23001b, size: 2}
