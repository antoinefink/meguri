# specs/servers/ankiconnect-media X11.3 ("pending, other" row and the
# paragraph after the table), X14 external-folder test "mid-write": a file that
# grows between two scans is copied only after two scans saw it unchanged,
# with all its bytes. The second content is longer, so the change is seen
# whatever file times the executor writes. Meguri only (declared).
# 61 0a 62 0a = "YQpiCg==". All values are synthetic.
id: servers/ankiconnect/media/ext-mid-write
description: an external file still being written is copied only once stable
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - media_dir_grant: {}
    expect:
      output: {baseline: 0}
  - media_dir_write: {name: part.mp3, text: "a"}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: true, ingested: 0, notices: []}
  - media_dir_write: {name: part.mp3, text: "a\nb\n"}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: true, ingested: 0, notices: []}
  - http:
      body: {json: {action: getMediaFilesNames, version: 6}}
    expect:
      status: 200
      body: {json: {result: [], error: null}}
  - media_dir_scan: {}
    expect:
      output: {status: done, rescan: false, ingested: 1, notices: []}
  - http:
      body: {json: {action: retrieveMediaFile, version: 6, params: {filename: part.mp3}}}
    expect:
      status: 200
      body: {json: {result: "YQpiCg==", error: null}}
