# specs/servers/ankiconnect-actions A20.3 `can-add-media` (A7.7, A18
# `ankiconnect-canadd-no-media`): canAddNote with a data attachment. The golden
# shows whether the add-on stored the file; Meguri stores nothing. Steps 2 and
# 3: an attachment that fails (an ftp url, X10.2 step 3) and has no `fields`;
# the add-on refuses the note, Meguri reads no attachment and can add it.
id: servers/ankiconnect/notes/can-add-media
description: canAddNote with an audio data attachment and with a failing attachment
tags: [no-origin]
server: ankiconnect
source: oracle
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [D]
  notetypes:
    - name: Pair
      fields: [Term, Gloss]
      templates:
        - {name: Card 1, front: "{{Term}}", back: "{{FrontSide}}<hr>{{Gloss}}"}
      css: ".card{}"
steps:
  - http:
      body:
        json:
          action: canAddNote
          version: 6
          params:
            note:
              deckName: D
              modelName: Pair
              fields: {Term: "x", Gloss: "y"}
              audio: {filename: a.mp3, data: "YQo=", fields: [Term]}
  - observe: [{db_dump: {tables: [notes, cards]}}, media_dir]
  - http:
      body:
        json:
          action: canAddNote
          version: 6
          params:
            note:
              deckName: D
              modelName: Pair
              fields: {Term: "x", Gloss: "y"}
              audio: {filename: x.mp3, url: "ftp://h/x"}
  - http:
      body:
        json:
          action: canAddNoteWithErrorDetail
          version: 6
          params:
            note:
              deckName: D
              modelName: Pair
              fields: {Term: "x", Gloss: "y"}
              audio: {filename: x.mp3, url: "ftp://h/x"}
  - observe: [{db_dump: {tables: [notes, cards]}}, media_dir]
