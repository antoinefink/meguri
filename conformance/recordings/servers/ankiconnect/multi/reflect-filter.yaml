# servers/ankiconnect-envelope E19.3 `multi/reflect-filter`: apiReflect drops a reference action Meguri does not implement (E10 row 6, E12.4).
# Meguri's own behavior (declared, servers/transcripts T13). Default settings
# unless given, fresh collection (deck Default only), no Origin, so
# Access-Control-Allow-Origin is * (E7.3); all values are synthetic.
id: servers/ankiconnect/multi/reflect-filter
description: "apiReflect v6 with addNote and guiReviewActive"
tags: [reflect]
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      body: {json: {action: apiReflect, version: 6, params: {scopes: [actions], actions: [addNote, guiReviewActive]}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: {scopes: [actions], actions: [addNote]}, error: null}}
