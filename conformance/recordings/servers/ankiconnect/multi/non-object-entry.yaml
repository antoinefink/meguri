# servers/ankiconnect-envelope E19.3 `multi/non-object-entry`: a non-object element fails the whole call (E11, E18).
# Meguri's own behavior (declared, servers/transcripts T13). Default settings
# unless given, fresh collection (deck Default only), no Origin, so
# Access-Control-Allow-Origin is * (E7.3); all values are synthetic.
id: servers/ankiconnect/multi/non-object-entry
description: "multi v6 with a number as its only element"
tags: [multi]
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      body: {json: {action: multi, version: 6, params: {actions: [1]}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: {result: null, error: "invalid parameter: actions"}}
      no_effect: true
