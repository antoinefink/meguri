# servers/ankiconnect-envelope E19.3 `multi/sub-readonly`: read-only mode refuses a mutating sub-action and serves a read (E11, E13).
# Meguri's own behavior (declared, servers/transcripts T13). Default settings
# unless given, fresh collection (deck Default only), no Origin, so
# Access-Control-Allow-Origin is * (E7.3); all values are synthetic.
id: servers/ankiconnect/multi/sub-readonly
description: "read-only on; deckNames and createDeck A inside multi"
tags: [multi]
server: ankiconnect
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
server_config: {read_only: true}
steps:
  - http:
      body: {json: {action: multi, params: {actions: [{action: deckNames}, {action: createDeck, params: {deck: A}}]}}}
    expect:
      status: 200
      headers: {content-type: application/json, access-control-allow-origin: "*", access-control-allow-headers: "*"}
      body: {json: [[Default], {result: null, error: "Meguri: the API is in read-only mode"}]}
      no_effect: true
