# servers/ankiconnect-envelope E19.3 `multi/not-atomic`: a failing sub-action stops nothing and undoes nothing (E11, R1753).
# Default settings, fresh collection (deck Default only), no Origin; synthetic values.
id: servers/ankiconnect/multi/not-atomic
description: "createDeck A, an unknown action, deckNames; deck A stays"
tags: [multi, no-origin]
server: ankiconnect
source: oracle
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      body: {json: {action: multi, version: 6, params: {actions: [{action: createDeck, params: {deck: A}}, {action: nope}, {action: deckNames}]}}}
  - observe: [{db_dump: {tables: [decks]}}]
