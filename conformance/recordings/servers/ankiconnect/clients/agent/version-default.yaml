# Agent sessions and scripts (servers/ankiconnect-clients C2 env G): no Origin,
# no Content-Type, no key. Setup is the common setup of C6.
# C3 row 1: a version-less call; the add-on defaults version to 4, so the reply is bare.
id: servers/ankiconnect/clients/agent/version-default
description: "version without a version member (bare reply)"
tags: [client:agent, no-origin]
server: ankiconnect
source: oracle
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [Lang, "Lang::Mining"]
  notetypes:
    - name: Vocab
      fields: [Word, Reading, Meaning, Audio, Picture]
      templates:
        - {name: Recognition, front: "{{Word}}", back: "{{FrontSide}}<hr id=answer>{{Meaning}}{{Audio}}{{Picture}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Vocab, deck: "Lang::Mining", fields: {Word: alpha, Meaning: first}, tags: [mined]}
    - {notetype: Vocab, deck: Lang, fields: {Word: beta, Meaning: second}}
  media_files:
    - {name: old.mp3, fill: {size: 16, byte: 0}}
steps:
  - http:
      body: {json: {action: version}}
