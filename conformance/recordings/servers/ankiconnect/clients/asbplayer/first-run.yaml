# servers/ankiconnect-clients C7 `asbplayer/first-run` (C3 rows 33, 34, 7), env A (C2, C5).
# Setup: C6, repeated here. All values are synthetic.
id: servers/ankiconnect/clients/asbplayer/first-run
description: createDeck twice, createModel, modelFieldNames
tags: [client:asbplayer]
server: ankiconnect
source: oracle
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [Lang, "Lang::Mining"]
  notetypes:
    - name: Vocab
      fields: [Word, Reading, Meaning, Audio, Picture]
      templates:
        - {name: Recognition, front: "{{Word}}", back: "{{FrontSide}}<hr id=answer>{{Meaning}}{{Audio}}{{Picture}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Vocab, deck: "Lang::Mining", fields: {Word: alpha, Meaning: first}, tags: [mined]}
    - {notetype: Vocab, deck: Lang, fields: {Word: beta, Meaning: second}}
  media_files:
    - {name: old.mp3, fill: {size: 16, byte: 0}}
steps:
  - http:
      headers: [[Origin, "chrome-extension://bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"], [Content-Type, application/json]]
      body: {json: {action: createDeck, version: 6, params: {deck: "Video::Mining"}}}
  - http:
      headers: [[Origin, "chrome-extension://bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"], [Content-Type, application/json]]
      body: {json: {action: createDeck, version: 6, params: {deck: "Video::Mining"}}}
  - http:
      headers: [[Origin, "chrome-extension://bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"], [Content-Type, application/json]]
      body:
        json:
          action: createModel
          version: 6
          params:
            modelName: Clip
            inOrderFields: [Sentence, Image]
            css: ".card {}"
            isCloze: false
            cardTemplates: [{Name: Card, Front: "{{Sentence}}", Back: "{{FrontSide}}<hr id=answer>{{Image}}"}]
  - http:
      headers: [[Origin, "chrome-extension://bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"], [Content-Type, application/json]]
      body: {json: {action: modelFieldNames, version: 6, params: {modelName: Clip}}}
