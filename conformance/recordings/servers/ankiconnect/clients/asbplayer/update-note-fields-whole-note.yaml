# servers/ankiconnect-clients C7 `asbplayer/update-note-fields-whole-note` (C3 rows 43), env A (C2, C5).
# Setup: C6, repeated here. All values are synthetic.
id: servers/ankiconnect/clients/asbplayer/update-note-fields-whole-note
description: updateNoteFields given a whole note plus id
tags: [client:asbplayer]
server: ankiconnect
source: oracle
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [Lang, "Lang::Mining"]
  notetypes:
    - name: Vocab
      fields: [Word, Reading, Meaning, Audio, Picture]
      templates:
        - {name: Recognition, front: "{{Word}}", back: "{{FrontSide}}<hr id=answer>{{Meaning}}{{Audio}}{{Picture}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Vocab, deck: "Lang::Mining", fields: {Word: alpha, Meaning: first}, tags: [mined]}
    - {notetype: Vocab, deck: Lang, fields: {Word: beta, Meaning: second}}
  media_files:
    - {name: old.mp3, fill: {size: 16, byte: 0}}
steps:
  - http:
      headers: [[Origin, "chrome-extension://bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"], [Content-Type, application/json]]
      body:
        json:
          action: updateNoteFields
          version: 6
          params:
            note:
              id: "#n2"
              deckName: Lang
              modelName: Vocab
              fields: {Meaning: whole}
              tags: [x]
              options: {allowDuplicate: true}
  - http:
      headers: [[Origin, "chrome-extension://bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"], [Content-Type, application/json]]
      body: {json: {action: notesInfo, version: 6, params: {notes: ["#n2"]}}}
  - observe: [{db_dump: {tables: [notes, cards]}}]
