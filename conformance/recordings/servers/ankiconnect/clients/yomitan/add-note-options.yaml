# servers/ankiconnect-clients C7 yomitan/add-note-options (C3 row 23, C9.5): the field name word is lower case (R1758).
# Common setup: servers/ankiconnect-clients C6. Envelope: Yomitan's (C2, C5):
# a synthetic extension Origin, Content-Type application/json, version 2.
id: servers/ankiconnect/clients/yomitan/add-note-options
description: "addNote with duplicate options, a duplicate, then allowDuplicate"
tags: [client:yomitan]
server: ankiconnect
source: oracle
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [Lang, "Lang::Mining"]
  notetypes:
    - name: Vocab
      fields: [Word, Reading, Meaning, Audio, Picture]
      templates:
        - {name: Recognition, front: "{{Word}}", back: "{{FrontSide}}<hr id=answer>{{Meaning}}{{Audio}}{{Picture}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Vocab, deck: "Lang::Mining", fields: {Word: alpha, Meaning: first}, tags: [mined]}
    - {notetype: Vocab, deck: Lang, fields: {Word: beta, Meaning: second}}
  media_files:
    - {name: old.mp3, fill: {size: 16, byte: 0}}
steps:
  - http:
      headers: [[Origin, "chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"], [Content-Type, application/json]]
      body: {json: {action: addNote, version: 2, params: {note: {deckName: "Lang::Mining", modelName: Vocab, fields: {word: gamma, Meaning: third}, tags: [y], options: {allowDuplicate: false, duplicateScope: deck, duplicateScopeOptions: {deckName: null, checkChildren: false, checkAllModels: false}}}}}}
  - http:
      headers: [[Origin, "chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"], [Content-Type, application/json]]
      body: {json: {action: addNote, version: 2, params: {note: {deckName: "Lang::Mining", modelName: Vocab, fields: {word: gamma, Meaning: third}, tags: [y], options: {allowDuplicate: false, duplicateScope: deck, duplicateScopeOptions: {deckName: null, checkChildren: false, checkAllModels: false}}}}}}
  - http:
      headers: [[Origin, "chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"], [Content-Type, application/json]]
      body: {json: {action: addNote, version: 2, params: {note: {deckName: "Lang::Mining", modelName: Vocab, fields: {word: gamma, Meaning: third}, tags: [y], options: {allowDuplicate: true, duplicateScope: deck, duplicateScopeOptions: {deckName: null, checkChildren: false, checkAllModels: false}}}}}}
  - observe: [{db_dump: {tables: [notes, cards]}}]
