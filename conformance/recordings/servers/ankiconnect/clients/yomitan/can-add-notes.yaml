# servers/ankiconnect-clients C7 yomitan/can-add-notes (C3 rows 21, 22).
# Common setup: servers/ankiconnect-clients C6. Envelope: Yomitan's (C2, C5):
# a synthetic extension Origin, Content-Type application/json, version 2.
id: servers/ankiconnect/clients/yomitan/can-add-notes
description: "canAddNotes and canAddNotesWithErrorDetail: duplicate, new, empty"
tags: [client:yomitan]
server: ankiconnect
source: oracle
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [Lang, "Lang::Mining"]
  notetypes:
    - name: Vocab
      fields: [Word, Reading, Meaning, Audio, Picture]
      templates:
        - {name: Recognition, front: "{{Word}}", back: "{{FrontSide}}<hr id=answer>{{Meaning}}{{Audio}}{{Picture}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Vocab, deck: "Lang::Mining", fields: {Word: alpha, Meaning: first}, tags: [mined]}
    - {notetype: Vocab, deck: Lang, fields: {Word: beta, Meaning: second}}
  media_files:
    - {name: old.mp3, fill: {size: 16, byte: 0}}
steps:
  - http:
      headers: [[Origin, "chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"], [Content-Type, application/json]]
      body: {json: {action: canAddNotes, version: 2, params: {notes: [{deckName: Lang, modelName: Vocab, fields: {Word: alpha}}, {deckName: Lang, modelName: Vocab, fields: {Word: gamma}}, {deckName: Lang, modelName: Vocab, fields: {Word: ""}}]}}}
  - http:
      headers: [[Origin, "chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"], [Content-Type, application/json]]
      body: {json: {action: canAddNotesWithErrorDetail, version: 2, params: {notes: [{deckName: Lang, modelName: Vocab, fields: {Word: alpha}}, {deckName: Lang, modelName: Vocab, fields: {Word: gamma}}, {deckName: Lang, modelName: Vocab, fields: {Word: ""}}]}}}
