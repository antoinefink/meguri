# servers/api-undo-history Y4 `add-notes` (Y5 reads it). No Origin, version 6.
# Baseline undo_status, then each write and undo_status with its rows.
# No-notes setup.
# All values are synthetic.
id: servers/ankiconnect/undo/add-notes
description: addNotes of two Pair notes, undo history before and after
tags: [undo-reference, no-origin]
server: ankiconnect
source: oracle
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [Lang]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{FrontSide}}<hr id=answer>{{Back}}"}
      css: ".card {font-size: 20px;}"
steps:
  - observe: [undo_status]
  - http:
      body: {json: {action: addNotes, version: 6, params: {notes: [{deckName: Lang, modelName: Pair, fields: {Front: gamma, Back: third}}, {deckName: Lang, modelName: Pair, fields: {Front: delta, Back: fourth}}]}}}
  - observe: [undo_status, {db_dump: {tables: [notes, cards]}}]
