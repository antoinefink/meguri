# servers/api-undo-history Y4 `remove-tags-then-clear` (Y5 reads it). No Origin, version 6.
# Baseline undo_status, then each write and undo_status with its rows.
# Chained: clearUnusedTags needs the unused tag the first write leaves.
# All values are synthetic.
id: servers/ankiconnect/undo/remove-tags-then-clear
description: removeTags spare from the second note, then clearUnusedTags, undo history around each
tags: [undo-reference, no-origin]
server: ankiconnect
source: oracle
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [Lang, Other, Spare]
  notetypes:
    - name: Pair
      fields: [Front, Back]
      templates:
        - {name: Card 1, front: "{{Front}}", back: "{{FrontSide}}<hr id=answer>{{Back}}"}
      css: ".card {font-size: 20px;}"
  notes:
    - {notetype: Pair, deck: Lang, fields: {Front: alpha, Back: first}, tags: [old]}
    - {notetype: Pair, deck: Lang, fields: {Front: beta, Back: second}, tags: [old, spare]}
  media_files:
    - {name: old.mp3, fill: {size: 16, byte: 0}}
steps:
  - observe: [undo_status]
  - http:
      body: {json: {action: removeTags, version: 6, params: {notes: ["#n2"], tags: spare}}}
  - observe: [undo_status, {db_dump: {tables: [notes, tags]}}]
  - http:
      body: {json: {action: clearUnusedTags, version: 6}}
  - observe: [undo_status, {db_dump: {tables: [tags]}}]
