# servers/migaku-received-log L17 `retry-busy` (declared, servers/transcripts T13).
# Switch off (T4.1 default): a card sent while the collection is exclusive
# fails after 5 s with Meguri is busy, a Failed row with its payload kept
# (servers/migaku-receive P14, P20). Once the collection is ready, Retry runs
# the payload from stage 1 at the Retry instant (L14): created, the same row
# Created with the note, the payload deleted, the receive time still the first
# arrival (2030-01-15T09:00:00Z), and no second row.
# Relies on a servers/transcripts T10.1 rule proposed with this file:
# entities get tokens after every step, not only after exchanges (the note a
# Retry or a drain creates is the next #nN).
# The collection holds servers/migaku-receive P24's 11-field note type T-Mining
# (#m7, the first setup note type, servers/transcripts T10.1) and the decks DE
# (#d1) and DE::Mining (#d2). Profiles are servers/transcripts T5.1 values,
# saved in list order on a new store, so the first has id 1; a profile without
# field_map infers R1712's map (servers/migaku-routing D4). L16 calls are
# `received` steps (T7.3), read in the JSON form of L16.1. No Origin, so
# Access-Control-Allow-Origin is * (servers/migaku-protocol P6). All content is
# synthetic.
id: servers/migaku/moves/retry-busy
description: "Retry of a busy Failed row creates the note and updates the same row"
tags: ["moves"]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: ["DE", "DE::Mining"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
migaku_routing:
  profiles:
    - {name: "DE", language: "de", notetype: "T-Mining", deck: "DE::Mining", defaults: {"Is Vocabulary Card": "x", "Is Audio Card": "x"}}
  override: "DE"
steps:
  - lifecycle: exclusive
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {"targetWord": "Hund[Hund,nn,m]", "sentence": "Der Hund."}}
      async: b
  - wait: 1s
  - advance: 5s
  - await: b
    expect:
      status: 400
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: false, error: "Meguri is busy"}}
  - lifecycle: ready
  - received: {call: row, row: "#r1"}
    expect:
      output_at:
        "/status": "Failed"
        "/error": "Meguri is busy"
        "/payload": true
        "/receive_time": 1894698000000
  - advance: 1m
  - received: {call: retry, row: "#r1"}
    expect:
      output: {result: created, note: "#n1"}
  - received: {call: row, row: "#r1"}
    expect:
      output_at:
        "/status": "Created"
        "/payload": false
        "/note": "#n1"
        "/decision": "Override"
        "/receive_time": 1894698000000
  - logs: {}
    expect:
      output_at:
        "/received": 1
