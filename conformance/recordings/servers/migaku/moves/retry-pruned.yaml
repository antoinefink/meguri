# servers/migaku-received-log L17 `retry-pruned` (declared, servers/transcripts T13).
# An empty body fails with the "nothing to add" error (servers/migaku-receive
# P7, P19): a Failed row with its payload. The payload is deleted 7 days after
# the failed instant (L5): a prune pass 6 days later keeps it, one 8 days later
# deletes it. The row stays (it is within 30 days), and Retry returns
# retry_unavailable (L14).
# The collection holds servers/migaku-receive P24's 11-field note type T-Mining
# (#m7, the first setup note type, servers/transcripts T10.1) and the decks DE
# (#d1) and DE::Mining (#d2). Profiles are servers/transcripts T5.1 values,
# saved in list order on a new store, so the first has id 1; a profile without
# field_map infers R1712's map (servers/migaku-routing D4). L16 calls are
# `received` steps (T7.3), read in the JSON form of L16.1. No Origin, so
# Access-Control-Allow-Origin is * (servers/migaku-protocol P6). All content is
# synthetic.
id: servers/migaku/moves/retry-pruned
description: "a Failed row's payload is pruned after 7 days and Retry is then unavailable"
tags: ["moves"]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: ["DE", "DE::Mining"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
migaku_routing:
  profiles:
    - {name: "DE", language: "de", notetype: "T-Mining", deck: "DE::Mining", defaults: {"Is Vocabulary Card": "x", "Is Audio Card": "x"}}
  override: "DE"
steps:
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {}}
    expect:
      status: 400
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: false, error: "Nothing to add: every mapped field is empty."}}
  - received: {call: row, row: "#r1"}
    expect:
      output_at:
        "/status": "Failed"
        "/payload": true
  - advance: 6d
  - prune: {}
  - received: {call: row, row: "#r1"}
    expect:
      output_at:
        "/status": "Failed"
        "/payload": true
  - advance: 2d
  - prune: {}
  - received: {call: row, row: "#r1"}
    expect:
      output_at:
        "/status": "Failed"
        "/payload": false
        "/error": "Nothing to add: every mapped field is empty."
  - received: {call: retry, row: "#r1"}
    expect:
      output: {result: retry_unavailable}
