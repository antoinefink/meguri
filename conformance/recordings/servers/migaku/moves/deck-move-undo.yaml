# servers/migaku-received-log L17 `deck-move-undo` (declared, servers/transcripts T13).
# A card received into DE (override), then the override set back to Automatic.
# The move to DE2 changes the card's deck to DE::Other; undo puts it back in
# DE::Mining and the row is Created, redo moves it again (L13's deck-move
# patterns). The decision is Manual after each.
# DE2 shares DE's note type, so the move is a deck move (L10, L11). Each
# move, undo and redo calls record_manual_move with the profile the card now
# belongs to (L13). That call has no output; the scenario sees it through the
# D10 ties sent 5 minutes later (servers/migaku-routing D11 step 4): each goes
# to the last route's profile with route `recent`. Without the calls they would
# go to the fallback profile DE (the override commit counted for DE, D12).
# The collection holds servers/migaku-receive P24's 11-field note type T-Mining
# (#m7, the first setup note type, servers/transcripts T10.1) and the decks DE
# (#d1), DE::Mining (#d2) and DE::Other (#d3). Profiles are servers/transcripts
# T5.1 values, saved in list order on a new store, so the first has id 1; a
# profile without field_map infers R1712's map (servers/migaku-routing D4). L16
# calls are `received` steps (T7.3), read in the JSON form of L16.1. No Origin,
# so Access-Control-Allow-Origin is * (servers/migaku-protocol P6). All content
# is synthetic.
id: servers/migaku/moves/deck-move-undo
description: "a deck move, its undo and its redo each update the row and the last route"
tags: ["moves"]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: ["DE", "DE::Mining", "DE::Other"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
migaku_routing:
  profiles:
    - {name: "DE", language: "de", notetype: "T-Mining", deck: "DE::Mining", defaults: {"Is Vocabulary Card": "x", "Is Audio Card": "x"}}
    - {name: "DE2", language: "de", notetype: "T-Mining", deck: "DE::Other", defaults: {"Is Vocabulary Card": "x", "Is Audio Card": "x"}}
  override: "DE"
steps:
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {"targetWord": "Hund[Hund,nn,m]", "sentence": "Der Hund.", "translation": "Alpha 2.", "definitions": "<p>Alpha 3.</p>", "sentenceAudio": [{"id": "s1", "input": "data:audio/mp4;base64,AAAAGGZ0eXBNNEEgAAAAAE00QSBpc29t"}]}}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: true, created: true, id: "#n1"}}
  - routing: {set_override: null}
  - advance: 1m
  - received: {call: move, rows: ["#r1"], profile: 2, deck_only: false}
    expect:
      output: [{row: "#r1", result: deck_move}]
  - received: {call: row, row: "#r1"}
    expect:
      output_at:
        "/status": "Moved"
        "/decision": "Manual"
        "/note": "#n1"
        "/profile/name": "DE2"
  - observe: [{db_dump: {tables: [cards]}}]
    expect:
      output_at:
        "/db_dump/cards/#c1/did": "#d3"
  - advance: 5m
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {"targetWord": "Café", "sentence": "Ist das Café zu?"}}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: true, created: true, id: "#n2"}}
  - received: {call: row, row: "#r2"}
    expect:
      output_at:
        "/route": "recent"
        "/decision": "Fallback"
        "/profile/name": "DE2"
  - collection: {undo: {}}
  - received: {call: row, row: "#r1"}
    expect:
      output_at:
        "/status": "Created"
        "/decision": "Manual"
        "/note": "#n1"
        "/profile/name": "DE"
  - observe: [{db_dump: {tables: [cards]}}]
    expect:
      output_at:
        "/db_dump/cards/#c1/did": "#d2"
  - advance: 5m
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {"targetWord": "Peña", "sentence": "Peña und Kühn"}}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: true, created: true, id: "#n3"}}
  - received: {call: row, row: "#r3"}
    expect:
      output_at:
        "/route": "recent"
        "/profile/name": "DE"
  - collection: {redo: {}}
  - received: {call: row, row: "#r1"}
    expect:
      output_at:
        "/status": "Moved"
        "/decision": "Manual"
        "/profile/name": "DE2"
  - observe: [{db_dump: {tables: [cards]}}]
    expect:
      output_at:
        "/db_dump/cards/#c1/did": "#d3"
  - advance: 5m
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {"targetWord": "streng[streng,adj,|streng,adv,]", "sentence": "Streng vertraulich."}}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: true, created: true, id: "#n4"}}
  - received: {call: row, row: "#r4"}
    expect:
      output_at:
        "/route": "recent"
        "/profile/name": "DE2"
