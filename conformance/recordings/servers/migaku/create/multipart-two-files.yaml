# servers/migaku-received-log C5 `multipart-two-files` (declared, servers/transcripts T13).
# Multipart form (C1): `version` 2; a `card` whose Sentence is "Ein Text.",
# whose Sentence Audio is [sound:Clip.m4a] and whose tags are ["legacy"]; and
# two `files` parts, Clip.m4a (P24's M4A bytes) and pic.png. New names are
# stored lowercased (media/media-files M3 row b), so Clip.m4a is stored as
# clip.m4a and the field is rewritten to [sound:clip.m4a] (C2 step 6). Reply
# 200 {"id": <note id>} (C2 step 9), the note being #n1 (T10.1); the `id`
# member needs a T10.5 id position for Migaku replies (see the session's
# proposals).
# The T14 equivalence check of #n1 compares the note (type, deck, fields, tags)
# with Anki's add of the same fields, and the file the fields reference by name
# and SHA-256. It does not prove the rewrite: a Meguri that kept
# [sound:Clip.m4a] and stored Clip.m4a would agree with Anki's add of that
# record too. pic.png is referenced by no field, so T14 does not see it. Its
# bytes are a text stub: a text body cannot send the PNG signature byte 0x89
# as one byte, and a base64 body would lose T10.2's ${#m7} substitution.
# C5's defaults from profile DE (Is Vocabulary Card and Is Audio Card x) are
# not set up: no profile is stored, so both fields stay empty here. The stored
# files and the Created/Manual row have no check in T13 yet.
# The collection holds P24's 11-field note type T-Mining (#m7, the first setup
# note type, servers/transcripts T10.1) and the decks DE (#d1) and DE::Mining
# (#d2, C5's <D>), created in that order. No Migaku profile is stored: the
# transcript format has no step or setup section for profiles (see the session's
# proposals), and nothing this scenario checks depends on one. No Origin, so
# Access-Control-Allow-Origin is * and no Vary (servers/migaku-protocol P3.1,
# P6). All content is synthetic.
id: servers/migaku/create/multipart-two-files
description: "a card with two files: the audio is stored lowercased and the field follows"
tags: [create]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [DE, "DE::Mining"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
steps:
  - http:
      method: POST
      target: /create
      headers:
        - [Content-Type, "multipart/form-data; boundary=b0b0b0"]
      body: {text: "--b0b0b0\r\nContent-Disposition: form-data; name=\"version\"\r\n\r\n2\r\n--b0b0b0\r\nContent-Disposition: form-data; name=\"card\"\r\n\r\n{\"noteTypeId\":${#m7},\"deckId\":${#d2},\"fields\":[{\"name\":\"Sentence\",\"content\":\"Ein Text.\"},{\"name\":\"Sentence Audio\",\"content\":\"[sound:Clip.m4a]\"}],\"tags\":[\"legacy\"]}\r\n--b0b0b0\r\nContent-Disposition: form-data; name=\"files\"; filename=\"Clip.m4a\"\r\nContent-Type: audio/mp4\r\n\r\n\u0000\u0000\u0000\u0018ftypM4A \u0000\u0000\u0000\u0000M4A isom\r\n--b0b0b0\r\nContent-Disposition: form-data; name=\"files\"; filename=\"pic.png\"\r\nContent-Type: image/png\r\n\r\nGamma\r\n--b0b0b0--\r\n"}
    expect:
      status: 200
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
      body: {json: {id: "#n1"}}
equivalence:
  notes: ["#n1"]
