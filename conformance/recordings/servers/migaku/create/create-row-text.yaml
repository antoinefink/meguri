# servers/migaku-received-log C5 `create-row-text` (declared, servers/transcripts T13).
# Multipart form (C1): `version` 2 and a `card` with Target Word
# <b>Hund[Hund,nn,m]</b> and Sentence "Der Hund.". Reply 200 {"id": <note id>}
# (C2 step 9, servers/transcripts T10.5), the note being #n1. The stored fields
# keep the HTML and the brackets, and the empty flags take profile DE's
# defaults (C2 step 5).
# The row's target word and snippet come from the fields that profile DE's plan
# maps to targetWord and sentence (C2 step 10): Target Word, bracket syntax
# removed (servers/migaku-syntax S5) and HTML stripped (text/strip-html H4),
# gives Hund; Sentence gives "Der Hund.". The T14 equivalence check of #n1
# compares the stored fields with Anki's add of the same fields.
# The collection holds servers/migaku-receive P24's 11-field note type T-Mining
# (#m7, the first setup note type, servers/transcripts T10.1) and the decks DE
# (#d1) and DE::Mining (#d2, C5's <D>), created in that order. Profile DE
# (servers/transcripts T5.1: T-Mining, DE::Mining, defaults Is Vocabulary Card
# and Is Audio Card x, R1712's inferred map) is the matching profile of C2 step
# 4; on a new store it has id 1. No Origin, so Access-Control-Allow-Origin is *
# and no Vary (servers/migaku-protocol P3.1, P6). All content is synthetic.
id: servers/migaku/create/create-row-text
description: "a created card's stored fields, profile DE's defaults and the row's target word and snippet"
tags: [create]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [DE, "DE::Mining"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
migaku_routing:
  profiles:
    - {name: "DE", language: "de", notetype: "T-Mining", deck: "DE::Mining", defaults: {"Is Vocabulary Card": "x", "Is Audio Card": "x"}}
steps:
  - http:
      method: POST
      target: /create
      headers:
        - [Content-Type, "multipart/form-data; boundary=b0b0b0"]
      body: {text: "--b0b0b0\r\nContent-Disposition: form-data; name=\"version\"\r\n\r\n2\r\n--b0b0b0\r\nContent-Disposition: form-data; name=\"card\"\r\n\r\n{\"noteTypeId\":${#m7},\"deckId\":${#d2},\"fields\":[{\"name\":\"Sentence\",\"content\":\"Der Hund.\"},{\"name\":\"Target Word\",\"content\":\"<b>Hund[Hund,nn,m]</b>\"}]}\r\n--b0b0b0--\r\n"}
    expect:
      status: 200
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
      body: {json: {id: "#n1"}}
  - observe: [{db_dump: {tables: [notes]}}]
    expect:
      output_at:
        "/db_dump/notes/#n1/flds": "Der Hund.\u001f\u001f<b>Hund[Hund,nn,m]</b>\u001f\u001f\u001f\u001f\u001f\u001f\u001fx\u001fx"
  - received: {call: row, row: "#r1"}
    expect:
      output_at:
        "/endpoint": "create"
        "/status": "Created"
        "/decision": "Manual"
        "/profile/name": "DE"
        "/target_word": "Hund"
        "/snippet": "Der Hund."
        "/warnings": ["front_would_be_empty"]
equivalence:
  notes: ["#n1"]
