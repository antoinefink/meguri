# servers/migaku-received-log C5 `version-mismatch` (declared, servers/transcripts T13).
# A card form whose `version` is not exactly 2 gets HTTP 200 in plain text with
# the mismatch message, and nothing else happens (C2 step 1, L18 Q1;
# servers/migaku-protocol P8.1 for the content type): no_effect covers the
# collection and the media folder, `logs` the absence of a row.
# The `card` value, before form encoding (C1: `+` is a space, then
# percent-decoding):
# {"noteTypeId":<T>,"deckId":<D>,"fields":[{"name":"Sentence","content":"Alpha
# 1."},{"name":"Translation","content":"Alpha 2."}]}
# The collection holds servers/migaku-receive P24's 11-field note type T-Mining
# (#m7, the first setup note type, servers/transcripts T10.1) and the decks DE
# (#d1) and DE::Mining (#d2, C5's <D>), created in that order. No Migaku
# profile is stored; nothing this scenario checks depends on one. No Origin, so
# Access-Control-Allow-Origin is * and no Vary (servers/migaku-protocol P3.1,
# P6). All content is synthetic.
id: servers/migaku/create/version-mismatch
description: "version 1 gets the plain-text mismatch reply and changes nothing"
tags: [create]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: [DE, "DE::Mining"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
steps:
  - http:
      method: POST
      target: /create
      headers:
        - [Content-Type, application/x-www-form-urlencoded]
      body: {text: "version=1&card=%7B%22noteTypeId%22%3A${#m7}%2C%22deckId%22%3A${#d2}%2C%22fields%22%3A%5B%7B%22name%22%3A%22Sentence%22%2C%22content%22%3A%22Alpha+1.%22%7D%2C%7B%22name%22%3A%22Translation%22%2C%22content%22%3A%22Alpha+2.%22%7D%5D%7D"}
    expect:
      status: 200
      headers:
        content-type: "text/plain; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
      body: {text: "Card could not be created: Version mismatch"}
      no_effect: true
  - logs: {}
    expect:
      output_at:
        "/received": 0
