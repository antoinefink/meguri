# servers/migaku-receive P24 `pending-replaced` (declared, servers/transcripts T13).
# Switch on. The entry waits with the plan of its arrival (P15). The
# replacement (T7.3 lifecycle replace) holds only the stock note types and
# N::Mining, so the T-Mining id that profile DE stores names no note type,
# whichever instant the new collection is built at (the stock kinds take
# now_ms to now_ms + 5, T10.1; T-Mining had clock.start + 6). It has no
# DE::Mining either: the drain fails with the note type message, which wins
# over the deck message (P19), and adds no note. Ready follows the
# replacement, since the exclusive phase is still held. A profile N on the
# stock Basic is then saved and forced (T7.3 routing; profile ids are the
# store's, DE 1 and N 2); the sentinel request reaches the FIFO after the
# entry, so its reply shows the drain finished (P13).
# The collection holds P24's 11-field note type T-Mining (the first setup note
# type, #m7, servers/transcripts T10.1) and the profile decks. Profiles are
# servers/transcripts T5.1 values; a profile without field_map infers R1712's
# map (servers/migaku-routing D4). No Origin, so Access-Control-Allow-Origin
# is * (servers/migaku-protocol P6). All content is synthetic.
id: servers/migaku/receive/pending-replaced
description: "a pending entry whose note type is gone after a collection replacement fails"
tags: ["receive"]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
host_env: {migaku_pending_switch: true}
setup:
  decks: ["DE::Mining"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
migaku_routing:
  profiles:
    - {name: "DE", language: "de", notetype: "T-Mining", deck: "DE::Mining", defaults: {"Is Vocabulary Card": "x", "Is Audio Card": "x"}}
  override: "DE"
steps:
  - lifecycle: exclusive
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Hund", sentence: "Der Hund."}}
      async: r
  - wait: 1s
  - advance: 5s
  - await: r
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: true, created: false}}
  - lifecycle: {replace: {decks: ["N::Mining"]}}
  - lifecycle: ready
  - routing: {save_profile: {name: N, language: de, notetype: Basic, deck: "N::Mining", field_map: {Front: targetWord, Back: sentence}}}
  - routing: {set_override: 2}
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Omega", sentence: "Omega omega."}}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: true, created: true, id: "#n1"}}
  - observe: [{db_dump: {tables: [notes]}}, media_dir]
    expect:
      output_at:
        "/db_dump/notes/#n1/flds": "Omega\u001fOmega omega."
        "/db_dump/notes/#n2": null
  - received_log: {}
    expect:
      output_at:
        "/rows/0/status": "Failed"
        "/rows/0/profile": "DE"
        "/rows/0/error": "Destination note type for DE no longer exists."
        "/rows/1/status": "Created"
        "/rows/1/profile": "N"
        "/rows/1/note": "#n1"
        "/rows/2": null
equivalence:
  notes: ["#n1"]
