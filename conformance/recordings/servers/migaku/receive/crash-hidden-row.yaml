# servers/migaku-receive P24 `crash-hidden-row` (declared, servers/transcripts T13).
# The fault hook stops the host after P17 step 1 (intent and hidden row
# written) and before the op runs (T7.3 migaku_crash before_op). After the
# restart the GUID is absent, so the intent is discarded and the hidden row
# becomes a visible Failed row with the internal error and its payload (P17).
# That the row was never readable before the restart is checked in Meguri's
# own tests (P24).
# The collection holds P24's 11-field note type T-Mining (the first setup note
# type, #m7, servers/transcripts T10.1) and the profile decks. Profiles are
# servers/transcripts T5.1 values; a profile without field_map infers R1712's
# map (servers/migaku-routing D4). No Origin, so Access-Control-Allow-Origin
# is * (servers/migaku-protocol P6). All content is synthetic.
id: servers/migaku/receive/crash-hidden-row
description: "a crash before the op leaves no note and one Failed row"
tags: ["receive"]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: ["DE::Mining"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
migaku_routing:
  profiles:
    - {name: "DE", language: "de", notetype: "T-Mining", deck: "DE::Mining", defaults: {"Is Vocabulary Card": "x", "Is Audio Card": "x"}}
  override: "DE"
steps:
  - fault: {migaku_crash: {point: before_op}}
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Hund", sentence: "Der Hund."}}
    expect: {outcome: closed_without_reply}
  - restart_host: {}
  - observe: [{db_dump: {tables: [notes]}}, media_dir]
    expect:
      output_at:
        "/db_dump/notes": {}
        "/media_dir": {}
  - received_log: {}
    expect:
      output_at:
        "/rows/0/status": "Failed"
        "/rows/0/error": "Meguri could not add the card."
        "/rows/1": null
