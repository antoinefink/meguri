# servers/migaku-receive P24 `retry-empty-ids` (declared, servers/transcripts T13).
# The same body twice, 60 s apart. Its one item has the id "", so the retry key
# never matches (P12) and each request adds a note. Each file gets 11 random
# hex digits as its name (P10 step 1); those names have no transcript form
# yet, so the two files are checked in Meguri's own tests (P24). Profile DE
# maps Images to images here, so the image is used.
# The collection holds P24's 11-field note type T-Mining (the first setup note
# type, #m7, servers/transcripts T10.1) and the profile decks. Profiles are
# servers/transcripts T5.1 values; a profile without field_map infers R1712's
# map (servers/migaku-routing D4). No Origin, so Access-Control-Allow-Origin
# is * (servers/migaku-protocol P6). All content is synthetic.
id: servers/migaku/receive/retry-empty-ids
description: "an item with an empty id never matches a retry"
tags: ["receive"]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: ["DE::Mining"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
migaku_routing:
  profiles:
    - {name: "DE", language: "de", notetype: "T-Mining", deck: "DE::Mining", defaults: {"Is Vocabulary Card": "x", "Is Audio Card": "x"}, field_map: {Sentence: "sentence", Translation: "translation", "Target Word": "targetWord", Definitions: "definitions", Screenshot: "none", "Sentence Audio": "sentenceAudio", "Word Audio": "wordAudio", Images: "images", "Example Sentences": "exampleSentences"}}
  override: "DE"
steps:
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Alpha", sentence: "Alpha.", images: [{id: "", src: "data:image/gif;base64,R0lGODlhAQABAAAAAA=="}]}}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: true, created: true, id: "#n1"}}
  - advance: 60s
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Alpha", sentence: "Alpha.", images: [{id: "", src: "data:image/gif;base64,R0lGODlhAQABAAAAAA=="}]}}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: true, created: true, id: "#n2"}}
equivalence:
  notes: ["#n1", "#n2"]
