# servers/migaku-receive P24 `busy-three-off` (declared, servers/transcripts T13).
# As busy-three with the switch off: each request replies 400 Meguri is busy at
# 5, 6 and 7 s, writes a Failed row and queues nothing (P14). The sentinel
# after Ready gets #n1, so no entry drained before it.
# The collection holds P24's 11-field note type T-Mining (the first setup note
# type, #m7, servers/transcripts T10.1) and the profile decks. Profiles are
# servers/transcripts T5.1 values; a profile without field_map infers R1712's
# map (servers/migaku-routing D4). No Origin, so Access-Control-Allow-Origin
# is * (servers/migaku-protocol P6). All content is synthetic.
id: servers/migaku/receive/busy-three-off
description: "switch off: three busy requests each fail at their own 5 s mark"
tags: ["receive"]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: ["DE::Mining"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
migaku_routing:
  profiles:
    - {name: "DE", language: "de", notetype: "T-Mining", deck: "DE::Mining", defaults: {"Is Vocabulary Card": "x", "Is Audio Card": "x"}}
  override: "DE"
steps:
  - lifecycle: exclusive
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Alpha", sentence: "Alpha."}}
      async: a
  - wait: 1s
  - advance: 1s
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Beta", sentence: "Beta."}}
      async: b
  - wait: 1s
  - advance: 1s
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Gamma", sentence: "Gamma."}}
      async: c
  - wait: 1s
  - advance: 3s
  - await: a
    expect:
      status: 400
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: false, error: "Meguri is busy"}}
  - advance: 1s
  - await: b
    expect:
      status: 400
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: false, error: "Meguri is busy"}}
  - advance: 1s
  - await: c
    expect:
      status: 400
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: false, error: "Meguri is busy"}}
  - advance: 3s
  - lifecycle: ready
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Omega", sentence: "Omega omega."}}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: true, created: true, id: "#n1"}}
  - observe: [{db_dump: {tables: [notes]}}, media_dir]
    expect:
      output_at:
        "/db_dump/notes/#n1/flds": "Omega omega.\u001f\u001fOmega\u001f\u001f\u001f\u001f\u001f\u001f\u001fx\u001fx"
        "/db_dump/notes/#n2": null
  - received_log: {}
    expect:
      output_at:
        "/rows/0/status": "Failed"
        "/rows/1/status": "Failed"
        "/rows/2/status": "Failed"
        "/rows/3/status": "Created"
        "/rows/3/note": "#n1"
        "/rows/4": null
equivalence:
  notes: ["#n1"]
