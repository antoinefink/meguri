# servers/migaku-receive P24 `no-field-mapped` (declared, servers/transcripts T13).
# Profile X gives every field the source none (servers/migaku-routing D2.1
# saves it; D7.1's last check refuses it), so the request fails with the
# string the extension knows (P7, R1703). The row is Failed.
# The collection holds P24's 11-field note type T-Mining (the first setup note
# type, #m7, servers/transcripts T10.1) and the profile decks. Profiles are
# servers/transcripts T5.1 values; a profile without field_map infers R1712's
# map (servers/migaku-routing D4). No Origin, so Access-Control-Allow-Origin
# is * (servers/migaku-protocol P6). All content is synthetic.
id: servers/migaku/receive/no-field-mapped
description: "a profile that maps no field refuses every card"
tags: ["receive"]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: ["X::Mining"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
migaku_routing:
  profiles:
    - {name: "X", language: "de", notetype: "T-Mining", deck: "X::Mining", field_map: {Sentence: "none", Translation: "none", "Target Word": "none", Definitions: "none", Screenshot: "none", "Sentence Audio": "none", "Word Audio": "none", Images: "none", "Example Sentences": "none", "Is Vocabulary Card": "none", "Is Audio Card": "none"}}
  override: "X"
steps:
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Hund", sentence: "Der Hund."}}
    expect:
      status: 400
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: false, error: "No fields to map to."}}
      no_effect: true
  - received_log: {}
    expect:
      output_at:
        "/rows/0/status": "Failed"
        "/rows/0/error": "No fields to map to."
        "/rows/1": null
