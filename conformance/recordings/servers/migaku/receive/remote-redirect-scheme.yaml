# servers/migaku-receive P24 `remote-redirect-scheme` (declared, servers/transcripts T13),
# the half without Location: a 302 entry without redirect_to is sent with no
# Location (conformance/editor-ops E2), which P8 reports as HTTP 302. The half
# that redirects to ftp:// needs a cross-scheme Location that D6.9 cannot
# serve; it runs in Meguri's own tests (P24).
# The collection holds P24's 11-field note type T-Mining (the first setup note
# type, #m7, servers/transcripts T10.1) and the profile decks. Profiles are
# servers/transcripts T5.1 values; a profile without field_map infers R1712's
# map (servers/migaku-routing D4). No Origin, so Access-Control-Allow-Origin
# is * (servers/migaku-protocol P6). All content is synthetic.
id: servers/migaku/receive/remote-redirect-scheme
description: "a 302 without Location is a non-2xx status"
tags: ["receive"]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
setup:
  decks: ["DE::Mining"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
  http_fixtures:
    - {path: /no-loc, status: 302}
migaku_routing:
  profiles:
    - {name: "DE", language: "de", notetype: "T-Mining", deck: "DE::Mining", defaults: {"Is Vocabulary Card": "x", "Is Audio Card": "x"}}
  override: "DE"
steps:
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Hund", sentence: "Der Hund.", sentenceAudio: [{id: "n1", input: "${fixture_base}/no-loc"}]}}
    expect:
      status: 400
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: false, error: "Could not download sentenceAudio item 1: HTTP 302."}}
      no_effect: true
