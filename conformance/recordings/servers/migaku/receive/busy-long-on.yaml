# servers/migaku-receive P24 `busy-long-on` (declared, servers/transcripts T13).
# With the switch on (T4.1 migaku_pending_switch) the 5 s mark gives the
# pending reply and a Pending row (P14, P15). The host restarts before the
# phase ends, and the entry survives in the integrations store. After Ready a
# later request (the sentinel) commits only after the drained entry (P13,
# P15), so its reply shows the drain finished: the entry's note is #n1 (lower
# id) and the sentinel's #n2.
# The collection holds P24's 11-field note type T-Mining (the first setup note
# type, #m7, servers/transcripts T10.1) and the profile decks. Profiles are
# servers/transcripts T5.1 values; a profile without field_map infers R1712's
# map (servers/migaku-routing D4). No Origin, so Access-Control-Allow-Origin
# is * (servers/migaku-protocol P6). All content is synthetic.
id: servers/migaku/receive/busy-long-on
description: "switch on: pending after 5 s, kept across a restart, added on Ready"
tags: ["receive"]
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
host_env: {migaku_pending_switch: true}
setup:
  decks: ["DE::Mining"]
  notetypes:
    - name: T-Mining
      fields: [Sentence, Translation, Target Word, Definitions, Screenshot, Sentence Audio, Word Audio, Images, Example Sentences, Is Vocabulary Card, Is Audio Card]
      templates:
        - name: Card 1
          front: "{{#Is Audio Card}}{{Word Audio}}{{/Is Audio Card}}{{^Is Audio Card}}{{Sentence}}{{/Is Audio Card}}"
          back: "{{Translation}}"
      css: ".card {font-size: 18px;}"
migaku_routing:
  profiles:
    - {name: "DE", language: "de", notetype: "T-Mining", deck: "DE::Mining", defaults: {"Is Vocabulary Card": "x", "Is Audio Card": "x"}}
  override: "DE"
steps:
  - lifecycle: exclusive
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Hund", sentence: "Der Hund."}}
      async: r
  - wait: 1s
  - advance: 5s
  - await: r
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: true, created: false}}
  - restart_host: {}
  - advance: 5s
  - lifecycle: ready
  - http:
      target: /receive
      headers:
        - [Content-Type, application/json]
      body: {json: {targetWord: "Omega", sentence: "Omega omega."}}
    expect:
      status: 200
      headers: {content-type: "application/json; charset=UTF-8", access-control-allow-origin: "*"}
      body: {json: {success: true, created: true, id: "#n2"}}
  - observe: [{db_dump: {tables: [notes]}}, media_dir]
    expect:
      output_at:
        "/db_dump/notes/#n1/flds": "Der Hund.\u001f\u001fHund\u001f\u001f\u001f\u001f\u001f\u001f\u001fx\u001fx"
        "/db_dump/notes/#n3": null
  - received_log: {}
    expect:
      output_at:
        "/rows/0/status": "Created"
        "/rows/0/note": "#n1"
        "/rows/1/note": "#n2"
        "/rows/2": null
equivalence:
  notes: ["#n1", "#n2"]
