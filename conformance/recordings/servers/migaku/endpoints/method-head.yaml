# servers/migaku-protocol P16 `method-head`.
# HEAD is listed nowhere, so it gets 405; the reply has the GET reply's status and
# headers but no body. Content-Length is not compared (P4, servers/transcripts T8).
# No Origin, so Access-Control-Allow-Origin is * and no Vary (P6).
# Meguri's own behavior (declared, servers/transcripts T13): the Migaku server has no
# oracle (P15). The integration is on, the collection Available, each request carries
# the default Host of T6.2 on the ephemeral port (T20). All values are synthetic.
id: servers/migaku/endpoints/method-head
description: "HEAD on /srs-check: 405 with no body"
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      method: HEAD
      target: /srs-check
    expect:
      status: 405
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
        allow: "GET, OPTIONS"
      body: {empty: true}
