# servers/migaku-protocol P16 `keepalive-after-404`.
# A 404 to a request with no body follows the keep-alive rules: the connection
# stays open and serves the next request; neither reply carries Connection (P2,
# servers/host-security H7.3, which adds Connection only as close). No Origin, so Access-Control-Allow-Origin is * and no Vary (P6).
# Meguri's own behavior (declared, servers/transcripts T13): the Migaku server has no
# oracle (P15). The integration is on, the collection Available, each request carries
# the default Host of T6.2 on the ephemeral port (T20). All values are synthetic.
id: servers/migaku/endpoints/keepalive-after-404
description: "a 404 keeps the connection open for the next request"
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      method: GET
      target: /nope
      connection: c
    expect:
      status: 404
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
        connection: null
      body: {json: {success: false, error: "Not found."}}
      closed: false
  - http:
      method: GET
      target: /srs-check
      connection: c
    expect:
      status: 200
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
        connection: null
      body: {json: {ok: true, version: "4"}}
      closed: false
  - close: c
