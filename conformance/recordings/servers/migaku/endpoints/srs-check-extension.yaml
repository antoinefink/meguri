# servers/migaku-protocol P16 `srs-check-extension`.
# GET /srs-check from the extension: the origin is echoed with Vary (P3.1, P6, P9).
# EXT is the invented extension origin of P16.
# Meguri's own behavior (declared, servers/transcripts T13): the Migaku server has no
# oracle (P15). The integration is on, the collection Available, each request carries
# the default Host of T6.2 on the ephemeral port (T20). All values are synthetic.
id: servers/migaku/endpoints/srs-check-extension
description: "srs-check from the extension: the origin is echoed"
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      method: GET
      target: /srs-check
      headers:
        - [Origin, "chrome-extension://abcdefghijklmnopabcdefghijklmnop"]
    expect:
      status: 200
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "chrome-extension://abcdefghijklmnopabcdefghijklmnop"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: Origin
      body: {json: {ok: true, version: "4"}}
