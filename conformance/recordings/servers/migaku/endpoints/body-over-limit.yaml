# servers/migaku-protocol P16 `body-over-limit`.
# A body over the Migaku limit (134,217,728 bytes) gets 400 with Connection: close,
# by Content-Length before any body byte, and by counted bytes for a chunked body;
# the /receive handler never runs and nothing is written (P2 step 7, P8.2, P8.3,
# servers/host-security H8). No Origin, so Access-Control-Allow-Origin is * and no Vary (P6).
# Meguri's own behavior (declared, servers/transcripts T13): the Migaku server has no
# oracle (P15). The integration is on, the collection Available, each request carries
# the default Host of T6.2 on the ephemeral port (T20). All values are synthetic.
id: servers/migaku/endpoints/body-over-limit
description: "over-limit /receive bodies, by length and chunked"
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      method: POST
      target: /receive
      declared_length: 134217729
    expect:
      status: 400
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
        connection: close
      body: {json: {success: false, error: "Request body is too large."}}
      closed: true
      no_effect: true
  - http:
      method: POST
      target: /receive
      headers:
        - [Transfer-Encoding, chunked]
      body: {fill: {size: 134217729, byte: 32}}
    expect:
      status: 400
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
        connection: close
      body: {json: {success: false, error: "Request body is too large."}}
      closed: true
      no_effect: true
