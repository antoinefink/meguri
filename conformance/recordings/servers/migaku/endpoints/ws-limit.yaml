# servers/migaku-protocol P16 `ws-limit`.
# At most 64 sockets are open at once: the 65th upgrade gets 503 instead of 101,
# and the 64 stay open and answer pings (P10.1, P8.2). No Origin.
# Meguri's own behavior (declared, servers/transcripts T13): the Migaku server has no
# oracle (P15). The integration is on, the collection Available, each request carries
# the default Host of T6.2 on the ephemeral port (T20). All values are synthetic.
id: servers/migaku/endpoints/ws-limit
description: "the 65th WebSocket upgrade gets 503"
server: migaku
source: declared
