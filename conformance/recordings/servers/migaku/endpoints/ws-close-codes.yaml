# servers/migaku-protocol P16 `ws-close-codes`.
# A client close gets a close frame back: an empty payload is echoed empty, a
# valid code is echoed without its reason, and 1005 (not allowed on the wire) gets
# 1002 (P10.4). That the 1000 reply has no reason is not expressible (ws_expect
# compares the code only).
# ws_send close and ws_expect close values: {code, reason} sent, the code received,
# null for a close frame with no status code (T7.3 names the members only).
# No Origin.
# Meguri's own behavior (declared, servers/transcripts T13): the Migaku server has no
# oracle (P15). The integration is on, the collection Available, each request carries
# the default Host of T6.2 on the ephemeral port (T20). All values are synthetic.
id: servers/migaku/endpoints/ws-close-codes
description: "close payloads and the close frames Meguri sends back"
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - ws_open:
      name: a
      target: /anki-connect
    expect:
      status: 101
      headers:
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
  - ws_open:
      name: b
      target: /anki-connect
    expect:
      status: 101
      headers:
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
  - ws_open:
      name: c
      target: /anki-connect
    expect:
      status: 101
      headers:
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
  - ws_send: {name: a, close: {}}
  - ws_expect: {name: a, frames: [{close: null}], within_ms: 1000}
  - ws_send: {name: b, close: {code: 1000, reason: bye}}
  - ws_expect: {name: b, frames: [{close: 1000}], within_ms: 1000}
  - ws_send: {name: c, close: {code: 1005}}
  - ws_expect: {name: c, frames: [{close: 1002}], within_ms: 1000}
  - status: {until: {migaku: {extension_connected: false, open_sockets: 0, last_received_at: null}}, within_ms: 1000}
