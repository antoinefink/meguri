# servers/migaku-protocol P16 `srs-check-corrupt`.
# Failed{Corrupt} is not Available: ok is false (P1, P9). The reply reads only
# the lifecycle state in memory (P7). No Origin, so Access-Control-Allow-Origin is * and no Vary (P6).
# Meguri's own behavior (declared, servers/transcripts T13): the Migaku server has no
# oracle (P15). The integration is on, the collection Available until the `lifecycle`
# step, each request carries the default Host of T6.2 on the ephemeral port (T20).
# All values are synthetic.
id: servers/migaku/endpoints/srs-check-corrupt
description: "srs-check after the engine ends in Failed{Corrupt}: ok false"
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - lifecycle: fail_corrupt
  - http:
      method: GET
      target: /srs-check
    expect:
      status: 200
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
      body: {json: {ok: false, version: "4"}}
      within_ms: 200
