# servers/migaku-protocol P16 `body-at-limit`.
# A body exactly at the limit is read and handed on; /srs-import ignores it and
# answers 501 (P8.3, P11). No Origin, so Access-Control-Allow-Origin is * and no Vary (P6).
# Meguri's own behavior (declared, servers/transcripts T13): the Migaku server has no
# oracle (P15). The integration is on, the collection Available, each request carries
# the default Host of T6.2 on the ephemeral port (T20). All values are synthetic.
id: servers/migaku/endpoints/body-at-limit
description: "a body exactly at the limit is accepted and ignored"
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      method: POST
      target: /srs-import
      body: {fill: {size: 134217728, byte: 32}}
    expect:
      status: 501
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
      body: {json: {success: false, error: "Importing into Migaku Memory is not supported by Meguri."}}
