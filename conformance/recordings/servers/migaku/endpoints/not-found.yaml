# servers/migaku-protocol P16 `not-found`.
# Paths compare byte for byte: a trailing /, another case, the root and the
# add-on's older routes are unknown (P1 Path, P4, P8.2). No Origin, so Access-Control-Allow-Origin is * and no Vary (P6).
# Meguri's own behavior (declared, servers/transcripts T13): the Migaku server has no
# oracle (P15). The integration is on, the collection Available, each request carries
# the default Host of T6.2 on the ephemeral port (T20). All values are synthetic.
id: servers/migaku/endpoints/not-found
description: "unknown paths get 404 in the error shape"
server: migaku
source: declared
clock: {tz: Europe/Paris, start: "2030-01-15T10:00:00"}
steps:
  - http:
      method: GET
      target: /nope
    expect:
      status: 404
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
      body: {json: {success: false, error: "Not found."}}
  - http:
      method: GET
      target: /receive/
    expect:
      status: 404
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
      body: {json: {success: false, error: "Not found."}}
  - http:
      method: GET
      target: /RECEIVE
    expect:
      status: 404
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
      body: {json: {success: false, error: "Not found."}}
  - http:
      method: GET
      target: /
    expect:
      status: 404
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
      body: {json: {success: false, error: "Not found."}}
  - http:
      method: GET
      target: /learning-statuses
    expect:
      status: 404
      headers:
        content-type: "application/json; charset=UTF-8"
        access-control-allow-origin: "*"
        access-control-allow-headers: "access-control-allow-origin,content-type"
        access-control-allow-methods: "POST, GET, OPTIONS"
        vary: null
      body: {json: {success: false, error: "Not found."}}
