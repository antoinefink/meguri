    plan: ["plus the macOS-native oracle check (KTD24)"]
    why: The macOS-native oracle result is attached from M1R (U246, KTD24); M1 repeats the clause
  - id: nightly-divergences
    pending: U247
    from: M2
    why: Zero untriaged nightly divergences (U247), which start with U247 in M2

