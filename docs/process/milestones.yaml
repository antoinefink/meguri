# Delivery milestones (U240, U240r; plan "Delivery Milestones"; docs/process/tiers.md).
#
# Membership, closing gates and user steps are defined once, in the plan's
# Delivery Milestones table. This file mirrors it: `units` and the `plan`
# texts must equal the table's cells, and every unit of the plan's Unit Index
# is in exactly one milestone (`tools/mg milestone-gate --check`, a T0 run).
# The definitions that run are bound to that text by their `plan` excerpts
# (below): every part of a milestone's closing gate and user steps texts must
# be claimed by the suite, global condition or user step that implements it,
# so removing a required entry, scope item or device run fails the check.
# When the table changes, copy the cells here and update the suites, user
# steps and their excerpts to match.
#
# `milestones` is the one list of milestones, in delivery order (M0, M1R, M1,
# M2, ...): `tools/mg milestone` and `milestone-gate` take the names and the
# order from it, and --check keeps it equal to the table's rows, in order.
#
# `tools/mg milestone <M>` (U19) runs the suites; `tools/mg milestone-gate <M>`
# evaluates them with tools/scripts/gates/milestone_gate.py. A milestone
# closes when, on one gate commit:
#   - every suite of this milestone and of every earlier one passes (gates
#     are cumulative; a suite id listed again widens its scope);
#   - every unit of this milestone and the earlier ones is merged (a commit
#     with its `Unit:` trailer, by a role other than spec-writer or
#     oracle-maintainer, at or before the gate commit) and has no open entry
#     in docs/process/provenance/escalations.jsonl;
#   - every user step of this milestone passes its validator;
#   - every deferral (this milestone and earlier) is approved and still holds,
#     or its cells pass;
#   - every `global` condition holds.
# The outcome is pass, fail, or awaiting_user when only user-step evidence is
# missing (or a suite's own result is awaiting_user). It fails outside the
# main checkout, where a unit branch's own commits look merged. A pass writes
# docs/process/milestone-records/<M>.json; commit it.
#
# The gate commit is the commit every suite result was made on (clean tree).
# HEAD may be later only by commits that touch evidence paths: the
# `evidence_paths` below and every user step's `evidence`. Evidence is read
# from HEAD's commit, never from the working tree.
#
# Suites:
#   id       suite id; the same id in a later milestone adds scope items and
#            pass rules
#   run      a tools/gate/tiers.yaml run of tier T0, T1 or T3 (the runs
#            `tools/mg milestone` executes, with its milestone arguments); its
#            job's latest non-dry-run result whose arguments match is the one
#            evaluated, and the run's own `require` rules apply
#   scope    {detail: <dotted path in the result's details>, items: [...]}:
#            the job reports that path as a map from item to {status} (or a
#            status string); every listed item must be there with pass
#   require  extra pass rules, as in tiers.yaml ({id, summary, max} or {id,
#            detail, only_keys})
#   pending  the unit that delivers the run or its scope; a pending suite
#            fails the gate as `pending` until that unit removes the key
#   plan     the part of the milestone's closing gate text it implements: a
#            list of excerpts, each a string or {text, items}; `items` are
#            the scope items that text asks for, and must be in `scope`
#   why      what it proves (the plan's closing-gate text)
# A suite may not run a job that requires its own milestone's gate (or a
# later one's). A result counts only when its status is pass (or warn awaiting
# Antoine); a queued result counts as missing, awaiting the user step it names
# (U19b); an unavailable or other warn result fails, unless a deferral that
# holds covers it and every cell it does not defer passes.
#
# Plan excerpts (`plan` on suites, user steps and global conditions; checked
# by --check and before every evaluation): each excerpt occurs exactly once in
# its text, word for word, or is a bare unit id the text names (a unit inside
# a range such as U252–U254 is quoted on its own: U253; an excerpt never spans
# a unit range). Together they must cover the text but for punctuation and
# the words a, an, and, as, at, by, for, in, of, on, or, plus, the, to, with,
# and claim every unit it names. A suite or global condition (in its `from`
# milestone) quotes the closing gate text; a global condition's excerpt also
# claims a later milestone's text where it occurs there. A milestone's
# `cumulative` excerpts claim the closing gate text that states the cumulative
# rule (each names an earlier milestone). A user step quotes the user steps
# text, or the closing gate text with {text, cell: gate}. Device-run steps
# must cover the devices their excerpts name (all three when they name none),
# and a trial's excerpt states its days ("7-day"). A suite or user step the
# table does not ask for needs no excerpt, and one that only supports another
# (bench-mac for perf-gate) quotes none:
#   - every definition that quotes plan text must be needed: without it some
#     text, unit or device goes unclaimed;
#   - definitions share text only by quoting the same excerpt, binding the
#     same items, so scope items never leave with their suite unnoticed;
#   - the table's wording names the kind of user step: text with "<N>-day",
#     "trial" or "daily-driver" is a trial (of N days), "device run" (in
#     either text) a device-run, "device session" a device-session, "variant
#     picks" or "sign-off" a variant-pick, "capture" a capture, R1969 a setup
#     step, "first real sync" a first-sync (its clause may say "trial": the
#     sync starts it); only steps of that kind claim it, each step claims its
#     kind's wording, and text that names no kind is a report.
#
# User steps (performed by Antoine; agents only record his reports):
#   id, description, evidence (the path read at HEAD), validator:
#   setup         {step}: tools/mg doctor (run by milestone-gate) does not
#                 report this docs/process/one-time-setup.md step missing; a
#                 step doctor cannot check (unverified) passes and is
#                 recorded as unverified
#   device-run    {device: iphone|ipad|mac}: the U256 JSON at `evidence`,
#                 U241's device-run report (`tools/mg perf-gate --results
#                 <dir> --device-run <M> --device <d>` writes it): {milestone,
#                 device, build_commit (an ancestor of the gate commit),
#                 configuration Profile, runner (that device), budgets: [{id,
#                 status, cases: [...]}]} with a pass for every budget of this
#                 milestone's and the earlier milestones' `budgets` that
#                 applies to the device (`budget_devices`). Each budget's
#                 device cases in tools/perf/budgets.yaml must be recorded
#                 with their dimensions (suite, interval, metric, unit,
#                 percentile, fixture) and values, and are judged again
#                 against the catalog; a case still pending on the unit that
#                 lands its measurement keeps the step `pending` (it fails
#                 the gate). The record copies the build commit and the app/
#                 and core/ paths changed since
#   variant-pick  {screens}: docs/design/decisions.md has a "Picked ..." row
#                 for each screen, dated within the milestone (on or after
#                 the previous milestone record's closed_at date, not after
#                 today)
#   trial         {days}: the daily-driver log (JSON lines, every key
#                 required: date, devices [iphone|ipad|mac, ...], fallback
#                 null|"none"|{task, in_scope}, data_incident
#                 null|"none"|<text or object>): the latest run of
#                 consecutive logged days within the milestone, ending at the
#                 last entry, reaches `days` with no in-scope fallback and no
#                 data incident. A fallback or incident that broke the latest
#                 run fails the gate; a run still too short awaits Antoine
#   device-session {days}: a docs/process/milestone-records/device-sessions/
#                 file (docs/design/device-session.md) with `date` within the
#                 last `days` days and reported_by: antoine (U254's rule)
#   capture       {index, cases | cases_file}: the JSON index {cases: [{id},
#                 ...]} lists every case id; cases_file is a JSON file of the
#                 same shape that lists the required ids
#   first-sync    {results: [<id>, ...]}: the first real sync with AnkiWeb
#                 (M1R): {build: {commit, dirty}, sync_started_at, results:
#                 {<id>: {job, commit, finished_at, outcome}}, backup: {file,
#                 taken_at}} (times YYYY-MM-DDTHH:MM:SSZ). It passes only when
#                 the build is a commit of this repository from a clean tree,
#                 every listed result is a pass on that commit that finished
#                 before the sync started, and the backup predates the sync.
#                 It is never compared with the gate commit: fixes during the
#                 trial move the gate commit, and the first sync cannot be
#                 redone
#   report        a JSON file {date, result: pass|fail, reported_by: antoine}
#                 recorded from Antoine's report
# Missing evidence awaits Antoine; evidence that records a failure, or that
# is malformed, fails the gate.
#
# Deferred: items gated on an external dependency. Each names a dependency
# from the evaluator's fixed list, that dependency's condition, the deferred
# cells as a suite (`cells: {run, scope: {detail, items}}`, both required)
# and `approved_by: antoine`, written only from Antoine's chat approval, as
# for quarantine (U19). The gate fails on any other entry, and once the
# condition no longer holds while the cells do not pass. While it holds it
# waives its cells and nothing else: a suite of the cells' run whose result
# is a warn of the lane the dependency covers, or a pass lacking only those
# cells, is `deferred` when the result records no failure, the pass rules
# hold and every other cell passes (its scope items but the deferred ones;
# for a suite without a scope, every entry of the result's details.<detail>
# table beside them, so the table must be there). The only dependency today:
#   - dependency: xcode-27.1-foldable-simulator
#     condition: {job: sim-setup, args: [], detail: foldable, equals: {status: unavailable, reason: toolchain}}
#     (a sim-setup result on the gate commit; run `tools/mg sim-setup` there);
#     it covers a warn whose details.lane is {kind: foldable, status:
#     unavailable, reason: toolchain}
# The foldable cells (R1962, R1971) are not deferred yet: Antoine has not
# approved it (perfqa coverage note, question 5).
#
# Global conditions, checked at every milestone they apply to (`from`):
#   quarantine  no conformance, sync or data-safety test is quarantined (U19),
#               and every quarantine entry is valid and in date (R1953); the
#               record lists the open entries with their owners
#   suite       a tiers run that passes on the gate commit; the record
#               attaches its result
#   pending     a condition whose check lands with that unit: it fails the
#               gate until then

