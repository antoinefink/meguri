# Delivery milestones M0-M5 (U240; plan "Delivery Milestones"; docs/process/tiers.md).
#
# Membership, closing gates and user steps are defined once, in the plan's
# Delivery Milestones table. This file mirrors it: `units` and the `plan`
# texts must equal the table's cells, and every unit of the plan's Unit Index
# is in exactly one milestone (`tools/mg milestone-gate --check`, a T0 run).
# When the table changes, copy the cells here and update the suites and user
# steps to match.
#
# `tools/mg milestone <M>` (U19) runs the suites; `tools/mg milestone-gate <M>`
# evaluates them with tools/scripts/gates/milestone_gate.py. A milestone
# closes when, on one gate commit:
#   - every suite of this milestone and of every earlier one passes (gates
#     are cumulative; a suite id listed again widens its scope);
#   - every unit of this milestone and the earlier ones is merged (a commit
#     with its `Unit:` trailer, by a role other than spec-writer or
#     oracle-maintainer, at or before the gate commit) and has no open entry
#     in docs/process/provenance/escalations.jsonl;
#   - every user step of this milestone passes its validator;
#   - every deferral (this milestone and earlier) is approved and still holds,
#     or its cells pass;
#   - every `global` condition holds.
# The outcome is pass, fail, or awaiting_user when only user-step evidence is
# missing (or a suite's own result is awaiting_user). A pass writes
# docs/process/milestone-records/<M>.json; commit it.
#
# The gate commit is the commit every suite result was made on (clean tree).
# HEAD may be later only by commits that touch evidence paths: the
# `evidence_paths` below and every user step's `evidence`. Evidence is read
# from HEAD's commit, never from the working tree.
#
# Suites:
#   id       suite id; the same id in a later milestone adds scope items and
#            pass rules
#   run      a tools/gate/tiers.yaml run of tier T0, T1 or T3 (the runs
#            `tools/mg milestone` executes, with its milestone arguments); its
#            job's latest non-dry-run result whose arguments match is the one
#            evaluated, and the run's own `require` rules apply
#   scope    {detail: <dotted path in the result's details>, items: [...]}:
#            the job reports that path as a map from item to {status} (or a
#            status string); every listed item must be there with pass
#   require  extra pass rules, as in tiers.yaml ({id, summary, max} or {id,
#            detail, only_keys})
#   pending  the unit that delivers the run or its scope; a pending suite
#            fails the gate as `pending` until that unit removes the key
#   why      what it proves (the plan's closing-gate text)
# A suite may not run a job that requires its own milestone's gate (or a
# later one's).
#
# User steps (performed by Antoine; agents only record his reports):
#   id, description, evidence (the path read at HEAD), validator:
#   setup         {step}: tools/mg doctor (run by milestone-gate) does not
#                 report this docs/process/one-time-setup.md step missing; a
#                 step doctor cannot check (unverified) passes and is
#                 recorded as unverified
#   device-run    {device: iphone|ipad|mac}: the U256 JSON at `evidence`:
#                 {milestone, device, build_commit (an ancestor of the gate
#                 commit), budgets: [{id: R-ID, status: pass|fail}, ...]}
#                 with a pass for every budget of this milestone's and the
#                 earlier milestones' `budgets` that applies to the device
#                 (`budget_devices`); the record copies the build commit and
#                 the app/ and core/ paths changed since
#   variant-pick  {screens}: docs/design/decisions.md has a "Picked ..." row
#                 for each screen, dated within the milestone (on or after
#                 the previous milestone record's closed_at date, not after
#                 today)
#   trial         {days}: the daily-driver log (JSON lines: date, devices,
#                 fallback null|"none"|{task, in_scope}, data_incident
#                 null|"none"|<text or object>): the latest run of
#                 consecutive logged days within the milestone, ending at the
#                 last entry, reaches `days` with no in-scope fallback and no
#                 data incident. A fallback or incident that broke the latest
#                 run fails the gate; a run still too short awaits Antoine
#   device-session {days}: a docs/process/milestone-records/device-sessions/
#                 file (docs/design/device-session.md) with `date` within the
#                 last `days` days and reported_by: antoine (U254's rule)
#   capture       {index, cases | cases_file}: the JSON index {cases: [{id},
#                 ...]} lists every case id; cases_file is a JSON file of the
#                 same shape that lists the required ids
#   report        a JSON file {date, result: pass|fail, reported_by: antoine}
#                 recorded from Antoine's report
# Missing evidence awaits Antoine; evidence that records a failure, or that
# is malformed, fails the gate.
#
# Deferred: items gated on an external dependency. Each names a dependency
# from the evaluator's fixed list, that dependency's condition, the deferred
# cells as a suite (`cells: {run, scope}`) and `approved_by: antoine`, written
# only from Antoine's chat approval, as for quarantine (U19). The gate fails
# on any other entry, and once the condition no longer holds while the cells
# do not pass. The only dependency today:
#   - dependency: xcode-27.1-foldable-simulator
#     condition: {job: sim-setup, args: [], detail: foldable, equals: {status: unavailable, reason: toolchain}}
#     (a sim-setup result on the gate commit; run `tools/mg sim-setup` there)
# The foldable cells (R1962, R1971) are not deferred yet: Antoine has not
# approved it (perfqa coverage note, question 5).
#
# Global conditions, checked at every milestone they apply to (`from`):
#   quarantine  no conformance, sync or data-safety test is quarantined (U19),
#               and every quarantine entry is valid and in date (R1953); the
#               record lists the open entries with their owners
#   suite       a tiers run that passes on the gate commit; the record
#               attaches its result
#   pending     a condition whose check lands with that unit: it fails the
#               gate until then

