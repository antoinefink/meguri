  - id: browse.browser
    title: Browser
    units: [U210, U211, U212, U213, U214, U215, U216, U218, U221, U223]
    signature: true
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: full
    references: [table, search-tokens, sidebar, inspector, content-unavailable]
    purpose: >-
      Search, sort and act on the collection's cards or notes (U210). Entry points: the Browse
      sidebar section (Mac, iPad) or tab (iPhone); ⌘F from Home, the deck page or review, with the
      field focused (R216); and with a given search (R1114): the deck menu's Browse, the session
      summary's Browse Missed Cards, Stats' Show in Browser and the heatmap, the editor's Show
      Duplicates, the Add history, meguri://browse?search=, Migaku and AnkiConnect. A given search
      gets search/join-and-replace J2's rule, is put in canonical form and runs as committed (R1109);
      Stats' text is the exception and shows exactly as stats/browse-queries Q3 writes it. A plain
      open runs defaultSearchText when it is set (browser/config-keys K6.4), otherwise deck:current
      with an empty field and the placeholder "Search current deck" (R1112); the placeholder reads
      "Search" whenever another search is the committed one. Committing an empty field (Return, live
      search) runs the empty search, the whole collection (search/query-model Q2), as Anki does and
      as search/join-and-replace J6 and J7 read it; only the open uses deck:current. From review the card under review becomes the current row and scrolls into
      view, or the search becomes cid:<id> when the default search does not hold it (R1113,
      browser/result-sets H12 index_of). Mac (R1232): the Browse section's detail holds the filter
      column (U216: a source list with Saved Searches, Today, Flags, Card State, Decks, Note Types and
      Tags, each collapsible, R1157), the table (U211) and the inspector (U221: Editor, Preview and
      Card Info tabs; trailing, or below the table by the device setting, R1222). The toolbar holds
      the search field (U214; suggestions U215), the Cards/Notes segmented picker (R1115) and the
      inspector toggle; ⌃⌘S shows or hides the filter column. A narrower window collapses the
      inspector first, then the filter column; nothing opens another window. iPad at regular width
      (R1233): the same columns, with the toolbar in the navigation bar; below the table's minimum
      width (U211 spike B1) it switches live to the compact layout and keeps search, selection and
      scroll position. iPhone and compact width (U223): a list with the search field pinned at the
      top, the quick-filter chips, two-line rows and the toolbar's Cards/Notes, Sort, Display, Select
      and Filters (the filter sections in a sheet); a row pushes the note detail. Table: the columns
      of activeCols or activeNoteCols (K4) with browser/columns C2's labels, alignment and elision;
      a header click sorts by that column in its first direction (browser/sorting S1) and a second
      click reverses it (K5.2); Question and Answer show no sort affordance; the header's context
      menu shows, hides and reorders columns (K4.2, K4.3); widths and row density stay on the device
      (K11). Rows show the flag, marked, suspended and buried tints and glyphs (C4, C5); a damaged row
      (C3.1) is shown disabled. The current row is separate from the selection (U212). Below the
      table (Mac, iPad) a status bar in the footnote style, as Finder's, reads "1,204 cards" or "3 of
      1,204 cards selected", "notes" in notes mode (R1111); on iPhone the same text is the navigation
      subtitle. Cards/Notes writes browserTableShowNotesMode (K6.1), runs the other mode with its own
      columns and sort, and maps the selection and current row (H11, H12). Loading: while a search
      runs the previous results stay; with none, the table area shows an indeterminate progress
      indicator; a streamed search shows "Searching…" and the count so far in the status bar until it
      completes; rows not fetched yet show fixed-height placeholders (U211). Empty: a valid search
      with no results shows a content-unavailable view "No cards match" ("No notes match") with
      "Clear Search", which restores the default search (R1110). Error: an incomplete term at the
      cursor keeps the last valid results with no message (R1107); a syntax error underlines its
      range in the field, shows its message in one line at the top of the table area (under the field
      on iPhone; decided 2026-10-27: on Mac and iPad the field is in the toolbar, so the line under
      the toolbar replaces R1108's and U214's "under the field") and dims the previous results under "Results unchanged until the search is valid"
      (R1108, search/errors E7); a search that fails otherwise (storage, collection unavailable)
      shows a content-unavailable view with its message and Try Again. Changes from elsewhere refresh
      the visible rows in place and show a "Results changed" bar with Refresh above the table, which
      runs the committed search again (R1792). Overflow: 150,000 rows scroll at display rate; a
      truncated cell shows its full value as help text on hover (Mac) or by long press (iPad). In the
      exclusive phase searches still run and every mutating command is disabled (U153);
      CollectionReplaced returns to Home. Keyboard (menu commands, U218; R1225, R1229, R261, R272,
      R273): ⌘F focuses the search field and selects its text, ⇧⌘F the filter column's filter field,
      ⇧⌘L the table, ⌥⌘L the editor, ⌥⌘I Card Info, ⇧⌘P Preview; ↑, ↓, Home, End and ⌃⌘↑ or ⌃⌘↓ move
      the current row, Shift extends the selection; ⌘A in the table and ⌥⌘A elsewhere select all, ⌥⌘S
      inverts, ⌘C copies the selected rows; Return in the field commits. VoiceOver (R1240): a row is
      one element that reads its visible column values and states, with custom actions; a header
      reads its column and sort direction; a committed search announces its result count once; every
      chip, token, sidebar item and toolbar item has a label. Identifiers browse.<element>, rows
      browse.table.row.<id>. Core: one search session per Browse instance (browser/result-sets H2):
      start_search, rows, qa_cells only while Question or Answer shows (H7), reverse for a second
      header click and resort for a new column on a complete result, a new start_search while a
      search still runs (H8), toggle and map_selection (H11, H12), invalidated_rows with every change
      set (H10), resolve_selection for every action (H12); search/join-and-replace build, join and
      replace for sidebar items and chips; the reads and writes of browser/config-keys K4 to K7,
      each written only when the value changes (K10.1); reads never write (K2, R1138).
