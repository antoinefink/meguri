      cards; a filtered deck's menu offers only Rename and Delete (R53). On iPhone a row swipe shows
      Options and More, never Delete (R49). The menu bar's Deck menu is U159's and follows R283. Until
      U156 lands the menu holds Study and Overview (U152). Delete of a subtree with cards asks first with
      the deck and card counts (confirmation-dialog); deletes and moves end with an Undo toast.
