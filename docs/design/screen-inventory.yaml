  - id: cardInfo.card
    title: Card Info
    units: [U222]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: pairwise
    references: [inspector, charts, table, content-unavailable, toast]
    purpose: >-
      One card's properties, review history and forgetting curve (U222, stats/card-info), read only:
      opening or refreshing it never writes (C1, R1252). Hosts, never a separate window (R1247,
      R1422): the Card Info tab of Browse's inspector (Mac, iPad; ⌥⌘I), which follows the current
      row live, a notes-mode row showing its note's card with the lowest template ordinal, then the
      lowest card id, as Anki does (decided 2026-10-27; browser/columns C1's first card, by id, is
      only for column values); the Card Info item
      of the iPhone note detail (U223); the editor's ⋯ menu and the review ⋯ menu (Card Info,
      Previous Card Info; on Mac also I for Card Info and ⌥⌘I for Previous Card Info during review,
      R1262, R1422), as a sheet: a window sheet with Done on Mac, a form sheet on iPad, a sheet with
      medium and large detents on iPhone; and the session summary's missed-card preview (U157).
      Opened from review, the sheet starts with a segmented Current/Previous picker (R1263), on
      Current from Card Info or I and on Previous from Previous Card Info or ⌥⌘I; Previous is disabled before the session's first answer and
      after every answer is undone (C9). Layout, one scrolling grouped list: (1) the stats rows of
      C4.1 in the core's order, the label leading and the value trailing, values exactly as the core
      writes them and selectable; never an Ease row (R1250); labels from the String Catalog (C12).
      (2) Forgetting Curve (C7), only when the snapshot has a curve (C7.1): a Swift Charts line, the
      past solid and the future dashed, a today marker, and the dashed Desired Retention line when it
      is above the chart's lower bound (C7.5); a segmented range picker (First Week, First Month,
      First Year, All Time) only when more than one range is offered, starting on the last one
      (C7.3); the tooltip of C7.6 on hover (Mac) or touch. The section is a disclosure; collapsing it
      is R1258's hide, saved on the device. (3) Review History (C6), newest first: on Mac and at
      regular width, table-like rows of the same list, not a separate Table view, so there is one
      scroll area (N2): a header row naming the columns, then one row per entry with Grid-aligned
      columns (Date, with the time when wide; Type in its state colour; Rating, Again in the
      Learn colour; Interval; Ease; Time; Stability when turned on), two-line rows at compact width;
      the state colours follow N11.5's contrast rule;
      the section header's menu holds "Show Stability", saved on the device (R1254). (4) "Copy Debug
      Info", a bordered button that puts C8's JSON on the pasteboard and confirms with the toast
      "Copied to clipboard". Empty: a new card shows its rows only, with no curve and no history
      section. Loading: it opens within 100 ms (R1841); until the first snapshot arrives the rows are
      blank placeholders of their final size; a refresh replaces the content in place, keeping
      the range, the disclosure and the scroll position. Error: a card that does not exist, and
      Browse with no current row, show a content-unavailable view with C12's "(No card to display.)";
      a C11 error shows a content-unavailable view titled "Card Info Unavailable" with C12's text
      for its kind: missing_note to missing_preset followed by "Check Database can repair it.";
      invalid_cutoff (which points to Deck Options) and fsrs_failed exactly as C12 gives them, with
      no Check Database line, since Check Database does not change a preset. Overflow: 500 history entries scroll; long deck, note type and custom
      data values wrap. Live (C10, R1260): it fetches again on CardStatsChanged for the shown card and
      on the day change; in Browse it changes card with the current row. Keyboard: Tab reaches the
      picker, the range picker, the disclosure, the history menu and Copy Debug Info; Esc closes a
      sheet; ⌥⌘I shows or hides Browse's tab. VoiceOver: each stats row is one element ("Due,
      2026-11-02"); each history entry is one element that reads its column labels and values; the
      chart has a summary and an audio graph; the picker is labelled "Card". Identifiers
      cardInfo.row.<key>, cardInfo.history, cardInfo.curve.range, cardInfo.copyDebug,
      cardInfo.switch. Core: the C1 snapshot through U103's export (query lane; the interactive lane
      from review), card_info_debug_json (C8), card_info_affected for CardStatsChanged (C10); the
      previous card's id comes from U175's session record (C9).

  - id: stats.overview
    title: Statistics
    units: [U225, U226, U230, U231]
    signature: true
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: full
    references: [charts, calendar-grid, toolbar, content-unavailable]
    purpose: >-
      The scope and history header and the graph cards in R1357's order (Today, Future Due, Calendar,
      ... Added) for a deck, the collection or a search. The heatmap and streak stats are not here:
      they live on Home and the deck page (home.deckList, home.deckPage). The shell is U225's; the
      graphs are U226's, U230's and U231's (stats/graph-presentation). Entry points (R1349): the Stats
      sidebar section (Mac, iPad), the Stats tab (iPhone), the deck page's and the deck menu's Stats
      (that deck's scope) and the T key on Home and the deck page. Stats reopens with the device's
      last scope, deck, search and history, except when opened from a deck (R1354). Header, in the
      toolbar (native-interface-contract N11.7): at regular width the scope picker (Deck,
      Collection, Search), then the deck pop-up button listing every deck, filtered decks included
      (Deck scope), or a search field run on Return or when it loses focus (Search scope), then the
      history picker (Last 12 Months, All History; stats/graphs-common G3); at compact width the
      title "Statistics" with the scope and history as its subtitle ("Japanese · Last 12 Months")
      and one toolbar menu with the same choices, the Search scope showing the navigation bar's
      search field. Choosing a deck never changes the current deck (R1353). Content: one scrolling
      grid of graph boxes, 3 columns on wide Mac windows, 2 at medium widths and iPad landscape, 1 on
      iPhone and narrow windows (R1359); each box is a system group box with Anki's title and
      subtitle (R1358), one row of the graph's controls, the chart and its table. Changing a graph's
      control re-bins without a core call (R1355); the range pickers are remembered per device
      (R1366); Backlog and Separate suspended/buried read their synced keys
      (`futureDueShowBacklog`, `cardCountsSeparateInactive`; stats/graphs-common G7) and write them
      as editor/config-keys K1 writes its boolean keys (decided 2026-10-27, as K1 does not list
      these two yet): a compact JSON boolean, written only when the user flips the toggle, a
      missing key or a value of another type kept until then, one key per change, at once, with no
      undo step (UserNonUndoable); every other control follows stats/graph-presentation. On Mac a click on
      a clickable bar, cell or label opens Browse in the same window with the joined search
      (stats/browse-queries Q3) and hover shows its tooltip; on touch a first tap selects it and shows
      the tooltip with "Show in Browser" (R1417, R1418); coming back restores scope, controls, scroll
      position and selection (R1419). Loading: Stats opens at once on the last result for the scope,
      or on blank placeholders of the final size, and puts the new data in place without moving
      the layout (R1291); every open refreshes (R1294). Empty: a scope with no cards and no reviews:
      each box shows its empty state, `No Data`, with Card Counts keeping its table
      (stats/graph-presentation P16.5, R1361); the header stays usable. Error: a Search scope
      error shows its message (search/errors E7) in one line at the top of the content, under the
      search field at compact width, and the graphs shown stay (R1351); while a scope error shows,
      no item is clickable (stats/browse-queries Q2.3); a deck deleted while it is
      the scope (unknown_deck) shows "This deck no longer exists." in the same place; an unreadable
      row (stats/graphs-common G8.2) shows a content-unavailable view in place of the grid, saying
      Check Database can repair it, with a Check Database button once U128 lands. Live: after a
      change set, a rollover, a day-clock change or CollectionReplaced (G10) a visible Stats screen
      refreshes in place, about 500 ms after the last event, keeping every control and the scroll
      position (R1356); a hidden one refreshes when it appears. Overflow: the largest text sizes, a
      long deck name (middle truncation in the pop-up, full name as help text) and all graphs in one
      column scroll. Keyboard: Tab moves through the header controls, then each box's controls; ⌘F
      selects the Search scope and focuses its field; Return runs it; T opens Stats from Home and the
      deck page. VoiceOver: each box is a container named by its title; each chart has a summary and
      an audio graph (U226); an empty box reads stats/graph-presentation P18.1's "<title>. <scope>.
      No Data"; the header controls are labelled "Scope", "Deck",
      "Search" and "History". Identifiers stats.scope.deck, stats.scope.collection,
      stats.scope.search, stats.history.all (R1445). Core: stats/graphs-common G8 requests on the
      query lane, two per refresh (the graphs above the fold first, G8.3), the superseded one
      cancelled; the G7 preferences in the result; the G10 events; the scope text and the join of
      stats/browse-queries Q2 and Q3 in Swift; viewing writes nothing (G11, R1295).
  - id: stats.heatmapSettings
    title: Heatmap settings
    units: [U229]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, overflow, error]
    variants: pairwise
    references: [grouped-form, calendar-grid]
    purpose: >-
      The Heatmap section of Settings (U229; R1336–R1343, R149, R1315, R1325; stats/heatmap-config
      K2, K3, K6; stats/heatmap-addon A2.2; native-interface-contract N11.4, N11.12). Mac: the
      Heatmap section of the Settings window's sidebar; iPad and iPhone: the Heatmap row of Settings,
      pushing this form. Labels are the add-on's option names (R1339); footers are Meguri's own
      (String Catalog). One grouped form: (1) "Calendar mode", a segmented picker of Year and 9 months
      (`mode`, R1325), and "First day of week", a menu picker of exactly Sunday, Monday, Friday and
      Saturday (`firstDayOfWeek`, editor/config-keys K5), with the footer that it also sets the week
      of the Stats calendar. Synced (R113): every row stored in the heatmap key or in
      `firstDayOfWeek`, that is groups (1) and (3) with the excluded-deck row, carries the Synced
      marker of native-interface-contract N11.4 (the `globe` symbol in secondary style after its
      label, no capsule or tint), and those groups' footers end with R113's footnote "Applies on all devices that sync
      this collection". (2) On This Device (R1342): "Show
      heatmap on Home", "Show heatmap on deck pages" and "Show streak stats when the heatmap is
      hidden", all on by default, kept in the app's device settings and never in the collection, with
      the footer that they apply to this device only. (3) An Advanced disclosure (R1339), collapsed at
      first and remembered on the device: "History limit" and "Forecast limit", each a whole-number
      field in days where 0 or empty shows the placeholder "No limit" (`limhist`, `limfcst`; 0 to
      2,147,483,647), written when the field commits (Return or the focus leaving), never per
      keystroke; "Ignore data before", a toggle and, when on, a date picker from the collection's
      creation date to today (`limdate`; turning it on starts at the creation date, which A2.2
      ignores, so the heatmap changes only once a later date is chosen; turning it off writes 0);
      "Exclude deleted cards from history" (`limcdel`) and "Exclude manual reschedules from history"
      (`limresched`, on by default), toggles; "Exclude decks from main heatmap", a row whose value is
      the count ("None", "2 decks"), pushing the excluded-deck list (`limdecks`, R1340). That page: one
      row per stored id in the stored order, with the deck's full name, or "Deleted deck" for an id no
      deck has, kept until removed (stats/counting-rules N3.3); Add Deck… opens a searchable list of
      the collection's decks without those already listed, and the chosen deck is appended; a row is
      removed by swipe, ⌫ or Edit; the footer says subdecks are excluded too and that deck pages and
      Stats are not affected (R1340, R1343). No colour theme (R1315): `colors` keeps its stored
      value. Writes: each change is one K6 patch of the one member that changed (the whole new list
      for `limdecks`), at once, with no Save and no undo step (R115); opening and closing the section
      writes nothing, and an absent key stays absent (R1337, K6.2 step 1). A stored value a control
      cannot show as it is is kept until that control changes it (K6.3): a `limdate` with a fraction
      shows as the date it reads as; a `limdate` before the creation date or after today shows, with
      the toggle on, as that date in read-only secondary text in place of the picker, whose range
      stays the creation date to today (K6.1, U229); choosing the text shows the picker at the
      nearest date in range, and nothing is written until a date is chosen. Error: a write that fails
      shows its cause in the footer of the control's group and the control shows the stored value
      again; in Failed{Corrupt} the synced rows are disabled and the On This Device rows stay
      (shell.damagedCollection). Overflow: many excluded decks and long deck paths (two lines, then
      truncated in the middle, the full path as help text), and the largest text sizes, where values
      wrap under their labels. Keyboard: Tab through the controls, Return commits a number field, ⌘[
      or the back button leaves the deck list. VoiceOver: each control reads its label and value
      ("History limit, No limit"); a deleted deck's row reads "Deleted deck"; the Synced marker is read
      with its row. Identifiers stats.heatmapSettings.<name> (N11.12), for the names mode,
      firstDayOfWeek, limhist, limfcst, limdate, limcdel, limresched, limdecks, limdecks.add,
      showOnHome, showOnDeckPages and showStreaks. Core: the effective
      settings (K3, through U95), the K6 writer with its patch and `invalid_heatmap_setting`, the
      `firstDayOfWeek` write of editor/config-keys K1, the collection's creation date for the picker
      range, and the deck list for the excluded-deck picker.

  - id: deckOptions.options
    title: Deck options
    units: [U232, U233, U234]
    signature: true
    platforms: [iphone, ipad, mac]
    states: [typical, overflow, error, loading]
    variants: full
    references: [grouped-form, sheet-form, confirmation-dialog]
    purpose: >-
      A normal deck's options: its preset, the Essentials, the Advanced sections and the one undoable
      save (U232: shell, presets and save; U233: Essentials and Daily Limits; U234: the other
      Advanced sections; sched/deck-options O2 to O9; R730–R753; native-interface-contract N11.9).
      Option and section names are O3's, in Anki's English; help texts, issue texts and every other
      line are Meguri's own (String Catalog, O11). Entry points (R730): the deck menu's Deck Options…
      (home.deckMenu), the deck page's Deck Options button and the finished state's limit links
      (home.deckPage, U155), Deck › Deck Options… (⌥⌘O, the selected deck; R283), the O key on the
      deck list and the deck page for the selected or shown deck (R223), and during review the
      review ⋯ menu (iPhone, iPad; review.menu), Deck › Deck Options… (Mac) or the O key (R241,
      R421; it opens the sheet), for the current card's home deck. A filtered deck has no options screen (O1): its menus offer none (R53).
      Presentation: on Mac and iPad pushed in the main window's detail area above the screen it was
      opened from, with the system back button and the sidebar selection unchanged; on iPhone pushed
      full screen in the Decks tab's stack. Opened during a review session, on every platform, it is
      a sheet over the review instead (window sheet on Mac, page sheet on iPad, full-height sheet on
      iPhone; N11.9), which owns the keys (N4); Save or Cancel returns to the same card. Title "Deck
      Options", subtitle the deck's full name. Toolbar: Save (confirmation action, prominent; ⌘S and
      ⌘↩), disabled while an O4 error shows; in the sheet also Cancel. One grouped form, top to
      bottom: (1) Preset: a menu picker "Preset" listing every preset as "<name> (used by N decks)"
      in O2's order with O6.1's counts (R731), and beside it a Preset Actions menu (ellipsis.circle)
      with Add Preset…, Clone Preset…, Rename Preset…, Remove Preset… (disabled for Default, O6.5), a
      divider and Save to All Subdecks (always enabled, as in Anki: decided 2026-10-27, since O2
      does not say whether the deck has a normal subdeck; with none it saves this deck only); the
      Preset group's footer says that Save to All Subdecks also gives every subdeck this deck's
      daily limits and desired retention (O7.2 step 3); when O2's
      preset_missing holds, the footer also says that the deck's preset is missing and that saving
      assigns the selected one. (2) Essentials (R736): New cards/day and Maximum reviews/day, each
      with a segmented Preset, This deck and Today only picker above its number field (O6.2: it opens
      on the most specific tab that is set, choosing a tab clears the more specific ones, and Today
      only offers its stored limit again); Desired retention with Preset and This deck tabs, as a
      percentage (70 to 99 %, the stepper moving by one point, a stored value shown with up to two
      decimals such as 87.5 %); the "Don't play audio automatically" toggle. (3) An Advanced
      disclosure, collapsed at first and remembered on the device, with Anki's sections in R736's
      order holding O3's options: Daily Limits (New cards ignore review limit, Limits start from top),
      New Cards (Learning steps, Insertion order, with the footer that a changed order re-sorts the
      new cards of every deck using the preset when saved, R744), Lapses, Display Order (O3's lists in
      their order; Review sort order labels 6 and 5 ascending and descending difficulty), Burying
      (with R747's footer), Audio (Skip question when replaying answer), Timers, Auto Advance (tenths
      of a second, 0 shown as "Off") and Advanced (Maximum interval, Historical retention as a
      percentage from 70 to 97 %, Ignore cards reviewed before, Load balancer). Ignore cards reviewed
      before is a toggle and, when on, a date picker up to today's date. A stored empty text or
      1970-01-01 (both no cutoff, sched/fsrs-items I1.3) shows the toggle off and is kept as stored
      unless the user edits it (as O5.2 keeps an unedited field). Decided 2026-10-27: turning
      the toggle on sets the draft to the collection's creation date, so the count shows what that
      date keeps before a later date is chosen; turning it off sets the empty text, or the stored
      value again when that was 1970-01-01, so toggling on and off leaves the draft unchanged; under
      it the line "<included> of <total> cards included" (O2 item 7, asked again for each date
      entered), with the warning symbol when its flag is set. Decided 2026-10-27, as
      stats.heatmapSettings does for `limdate` (K6.3): a stored date after today, or a stored text
      I1.3 refuses, shows the toggle on and the stored text as read-only secondary text in place of
      the picker, with its O4 issue line (date_in_future or invalid_date) in the warning style, since
      it is no error while unchanged (O4.1); choosing the text shows the picker at today, and the
      draft keeps the stored text until a date is chosen; an unreadable text hides the count line
      (M5 gives no count for it). Never shown (R752, O3's hidden options):
      the FSRS switch, parameters, Optimize and Evaluate, the simulator, Easy Days, Custom scheduling
      and the SM-2 options; parameter optimization runs by itself (sched/optimizer) and reports in
      home.fsrsSheet and settings.diagnostics. Decided 2026-10-27: no notice for an unsupported preset
      (sched/fsrs-policy U1) here, since the snapshot has no such fact; its parameter lists are hidden
      options that a save keeps (sched/presets V8), and the study refusal (U51) names it. Every option
      row: the label; "Global" in secondary text after it for the three global options (R735); the
      control (a number field with a stepper, a text field for steps, a menu picker, a toggle or a
      date picker); a Restore Default button (arrow.counterclockwise) only while the draft value
      differs from O2's default (O6.6); a help button (info.circle) whose popover holds Meguri's help
      text (R734; a sheet at the medium detent at compact width). O4's issues show in one line under
      their row: an error with xmark.octagon in the system red, a warning with
      exclamationmark.triangle.fill in its multicolour rendering (the system yellow fill with a
      dark mark, N11.9), a strong warning with exclamationmark.octagon.fill in the system red,
      each with its text in the primary label colour, so colour is never the only sign. A steps field is checked as typed (O4.2,
      naming the bad token) and shows O5.2's text once it loses the focus with a valid value. A value
      outside its editor range shows `out_of_range` and keeps Save disabled; a stored out-of-range
      value shows as stored and is no error until changed (O4.1); steppers stop at the range. Preset
      menu: Add Preset…, Clone Preset… (prefilled with the current name) and Rename Preset… (prefilled)
      open an alert with one name field, OK and Cancel, applying decks/deck-presets P7 (O6.3, O6.4);
      Remove Preset… asks (confirmation-dialog) "Remove the preset “<name>”?" with the message that
      the N decks using it (O2's use count) move to the preset selected when the draft is saved and
      take this deck's daily limits and desired retention in place of their own (R733, O7.2 step
      3), with Remove (destructive) and Cancel (decided 2026-10-27: the message gives the count, not
      the deck names, since O2 lists no decks per preset and Anki's question names none). These change only the draft (O6). Save to All Subdecks saves at once
      with the subdeck flag (O7). Save (R737, O7): one "Deck Options" undo step; on success the screen
      returns to where it was opened from. While it saves (a draft that removes an existing preset
      takes the op's safety backup first) a progress indicator replaces Save and the controls are
      disabled. Leaving with unsaved changes (O6.6: back, ⌘[, Esc, Cancel, another sidebar item or
      deck, and a Mac quit, sync.quitFlush) asks, as a confirmation-dialog, Discard Changes or Keep Editing; on iPhone, while the
      draft differs, Cancel replaces the back button and the swipe back is off. Loading: the snapshot
      (O2) is read on the interactive lane; until it arrives the rows are placeholders of their final
      size and Save is disabled. Error: a refused or failed read (not_found, filtered_deck, storage)
      shows a content-unavailable view with its message, with Try Again for a storage failure;
      O7.1's validation refusal shows its issues on their rows; not_found at save (the deck or a
      preset removed meanwhile) shows an alert with Reload, which reads a new snapshot;
      SafetyBackupFailed shows R167's error alert with its cause and that nothing was changed, and
      the draft stays. Live: a change set that touches the deck or a preset reloads silently while the
      draft is unchanged, and otherwise shows a row at the top of the form, "These options were
      changed elsewhere.", with Reload and Keep Editing; in the exclusive phase every control is
      disabled under "Waiting for <operation>" (KTD17); CollectionReplaced closes the screen.
      Overflow: Advanced expanded, many presets, long preset and deck names (middle truncation, the
      full name as help text) and the largest text sizes, where controls wrap under their labels.
      Layout (R738): one column on iPhone and in narrow windows; in Mac and iPad windows wide enough
      for two form columns, the sections in two columns, Preset and Essentials first and the Advanced
      sections continuing in Anki's order. The R1988 variants vary only this wide arrangement; the
      controls, their order and the save stay. Keyboard: O (R223, R241, R421) and ⌥⌘O open it; Tab
      through the controls in order; ⌘S and ⌘↩
      save; Esc and ⌘[ go back, asking first when the draft differs; ↑ and ↓ step a focused number
      field on Mac. VoiceOver: each option's control is its element, never a row combined into one,
      so text editing and the stepper stay available: its label is the option's label with "Global"
      when it applies, its value the control's, and its issue text its hint; the row's "Global"
      text and issue line are hidden from VoiceOver; Restore Default and Help are also custom
      actions on the control, and their buttons stay reachable for Full Keyboard Access; an issue that
      appears after an edit is announced once; each section is a container named by its header.
      Identifiers (N11.9) deckOptions.options.preset.picker, deckOptions.options.preset.menu,
      deckOptions.options.preset.menu.add, deckOptions.options.preset.menu.clone,
      deckOptions.options.preset.menu.rename, deckOptions.options.preset.menu.remove,
      deckOptions.options.preset.menu.saveToSubdecks, deckOptions.options.save,
      deckOptions.options.cancel, deckOptions.options.advanced, deckOptions.options.option.<key>,
      deckOptions.options.option.<key>.restore, deckOptions.options.option.<key>.help.
      Core (U49): the O2 snapshot, O4's validation of the draft after each edit, O5's step text
      reading and writing, sched/memory-state M5's count for each entered date, the collection's
      creation date for the ignore-date toggle, the decks/deck-presets P7 naming helper and the O7 save with O7.1's refusals; the change stream for
      the live reload.

  - id: settings.root
    title: Settings
    units: [U160]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical]
    variants: pairwise
    references: [grouped-form, sidebar]
    purpose: >-
      The settings sections and their preferences (native-interface-contract N5, N11.4). Mac: the
      separate Settings window (⌘,) with a sidebar of sections and a search field; iPad and iPhone:
      the Settings sidebar section or tab of the main window, sections as rows. Each section is a
      grouped form.
  - id: settings.accountSync
    title: Account & Sync
    units: [U161]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: pairwise
    references: [grouped-form, list-counts, confirmation-dialog]
    purpose: >-
      The Account & Sync section, first in Settings (native-interface-contract N11.4, N11.8; R117,
      R122, R123, R125, R1560, R2046, R2054, R2059). Mac: a section of the Settings window's sidebar;
      iPad and iPhone: the first row of Settings, pushing this form. Text: sync/status-strings T14,
      with T3 to T9 for the status (titled `sync.settings.section`), and T18 for the Sync Service and
      Meguri Sync (sync/meguri-provider MP2–MP5; N12.4). It shows no Anki endpoint, account,
      transfer result or one-way option (Settings › Anki Server and Collection, N11.4; R1547, R1560).
      One grouped form: (0) Sync Service, always first (MP2): a standard Picker labelled
      `sync.service.label` with exactly `sync.service.iCloud` and `sync.service.meguri`. It shows the
      committed selection only: choosing a value writes no selection, and the shown service changes
      only when its change commits. While no service is selected (local-only) it shows no value, with
      `sync.service.none.footer` as its footer; choosing iCloud Sync then opens the flow of section
      (1)'s enable control (sync.connect, or Resume Syncing's continue page for a stopped binding
      that V9.2 offers), and choosing Meguri Sync selects it with nothing to stop and shows (M).
      While a service is selected, choosing the other opens sync.serviceSwitch. While a change runs
      the picker is disabled with `sync.service.changing` under it; after a failed change,
      `sync.service.changeFailed`. In handoff recovery (MP3.5), whatever the selection, the picker
      is disabled and `sync.service.recovery` sits under it with `sync.service.recovery.action`,
      which asks the alert `sync.service.recovery.title` with `.message`, destructive `.confirm` and
      `sync.service.cancel`, then calls recoverProviderHandoffToLocalOnly; that action is offered nowhere else.
      While the provider phase is blocked the picker is disabled with `sync.service.blocked` and no
      action. Opening the section or choosing a value starts no Meguri request (MP2). Sections (1)
      to (6) are iCloud Sync's, shown unchanged whenever Meguri Sync is not the selected service;
      while it is, (M) replaces them. (1) iCloud (`sync.settings.iCloud`): the status row with
      sync.status's symbol and the T3 title and detail, then T4's lines, T5's media lines and, while a
      Sync Now runs or after one, T7's step or result; the account row, `sync.settings.account.*`
      by the account status and whether it matches the binding (`.other`); the account guidance of T3
      when iCloud is unavailable, as text with no sign-in field and no Apple password (R117); then
      the enable control (T14), the first that applies, none with a confirmation (V16):
      `sync.settings.resumePause` while the user's pause is on, whatever the binding, so a pause can
      always be cleared (decided 2026-10-27); none while the state is `paused{decisionRequired}`,
      whose `sync.decision.action` (accessibility label `sync.decision.action.label`) sits under the
      status row's detail whatever the pause and opens sync.publicationChoice, so Connect to iCloud…
      is not shown (its Replace would publish with reason 2, not V12.2's); `sync.action.resume`
      (sync.connect's continue page) for a `stopped` binding while V9.2 offers it (T9.2: a stopped
      binding is the `localOnly` state, not an attention row); `sync.connect.action` while no
      binding is usable (sync.connect); otherwise `sync.settings.pause`; then `sync.now.command`,
      disabled with T6's reason as its footer. Section
      footer `sync.settings.privacy` (R2058, R2059). (2) The device-local toggles
      `sync.settings.automatic` (R123; default on after a connection) and `sync.settings.media`
      (R122; default on), each with its footer; written only on change (R114), and disabled while
      no binding is usable. (3) Needs Attention, present only with items: one row per P14.4 item in
      P14.4's order with its T9.1 text and count and its T9.2 actions as buttons, as in sync.status;
      Show Details… pushes the item's list (T11.3: one row per item, `sync.item.*` with the key, and
      `sync.item.error` for applyFailed and rekeyFailed; media names alone), with Copy Debug Info in its
      toolbar; Abandon Change… asks T13.3's alert; Cancel Replacement… asks T13.5's; Keep on This
      Device Only… asks T14's local-only alert. (4) `sync.settings.conflicts`, always present, with the
      unresolved count as its value (V17.2); it pushes sync.reviewConflicts, also at zero. (5)
      `sync.settings.advanced`, only while the account is available; showing it starts the preview
      read of `MGActive` and its `MGEpoch` records (V26.1 "Preview reads", not while paused; an
      iCloud read N11.8 allows, not an Anki server request):
      `sync.adopt.action`
      (sync.replaceLocal with the active source, shown while a fresh read of `MGActive` names a
      complete epoch, V14.1), `sync.adopt.previous` (the previous source, only while V14.1 offers it),
      `sync.publish.action` (sync.replaceCloud, V15.1), as T14 lists the group. Decided 2026-10-27:
      while the user's pause is on (V16; automatic sync off is not a pause) no preview read runs,
      so the group shows `sync.adopt.action` and `sync.publish.action` disabled, with
      `sync.status.paused.user` as its footer, and no `sync.adopt.previous` (N11.8). (6) While a binding
      is active, whatever the account status (stop_using_icloud needs no account or network), its
      own row outside Advanced: `sync.settings.stop`, opening the alert `sync.settings.stop.title` with `.message`, destructive
      `.confirm` and Cancel (stop_using_icloud, V16); a stopped binding's Resume Syncing is the
      enable control (1). Decided 2026-10-27: while an `adopt` or `publish` row of this build exists
      (V2.3; a `prefetch` row does not count), Stop stays enabled and, when chosen, shows
      `sync.recovery.error.busy` with that op's name in its row and opens no alert, because the op's
      Cancel or failure returns the binding before to its recorded state (V14.3, V15.3) and would
      undo the Stop; the user cancels the op first (sync/cloudkit-recovery V26.2 should give
      stop_using_icloud the same `Busy{running_op}`). Gates: an action V20 refuses during a review
      session stays enabled and shows `sync.recovery.error.sessionActive` in its row when chosen
      (T9.2); Sync Now follows T6; Replace iCloud Collection… and Review Conflicts work during a
      session (V20). In the exclusive phase a recovery action shows `sync.recovery.error.busy`
      (R171). In Failed{Corrupt} the toggles, Pause, Review Conflicts (read only) and
      `sync.adopt.action` (V19's conditions) stay usable; Sync Now shows `collectionUnavailable`.
      (M) Meguri Sync, while it is the selected service (T18.3 to T18.7): (M1) the status row
      labelled `sync.service.meguri`, one element with the T18.4 title and detail of the first
      condition that applies, then T18.5's or T18.6's lines and controls for a setup stage or a
      blocked media phase. Use This Device’s Collection… and Use Server Collection… are shown
      together, neither the default button; they and Download from Meguri Sync… only start the
      preparation (Preparing… with Cancel), whose preview opens sync.meguriSetup. Show Affected
      Files pushes a page inside Account & Sync on every platform: a native List of the affected
      files sorted by name, each its name and T18.6 state, `sync.meguri.media.lossyName` under a
      name that is not valid text, titled `sync.meguri.media.list.title`, footer
      `sync.meguri.media.list.footer`, and `sync.meguri.media.list.excluded` while a file that can't
      transfer is listed; the names appear nowhere else, logs included. Retry calls the media retry,
      which recomputes the list, keeps every guard and never clears the block by leaving a file out
      (MP5); nothing deletes or converts a file automatically, and no text points to a media folder.
      After an exactly accepted upload whose local activation did not finish, and after
      `activationInterrupted`, the row offers only `sync.meguri.setup.finish` (identifier
      settings.accountSync.meguri.finishSetup), shown and enabled only while the core exposes a
      permitted recovery command for the retained operation; this contract defines no such command
      and does not claim one exists. No new collection choice shows until it is settled (MP4).
      (M2) The account. While unconfigured, signed out, cancelled or Sign In Required: the fields
      `sync.meguri.address` (URL keyboard), `sync.meguri.username` (username content type) and the
      secure `sync.meguri.password` (password content type), with no autocapitalization or
      autocorrection, then `sync.meguri.signIn`, disabled until all three hold text and also chosen
      by Return in Password, with footer `sync.meguri.signIn.footer`. Sign In normalizes the address
      locally first (`sync.meguri.error.address`, with no request, when refused), applies an address
      change, which invalidates the stored sign-in (MP2), then only authenticates; a failure shows
      its T18.3 line under the fields. The password field is emptied after every attempt and on any
      address edit. Otherwise the address is a read-only row, with `sync.meguri.signOut` (its alert:
      `.title`, `.message`, destructive `.confirm` and `sync.service.cancel`; `sync.meguri.signingOut`
      while work drains; `.failed` when removal fails, then the selection and connection phase the
      core actually reports, never a claim that they are unchanged). Sign Out calls
      removeMeguriConnection, which is changeProvider(to: .localOnly, removing the credentials):
      only after the actual drain and credential deletion does local-only become the selection,
      never iCloud Sync, keeping the collection, media, server data and every unresolved
      operation's evidence (MP2); the address changes only after Sign Out. While the
      connection is blocked: `sync.meguri.connection.retry`, then Sign Out. No Test Connection is
      offered. (M3) While a round is reported: `sync.now.command` in T18.7's disabled and enabled rows
      only, enabled exactly in its last row, with T18.7's reason as its footer otherwise, and `sync.meguri.pause` or
      `sync.meguri.resume`. There is no media toggle: media is always included (MP1, MP5). (M4)
      `sync.meguri.stop`, opening sync.serviceSwitch to local-only, except in handoff recovery and
      while blocked. A control shows only while the core reports its stage, so none calls a command
      that does not exist yet. Meguri Sync states: empty: Not Set Up with empty fields; typical: On
      with its last exchange; loading: Signing In…, Preparing…, a transfer or a round running;
      error: Setup Didn’t Finish, Setup Not Finished on This Device, Media Incomplete, Server
      Acceptance Unknown, Last Exchange Didn’t
      Finish, a blocked connection; overflow: a long address and long affected names wrap, and the
      affected list scrolls.
      Empty: never connected: the iCloud group with T3's localOnly lines and Connect to iCloud…, the
      toggles disabled, Review Conflicts… at 0. Typical: connected and up to date. Loading: an
      exchange, media transfer or recovery op running, its progress in the iCloud group, with Cancel
      where V14.3 or V15.3 allow it. Error: needs attention, iCloud unavailable, quota full (T9.1 with
      the storage guidance and Try Again; study, edits, backups and file export go on, R2059), local
      storage full, unsupported schema. Overflow: many attention rows and long details lists scroll;
      at the largest text sizes row values wrap under their labels. Changes apply at once with no
      Save (R115). Keyboard: Tab through the rows; ⇧⌘Y runs Sync Now from anywhere, and the
      unmodified Y only when no text field, secure field, open menu or other view that owns keys has
      focus, through the same ownership check as the review keys (N4, N11.3; the Settings search
      field keeps its letters; sync.status). VoiceOver: the status row is one element with its title and detail; each
      attention row reads its text and count and offers its actions as custom actions as well as
      buttons; the toggles read their state. Identifiers settings.accountSync.status,
      settings.accountSync.connect, settings.accountSync.resume, settings.accountSync.decide,
      settings.accountSync.pause, settings.accountSync.syncNow,
      settings.accountSync.automatic, settings.accountSync.media,
      settings.accountSync.attention.<item>, settings.accountSync.reviewConflicts,
      settings.accountSync.replaceLocal, settings.accountSync.restorePrevious,
      settings.accountSync.replaceCloud, settings.accountSync.stop, settings.accountSync.service,
      settings.accountSync.serviceRecovery, settings.accountSync.meguri.status,
      settings.accountSync.meguri.address, settings.accountSync.meguri.username,
      settings.accountSync.meguri.password, settings.accountSync.meguri.signIn,
      settings.accountSync.meguri.retryConnection, settings.accountSync.meguri.signOut,
      settings.accountSync.meguri.useDevice, settings.accountSync.meguri.useServer,
      settings.accountSync.meguri.download, settings.accountSync.meguri.cancelSetup,
      settings.accountSync.meguri.finishSetup,
      settings.accountSync.meguri.showAffected, settings.accountSync.meguri.affectedList,
      settings.accountSync.meguri.retryMedia, settings.accountSync.meguri.syncNow,
      settings.accountSync.meguri.pause, settings.accountSync.meguri.stop. Core: the P14 status and
      syncNowAvailability() through U151's SyncStatusModel and SyncCoordinator; DeviceSettings for
      Pause, automatic and media (V2.1, R324); recovery_state(), resume_recovery_op,
