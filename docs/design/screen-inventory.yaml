# Meguri's screen inventory (U9, R2001): the only list of screens. UI units
# add and refine their own entries; screens.md is generated from this file
# (`tools/mg design-docs --write`) and `tools/mg design-docs` fails when it is
# stale or an entry breaks the rules below.
#
# Per screen:
#   id          area.screen, lowerCamel parts; the prefix of the screen's
#               accessibility identifiers (R1964)
#   title       what the screen is called in reviews and the gallery
#   units       plan units that build it
#   signature   true for the signature set (R1972 plus deck options from the
#               design-quality Success Criterion): full snapshot covering set
#               and a variant pick (R1988)
#   platforms   iphone, ipad, mac, widget
#   states      from U10's five: empty, typical, overflow, error, loading;
#               each needs a preview and a snapshot (R1970, U252)
#   variants    full (signature screens) or pairwise (U252)
#   references  pattern ids from references/index.md
#   purpose     one line
#
# Status (sketch, built, verified, approved) is never kept here: it lives
# only in screen-status.yaml (U10, U254).

version: 1
screens:
  - id: shell.root
    title: App shell
    units: [U150]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, loading, error]
    variants: pairwise
    references: [sidebar, tab-bar, toolbar]
    purpose: Root layout with the sidebar on iPad and Mac and the tab bar on iPhone, plus the status overlay.
  - id: shell.keyboardShortcuts
    title: Keyboard shortcuts help
    units: [U158]
    signature: false
    platforms: [ipad, mac]
    states: [typical, overflow]
    variants: pairwise
    references: [sheet-form]
    purpose: The list of keyboard shortcuts for the current context.
  - id: shell.damagedCollection
    title: Damaged collection
    units: [U153, U163a, U251]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, error, loading]
    variants: pairwise
    references: [content-unavailable, confirmation-dialog]
    purpose: >-
      Shown in Failed{Corrupt} (engine/lifecycle L1, maintenance/optimize-integrity M7) in place of
      the whole root content: no sidebar, tab bar, deck list or review. A native content-unavailable
      view with the exclamationmark.triangle symbol, the title "This Collection Is Damaged" and one
      line, "Meguri stopped saving changes and sending anything to iCloud so the damage can't spread.",
      then the remedies as buttons in M7.1's order, each shown only while M7.1 offers it:
      "Check Database" (U163 once U128 lands), "Restore from Backup…" (when the backups listing holds a
      backup or server copy; opens settings.backups' restore sheet with the newest restorable backup
      preselected) and "Replace with iCloud Collection…" (only when sync/cloudkit-recovery V19's
      conditions hold; opens sync.replaceLocal, its V14 preview). The first offered remedy has the prominent style, the
      others the bordered style; "Copy Debug Info" is always there as a plain button below them. No
      remedy downloads from an Anki server. Empty: no remedy is offered, so the line adds "No backup or
      iCloud copy of this collection is available on this device." and only Copy Debug Info shows.
      Loading: Check Database's stages or the iCloud entry's progress replace the buttons, with Cancel
      while the operation says stopping is safe. Error: Check Database or the iCloud entry failing or
      refusing (Check Database's corrupt verdict, offline, SafetyBackupFailed) shows its reason in one
      line above the remaining buttons; the screen stays. A restore started here reports its progress
      and errors in settings.backups' restore sheet. A remedy that succeeds returns to the deck
      workspace. Every menu command that needs a collection is disabled; Settings, Copy Debug Info and
      Quit stay available. In Settings every row stored in the collection is disabled; device-local
      rows, Backups' Restore from Backup… and Show in Finder or Files, and About stay usable.

  - id: onboarding.welcome
    title: Welcome
    units: [U166]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, error]
    variants: pairwise
    references: [onboarding]
    purpose: >-
      First launch with no collection (U151's CollectionStore in NoCollection; R157, R161, R163,
      R2046; native-interface-contract N11.8). It replaces the whole root content: no sidebar, tab bar
      or toolbar sync button; Settings (⌘, on Mac) and Quit stay available. Layout (onboarding): the
      app icon, the title "Welcome to Meguri", one line saying Meguri studies flashcards on this
      device and syncs through the user's private iCloud, then three buttons in R157's order:
      `sync.connect.action` ("Connect to iCloud…", prominent), "Import a File…" (bordered) and
      "Start Empty" (bordered);
      full width on iPhone, content-sized and centred on Mac and iPad. No feature rows, walkthrough,
      sample deck or Anki login (R157, R163). Line texts are Meguri's own (String Catalog); the iCloud
      text is sync/status-strings' (T12 names this choice, T14 and T8 the reasons). Connect to iCloud
      opens sync.connect
      (cloudkit-recovery V13). Import a File… opens onboarding.collectionImport now and U162's full
      file intake once it lands; the imported collection stays local, and its iCloud choice is the
      first connection (V12.2). Start Empty creates the collection with only the Default deck and the
      stock note types (R161), local only, and opens Home; it never asks for an Apple account.
      Connect to iCloud needs the account status `available` with an identity read in this process
      (V13.1): while the status is anything else (sync/policy P14.4 unavailableReason; offline before
      the identity is read, V9.1) the button stays visible and disabled, the reason
      (by unavailableReason: noAccount `sync.settings.account.none`, restricted
      `sync.settings.account.restricted`, temporary `sync.settings.account.temporary`, setupNeeded
      `sync.error.noAccount`; offline `sync.error.offline`; T3's details speak of "this collection",
      which Welcome does not have yet) shows in one line under it as text only, with no link that changes system accounts and no Apple password
      field (R102, R117, R2065), and Start Empty takes the prominent style; the button enables as soon
      as a later account read succeeds (V9.1's read points). Error: a failed Start Empty (disk full) shows
      its cause in one line and the screen stays. Decided
      2026-10-27: an iCloud download interrupted by a relaunch has no error state here: V14.3 deletes
      its staging and op row at restart and no core fact records it, so Welcome shows as usual and
      Connect to iCloud starts V13 case b again. Keyboard: Tab moves through
      the buttons; Return activates the prominent one. VoiceOver: the title is a header; the reason
      line is read as the hint of Connect to iCloud. Identifiers onboarding.welcome.connect,
      onboarding.welcome.import, onboarding.welcome.startEmpty. Core: the account status from U151's
      SyncStatusModel (P14 iCloudUnavailable and its reason), the empty-collection create of R161; no CloudKit read or write starts before Connect to iCloud
      (R2046).

  - id: onboarding.collectionImport
    title: Import Collection
    units: [U166]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: pairwise
    references: [sheet-form]
    purpose: Choose a latest-format collection-only .colpkg, confirm inspected counts and local replacement safety, and follow cancellable import progress or a typed failure.

  - id: home.deckList
    title: Home and deck list
    units: [U152, U228]
    signature: true
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: full
    references: [list-counts, sidebar, content-unavailable]
    purpose: >-
      The deck tree as a native list (native-interface-contract N2, N11.5): each row the deck's last
      name component with the non-zero New, Learning and To Review counts as secondary text, the Mac
      and iPad sidebar rows with a To Review badge; then the activity section (studied-today line, heatmap,
      streak stats; U228) in the same list on every layout; and the sync button.
  - id: home.deckPage
    title: Deck page
    units: [U155, U228a, U228]
    signature: true
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: full
    references: [list-counts, charts]
    purpose: >-
      One deck's labelled New, Learning and To Review counts with the buried "+N" badge (U228a), the
      Study button, the finished state, and the deck-scoped heatmap, streak stats and Stats action
      (U228).
  - id: home.deckMenu
    title: Deck menu
    units: [U152, U156]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical]
    variants: pairwise
    references: [list-counts, confirmation-dialog]
    purpose: >-
      One menu for a deck, shown as the row's context menu (right-click, long press) and the Mac row's
      hover ⋯ button, in R47's order with Delete separated and destructive and Unbury only with buried
      cards; a filtered deck's menu offers only Rename and Delete (R53). On iPhone a row swipe shows
      Options and More, never Delete (R49). The menu bar's Deck menu is U159's and follows R283. Until
      U156 lands the menu holds Study and Overview (U152). Delete of a subtree with cards asks first with
      the deck and card counts (confirmation-dialog); deletes and moves end with an Undo toast.
  - id: home.deckName
    title: Deck name sheet
    units: [U156]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, error]
    variants: pairwise
    references: [sheet-form]
    purpose: >-
      The sheet for Create Deck, New Subdeck (prefilled "<parent>::", cursor at the end) and Rename
      (prefilled full path): one name field, Cancel and a confirm button disabled for an empty or
      blank name. Error: the refused move or name in one line under the field; a final name that
      differs from the typed one is reported after saving.
  - id: home.goToDeck
    title: Go to Deck
    units: [U156]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow]
    variants: pairwise
    references: [search-tokens, sheet-form]
    purpose: Filter decks by name and jump to one.
  - id: home.sessionSummary
    title: Session summary
    units: [U157]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow]
    variants: pairwise
    references: [sheet-form, list-counts]
    purpose: >-
      A sheet over the restored deck workspace (window sheet on Mac, form sheet on iPad, sheet on
      iPhone), shown when R91 says (queue empty, timebox Finish, Back to Decks or Esc after at least
      one answer). Title "Session Summary"; toolbar Done (confirmation action; Return and Esc too) and
      Undo (⌘Z; while an answer can be undone). A grouped list: (1) totals: cards studied and time
      ("42 cards in 12 minutes"), Again, Hard, Good and Easy counts as four labelled values, "Passed"
      as the percentage of answers that were not Again, and new cards introduced; (2) What's Next:
      remaining today with a bordered Continue button after an early close (Done keeps Return), or the time until the
      next learning card, or "Finished for today" with tomorrow's due count; the finished state's
      limit and buried notes with their actions (R94); (3) the streak line once U228 fills its slot,
      taking no space before; (4) Missed Cards in first-miss order: question excerpt (two lines at
      most), deck name as secondary text, the miss count trailing ("2×"), a deleted card labelled
      "Deleted card"; a row opens the read-only preview once U186 attaches it, and "Browse Missed
      Cards" sits under the section once U210 attaches it. Empty: no missed cards, the section reads
      "No missed cards". Overflow: many missed cards scroll inside the sheet; the toolbar stays. The
      deck page's "Last Session" opens the same sheet read-only: title "Last Session", no Undo,
      Continue or Unbury. No chart.
  - id: home.fsrsSheet
    title: FSRS optimization sheet
    units: [U51]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, error, loading]
    variants: pairwise
    references: [sheet-form]
    purpose: The FSRS-only notice and parameter optimization status for a collection.

  - id: review.question
    title: Review, question side
    units: [U175, U177, U180, U181]
    signature: true
    platforms: [iphone, ipad, mac]
    states: [typical, overflow, error, loading]
    variants: full
    references: [progress-header, floating-controls]
    purpose: >-
      The card's question side in quiet corners (native-interface-contract N3, N11.1, N11.2): Back to
      Decks at the upper left, the timer, touch undo and ⋯ and the sync status icon at the upper right,
      the thin progress bar under them, the card scrolling between them and a reserved bottom action
      region holding the Show Answer button.
  - id: review.answer
    title: Review, answer side
    units: [U175, U178, U179]
    signature: true
    platforms: [iphone, ipad, mac]
    states: [typical, overflow, error]
    variants: full
    references: [floating-controls, progress-header]
    purpose: >-
      The answer side: the same corners and card position as the question side, and in the same
      bottom region the Again, Hard, Good and Easy buttons in one row, interval as the prominent label
      and grade name secondary, no key hints (N11.2). iPhone (compact width, any iPad window that
      narrow): full screen above the hidden tab bar with the status bar visible, the exit an xmark
      close button named "Back to Decks", undo and ⋯ at the upper right, the bottom region above the
      home indicator and clear of the fold, buttons at least 44 pt tall with Dynamic Type capped to
      keep one row (R358), card taps and tap zones as U180. iPad at regular width: the review fills
      the window with the sidebar hidden for the whole session, the labelled Back to Decks button,
      and the iPhone touch rules; with a hardware keyboard the shortcuts appear in the menu bar and
      the ⌘ overlay, not on the buttons. Landscape and short windows keep the corner controls and the
      one-row bottom region; only the card area shrinks.
  - id: review.menu
    title: Review menu
    units: [U182]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical]
    variants: pairwise
    references: [toolbar, toast]
    purpose: In-place card actions (bury, suspend, flag, mark, edit) and their toasts.
  - id: review.setDueDate
    title: Set Due Date
    units: [U183]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, error]
    variants: pairwise
    references: [sheet-form]
    purpose: Set the current card's due date from the review screen.
  - id: review.forget
    title: Forget card
    units: [U183]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical]
    variants: pairwise
    references: [sheet-form, confirmation-dialog]
    purpose: Reset the current card to new with its two remembered options.
  - id: review.editCurrent
    title: Edit current card
    units: [U184]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, overflow, error]
    variants: pairwise
    references: [editor, sheet-form]
    purpose: Edit the note of the card under review without leaving the session.
  - id: review.congratulations
    title: Congratulations
    units: [U186]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical]
    variants: pairwise
    references: [content-unavailable]
    purpose: Nothing left to study today, with what comes next.

  - id: editor.add
    title: Add note
    units: [U190, U192, U193, U195]
    signature: true
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error]
    variants: full
    references: [editor, toolbar, sheet-form, toast, confirmation-dialog]
    purpose: >-
      Add notes (U195). Entry points (R796, notes/add-defaults D3): the Home toolbar "+", the
      review ⋯ menu, Browse's Add Notes and the A key; from a deck, with that deck preset (D1
      preset_deck): the deck page "+", the deck menu's Add Note, the empty deck page and Browse's
      sidebar; Create Copy (Browse, review ⋯) and AnkiConnect guiAddCards. Mac: a resizable trailing
      panel in the main window beside the current content, never a separate window; iPad: a page
      sheet; iPhone: a sheet at full height (large detent; decided 2026-10-27: this is R796's and
      U195's "full-screen sheet", kept a sheet so that the swipe-down reaches R816's prompt). The
      draft is kept above the layout, so it survives size changes (R5). Layout, top to bottom, one
      form: the Type and Deck rows (R797), each showing the current name; on Mac each opens a popover
      with a searchable list, on iPad and iPhone each pushes a searchable list inside the sheet; the
      deck list leaves out filtered decks and an empty Default deck with no subdecks. Then the fields
      in order (U190), each labelled with its name and with a pin toggle for its sticky option (R805);
      the formatting controls (U192: a toolbar row above the fields on Mac, the keyboard accessory on
      iPad and iPhone); the Tags field with suggestions (U193; tags/complete C5: at most 500, "::"
      shown as "∷"). Mac panel: a header with the title "Add Note" and a close button, and a bottom
      bar with History and the prominent Add button. Sheets: a close button (system close role) at
      the leading edge, History and the prominent Add button (confirmation action) at the trailing
      edge. Image occlusion note types hand the field area to U206. Defaults: on open, and on a
      reopen while the draft is blank, the screen asks notes/add-defaults D1 with the card under
      review and the entry's deck (D3, D4); a draft that is not blank is kept unchanged. A note type
      change maps the content (R802) and, with addToCur off, selects D2's deck when it gives one
      (editor/config-keys K4.2). After each change set the screen checks its selection (D5). Create
      Copy and a prefilled draft replace an unchanged draft, or ask first (D3). Live check
      (notes/field-check K1): 600 ms after a change and when a field loses focus. Duplicate: the
      first field is marked and the line "A note with this first field already exists." shows with a
      "Show Duplicates" button, which opens Browse on the dupe: search built by
      search/join-and-replace J3, or on nid: with the found notes when J3.4 refuses the text; a
      duplicate never blocks adding (R808). Each cloze state shows its line under the fields (R812);
      the empty state shows its line only once some field is not empty (decided 2026-10-27: a blank
      draft shows no line, which narrows notes/field-check K5's live hint for that draft, and a
      refusal names its cause in place, with no alert). Line texts are Meguri's own (String Catalog).
      Add (⌘↩, R813): flushes the editor and runs the check again; empty, notetype_not_cloze and
      field_not_cloze refuse (R809, R810): no alert, the state's line shows (on a blank draft the
      empty line appears now) and stays, focus moves to the first field and VoiceOver announces the line; missing_cloze asks first
      (confirmation-dialog "Add without a cloze deletion?", Add and Cancel; R811); otherwise the note
      is added with update_add_defaults true (D6), as one undo step "Add Note" (R814), and a toast
      says "1 card added" or "N cards added" with Undo. The next draft keeps the sticky fields and
      every tag, and focus returns to the first field (D6). History (⇧⌘H, R815): a popover (Mac,
      iPad) or a pushed list (iPhone) of the notes added since launch, newest first, each the first
      30 characters of its first field; a row opens Browse on nid:<id>; a deleted note's row is
      disabled as "(Note deleted)"; with no notes it says "No notes added yet." Close (R816, R259):
      Esc, ⌘W, the close button and the iPhone swipe-down; when the draft is not unchanged since the
      last add (D4), confirmation-dialog "Discard current input?" with Discard (destructive) and Keep
      Editing. Empty: a blank draft of the default note type and deck, no lines, Add enabled.
      Overflow: 31 fields and long field text scroll between the Type and Deck rows and the bottom
      controls, which stay visible. Error: the refusals above; D1's InvalidArgument (no note type)
      or NotFound shows a content-unavailable view in place of the form, with Add disabled; an add
      that fails shows its message in one line above Add and keeps the draft; in the exclusive phase
      Add is disabled with "Waiting for <operation>" (KTD17), and a collection replacement asks the
      close prompt first. Keyboard (menu commands too): ⌘↩ Add, ⌘N Type, ⌘D Deck, ⇧⌘H History, F9 or
      ⌥⌘P pin the focused field, ⇧F9 pin all fields or clear all when any is pinned (R862), Esc or ⌘W
      close, Tab between fields. VoiceOver: each field editor is labelled with its field name; the
      pin is a toggle "Pin <field name>"; Type and Deck read their label and value; a line that
      appears after Add and the toast are announced. Core: notes/add-defaults D1 and D2,
      notes/field-check K1, tags/complete C1, the add op with update_add_defaults (notes/note-records
      A4), the sticky field update (U29), editor/config-keys K4 (addToCur is read here and set in
      Settings › Editing), and search/join-and-replace build for dupe: and nid:.
  - id: editor.edit
    title: Edit note
    units: [U190, U196]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, overflow, error]
    variants: pairwise
    references: [editor, inspector]
    purpose: Edit an existing note from the browser or review.

  - id: noteTypes.list
    title: Note types
    units: [U200]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: pairwise
    references: [list-counts, sheet-form, confirmation-dialog]
    purpose: >-
      The Note Types screen (U200; R915–R919; notetypes/records N5, N7, N8, notetypes/stock-kinds
      K1, K8, notetypes/structure-changes S12, notetypes/restore-to-default; native-interface-contract
      N11.10). Line texts are Meguri's own (String Catalog), except R914's and R918's questions.
      Entry points (R915, R18): the Note Types sidebar section (Mac, iPad; R17); View › Note Types
      (⇧⌘N, R282) and Tools › Note Types (R285), which select that section; the Note Types row of Settings ›
      Collection (Mac: it brings the main window forward on the section; iPad: it selects the
      section; iPhone: it pushes this list inside Settings); and Browse's ⋯ menu (Mac and iPad select
      the section; iPhone pushes the list inside Browse). Layout: one native List of every note type
      by name (unicase order); a row is the name with the note count trailing as secondary text ("1
      note", "1,204 notes"), which a background query fills in and which stays blank until then
      (R915). Mac and iPad: rows are selectable; the toolbar holds Add (plus) and an Actions menu
      (ellipsis.circle) for the selected type, whose items are also the row's context menu; Return
      or a double click opens Cards…; Delete (⌫) asks to delete. iPhone: a row pushes the type's page:
      its note count, then Fields…, Cards…, Rename…, Restore to Default… and, in its own group,
      Delete Note Type… in the destructive style; Add (plus) is in the navigation bar. Actions (R917
      to R919): Fields… (noteTypes.fields) and Cards… (noteTypes.templates), each a sheet over this
      screen (N11.10); Rename… (a sheet with one name field prefilled with the name, Cancel and Rename,
      disabled while blank; records N8; the type stays selected); Restore to Default… (R914): the
      confirmation-dialog "Restore “<name>” to its default fields, card types and styling?" with the
      message that notes keep their content by field position and that fields and card types past
      the default's count are removed with their content, Restore (destructive) and Cancel, Cancel
      being the default so that Return cancels (R914's default No); when the op answers
      NeedsStockKind (restore-to-default D2), a sheet lists K1's six kinds, and the chosen one is
      submitted; Delete… (R918): disabled while it is the only note type (LastNotetype, S12);
      otherwise the confirmation-dialog "Delete this note type and all its cards?", or "Delete this
      unused note type?" when it has no notes, with Delete (destructive) and Cancel. Add (R916): a
      sheet "Add Note Type" with one list of choices, an Add section of "Add: <stock kind>" for K1's
      kinds and a Clone section of "Clone: <name>" for every note type, the first one selected, and a
      Name field under it prefilled with the choice's name (K1's name, or "<name> copy"), following
      the choice until the user edits it; Cancel and Add, disabled while the name is blank. The new
      type is selected and scrolled to. Rename and Add (from a clone or a stock kind) are checked
      saves (notetypes/validation V1): when the op refuses one with a V3 failure, the sheet stays
      open with the name as typed and the failure's message under the name field (Meguri's wording,
      V4, naming the card type), and nothing is written; the type's templates are fixed in Cards….
      A restore or a delete shows the op's progress in its row and the list stays usable; nothing
      more is asked (notetypes/schema-changes G4), and the op takes its own safety backup. While a
      restore plans, its row's progress has a Cancel button (restore-to-default D6, structure-changes
      S10), which ends it with Cancelled and leaves the type as it was; a delete and every write
      phase show progress without Cancel (S12 offers none). Empty: a collection with no note type (only a damaged one) shows a
      content-unavailable view "No Note Types" with Add. Loading: the names show at once and the
      counts fill in. Error: a failed list read shows a content-unavailable view with its message and
      Try Again; a count that fails stays blank; SafetyBackupFailed of a delete or a restore shows
      R167's error alert with its cause and that nothing was changed, and the list stays as it was;
      NoteFieldCountMismatch of a restore says Check Database can repair the note
      (structure-changes S1.2 item 4). Overflow: hundreds of note types and long names (two lines,
      then truncated, the full name as help text) scroll. Keyboard: ↑ and ↓ move the selection,
      Return opens Cards…, ⌫ asks to delete, Tab reaches the toolbar. VoiceOver: a row is one element
      with its name and note count, and Fields, Cards, Rename, Restore to Default and Delete as custom
      actions. Identifiers noteTypes.list.row.<id>, noteTypes.list.add, noteTypes.list.fields,
      noteTypes.list.cards, noteTypes.list.rename, noteTypes.list.restore, noteTypes.list.delete.
      Core: the note type list and the background note counts (U29); add (stock-kinds K8, records
      N5), clone (N7), rename (N8), restore (restore-to-default D1 to D7) and remove
      (structure-changes S12), each with its progress and refusals.
  - id: noteTypes.templates
    title: Card templates
    units: [U200]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, overflow, error, loading]
    variants: pairwise
    references: [editor, inspector, sheet-form, confirmation-dialog, toast]
    purpose: >-
      The card template editor (U200; R929–R937, R942, R943, R276; notetypes/structure-changes S1,
      S9 to S11; notetypes/validation V3, V4; native-interface-contract N11.10). Entry points: Cards…
      of noteTypes.list, the editors' Cards… (⌘L; editor.add, editor.edit, review.editCurrent; R847,
      saving the note first) and Browse's sidebar note type and card type items. Presentation, from
      every entry: a sheet over the current screen, page-sized and resizable on Mac, page-sized on
      iPad, full screen on iPhone; it never changes the selected section or ends a review, and
      closing it returns to the screen it came from, whose preview renders again. Title "Card Types
      for “<note type>”". Layout, top to bottom: the card type picker (R931), a menu picker of "N:
      Name" for each template with the line "Changes below will affect the N notes that use this card
      type." under it, or for a cloze type a picker of the previewed note's cloze numbers; a
      segmented picker Front Template, Back Template and Styling (⌘1, ⌘2, ⌘3); the code editor (R929:
      TextKit 2, the system monospaced font, smart quotes, smart dashes, text replacement and
      autocorrect off, Tab inserting four spaces, ⌘F the system find bar), with `{{…}}` tags
      highlighted in the system accent colour and a delimiter change honoured (R930); under it the
      issues list (V4, checked about 300 ms after a change): one row per failure in V4's order with
      its message and side, which selects its range when chosen. At regular width (Mac, iPad) the
      preview (noteTypes.preview, U202) sits beside the code with a draggable divider; at compact width
      a segmented Code and Preview switch in the toolbar shows one of them (R938). Toolbar: Cancel
      (cancellation action); Insert Field (a menu of the type's fields and the special fields; the
      reference goes in at the cursor, R936); Flip (Back Template only; without `<hr id=answer>` it
      shows the line that Flip needs it, R936); Options (ellipsis.circle, R932): Add Card Type…,
      Remove Card Type… (disabled for the last template), Rename Card Type…, Reposition Card Type…, a
      divider, Deck Override… (absent for a cloze type, R934), Browser Appearance…, a divider, Restore
      to Default… and Copy Info; and Save (confirmation action, prominent; ⌘S and ⌘↩). Options flows:
      Add Card Type copies the current template as "Card N" and, when the type has notes, asks first
      (confirmation-dialog "This will create N cards. Proceed?", R932); Remove Card Type asks with
      S11's preview, "Delete the 'X' card type, and its N cards?" and, when any, the line that N notes
      will be left with no cards (R933), with Delete (destructive) and Cancel; Rename and Reposition
      open a sheet with one field (a name; a position from 1 to N); Deck Override opens a sheet with
      a deck field and suggestions from the deck list, empty for none, where a new name creates the
      deck when the draft is saved (S9); Browser Appearance opens a sheet with the browser front and
      back formats and an optional browser font and size (R935); Copy Info puts the front, back and
      styling as three Markdown code blocks on the pasteboard, with the toast "Copied to clipboard";
      Restore to Default asks noteTypes.list's question, whose message adds that unsaved changes in
      this editor are discarded, and, once accepted, runs the restore op at once, discarding the
      draft, and closes the editor when it is restored (restore-to-default D6). Every flow except
      Restore to Default and Copy Info changes only the draft until Save. Save (R937): a draft
      with only styling or option changes goes through the plain save (records N3, N8); any other
      through the draft apply op (S1), one "Update Note Type" undo step. Nothing more is asked
      (notetypes/schema-changes G4; U200's structural save as corrected 2026-10-27): each change's
      own question was answered when it was made. While the op plans and writes, its progress
      replaces the issues list and the editor is disabled, with Cancel while it plans (S10); the
      safety backup is the op's. On success the sheet closes. Unsaved changes: Cancel, Esc and the
      iPhone swipe-down ask "Discard changes?" with Discard (destructive) and Keep Editing (R937).
      Loading: the draft opens at once from the stored note type; the note counts and the preview
      fill in. Error: a refused checked save keeps the sheet open with the issues listed and the
      first one selected (V4); Stale (S1.2 item 1) shows an alert that the note type changed
      elsewhere and nothing was saved, with Reload (the draft is discarded) and Keep Editing;
      SafetyBackupFailed shows R167's error alert with its cause and that nothing was changed, and
      keeps the draft so that Save can be tried again; NoteFieldCountMismatch says Check Database can
      repair the note. Overflow: long templates scroll inside the editor, many templates scroll in
      the picker, the largest text sizes scale the issue rows (the code keeps its size, and the
      preview follows the card zoom, R143). Keyboard: ⌘1, ⌘2, ⌘3 and ⌥1 to ⌥9 (R276), ⌘S and ⌘↩, ⌘F; Tab inserts spaces in the
      code editor and ⌃Tab moves the focus out of it; Esc is Cancel. VoiceOver: the code editor is a
      text area labelled with its part ("Front Template"); each issue is one element with its message
      and side; the picker reads "Card type". Identifiers noteTypes.templates.cardType,
      noteTypes.templates.part, noteTypes.templates.editor, noteTypes.templates.issues,
      noteTypes.templates.insertField, noteTypes.templates.flip, noteTypes.templates.options,
      noteTypes.templates.save, noteTypes.templates.cancel. Core: the draft validation (V3, V4) after
      each change, the note count per template (U29), S11's removal preview, the plain save and the
      draft apply op with its progress, Cancelled and refusals, and the deck list for Deck Override.
  - id: noteTypes.fields
    title: Fields
    units: [U201]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, overflow, error, loading]
    variants: pairwise
    references: [grouped-form, sheet-form, confirmation-dialog]
    purpose: >-
      The field editor (U201; R920–R928; notetypes/validation V5; notetypes/structure-changes S1,
      S5; notetypes/field-rename; native-interface-contract N11.10). Entry points: Fields… of
      noteTypes.list, the editors' Fields… (R847, saving the note first) and Browse's sidebar note
      type items; presented as noteTypes.templates is (a sheet, page-sized on Mac and iPad, full
      screen on iPhone, returning to where it came from). Title "Fields for “<note type>”". Layout at
      regular width: the field list leading, rows "1: Name" (R920) with drag reordering and, on Mac,
      + and − buttons under it (Add in the toolbar on iPad); the selected field's options trailing as
      a grouped form. At compact width: the list with Add and Edit (reorder, delete) in the toolbar; a
      row pushes its options form. Options form: Name with Rename… (a sheet whose field is checked as
      typed with V5; a refusal is explained in one line under it and Rename stays disabled; R921);
      "Sort by this field", a toggle that is on for exactly one field: turning it on moves the sort
      field there, and it cannot be turned off (R926); Editor font (the system font picker) and its
      size; "Reverse text direction (RTL)"; "Use HTML editor by default"; "Collapse by default";
      "Exclude from unqualified searches (slower)"; Description (R925). Sticky is not here (the Add
      screen's pin, U195). Actions, each changing only the draft: Add Field… (a name sheet with V5's
      check; the field goes at the end), Delete Field… (refused for the last field with "Notes require
      at least one field." and for a protected field with the line that its note type needs it;
      otherwise the confirmation-dialog "Delete field from N notes?" with N from U29, Delete
      (destructive) and Cancel; R922), Rename…, Reposition… (a sheet with a position from 1 to N) and
      drag. Save (⌘S, ⌘↩; confirmation action): a draft with only option edits goes through the plain
      save (records N8); any other through the draft apply op (S1, skip_checks true), one "Update
      Note Type" undo step that also rewrites the template references of renamed fields (R923).
      Nothing more is asked (notetypes/schema-changes G4; U200's structural save): a structural draft
      (add, delete, reorder, sort field) shows the op's progress while the notes are rewritten as a
      job on the maintenance lane, throttled, and the rest of the app stays usable (R927); the op
      takes its own safety backup; a rename alone takes none. On success the sheet closes. Unsaved
      changes: Cancel, Esc and the iPhone swipe-down ask "Discard changes?" (R928) with Discard
      (destructive) and Keep Editing. Loading: the draft opens at once; the note counts fill in.
      Error: Stale, SafetyBackupFailed and NoteFieldCountMismatch as in noteTypes.templates, the draft
      kept; ProtectedField and invalid_notetype, which this screen's checks prevent, show the op's
      message in an alert if they occur. Overflow: 31 fields, long names and long descriptions
      scroll; the options form wraps at the largest text sizes. Keyboard: ↑ and ↓ move through the
      fields, ⌫ asks to delete the selected one, Tab moves into the options form, Esc is Cancel.
      VoiceOver: a field row reads its position and name and offers Move Up, Move Down, Rename and
      Delete as custom actions (Move Up and Move Down are also its context menu); the sort toggle
      reads "Sort by this field" with its state. Identifiers noteTypes.fields.row.<ord>,
      noteTypes.fields.add, noteTypes.fields.delete, noteTypes.fields.rename,
      noteTypes.fields.reposition, noteTypes.fields.sortField, noteTypes.fields.save,
      noteTypes.fields.cancel. Core: V5's name check, U29's note count per field, the plain save
      (records N3, N8) and the draft apply op (S1, field-rename F2 to F4) with its progress and
      refusals.
  - id: noteTypes.preview
    title: Template preview
    units: [U202]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, error, loading]
    variants: pairwise
    references: [inspector]
    purpose: Preview the question and answer a template renders.
  - id: noteTypes.changeNoteType
    title: Change Note Type
    units: [U203]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, overflow, error, loading]
    variants: pairwise
    references: [sheet-form, toast]
    purpose: >-
      Change Note Type (U203; R944–R948; notetypes/change-notetype M1 to M10; notetypes/schema-changes
      G4; native-interface-contract N11.10). Entry: Browse's Change Note Type… (⇧⌘M) on selected notes
      that share one note type; Browse disables it otherwise (M4). Presentation: a window sheet on
      Mac, a form sheet on iPad, a sheet at the large detent on iPhone. Title "Change Note Type". One
      grouped form: (1) "Current: <old note type>" and a menu picker "New note type" of every note
      type, the current one included (R944), on the old type at first; choosing another runs the
      info query again (M5) and resets both maps to its defaults (M2, M3). (2) Fields: one row per new
      field, its name leading and a menu picker trailing with "(Nothing)" and every old field, on
      M2's default; several rows may take the same old field (R945). (3) Card Types, only when both
      types are standard (M1): one row per new template with "(Nothing)" and the old templates, an
      old template another row uses shown disabled (R946); otherwise R946's note in its place, that
      cloze numbers stay unchanged and that extra cards are removed when the target is a normal
      type. (4) What Will Be Lost (M6, R947), recomputed in Swift from M5's counts after every picker
      change, with no core call: "Will discard content on the following fields:" with each discarded
      field and how many notes hold text in it; "Will remove the following cards:" with each dropped
      template and its card count, or the removed-card count for cloze to standard; "Nothing will be
      lost." when there is neither. Toolbar: Cancel and Save (confirmation action; ⌘↩), Save disabled
      while M7 holds (the same type with identity maps). No confirmation dialog: the section is the
      change's preview and Save accepts it (M6, G4). Save: progress (notes done of notes selected)
      replaces the form, with Cancel while the safety backup runs and none once the write starts
      (M10); on success the sheet closes, Browse refreshes, and a toast says "N notes updated." with
      Undo (R948; ⌘Z undoes the one "Change Note Type" step). Loading: until M5 answers the rows are
      placeholders of their final size and Save is disabled. Error: schema_changed (M8 check 3) shows
      a line at the top, "The note types changed since this opened.", with Reload, which runs the
      info query again for the chosen target (default maps); not_found and multiple_notetypes show a
      line naming the cause with Close; SafetyBackupFailed shows R167's error alert with its cause and
      that nothing was changed, and the sheet keeps its mappings. Overflow: many fields and
      templates and long names scroll; at the largest text sizes each name stacks over its picker.
      Keyboard: Tab through the pickers, Esc is Cancel, ⌘↩ saves. VoiceOver: each mapping row reads
      the new field and its source ("Back, from Front"); the loss section is a container read in
      order. Identifiers noteTypes.changeNoteType.target, noteTypes.changeNoteType.field.<ord>,
      noteTypes.changeNoteType.template.<ord>, noteTypes.changeNoteType.loss,
      noteTypes.changeNoteType.save, noteTypes.changeNoteType.cancel. Core: the M5 info query on a
      reader, M6 computed from its counts, and the M8 change with its refusals and M10's progress.

