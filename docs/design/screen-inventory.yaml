  - id: settings.accountSync
    title: Account & Sync
    units: [U161]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: pairwise
    references: [grouped-form, list-counts, confirmation-dialog]
    purpose: >-
      The Account & Sync section, first in Settings (native-interface-contract N11.4, N11.8; R117,
      R122, R123, R125, R1560, R2046, R2054, R2059). Mac: a section of the Settings window's sidebar;
      iPad and iPhone: the first row of Settings, pushing this form. Text: sync/status-strings T14,
      with T3 to T9 for the status (titled `sync.settings.section`). It is about iCloud only: no Anki
      endpoint, account, transfer result or one-way option (Settings › Anki Server and Collection,
      N11.4; R1547, R1560). One grouped form: (1) iCloud (`sync.settings.iCloud`): the status row with
      sync.status's symbol and the T3 title and detail, then T4's lines, T5's media lines and, while a
      Sync Now runs or after one, T7's step or result; the account row, `sync.settings.account.*`
      by the account status and whether it matches the binding (`.other`); the account guidance of T3
      when iCloud is unavailable, as text with no sign-in field and no Apple password (R117); then
      the enable control (T14): `sync.connect.action` while no binding is usable (sync.connect),
      otherwise `sync.settings.pause`, or `sync.settings.resumePause` while paused, with no
      confirmation (V16); then `sync.now.command`, disabled with T6's reason as its footer. Section
      footer `sync.settings.privacy` (R2058, R2059). (2) The device-local toggles
      `sync.settings.automatic` (R123; default on after a connection) and `sync.settings.media`
      (R122; default on), each with its footer; written only on change (R114), and disabled while
      no binding is usable. (3) Needs Attention, present only with items: one row per P14.4 item in
      P14.4's order with its T9.1 text and count and its T9.2 actions as buttons, as in sync.status;
      Show Details… pushes the item's list (T11.3: one row per item, `sync.item.*` with the key, and
      `sync.item.error` for applyFailed and rekeyFailed; media names alone), with Copy Debug Info in its
      toolbar; Abandon Change… asks T13.3's alert; Cancel Replacement… asks T13.5's; Keep on This
      Device Only… asks T14's local-only alert. (4) `sync.settings.conflicts`, always present, with the
      unresolved count as its value (V17.2); it pushes sync.reviewConflicts, also at zero. (5)
      `sync.settings.advanced`, only while the account is available; showing it starts the preview
      read of `MGActive` and its `MGEpoch` records (V26.1 "Preview reads", not while paused; an
      iCloud read N11.8 allows, not an Anki server request):
      `sync.adopt.action`
      (sync.replaceLocal with the active source, shown while a fresh read of `MGActive` names a
      complete epoch, V14.1), `sync.adopt.previous` (the previous source, only while V14.1 offers it),
      `sync.publish.action` (sync.replaceCloud, V15.1), as T14 lists the group. (6) While a binding
      is active, whatever the account status (stop_using_icloud needs no account or network), its
      own row outside Advanced: `sync.settings.stop`, opening the alert `sync.settings.stop.title` with `.message`, destructive
      `.confirm` and Cancel (stop_using_icloud, V16); a stopped binding offers Resume Syncing in the
      attention and status rows when V9.2 allows it. Gates: an action V20 refuses during a review
      session stays enabled and shows `sync.recovery.error.sessionActive` in its row when chosen
      (T9.2); Sync Now follows T6; Replace iCloud Collection… and Review Conflicts work during a
      session (V20). In the exclusive phase a recovery action shows `sync.recovery.error.busy`
      (R171). In Failed{Corrupt} the toggles, Pause, Review Conflicts (read only) and
      `sync.adopt.action` (V19's conditions) stay usable; Sync Now shows `collectionUnavailable`.
      Empty: never connected: the iCloud group with T3's localOnly lines and Connect to iCloud…, the
      toggles disabled, Review Conflicts… at 0. Typical: connected and up to date. Loading: an
      exchange, media transfer or recovery op running, its progress in the iCloud group, with Cancel
      where V14.3 or V15.3 allow it. Error: needs attention, iCloud unavailable, quota full (T9.1 with
      the storage guidance and Try Again; study, edits, backups and file export go on, R2059), local
      storage full, unsupported schema. Overflow: many attention rows and long details lists scroll;
      at the largest text sizes row values wrap under their labels. Changes apply at once with no
      Save (R115). Keyboard: Tab through the rows; ⇧⌘Y and Y run Sync Now from anywhere
      (sync.status). VoiceOver: the status row is one element with its title and detail; each
      attention row reads its text and count and offers its actions as custom actions as well as
      buttons; the toggles read their state. Identifiers settings.accountSync.status,
      settings.accountSync.connect, settings.accountSync.pause, settings.accountSync.syncNow,
      settings.accountSync.automatic, settings.accountSync.media,
      settings.accountSync.attention.<item>, settings.accountSync.reviewConflicts,
      settings.accountSync.replaceLocal, settings.accountSync.restorePrevious,
      settings.accountSync.replaceCloud, settings.accountSync.stop. Core: the P14 status and
      syncNowAvailability() through U151's SyncStatusModel and SyncCoordinator; DeviceSettings for
      Pause, automatic and media (V2.1, R324); recovery_state(), resume_recovery_op,
      cancel_recovery_op, keep_local_only, stop_using_icloud and abandon_generation (V26.2);
      list_conflicts for the count (V17.3).
  - id: settings.sync
    title: Anki Server and Transfers
    units: [U161]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, error, loading, overflow]
    variants: pairwise
    references: [grouped-form, confirmation-dialog]
    purpose: >-
      The manual Anki server screens of native-interface-contract N11.4 (R118, R1496–R1504;
      sync/anki-transfers, frozen; native-interface-contract N5 to N8). Nothing here is iCloud sync, which is
      settings.accountSync and sync.status. Decided 2026-10-27: the id stays settings.sync, since the
      status ledger and its recorded snapshots use it. Two places: Settings › Anki Server (the
      preview's Connection section renamed: the server address with Test beside it, the account and
      its actions, and Connection details with Sync Logs; N6, N7) and the Anki Transfers actions of
      Settings › Collection (R118: explicit Anki collection transfers, each opening its preparation,
      replacement preview and separate destructive confirmation, and the separate both-side media
      consent; N5, N8). Overflow renders media-consent; supplemental settings/anki-transfer routes
      media-progress, media-partial, media-complete and media-unknown cover Cancel,
      explicit Resume, long excluded names and unverified exclusions using the
      production controls with synthetic values and no server work.
  - id: settings.importExport
    title: Import and export
    units: [U162]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, error, loading]
    variants: pairwise
    references: [grouped-form, sheet-form]
    purpose: Import packages and export decks or the collection.
  - id: settings.backups
    title: Backups and Restore
    units: [U163a]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: pairwise
    references: [grouped-form, sheet-form, list-counts, confirmation-dialog]
    purpose: >-
      The Backups section (Mac: a Settings window sidebar section, plus File › Back Up Now and File ›
      Restore from Backup…; iPad and iPhone: the Backups row of Settings). A grouped form: (1) "Back Up
      Now" with "Last backup: <date and time>" from the maintenance status (optimize-integrity M10),
      and the result "Created <file name> (<size>)" in the footer after a run; (2) "Restore from
      Backup…" and "Show in Finder" (Mac) or "Show in Files" (iPad, iPhone; Documents/Backups); (3)
      the limits with the Synced badge: "Back up every" N minutes (5–9999), "Daily backups",
      "Weekly backups", "Monthly backups" (0–9999 each), written only on change (package/backups
      B6.2). Each field shows the value B6.1 reads, even outside its range; an edit changes only the
      edited member and passes the other three read values to the B6.2 write unchanged. Footer "Backups don't include media files." and, once U162 attaches it, "Export
      Collection with Media…". The restore sheet (on the window it was opened from; the main window
      from the damaged-collection screen): title "Restore from Backup", a list newest first of date and
      time, size, and "Server copy" for a server copy; an unverified server copy is listed dimmed with
      "Can't be restored" and cannot be selected; the newest restorable entry is preselected; Cancel
      and Restore (disabled without a selection). The sheet stays open through the confirmation, the
      progress and a refusal, and closes on success. Restore asks first (confirmation-dialog): "Replace
      the current collection with the backup from <date>?", message "The current collection is backed
      up first. The restored collection stays on this device until you choose what to do with
      iCloud." (that choice is sync.publicationChoice), destructive Restore and Cancel. Loading: Back Up Now is a background job
      (package/backup-triggers T5): a non-modal activity in its row with Cancel while stopping is safe;
      only Back Up Now and Restore from Backup… are disabled meanwhile, and study and edits go on. The
      restore runs in the exclusive phase: its progress replaces the sheet's list, with Cancel while
      stopping is safe, and U153's gate disables mutating entry points app-wide. Error: a Back Up Now
      failure shows its cause in the section footer. A refused or failed restore shows one line in the
      sheet naming the cause and saying the current collection is unchanged: a backup that fails its
      check (the next-newest restorable entry is then preselected), a review session open, another
      operation running (named), the safety backup failing, not enough space. Empty: no
      backups yet; Restore from Backup… disabled with the footer "No backups yet". In Failed{Corrupt}
      Back Up Now and the limits are disabled and Restore stays. Success lands on the deck workspace
      with the iCloud publication choice (sync.publicationChoice) when iCloud is enabled on this
      device.
  - id: settings.maintenance
    title: Maintenance
    units: [U163]
    signature: false
    platforms: [iphone, ipad, mac]
