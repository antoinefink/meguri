  - id: sync.status
    title: iCloud status
    units: [U161, U151]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: pairwise
    references: [toolbar, floating-controls, sheet-form, list-counts]
    purpose: >-
      The iCloud status button, its media indicator and its popover (R102–R107, R1558–R1562, R2049,
      R2050; sync/policy P12, P14; cloudkit-recovery V11; native-interface-contract N11.8). Text:
      sync/status-strings only (T1), by the keys and sections named here. Button: one toolbar item,
      trailing, in the Mac main window's toolbar and the iPad sidebar layout's toolbar, trailing in
      the Decks navigation bar at compact width (R102), and in the review's upper-right corner after
      undo and ⋯, there only while sync needs the person (N11.1, N16.2). Its SF Symbol shows the P14.2 state, one distinct symbol each,
      never colour alone (R103, R104): localOnly icloud.slash, iCloudUnavailable person.icloud,
      paused (every pausedReason, automaticOff included, T3) pause.circle, needsAttention
      exclamationmark.icloud, offline wifi.slash, syncingCollection arrow.triangle.2.circlepath.icloud
      (rotating while it lasts with the system rotate symbol effect; with Reduce Motion on it does
      not rotate, and the symbol alone shows the state), syncingMedia photo.badge.arrow.down,
      changesPending icloud.and.arrow.up, upToDate checkmark.icloud; the system foreground style
      only, no red. Accessibility label `sync.button.label`, value the T3 title without its "…"; on
      Mac the T3 title and detail are its help tag (T2). While blobs transfer, the media indicator,
      `sync.media.filesLeft` in the footnote style, sits beside the button in the sidebar layout's
      toolbar (and under the compact navigation title), quiet and never announced (R106, T5). A click
      or tap opens the popover (Mac, iPad at regular width), or a sheet with medium and large detents
      (iPhone, compact width). Nothing here is modal or blocks study, and it never opens Anki
      credentials (R102, R1562). Popover, top to bottom (R105, R1560; T2): (1) the state symbol, the
      T3 title and detail (upToDate's "Last synced <instant>", never a claim about other devices,
      R107, R2050; iCloudUnavailable's detail is the system account guidance, with no button and no
      Apple password field, R117), then `sync.status.keptLocally` where T3 adds it; for `localOnly`,
      its one T9.2 action as a bordered button under the detail: `sync.action.resume` (sync.connect's
      continue page) while the newest binding is `stopped` and V9.2 offers Resume, else
      `sync.action.connect` (sync.connect), never both (T9.2). (2) T4's lines
      under their conditions (changes to send, the held answer, incoming changes waiting, provisional
      counts, last synced, last attempt with its result, the error line). (3) T5's media lines; after
      a connection's first download they are headed by `sync.connect.downloadingMedia` (T12) until
      the media queue first empties. (4) While a Sync Now runs, the T7 step line, else the last
      result the user started, with its T7 lines (media line included: never "done" while it is not,
      R2050), until the popover closes or the state changes. (5) Needs Attention: one row per P14.4
      item in P14.4's order, its T9.1 text and count and its T9.2 actions as bordered buttons, under
      T9.2's conditions: Resume Syncing (opens sync.connect's continue page), Connect to iCloud…
      (sync.connect), Use iCloud Collection… and Use That Collection… (sync.replaceLocal), Replace
      iCloud Collection… and Replace It Again… (sync.replaceCloud), Keep on This Device Only… (T14's
      local-only alert, then keep_local_only), Review Conflicts… (Settings › Account & Sync at
      sync.reviewConflicts; the Settings window on Mac), Show Details… (Settings › Account & Sync at
      that item's list), Check Database…, Abandon Change… (T13.3's alert, then abandon_generation),
      Try Again and Sync Now (SyncNowRequested), Resume and Cancel Replacement… (T13.5's alert) of a
      waiting recovery op, Copy Debug Info; quotaFull and publishQuota add `sync.attention.storageGuidance`.
      paused{decisionRequired} shows `sync.decision.action` (sync.publicationChoice) and a user
      pause `sync.settings.resumePause`. An action that V20 refuses during review stays enabled and
      shows `sync.recovery.error.sessionActive` in its row when chosen (T9.2). Decided 2026-10-27:
      while the user's pause is on (V16), V26.1 runs no preview read, so the actions that open
      sync.connect, sync.replaceLocal or sync.replaceCloud (here and under the localOnly detail) stay
      visible and disabled, with `sync.status.paused.user` as the line under them (the Mac help tag
      too; N11.8). (6) `sync.now.command`
      (bordered; `sync.now.cancel` in its place while an exchange runs), disabled with T6's reason as
      the line under it (the Mac help tag too; R89), then a link button that opens Settings › Account & Sync
      (`sync.settings.section` as its label; N11.8). During a review session on iPhone and iPad,
      Review Conflicts…, Show Details… and this link do not switch the main window's tab or sidebar
      section: they present Account & Sync in a sheet over the review, its own navigation stack
      already at the chosen page (sync.reviewConflicts or the item's list), with Done; the sheet
      owns the keys and sends none to the review (N4), and closing it returns to the same card. On
      Mac they open the Settings window, as at any other time. Sync Now: this button, File › Sync Now
      (⇧⌘Y, R280; Mac and iPad menu bar) and the global Y key (R1551: the unmodified Y only when no
      text field, secure field, open menu or other view that owns keys has focus, through the same
      ownership check as the review keys, N4, N11.3), all through
      syncNowAvailability() and one exchange; a press while one runs joins it (P12.1); the menu item
      and Y are disabled exactly when the button is. From the menu or Y in the sidebar layout the
      popover opens at the button to show the progress (R105); at compact width only the symbol
      changes. Empty: localOnly with no binding: T3's localOnly lines and Connect to iCloud… only;
      with a `stopped` binding that V9.2 offers to resume, Resume Syncing in its place.
      Typical: upToDate or changesPending. Loading: syncingCollection, syncingMedia, a Sync Now or a
      recovery op running (`sync.publish.uploading` while a publication uploads, T13.2). Error:
      needsAttention, iCloudUnavailable, offline, a waiting or failed result. Overflow: several
      attention rows and the largest text sizes scroll inside the popover or sheet, with Sync Now kept
      visible below them. Failures of background work change only the symbol and the popover; no
      alert appears for them (R166). Live: the button, the indicator and an open popover follow
      StatusChanged with no polling (R107). Keyboard: the button is in the toolbar's Tab order (Full
      Keyboard Access on Mac); Esc closes the popover; during review an open popover owns the keys and
      sends none to the review (N4). VoiceOver: state changes update the button's value without an
      announcement; only the end of a Sync Now the user started is announced, by its T7 title (T1);
      each popover row is one element with its text and count, and offers its actions as custom
      actions as well as buttons. Identifiers sync.status.button,
      sync.status.mediaIndicator, sync.status.popover, sync.status.syncNow,
      sync.status.attention.<item>. Core: the P14 status (StatusChanged and the P14.4 details) through
      U151's SyncStatusModel; syncNowAvailability(), SyncNowRequested, SyncNowCancelled and the
      ExchangeEnded result through SyncCoordinator (P12); recovery_state(), resume_recovery_op,
      cancel_recovery_op, keep_local_only and abandon_generation for the actions (V26.2);
      DeviceSettings for resuming a pause (V16). It reads no Anki state (R1559). While Meguri Sync
      is the selected service (sync/meguri-provider MP2; status-strings T18.7): the same button,
      place, popover or sheet, keyboard and announcement rules, with accessibility label
      `sync.meguri.button.label` and the T18.4 title as its value (title and detail as the Mac help
      tag), and no iCloud symbol, title or line. Its symbol, never colour alone: Stopped, a blocked
      connection, Setup Didn’t Finish, Setup Not Finished on This Device, Media Incomplete, Server
      Acceptance Unknown and Last
      Exchange Didn’t Finish exclamationmark.arrow.triangle.2.circlepath; Not Set Up, Not Signed
      In, Signed In, Setup Required, Choose a Collection and Sign In Required
      person.crop.circle.badge.exclamationmark; Signing In…, Preparing…, the transfers and the
      round's syncing arrow.triangle.2.circlepath (rotating like syncingCollection's, with the same
      Reduce Motion rule); Paused pause.circle; Waiting to Sync arrow.up.circle; On checkmark.circle.
      Popover: (1) the T18.4 title and detail with T18.5's or T18.6's lines, and no setup, media or
      recovery action; (2) Sync Now's place, by T18.7's table: `sync.now.command`, disabled with
      T18.7's reason as the line under it except in its last row, or instead
      `sync.meguri.setup.continue`, `sync.meguri.now.chooseCollection` or
      `sync.meguri.media.showAffected`, each opening Settings › Account & Sync; (3) the Account &
      Sync link. File › Sync Now and Y follow the same table: disabled with its reason, opening
      Account & Sync, or running the normal round only in its last row (MP5). No media indicator. Identifiers as above.
  - id: sync.connect
    title: Connect to iCloud
    units: [U166, U161]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: pairwise
    references: [sheet-form, list-counts]
    purpose: >-
      The first connection and its two-collections decision (cloudkit-recovery V13, V9.2; R158,
      R159, R160, R1592, R2055; N11.8). Text: sync/status-strings T11, T12 and T13.6, except page a's,
      which is U166's own (T12: that file adds none). Entry points: Account & Sync's
      `sync.connect.action`, which Welcome's Set Up Sync row leads to (onboarding.welcome, N18.3),
      and sync.status's Connect to iCloud… and Resume Syncing. It needs account status
      `available` with an identity read in this process (V13.1); during a review session it does not
      start and shows `sync.recovery.error.sessionActive` (V20, T9.2); while the user's pause is on
      its entry points are disabled with `sync.status.paused.user`, since V26.1 runs no preview read
      then (N11.8). Decided 2026-10-27, the device setting iCloud enabled (V2.1): pressing Connect,
      the reading page, the preview reads and Cancel never write it. U161 sets it true just before it
      calls `publish`, `adopt` with the active source or `resume_binding`, from any entry, and puts
      back its earlier value when the call returns an error or its op then ends, by a failure or a
      cancel, with no usable binding (V14.3, V15.3); `keep_local_only` and `stop_using_icloud` set it false (V16). A crash or
      relaunch in between leaves it true with no usable binding, V13's choose-the-collection case,
      which sends nothing (sync/cloudkit-recovery V13 and V16 should state this rule). Presentation: a window sheet on
      Mac (on the window its entry is in), a form sheet on iPad, a sheet at the large detent on iPhone,
      with its own navigation stack; it cannot be swiped away while an operation runs; every page has
      the system Cancel while V13.5, V14.3 or V15.3 allow it, and Cancel changes nothing and keeps a
      pending fence (T12). Pages: (1) `sync.connect.reading` with indeterminate progress while the
      preview reads run (V13.2 steps 1 and 2, V26.1). (2) One page per V13.3 case: (a) no collection
      and nothing in iCloud (empty): U166's Start Empty (prominent; creates R161's collection and
      publishes it at once, V15 from step 2 with reason 1, no preview) and Import a File…
      (onboarding.collectionImport, closing this sheet; the import sets the fence and the collection
      stays local, with iCloud not enabled, so as from Welcome its decision is the next connection,
      V12.2: Connect to iCloud… then reaches case c with the fence's reason); (b) no collection, an iCloud collection: no confirmation, the download page at once; (c) a
      collection, nothing in iCloud: `sync.connect.upload.title` with this device's T11 counts,
      `sync.connect.upload.message` and `sync.connect.upload.confirm` (prominent), reason 1 or the
      fence's recorded reason; (d) an empty collection (V1), an iCloud collection:
      `sync.connect.useICloud.title` with both sides' counts, its message and
      `sync.connect.useICloud.confirm` in the destructive style, never the default button (it
      replaces this device's collection, which may still hold note types, presets and settings, V1;
      N11.8); this confirmation stands for V14.2 steps 1 and 2,
      and the safety backup still runs; (e) two non-empty collections (typical): the decision below;
      (f) this collection's isolated binding meets V9.2: `sync.connect.continue.title`, its message
      with the unsent count and `sync.connect.continue.confirm` (prominent; resume_binding). Decision
      (V13.5): `sync.connect.two.title` and `.message`; the This Device and iCloud groups (T11.1) side
      by side at regular width and stacked at compact width, each with V13.4's counts as label and
      value rows; while the prefetch runs (V13.2 step 3) the iCloud group shows its progress with
      `sync.now.cancel`, and after a cancel it shows `MGEpoch.counts` under `sync.counts.asOf` with
      Last Review and Last Change `sync.counts.unknown`; then T11.2's lines (unsent changes by kind,
      held answers, earlier connections' unsent changes, other devices unknown). Then three choices
      as rows, each title with its T12 caption (`sync.connect.two.keepLocal` has none, so its row is
      its title alone) and no default: `sync.connect.two.useICloud` pushes
      sync.replaceLocal's preview; `sync.connect.two.replace` pushes sync.replaceCloud's preview with
      reason 2; `sync.connect.two.keepLocal` runs keep_local_only and closes. A pushed preview's Back
      returns here with the prefetch kept. Download (cases b, d, and an adoption chosen in e;
      loading): `sync.connect.downloading`, then T13.1's step lines (validating, backing up,
      replacing) with progress; Cancel until the exclusive phase starts (V14.3), then none. When the
      collection opens the sheet closes (CollectionReplaced, KTD17) on Home, which shows R159's arrival
      line once as a toast ("1,200 notes · 8 decks · 9,400 reviews", U166's own text); media
      continues in the background (sync.status's indicator and `sync.connect.downloadingMedia`), and
      cards whose media has not arrived show the placeholder (R160). A publication (a, c) closes the
      sheet once publish returns and goes on in the background (`sync.publish.uploading`, T13.2);
      Continue (f) closes it once resume_binding returns. Error: T13.6's line for the call's V21
      error on the page, with Try Again where it can help: AccountUnavailable, EpochIncomplete,
      InsufficientSpace, Busy, a failed preview read (V26.1) and offline (`sync.error.offline`);
      EpochChanged reads iCloud again and shows the new counts before any choice is taken;
      the replace primitive's errors before the rename and a failed check (SafetyBackupFailed,
      LiveWalNotEmpty, StagingNotFinalised, StagingRefused, StagingCorrupt; engine/collection-replace
      R9, package/backup-triggers#T9) leave this device's collection unchanged: in case d and an
      adoption chosen in e the line is `sync.attention.adoptWaiting` followed by
      `sync.cancelOp.adopt.message` ("This device keeps its current collection."), in case b (no
      collection here) `sync.error.cloudError`, each with Try Again. `Io` claims nothing, since it
      may come at or after the rename (T13.6, T13.7): in case d and an adoption chosen in e it shows
      `sync.recovery.error.replaceIncomplete` with `sync.recovery.tryAgain` and no
      `sync.cancelOp.adopt.message`; in case b `sync.error.cloudError` with Try Again. After a relaunch during a download chosen in the
      decision, recovery_state() shows the decision again with Try Again (V14.3); in case b no op row
      survives the restart, so Welcome shows as usual and Account & Sync's connect control starts V13 again. Overflow: the
      largest text sizes stack the groups and wrap every value; long kind lists scroll above the
      choices. Keyboard: Tab through the controls; Esc is Cancel while it is allowed; Return
      activates the prominent button of pages a, c and f; page d, the decision page and the previews
      have no default button, so Return confirms no replacement (N11.8). VoiceOver: each count group is a container named by `sync.counts.thisDevice`
      or `sync.counts.iCloud`; a choice reads its title and its caption, if it has one; progress announces each stage
      once. Identifiers sync.connect.reading, sync.connect.upload, sync.connect.useICloud,
      sync.connect.decision, sync.connect.choice.useICloud, sync.connect.choice.replaceICloud,
      sync.connect.choice.keepLocal, sync.connect.continue, sync.connect.download. Core: the preview
      reads through U114 and root_facts; recovery_state() for the case, the choices and the counts;
      start_prefetch and cancel_recovery_op for the prefetch; adopt(active, …), publish(reason, …),
      resume_binding and keep_local_only (V26.2), with V21's errors.
  - id: sync.publicationChoice
    title: iCloud publication choice
    units: [U161]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, error, loading]
    variants: pairwise
    references: [sheet-form, list-counts]
    purpose: >-
      The decision of a pending publication fence (cloudkit-recovery V12.2; R1548, R2010; sync/policy
      P17: paused{decisionRequired}). Text: sync/status-strings T10 and T11. Entry points: it opens by
      itself once, over the deck workspace, when a restore (settings.backups), a .colpkg import
      (onboarding.collectionImport, U162) or a manual Anki import completes while iCloud is enabled
      on this device (N11.8); afterwards only from `sync.decision.action` in sync.status and Account &
      Sync (T10). Sync Now is disabled with `sync.now.unavailable.decisionRequired` and never opens
      it (T6). With iCloud not enabled the
      first connection is the decision (sync.connect, V12.2) and this sheet is not shown.
      Presentation: a window sheet on Mac, a form sheet on iPad, a sheet at the large detent on
      iPhone. Title `sync.decision.sheetTitle`; its first line the prompt
      `sync.decision.title.restore`, `.import` or `.none` by pendingDecisionReason (T10,
      engine/collection-replace R6.7), then `sync.decision.message`. One grouped list: (1) This
      Device: T11's counts of this collection; (2) iCloud: the active epoch's T11 counts when the
      account has one, with progress while the preview read runs, and no group when `MGActive` names
      none; (3) `sync.decision.unsentInBackup` for the old connection's unsent changes, and
      `sync.preview.conflictsKept`, each when its count is above 0; (4) the choices as rows, each
      title with its caption and no default: `sync.decision.replace` pushes sync.replaceCloud's
      preview with V12.2's reason (3, 4 or 5 from pendingDecisionReason; none recorded: 2 when
      `MGActive` names an epoch, else 1); `sync.decision.keepLocal` runs keep_local_only with no
      further step and closes (T10, T14); `sync.decision.notNow` (toolbar cancellation action, Esc)
      closes and changes nothing, the status keeping the action. Without an available account,
      Replace is not shown (V12.2). Decided 2026-10-27: while the user's pause is on (V16), no
      preview read runs (V26.1), so there is no iCloud group and Replace stays visible and disabled
      with `sync.status.paused.user` under it; Keep on This Device Only and Not Now stay usable. Using the iCloud collection instead is not offered here; it is
      Account & Sync's Replace Local Collection from iCloud… (V12.2). Sync Now, a relaunch and an Anki
      transfer never answer it (V11). Loading: the preview read; the other choices stay usable.
      Error: a failed preview read shows `sync.error.offline` or T13.6's line in the iCloud group with
      Try Again; AccountUnavailable, Busy and EpochChanged show T13.6's line above the choices.
      Keyboard: Tab through the choices; Esc is Not Now; Return does nothing. VoiceOver: each choice
      reads its title and caption; the groups are containers. Identifiers
      sync.publicationChoice.replaceICloud, sync.publicationChoice.keepLocal,
      sync.publicationChoice.notNow. Core: recovery_state() (the V12.2 decision, its choices and
      previews), root_facts from U114's preview read, publish(reason, active_change_tag) through
      sync.replaceCloud, keep_local_only (V26.2).
  - id: sync.replaceLocal
    title: Replace local collection from iCloud
    units: [U161]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, overflow, error, loading]
    variants: pairwise
    references: [sheet-form, list-counts, confirmation-dialog]
    purpose: >-
      Preview, confirmation and progress of cloudkit-recovery V14 (R125, R2056, R171). Text:
      sync/status-strings T11, T13.1, T13.5 and T13.6. Entry points: Account & Sync › Advanced
      `sync.adopt.action` (the active source) and, while V14.1 offers it, `sync.adopt.previous` (the
      previous source); the T9.2 actions Use iCloud Collection… and Use That Collection…; the
      two-collections decision (sync.connect, pushed inside its sheet); and the damaged-collection
      screen's "Replace with iCloud Collection…" (shell.damagedCollection, V19: the active source,
      package/backup-triggers#T7's byte copy). Presentation: a window sheet on Mac, a form sheet on iPad, a sheet at the large
      detent on iPhone, titled `sync.adopt.title`. Choosing it during a review session shows
      `sync.recovery.error.sessionActive` and starts nothing (V20). Layout, one grouped list (V14.2
      step 1): `sync.adopt.direction`; the This Device and iCloud groups of T11.1 (a damaged
      collection's values `sync.counts.unreadable`); T11.2's lines with `sync.preview.unsent`,
      `.heldBack`, `.isolatedUnsent`, `.otherDevicesUnknown`, `.sentAfterReplacement` with its
      `.adopt` line and `.otherDevicesSentUnknown`; `sync.preview.conflictsKept`; for the active
      source `sync.adopt.mediaWithheld` and `sync.adopt.mediaSuperseded` (V14.4); for the previous
      source `sync.adopt.previousLocal` (V14.1); from the damaged screen `sync.adopt.damaged` (V19);
      then `sync.adopt.backup` (package/backup-triggers#T6.1). Toolbar: Cancel and `sync.adopt.confirm` in the destructive
      style, never the default button: the entry opened this preview and changed nothing, so this
      button is V14.2 step 2's confirmation (N8, N11.8). Decided 2026-10-27, placements: Cancel in
      the cancellation action placement (Esc), `sync.adopt.confirm` in the destructive action
      placement with the destructive role; never the confirmation action placement, which makes a
      Mac sheet's button the default button bound to Return, and no default action shortcut. A UI
      test presses Return in the open preview and checks that no adopt starts. While the user's
      pause is on (V16), every control that opens this sheet is disabled with `sync.status.paused.user`, since
      V26.1 runs no preview read then (N11.8). Loading: after Replace the list gives way to
      progress, the current T13.1 step line (`sync.adopt.staging` with the records fetched, then
      `.validating`, the review wait as `sync.attention.adoptAfterReview`, `.backingUp`,
      `.replacing`); study and edits go on while it downloads (V14.2 step 4). Cancel stays until the
      exclusive phase starts and asks T13.5's adopt confirmation (`sync.cancelOp.adopt.title`,
      `.message`, `sync.cancelOp.confirm`, `sync.cancelOp.keep`), then it is gone (V14.3). Success:
      CollectionReplaced closes the sheet and lands on Home with R159's arrival line as a toast; media
      follows in the background (R1592). Error: T13.6's line above the list, which comes back with this
      device's collection unchanged, with Try Again: InsufficientSpace, EpochIncomplete,
      AccountUnavailable, Busy (the running operation named), offline (`sync.error.offline`; the entry
      stays, V19); EpochChanged reopens the preview with new preview reads (T13.6); the replace
      primitive's errors before the rename (SafetyBackupFailed, LiveWalNotEmpty, StagingNotFinalised;
      package/backup-triggers#T9) and a failed check (StagingRefused, StagingCorrupt) show
      `sync.attention.adoptWaiting` followed by `sync.cancelOp.adopt.message` ("This device keeps
      its current collection."), with Try Again; `Io`, which may come at or after the rename, shows
      `sync.recovery.error.replaceIncomplete` with `sync.recovery.tryAgain` and no
      `sync.cancelOp.adopt.message` (T13.6, T13.7). After a relaunch during
      the download the entry shows the preview again with Try Again (V14.3); a waiting or unproven op
      is sync.status's row. Overflow: long kind lists and the largest text sizes scroll; the toolbar
      stays. Keyboard: Esc is Cancel while it is allowed; Return confirms nothing. VoiceOver: the
      direction line is read first; each count group is a container; progress announces each stage
      once. Identifiers sync.replaceLocal.replace, sync.replaceLocal.cancel. Core: recovery_state()
      for the offer and the preview (V14.1, V14.2 step 1), root_facts from U114's preview reads,
      adopt(source, epoch_id, active_change_tag) and cancel_recovery_op (V26.2), with V21's errors and
      engine/collection-replace R9's.
  - id: sync.replaceCloud
    title: Replace iCloud collection
    units: [U161]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, overflow, error, loading]
    variants: pairwise
    references: [sheet-form, list-counts, confirmation-dialog]
    purpose: >-
      Preview, confirmation and progress of cloudkit-recovery V15 (R125, R2056). Text:
      sync/status-strings T11, T13.2, T13.5 and T13.6. Entry points: Account & Sync › Advanced
      `sync.publish.action`; the T9.2 actions Replace iCloud Collection… and Replace It Again… (a new
      preview, then republish, V15.2 step 5); sync.publicationChoice and sync.connect's decision
      (pushed inside their sheets, with their reason). Allowed during a review session (V15.1, V20);
      the held answer then makes the upload finish after the session ends. Presentation: as
      sync.replaceLocal, titled `sync.publish.title`. Layout, one grouped list (V15.2 step 1):
      `sync.publish.direction`; the This Device and iCloud groups of T11.1; `sync.publish.carriedMedia`;
      `sync.publish.otherDevices`; `sync.preview.notApplied` with its reasons and
      `.notApplied.noteType`; `sync.preview.sentAfterReplacement` with its `.publish` line;
      `sync.preview.conflictsKept`; `sync.publish.retention`; `sync.publish.space` or `.spaceUnknown`.
      Toolbar: Cancel and `sync.publish.confirm` in the destructive style, never the default button,
      as V15.2 step 2's confirmation (N8, N11.8), with sync.replaceLocal's placements, its Return
      test (no publish starts) and its pause rule for the entries. Loading: the step line (`sync.publish.preparing`,
      `.uploading` with T4's count of changes to send and T5's media lines, `.finishing`,
      `.cancelling`); a Close button lets the upload run in the background, shown in sync.status as
      `sync.publish.uploading` until the switch (T13.2); `sync.action.cancelOp` with T13.5's publish
      confirmation is offered at every step before done, hidden only while an attempt of the
      `MGActive` save runs (V15.3). A waiting upload shows its T9.1 row and T9.2 actions in the sheet
      as in sync.status: `sync.attention.publishWaiting` (Resume, Cancel Replacement…),
      `.publishAccount`, `.publishQuota` with `sync.attention.storageGuidance`, and
      `.publishConflict` with Use That Collection… (sync.replaceLocal), Replace It Again… and Cancel
      Replacement…, never Resume (V15.2 step 5). Success: the sheet, if still open, closes, and the
      status follows P14. Error: T13.6's line above the list with Try Again: AccountUnavailable, Busy,
      a failed preview read; EpochChanged reopens the preview with new preview reads. Overflow: as
      sync.replaceLocal. Keyboard: Esc is Cancel or Close; Return confirms nothing. VoiceOver: the
      direction line is read first; step and waiting rows announce once when they change. Identifiers
      sync.replaceCloud.replace, sync.replaceCloud.cancel, sync.replaceCloud.close,
      sync.replaceCloud.cancelReplacement. Core: recovery_state() for the offer and the preview,
      root_facts from U114's preview reads, publish(reason, active_change_tag), republish,
      resume_recovery_op, cancel_recovery_op and adopt for Use That Collection (V26.2), with V21's
      errors.
  - id: sync.reviewConflicts
    title: Review Conflicts
    units: [U161]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow, error, loading]
    variants: pairwise
    references: [list-counts, grouped-form, content-unavailable, toast]
    purpose: >-
      The saved versions sync kept when it could not combine two edits, and their recovery
      (cloudkit-recovery V17; R2054; N11.8). Text: sync/status-strings T13.4 and T13.6. A page,
      `sync.conflicts.title`, pushed inside Settings › Account & Sync on every platform from its
      `sync.settings.conflicts` row; sync.status's Review Conflicts… opens Settings at this page (the
      Settings window on Mac; during a review on iPhone and iPad, the Account & Sync sheet over the
      review that sync.status describes). Available during review (V20); in Failed{Corrupt} it can be read and
      Restore is disabled. List (list_conflicts): every unresolved copy of every binding, in one
      section per kind in T11.3's order (note, deck, preset, note type, media file), each headed by
      that kind's `sync.kind.*` count of its objects; inside a section, one group per object, newest
      copy first, headed by the object label (V17.5) as primary text and the kind's
      `sync.conflicts.kind.*` noun as secondary text, so a header read alone (the headings rotor)
      names the kind (T13.4, T13.8); a card's copies sit in its note's group. A row:
      the reason caption (`sync.conflicts.reason.*`), the saved date, `sync.conflicts.earlierConnection`
      for an isolated or salvage binding's copy, and `sync.conflicts.deleted` when the object no
      longer exists. A row pushes its comparison page (get_conflict): `sync.conflicts.savedVersion`
      and `sync.conflicts.currentVersion` side by side at regular width, stacked at compact width; a
      note by field name with its tags and deck, a note type by name, CSS and template, a deck or
      preset by setting, a media file by name, size and an image preview; the current side reads
      `sync.conflicts.deleted` when the object is gone. The page lists only the parts that differ,
      except when the object is gone or the reason maps saved fields (missing_notetype,
      structure_rollback, unmapped_structure), where it lists every saved part; for those three
      reasons each part whose two versions differ carries `sync.conflicts.different` as text, never
      colour alone; a gone object's parts carry none (T13.8). Selection by V17.4's reason: a checkbox per field (field_conflict; a field the
      current note type lacks is shown disabled); one choice of name, CSS or a template
      (notetype_conflict); a target note type and a field mapping (missing_notetype, note); a
      destination per saved field and update or new note (structure_rollback, unmapped_structure,
      note); the whole version otherwise; a card's copy is read-only, its note's group holding the
      action; a media copy whose bytes are not here shows `sync.conflicts.bytesUnavailable`.
      `sync.conflicts.recover` (bordered, disabled until something is selected) opens a sheet with
      preview_recovery's result: what the normal edit would change, Cancel and
      `sync.conflicts.recoverConfirm` (prominent); a validation failure shows
      `sync.recovery.error.recoveryInvalid` there and disables it. Restore submits the edit (recover)
      as one undoable step of its kind (R173), closes the sheet, refreshes the comparison so the
      current side shows the restored values, and keeps the copy unresolved; a toast shows
      `sync.conflicts.restored` with the system Undo (T13.4, T13.8), and the system undo (Edit ›
      Undo, ⌘Z, the system undo gestures) also undoes the step. `sync.conflicts.resolve` resolves at once with no confirmation (T13.4); the row leaves
      the list and a toast offers `sync.conflicts.unresolve`, which runs unresolve while the copy
      exists. Empty (content-unavailable): `sync.conflicts.empty`. Loading: the list keeps its
      last rows, or shows placeholders of their final size, while list_conflicts runs. Error:
      conflictsUnreadable shows `sync.attention.conflictsUnreadable` with Copy Debug Info at the top of
      the list; a copy that no longer exists shows `sync.recovery.error.conflictNotFound` as a
      content-unavailable view on its page and the list refreshes; while the collection is not Ready
      or in the exclusive phase, Restore is disabled with `sync.recovery.error.busy` and reading goes
      on. Overflow: hundreds of copies and long labels (two lines, then truncated, the full label as
      help text) scroll; long field text wraps on the comparison page. Live: the list refreshes on
      the conflicts count's StatusChanged. Keyboard: ↑ and ↓ move through rows, Return opens one, ⌘[
      or the back button returns, Space toggles the focused checkbox, ⌘Z undoes a Restore through the
      Edit menu. VoiceOver: a row is one element reading its object, reason, date and labels; each
      comparison part reads its name and both values; Restore and Mark as
      Resolved are also the row's custom actions. Identifiers sync.reviewConflicts.row.<id>,
      sync.reviewConflicts.restore, sync.reviewConflicts.resolve. Core: list_conflicts, get_conflict,
      preview_recovery, recover, resolve and unresolve (V17.3), off the main thread and with no
      network; a restored edit is a local change that syncs like any other.
  - id: sync.keepCollection
    title: Which collection to keep
    units: [U161]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, error, loading]
    variants: pairwise
    references: [grouped-form, confirmation-dialog]
    purpose: >-
      The one sheet that asks which collection to keep, for both services
      (native-interface-contract N15.3; sync/cloudkit-recovery V27.4; sync/meguri-provider MP6.3;
      sync/status-strings T19.3). Title `sync.keep.title`; `sync.keep.message`; both sides' counts
      and last change; then Keep This Device’s Collection and Keep the iCloud Collection or Keep
      the Meguri Sync Collection, each with what it replaces and what protects the replaced side
      under it; Cancel. Both buttons have the destructive role and neither is the default: Return
      confirms nothing and Esc cancels. Built so far for Meguri Sync only, opened after sign-in when
      this device holds a collection and by the status action Choose…: it shows the message, the
      server address, the two buttons with their effect lines and Cancel, and a button still leads
      to sync.meguriSetup's preview, which keeps the bound confirmation. Not built yet: the counts
      side by side, the buttons as the confirmation itself, the one-direction form, and the sheet
      for iCloud, whose choice is still sync.connect's and sync.publicationChoice's. Typical: both
      sides hold a collection. Loading: the chosen direction's progress. Error: the facts changed
      and a new choice is needed. Identifiers sync.keepCollection.sheet,
      sync.keepCollection.message, sync.keepCollection.keepDevice, sync.keepCollection.keepService,
      sync.keepCollection.cancel. Test route settings/sync/keep-collection.
  - id: sync.serviceSwitch
    title: Change sync service
    units: [U161]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, overflow, error, loading]
    variants: pairwise
    references: [sheet-form]
    purpose: >-
      Round 2 (native-interface-contract N15.2; sync/status-strings T19.2; sync/cloudkit-recovery
      V27.5): the sheet also confirms Off, with the title and destructive button
      `sync.switch.title.off` and `sync.switch.confirm.off` and the line `sync.switch.next.localOnly`;
      for a service it shows `sync.switch.next.iCloud.setup` or `sync.switch.next.meguri.setup`, and
      the new service's setup follows with no Connect step. It never opens from Off, and it does not
      open while V27.5 refuses the change. Where the text below differs, this paragraph wins.
      The sheet that confirms a change of sync service (sync/meguri-provider MP2, MP3;
      native-interface-contract N11.8, N12.4). Opened from settings.root's Service
      picker when the other service is chosen while one is selected, and by Meguri Sync's
      `sync.meguri.stop`. Text: sync/status-strings T18.2. Title `sync.switch.title.*` by
      destination; then the old service's pending and held lines in T18.2's order, from its local
      status only (an unknown count shows as unknown, never as zero, and held answers never read as
      none; opening the sheet starts no request);
      `sync.switch.kept`, `sync.switch.otherDevices`, `sync.switch.signOut` when leaving Meguri
      Sync, and `sync.switch.next.*`. Toolbar: `sync.service.cancel` in the cancellation action placement, and
      `sync.switch.confirm.*` in the destructive action placement with the destructive role; neither
      is the default button, Return confirms nothing and Esc cancels (N11.8). While MP3.1 refuses
      (an active review, editor commit, collection replacement, or unsettled recovery or
      publication), `sync.switch.busy` shows and the confirm button is disabled; local review goes
      on. Confirm calls changeProvider with the destination, removing the Meguri Sync sign-in when
      leaving it (T18.2), with `sync.service.changing` in the sheet; the sheet closes when the
      change commits and the picker then shows the new service, or shows `sync.service.changeFailed`
      with the selection and phases the core then reports, which the failure may have changed. Typical: iCloud Sync to Meguri Sync with a count of unsent
      changes. Overflow: every line at the largest text sizes scrolls under a fixed toolbar.
      Loading: the change running. Error: the busy refusal or a failed change. Identifiers
      sync.serviceSwitch.cancel, sync.serviceSwitch.confirm.
  - id: sync.meguriSetup
    title: Meguri Sync collection choice
    units: [U161, U166]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [typical, overflow]
    variants: pairwise
    references: [sheet-form, list-counts]
    purpose: >-
      The preview sheet that confirms Meguri Sync's first transfer of the collection and its media
      (sync/meguri-provider MP4, MP5; native-interface-contract N8, N11.8). Opened when
      the Sync section's setup stage reaches its preview, after Use This Device’s Collection…,
      Use Server Collection… or Download from Meguri Sync…, which only start the preparation and
      change nothing. Text: sync/status-strings T18.5. Title `sync.meguri.preview.title.*` by
      direction; `sync.meguri.preview.server` with the endpoint; this device's T11.1 cards, notes and
      reviews, except for a download; `sync.meguri.preview.remoteEmpty` when the server reports an
      empty collection, never shown as proof that it is empty; the direction line;
      `sync.meguri.preview.unsent` for Use Server Collection… with pending local work;
      `sync.meguri.preview.otherClients` for Use This Device’s Collection… (the server copy and the
      upload are not locked together, MP4); `sync.meguri.preview.media` and
      `sync.meguri.preview.automatic` always. Toolbar: `sync.meguri.cancel` in the cancellation
      action placement, which cancels the preparation; for both replacements the confirm button in
      the destructive action placement with the destructive role, never the confirmation action
      placement or a default shortcut, so Return confirms no replacement, and Esc cancels (N11.8); a
      download replaces nothing, and `sync.meguri.preview.confirm.download` is a plain confirm
      button. The confirmation is bound to the shown preview's operation; a new preview replaces the
      facts and needs a new choice. After confirming, the sheet closes and the Sync section's
      status row shows the collection and then the media phase, never one success line; Server
      Acceptance Unknown and Media Incomplete stay until settled (T18.5, T18.6). Typical: Use This
      Device’s Collection… with counts and the warning. Overflow: a long endpoint and the largest text
      sizes scroll under a fixed toolbar. Failures show in the Sync section's status, not here.
      Identifiers sync.meguriSetup.cancel, sync.meguriSetup.confirm.
  - id: sync.quitFlush
    title: Mac quit sheet
    units: [U161, U151]
    signature: false
    platforms: [mac]
    states: [typical]
    variants: pairwise
    references: [sheet-form]
    purpose: >-
      The bounded iCloud flush when Meguri quits on Mac (R127, R1557; sync/policy P11.4;
      native-interface-contract N11.11). Text: sync/status-strings T15 only. On a quit (Meguri › Quit
      Meguri, ⌘Q, the Dock menu, a logout or a restart) Meguri first runs the close guard of every
      open screen whose close asks (decided 2026-10-27, data safety first): editor.add's "Discard
      current input?", deckOptions.options' Discard Changes or Keep Editing, noteTypes.templates'
      and noteTypes.fields' "Discard changes?", each brought forward in turn; Keep Editing cancels
      the quit (the app replies terminateCancel, so a logout or restart is cancelled too) and
      Discard closes that screen. These prompts have no time limit; the 10-second limit below
      starts with the flush. A note type, Change Note Type or deck options save that is still
      running is waited for until it ends, its screen brought forward with its progress and, while
      it plans, its Cancel; a draft it leaves then goes through its guard. Then any other sheet on
      the main window, which holds no draft, is closed, so the quit sheet never stacks on another
      sheet. Then Meguri ends an open review session
      (sched/review-session C16) and flushes the editors, then U151 sends QuitRequested. The sheet
      shows only for the QuitFlush action (P11.4: an exchange runs, or the gate is open, automatic
      sync is on and an entity is sendable, an apply is in progress or a ready inbox entry waits),
      never for QuitNow, which quits
      at once. Presentation: a window sheet on the main window, brought forward or opened again when
      it was closed; while it shows, the other windows and every menu command but Quit are disabled.
      Layout: the title `sync.quit.title`, the message `sync.quit.message`, an indeterminate progress
      indicator and one bordered button, `sync.quit.skip`, the cancellation action (Esc and ⌘. too),
      never a default button, so Return does nothing; a second Quit command acts as it. When the flush
      ends, at its limit of 10 seconds, or on Quit Without Syncing (which cancels the flush and any
      exchange), the app quits; pending work stays saved on the Mac and is never called synced, and
      the sheet shows no result of either kind (T15). A failure during the flush changes nothing here
      (R166). VoiceOver announces the title when the sheet appears (T1, T15). iPhone and iPad have no
      such sheet: their background flush (P11.2) shows nothing. Identifiers sync.quitFlush.sheet,
      sync.quitFlush.skip. Core: QuitRequested and its QuitFlush or QuitNow action through U151's
      SyncCoordinator (P11.4), the cancel of the flush and of an exchange, then the app's reply to the
      system's terminate request.

