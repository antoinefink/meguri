      configure and load send no request, MP2), changeProvider, removeMeguriConnection and
      recoverProviderHandoffToLocalOnly through SyncCoordinator; the setup stage, media accounting
      and round state from the Meguri setup and round services (MP4, MP5).
  - id: settings.sync
