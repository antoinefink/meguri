  - id: home.sessionSummary
    title: Session summary
    units: [U157]
    signature: false
    platforms: [iphone, ipad, mac]
    states: [empty, typical, overflow]
    variants: pairwise
    references: [sheet-form, list-counts]
    purpose: >-
      A sheet over the restored deck workspace (window sheet on Mac, form sheet on iPad, sheet on
      iPhone), shown when R91 says (queue empty, timebox Finish, Back to Decks or Esc after at least
      one answer). Title "Session Summary"; toolbar Done (confirmation action; Return and Esc too) and
      Undo (⌘Z; while an answer can be undone). A grouped list: (1) totals: cards studied and time
      ("42 cards in 12 minutes"), Again, Hard, Good and Easy counts as four labelled values, "Passed"
      as the percentage of answers that were not Again, and new cards introduced; (2) What's Next:
      remaining today with a bordered Continue button after an early close (Done keeps Return), or the time until the
      next learning card, or "Finished for today" with tomorrow's due count; the finished state's
      limit and buried notes with their actions (R94); (3) the streak line once U228 fills its slot,
      taking no space before; (4) Missed Cards in first-miss order: question excerpt (two lines at
      most), deck name as secondary text, the miss count trailing ("2×"), a deleted card labelled
      "Deleted card"; a row opens the read-only preview once U186 attaches it, and "Browse Missed
      Cards" sits under the section once U210 attaches it. Empty: no missed cards, the section reads
      "No missed cards". Overflow: many missed cards scroll inside the sheet; the toolbar stays. The
      deck page's "Last Session" opens the same sheet read-only: title "Last Session", no Undo,
      Continue or Unbury. No chart.
