# Meguri dev services. tools/mg is the only intended caller: it passes a
# per-checkout project name (-p), so each worktree gets its own image tag and
# target volume while CARGO_HOME (registry, git checkouts and cargo's lock
# files) is shared. MEGURI_DOCKER_CARGO_TARGET and MEGURI_DOCKER_CARGO_HOME
# may name host directories instead (hosted CI caches them).
# Images are built locally from digest-pinned bases and never pushed.

services:
  dev:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
      target: dev
    pull_policy: build
    # tini as PID 1 forwards SIGTERM, so killing tools/mg stops the container.
    init: true
    working_dir: /work
    volumes:
      - ..:/work
      - "${MEGURI_DOCKER_CARGO_HOME:-cargo-home}:/cargo-home"
      - "${MEGURI_DOCKER_CARGO_TARGET:-cargo-target}:/cargo-target"
      # Explicit locked browser install, shared with sync-web MG jobs; read-only.
      - sync-web-deps:/sync-web-deps:ro
    # SQLite files and other test scratch stay on tmpfs, never on the bind mount.
    tmpfs:
      - /tmp:exec,mode=1777
      # Bounded, container-owned filesystem for actual disk-full proofs.
      - /mg-enospc:noexec,nosuid,nodev,mode=1777,size=16m
    environment:
      # The whole CARGO_HOME is shared, not just registry/ and git/: cargo's
      # package-cache lock files live in its root. The image's tools stay in
      # /usr/local/cargo/bin, which is on PATH.
      CARGO_HOME: /cargo-home
      CARGO_TARGET_DIR: /cargo-target
      TMPDIR: /tmp
      MEGURI_TEST_ENOSPC_ROOT: /mg-enospc

  # Generated RF4 proof only. Host job adds its owned fixture directory,
  # decoder script (read-only), and fresh output directory; no checkout mount.
  package-interop-decoder:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
      target: dev
    pull_policy: build
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges"]
    mem_limit: 768m
    tmpfs:
      - /tmp:mode=1777,size=64m

  # cargo-fuzz (tools/mg core-fuzz): the dev image plus the pinned nightly and
  # cargo-fuzz of stage `fuzz`, with the dev service's mounts. Fuzz corpora
  # stay on the tmpfs; findings go to the run directory under build/mg/.
  fuzz:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
      target: fuzz
    pull_policy: build
    init: true
    working_dir: /work
    volumes:
      - ..:/work
      - "${MEGURI_DOCKER_CARGO_HOME:-cargo-home}:/cargo-home"
      - "${MEGURI_DOCKER_CARGO_TARGET:-cargo-target}:/cargo-target"
    tmpfs:
      - /tmp:exec,mode=1777
    environment:
      CARGO_HOME: /cargo-home
      CARGO_TARGET_DIR: /cargo-target
      TMPDIR: /tmp

  # The private collection vault (U15, R1938, R1939): `tools/mg private`
  # runs meguri-cli here, as the dev service built it (the target volume,
  # read-only), with the user's collection added for the run as a read-only
  # mount at /vault. No network, so nothing in it can send the collection
  # anywhere, and local-data/ of the checkout is hidden behind an empty
  # tmpfs: /vault is the only way to it. Copies go to build/private/.
  private:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
      target: dev
    pull_policy: build
    init: true
    network_mode: none
    working_dir: /work
    volumes:
      - ..:/work
      - "${MEGURI_DOCKER_CARGO_TARGET:-cargo-target}:/cargo-target:ro"
    tmpfs:
      - /tmp:exec,mode=1777
      - /work/local-data:mode=0700
    environment:
      CARGO_TARGET_DIR: /cargo-target
      TMPDIR: /tmp

  # The Anki oracle (oracle/, AGPL quarantine). `tools/mg oracle build` sets
  # MEGURI_ORACLE_TAG (<anki version>-<hash of the image inputs>) and builds it;
  # `tools/mg oracle bump` points MEGURI_ORACLE_CONTEXT at a staging copy.
  # One worker: `compose run --rm -T -e TZ=<zone> oracle`, JSON lines on
  # stdin/stdout (conformance/schema/protocol.json). Never pushed (R1869).
  oracle:
    build:
      context: ${MEGURI_ORACLE_CONTEXT:-../oracle}
      dockerfile: Dockerfile
    image: meguri-oracle:${MEGURI_ORACLE_TAG:-untagged}
    pull_policy: never
    init: true
    stdin_open: true
    networks:
      - oracle-internal
    # Collections and clock files stay on tmpfs: SQLite on it is ~10x faster
    # than on the container's overlay, and never touches a bind mount.
    tmpfs:
      - /scratch:exec,mode=1777
    environment:
      TZ: UTC
      TMPDIR: /scratch
      ORACLE_SCRATCH_ROOT: /scratch

  # Similarity scanner (U2) and JPlag. tools/mg similarity* are host jobs that
  # start this service themselves, adding the Anki corpus (refs/ of the main
  # checkout) as a read-only mount only for that run.
  similarity:
    build:
      context: ..
      dockerfile: docker/similarity.Dockerfile
      target: similarity
    pull_policy: build
    init: true
    working_dir: /work
    volumes:
      - ..:/work
    tmpfs:
      - /tmp:exec,mode=1777
    environment:
      TMPDIR: /tmp

  # Image tools (U8): ffmpeg and Python for contact sheets, scene-change and
  # freeze detection (tools/scripts/contact-sheet) and the hierarchy check
  # (tools/scripts/hierarchy-check). Docker jobs run in it; host jobs such as
  # `tools/mg drive` start it themselves with mg_compose.
  image-tools:
    build:
      context: ..
      dockerfile: docker/image-tools.Dockerfile
      target: image-tools
    pull_policy: build
    init: true
    working_dir: /work
    volumes:
      - ..:/work
    tmpfs:
      - /tmp:exec,mode=1777
    environment:
      TMPDIR: /tmp

  # UI lint gate (U9, R1994): SwiftLint's own image, pinned by digest, with
  # the checkout read-only and no network. `tools/mg lint-ui` passes the files
  # to lint (tools/lint-ui/path-rules.sh picks them) and filters the findings
  # on the host; app/.swiftlint.yml holds the rules.
  swiftlint:
    image: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
    pull_policy: missing
    init: true
    network_mode: none
    working_dir: /work
    volumes:
      - ..:/work:ro
    tmpfs:
      - /tmp:mode=1777

  # Local sync server for simulator and Mac app end-to-end runs (U13): Anki's
  # own server from the oracle image (the pinned release), on the real clock,
  # with the test users of syncserver.env.example. `tools/mg sync-rig up`
  # builds the image and starts it; `tools/mg sync-rig status` reports the
  # endpoints. Like toxiproxy and mitmdump, it is only on the internal
  # `sync-rig` network and publishes nothing: `sync-edge` publishes the rig.
  # Conformance runs do not use this service: their server is a child of the
  # oracle worker, on the scenario clock.
  syncserver:
    image: meguri-oracle:${MEGURI_ORACLE_TAG:-untagged}
    pull_policy: never
    profiles: [sync-rig]
    init: true
    entrypoint: ["python", "-m", "anki.syncserver"]
    env_file:
      - path: syncserver.env.example
      - path: syncserver.env
        required: false
    environment:
      SYNC_HOST: 0.0.0.0
      SYNC_PORT: "8080"
      SYNC_BASE: /data
      # The oracle's entrypoint, which this service skips, fakes the clock;
      # make sure nothing in the image does.
      LD_PRELOAD: ""
    tmpfs:
      - /data:mode=1777
    networks:
      - sync-rig
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Fault injection between a client and the sync server (sync-rig profile):
  # proxy `syncserver` listens on 8081 (docker/toxiproxy.json); its toxics
  # (latency, limit_data, reset_peer, timeout) are set through the API on 8474.
  # The API can repoint a proxy's upstream; on the internal network the new
  # upstream can only be another rig service.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    profiles: [sync-rig]
    init: true
    command: ["-host=0.0.0.0", "-port=8474", "-config=/etc/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/etc/toxiproxy.json:ro
    networks:
      - sync-rig
    depends_on:
      syncserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Exchange recorder (spec-record profile, spec side, R1933): a reverse proxy
  # to the sync server that writes every exchange, bodies zstd-decoded, to
  # $MEGURI_RECORD_DIR/exchanges.jsonl (mitm/record_sync.py). Started by
  # `tools/mg sync-rig up --record <name>`. Healthy only while the addon
  # reports that it has recorded every exchange; it stops mitmdump when it
  # cannot create the recording.
  mitmdump:
    image: mitmproxy/mitmproxy:12.2.1@sha256:743b6cdc817211d64bc269f5defacca8d14e76e647fc474e5c7244dbcb645141
    profiles: [spec-record]
    init: true
    command:
      - mitmdump
      - --mode
      - reverse:http://syncserver:8080@8080
      - --scripts
      - /opt/mitm/record_sync.py
      - --set
      - record_dir=/recordings
      - --set
      - flow_detail=0
    volumes:
      - ./mitm:/opt/mitm:ro
      - ${MEGURI_RECORD_DIR:-../build/sync-rig/recording}:/recordings
    networks:
      - sync-rig
    depends_on:
      syncserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import json, sys; sys.exit(0 if json.load(open('/tmp/record-sync-health.json'))['ok'] is True else 1)"]
      interval: 1s
      timeout: 3s
      retries: 30

  # The rig's only published container (sync-rig profile): a TCP forwarder
  # (sync-edge/forward.py) on the internal `sync-rig` network and on
  # `sync-rig-edge`, whose routes are fixed in the script: 8080 syncserver,
  # 8081 toxiproxy's proxy, 8474 toxiproxy's API, 8082 mitmdump. Every port is
  # published on 127.0.0.1 only, at a port Docker picks unless
  # MEGURI_SYNC_PORT, MEGURI_SYNC_PROXY_PORT, MEGURI_TOXIPROXY_API_PORT or
  # MEGURI_SYNC_RECORD_PORT sets one. It runs from the oracle image, which the
  # rig builds anyway, for its Python.
  sync-edge:
    image: meguri-oracle:${MEGURI_ORACLE_TAG:-untagged}
    pull_policy: never
    profiles: [sync-rig]
    init: true
    entrypoint: ["python", "/opt/sync-edge/forward.py"]
    environment:
      LD_PRELOAD: ""
    volumes:
      - ./sync-edge:/opt/sync-edge:ro
    ports:
      - "127.0.0.1:${MEGURI_SYNC_PORT:-}:8080"
      - "127.0.0.1:${MEGURI_SYNC_PROXY_PORT:-}:8081"
      - "127.0.0.1:${MEGURI_TOXIPROXY_API_PORT:-}:8474"
      - "127.0.0.1:${MEGURI_SYNC_RECORD_PORT:-}:8082"
    networks:
      - sync-rig
      - sync-rig-edge
    depends_on:
      toxiproxy:
        condition: service_healthy
    # Healthy once all four ports listen (read from /proc, so the probe
    # reaches no service and no recording).
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; up = {int(l.split()[1].rsplit(':', 1)[1], 16) for l in list(open('/proc/net/tcp'))[1:] if l.split()[3] == '0A'}; sys.exit(0 if {8080, 8081, 8474, 8082} <= up else 1)"]
      interval: 1s
      timeout: 3s
      retries: 30

  # The fault proxy of actor scenarios (specs/conformance/sync-ops.md S5,
  # S8.2): toxiproxy, pinned like the rig's, its API on 8474 and no proxy at
  # start. A worker creates one proxy per run, named for the run, in front of
  # its child sync server and deletes it when the session ends, so runs share
  # the service. `tools/mg` starts it (`up`) for oracle runs that select actor
  # scenarios, leaves it up and gives the workers ORACLE_SYNC_FAULTS=
  # sync-faults:8474. Only on oracle-internal and nothing published, so no
  # upstream the API is given leads out (R1876).
  sync-faults:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    profiles: [oracle-sync]
    init: true
    command: ["-host=0.0.0.0", "-port=8474"]
    networks:
      - oracle-internal
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 1s
      timeout: 3s
      retries: 30

  # The recorder of oracle-client exchanges in actor scenarios (sync-ops.md
  # S9, R1933): mitmdump, pinned like the rig's, as a forward proxy with
  # mitm/record_sync.py, which strips each request's /<actor>/<step index>
  # prefix and records actor and step. Only `tools/mg oracle recordings`
  # starts it, one container per scenario, writing to $MEGURI_RECORD_DIR, and
  # gives the workers its address as ORACLE_SYNC_RECORDER. Only on
  # oracle-internal; healthy while the addon reports every exchange recorded.
  sync-recorder:
    image: mitmproxy/mitmproxy:12.2.1@sha256:743b6cdc817211d64bc269f5defacca8d14e76e647fc474e5c7244dbcb645141
    profiles: [oracle-record]
    init: true
    command:
      - mitmdump
      - --mode
      - regular@8080
      - --scripts
      - /opt/mitm/record_sync.py
      - --set
      - record_dir=/recordings
      - --set
      - record_actor_steps=true
      - --set
      - flow_detail=0
    volumes:
      - ./mitm:/opt/mitm:ro
      - ${MEGURI_RECORD_DIR:-../build/sync-recorder/recording}:/recordings
    networks:
      - oracle-internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import json, sys; sys.exit(0 if json.load(open('/tmp/record-sync-health.json'))['ok'] is True else 1)"]
      interval: 1s
      timeout: 3s
      retries: 30

networks:
  # No route out of oracle containers: nothing in them can reach AnkiWeb or
  # any other host (R1876).
  oracle-internal:
    internal: true
  # The sync rig's network: no route out of syncserver, toxiproxy or mitmdump,
  # whatever upstream toxiproxy's API is given (R1876). Docker publishes no
  # port from an internal network, so sync-edge publishes the rig.
  sync-rig:
    internal: true
  # sync-edge's publishing network, without masquerade: its 127.0.0.1 ports
  # work and it has no route out either (`tools/mg sync-rig` also checks that
  # nothing answers on the LAN address).
  sync-rig-edge:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  cargo-home:
    name: meguri-cargo-home
  cargo-target: {}
  sync-web-deps: {}
