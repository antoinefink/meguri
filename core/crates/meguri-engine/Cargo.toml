[package]
name = "meguri-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only hooks (KTD18): the storage and model hooks (armed fault points,
# raw SQL, the steppable clock). Never on by default or in Release.
test-hooks = ["meguri-model/test-hooks", "meguri-storage/test-hooks"]

[dependencies]
meguri-model.workspace = true
meguri-storage.workspace = true
# The touch index compares tag keys with the collection's `unicase` folding.
meguri-text.workspace = true
tracing.workspace = true

# The pthread QoS calls of the thread registry (KTD9).
[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true

[dev-dependencies]
criterion.workspace = true
# Turns on the storage and model test hooks for the tests (raw reads, the
# steppable clock) and gives them fixture collections.
meguri-testkit.workspace = true
tempfile.workspace = true

# Criterion wall-clock suite (U12 harness, R1864): empty-op overhead and the
# answer-sized write phase (`specs/engine/op-model.md` O10).
[[bench]]
name = "executor"
harness = false
