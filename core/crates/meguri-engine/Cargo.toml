[package]
name = "meguri-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Only the [[test]] targets below build (tests/main.rs is engine_it).
autotests = false

[features]
# Test-only hooks (KTD18): the storage and model hooks (armed fault points,
# raw SQL, the steppable clock) and the WAL-flush observations. Never on by
# default or in Release; meguri-testkit turns it on.
test-hooks = ["meguri-model/test-hooks", "meguri-storage/test-hooks"]

[dependencies]
meguri-model.workspace = true
# The browser and search config keys (U83): their reading and the values
# each user action writes (`browser_config.rs`).
meguri-search.workspace = true
# The day clock's math (sched/day-clock, timing/).
meguri-sched.workspace = true
meguri-storage.workspace = true
# Note type validation and card requirements parse templates (U60).
meguri-template.workspace = true
# The touch index compares tag keys with the collection's `unicase` folding.
meguri-text.workspace = true
# Tag matching (`specs/tags/tags.md` T5): Unicode 16.0 simple case folding
# is the pinned crate's case-insensitive mode.
regex.workspace = true
# Tag completion uses the same Unicode 16.0 one-character ICU folding as
# template type-answer comparison, including its pinned compiled data.
icu_casemap.workspace = true
icu_casemap_data.workspace = true
rand.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Unix descriptor safety and the Apple thread registry QoS calls (KTD9).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
rusqlite.workspace = true
criterion.workspace = true
# Turns on this crate's, storage's and model's test hooks for the tests (raw
# reads, the steppable clock, WAL-flush observations) and gives them fixture
# collections.
meguri-testkit.workspace = true
# undo_conformance.rs: scenario values and the golden's observations.
serde_json.workspace = true
tempfile.workspace = true

[[bench]]
name = "memory_recompute"
harness = false

# Criterion wall-clock suite (U12 harness, R1864): empty-op overhead and the
# answer-sized write phase (`specs/engine/op-model.md` O10).
[[bench]]
name = "executor"
harness = false

# Criterion wall-clock suite: undo of an answer (`specs/engine/undo.md` M12,
# R1811).
[[bench]]
name = "undo"
harness = false

# Criterion wall-clock suite: bulk tag operations on 10k notes
# (`specs/tags/tags.md` T7, T10; R1831).
[[bench]]
name = "tags"
harness = false

[[bench]]
name = "session"
harness = false

# Integration tests: one binary. A file gets its own target only when it
# cannot share that binary, with the reason.
[[test]]
name = "engine_it"
path = "tests/main.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "derived_lag"
path = "tests/derived_lag.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "integrity"
path = "tests/integrity.rs"

# Its #[global_allocator] would serve every test in a shared binary.
[[test]]
name = "journal_payload_memory"
path = "tests/journal_payload_memory.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "kill_loop"
path = "tests/kill_loop.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "media_ops"
path = "tests/media_ops.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "notes"
path = "tests/notes.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "replace"
path = "tests/replace.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "session_durability"
path = "tests/session_durability.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "session_faults"
path = "tests/session_faults.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "session_recovery"
path = "tests/session_recovery.rs"

# `tools/mg native-durability` builds and runs this whole binary on the Mac.
[[test]]
name = "suspend"
path = "tests/suspend.rs"

# Its #[global_allocator] would serve every test in a shared binary.
[[test]]
name = "undo_holdback_memory"
path = "tests/undo_holdback_memory.rs"

# `tools/mg native-durability` builds and runs this whole binary on the Mac.
[[test]]
name = "wal_durability"
path = "tests/wal_durability.rs"
required-features = ["test-hooks"]
