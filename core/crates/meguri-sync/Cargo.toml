[package]
name = "meguri-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# AnkiWeb build switch (KTD21); off in the App Store build. Without it no
# AnkiWeb name is compiled in (tools/mg core-lint scans the library).
ankiweb = []
# Test-only code (KTD18): the sync endpoint guard (R1876), which the transport
# applies to every URL and proxy, and the AnkiWeb stand-in names, name pins
# and extra trusted roots tests use (specs/sync/transport.md T12).
# meguri-testkit turns it on.
test-hooks = []

[dependencies]
bytes.workspace = true
futures-core.workspace = true
# The job's cancel token and progress sink (U24, `engine/jobs` J4, J5).
meguri-engine.workspace = true
# The session key's random source (R1875), the records and their schema-11
# JSON (wire-format.md W6, W8-W10).
meguri-model.workspace = true
# The col row and config rows a check and a sync read (meta-status.md M1,
# wire-format.md W6.4).
meguri-storage.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# The files of a media download, expanded into the caller's staging
# directory rather than memory (R1852, wire-format.md W17.1); also the status
# tests' collection files.
tempfile.workspace = true
tokio.workspace = true
url.workspace = true
# The media sync zips (wire-format.md W17).
zip.workspace = true
zstd.workspace = true

[dev-dependencies]
# The scripted stub server (`sync_stub`). Through it every test build has this
# crate's `test-hooks` and `ankiweb` features.
meguri-testkit.workspace = true

[[test]]
name = "endpoint_guard"
required-features = ["test-hooks"]

[[test]]
name = "transport"
required-features = ["test-hooks", "ankiweb"]

[[test]]
name = "wire"
required-features = ["test-hooks"]

[[test]]
name = "status"
required-features = ["test-hooks"]

[[test]]
name = "errors"
required-features = ["test-hooks", "ankiweb"]
