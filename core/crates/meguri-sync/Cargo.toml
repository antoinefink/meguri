[package]
name = "meguri-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Only the [[test]] targets below build (tests/main.rs is sync_it).
autotests = false

[features]
# AnkiWeb build switch (KTD21); off in the App Store build. Without it no
# AnkiWeb name is compiled in (tools/mg core-lint scans the library).
ankiweb = []
# Test-only code (KTD18): the sync endpoint guard (R1876), which the transport
# applies to every URL and proxy, and the AnkiWeb stand-in names, name pins
# and extra trusted roots tests use (specs/sync/transport.md T12).
# meguri-testkit turns it on.
test-hooks = ["meguri-model/test-hooks", "meguri-engine/test-hooks"]

[dependencies]
bytes.workspace = true
libc.workspace = true
futures-core.workspace = true
# The job's cancel token and progress sink (U24, `engine/jobs` J4, J5).
meguri-engine.workspace = true
# The session key's random source (R1875), the records and their schema-11
# JSON (wire-format.md W6, W8-W10).
meguri-model.workspace = true
meguri-text.workspace = true
# The col row and config rows a check and a sync read (meta-status.md M1,
# wire-format.md W6.4).
meguri-storage.workspace = true
meguri-package.workspace = true
sha2.workspace = true
hmac.workspace = true
data-encoding.workspace = true
sha1.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# The files of a media download, expanded into the caller's staging
# directory rather than memory (R1852, wire-format.md W17.1); also the status
# tests' collection files.
tempfile.workspace = true
tokio = { workspace = true, features = ["sync"] }
url.workspace = true
# The media sync zips (wire-format.md W17).
zip.workspace = true
zstd.workspace = true

[dev-dependencies]
# The scripted stub server (`sync_stub`). Through it every test build has this
# crate's `test-hooks` and `ankiweb` features.
meguri-testkit.workspace = true

# Integration tests: one binary. A file gets its own target only when it
# cannot share that binary, with the reason.
[[test]]
name = "sync_it"
path = "tests/main.rs"

# Its #[global_allocator] would serve every test in a shared binary.
[[test]]
name = "cloud_generation_codec"
path = "tests/cloud_generation_codec.rs"

# Its #[global_allocator] would serve every test in a shared binary.
[[test]]
name = "cloud_payload_memory"
path = "tests/cloud_payload_memory.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "cloud_records"
path = "tests/cloud_records.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "cloud_recovery"
path = "tests/cloud_recovery.rs"

# Its #[global_allocator] would serve every test in a shared binary.
[[test]]
name = "cloud_rekey"
path = "tests/cloud_rekey.rs"

# Its #[global_allocator] would serve every test in a shared binary.
[[test]]
name = "download_memory"
path = "tests/download_memory.rs"

# Its #[global_allocator] would serve every test in a shared binary.
[[test]]
name = "download_meta_memory"
path = "tests/download_meta_memory.rs"

# Its #[global_allocator] would serve every test in a shared binary.
[[test]]
name = "media_zip_memory"
path = "tests/media_zip_memory.rs"
