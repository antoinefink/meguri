[package]
name = "meguri-package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Only the [[test]] targets below build (tests/main.rs is package_it).
autotests = false

[dependencies]
tracing.workspace = true
libc.workspace = true
meguri-engine.workspace = true
meguri-model.workspace = true
meguri-storage.workspace = true
meguri-text.workspace = true
tempfile.workspace = true
sha1.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
meguri-sched.workspace = true
zip.workspace = true
zstd.workspace = true

[dev-dependencies]
meguri-testkit.workspace = true
proptest.workspace = true
criterion.workspace = true
meguri-storage = { workspace = true, features = ["test-hooks"] }
tempfile.workspace = true
meguri-model = { workspace = true, features = ["test-hooks"] }

[[bench]]
name = "backup"
harness = false

# Integration tests: one binary. A file gets its own target only when it
# cannot share that binary, with the reason.
[[test]]
name = "package_it"
path = "tests/main.rs"
