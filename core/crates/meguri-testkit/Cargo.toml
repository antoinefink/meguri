[package]
name = "meguri-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Only the [[test]] targets below build (tests/main.rs is testkit_it).
autotests = false

[dependencies]
rusqlite.workspace = true
# The generator (U11): memory states derived from generated review
# histories, and its seeded ChaCha streams (both parity pins).
fsrs.workspace = true
granit-parser.workspace = true
# The anonymizer (U15, specs/fixtures/anonymizer.md): H3's entity grammar,
# judged at one position (A5.3), and A5.1's character classes (both parity
# pins, as meguri-text uses them).
htmlescape.workspace = true
# Benchmarks (U12): per-operation samples (bench::timing).
hdrhistogram.workspace = true
jiff.workspace = true
# test-hooks: the executor's WAL-flush observations (storage C9.2), so the
# engine's own tests get them in a plain workspace run.
meguri-engine = { workspace = true, features = ["test-hooks"] }
meguri-host = { workspace = true, features = ["test-hooks"] }
# test-hooks: armed fault points and the steppable clock (KTD18).
meguri-model = { workspace = true, features = ["test-hooks"] }
# Public native-review replay and recovery of host-test safety backups.
meguri-package.workspace = true
# The scheduler area's adapters (exec/sched.rs): fsrs_next and the fuzz table.
meguri-sched.workspace = true
# The stats area's `card_stats` observation (exec/stats.rs).
meguri-stats.workspace = true
# The search area's `search` and `canonical_search` observations (exec/search.rs).
# test-hooks: Plan::build_with for meguri-search's own tests, which get it
# through this crate in a plain workspace run.
meguri-search = { workspace = true, features = ["test-hooks"] }
# test-hooks: the raw SQL of db_exec and db_dump, and the storage fault points.
meguri-storage = { workspace = true, features = ["test-hooks"] }
# The sync endpoint guard (R1876) lives in meguri-sync behind test-hooks, so
# the transport and the harnesses share one rule; exec::sync_guard re-exports it.
# ankiweb: every test build has the AnkiWeb rules, with the stand-in names of
# specs/sync/transport.md T12 (core-lint's scan build checks the build
# without them).
meguri-sync = { workspace = true, features = ["ankiweb", "test-hooks"] }
# The render area's `template` observation (exec/render.rs).
meguri-template.workspace = true
meguri-text.workspace = true
# statvfs: the private vault refuses a source that is not on a read-only
# mount (U15, R1938); on Apple hosts also the process footprint
# (phys_footprint) that bench::memory samples (R1864).
libc.workspace = true
rand.workspace = true
# The sync stub's certificates: a test root and leaves for `.test` names
# (sync_stub, transport.md T13).
rcgen.workspace = true
regex.workspace = true
# The sync stub's TLS server side, on the provider reqwest uses.
rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
ryu.workspace = true
serde.workspace = true
# raw_value lets observe::parse_json read floats with std's exact parser:
# serde_json's own is off by one ULP for about 9% of 17-digit floats unless
# float_roundtrip is on, and that feature would also change the core's parsing
# in every test build that links testkit (feature unification).
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
sha1.workspace = true
# The session directory of a scenario that opens a collection.
tempfile.workspace = true
# The sync stub's bodies (zstd, transport.md T5, T6).
zstd.workspace = true
# E3 lists every archive entry, independently of the needed-entry inspection index.
zip.workspace = true

[dev-dependencies]
# Wall-clock suites (benches/*.rs) and the harness tests that drive them.
criterion.workspace = true
datatest-stable.workspace = true
# Instruction-count suites (benches/icount/), run by tools/mg bench-icount.
gungraun.workspace = true

# One test per scenario file under conformance/scenarios (T0).
[[test]]
name = "conformance"
harness = false

# Criterion wall-clock suites (U12, R1864): tools/mg bench. Each writes its
# perf result JSON (tools/perf/perf-result.schema.json) itself.
[[bench]]
name = "open"
harness = false

# gungraun instruction-count suites: tools/mg bench-icount, in Docker only.
[[bench]]
name = "icount_open"
path = "benches/icount/open.rs"
harness = false

[[bench]]
name = "next_states"
harness = false

[[bench]]
name = "queue_counts"
harness = false

[[bench]]
name = "answer"
harness = false

# U82's search terms, one statement per term family.
[[bench]]
name = "search_terms"
harness = false

# U84's sorted statements for the expensive keys, from a search and an id list.
[[bench]]
name = "browser_sort"
harness = false

# U85's search sessions: first pages, resorts, reverse and a row page.
[[bench]]
name = "browse_session"
harness = false

# U263's suggestions (10,000 tags) and the sidebar's filter counts.
[[bench]]
name = "browse_filters"
harness = false

# U266's Find Duplicates over All Notes and All Found.
[[bench]]
name = "browse_duplicates"
harness = false

# U267's Note Types reads: list counts, field contents, no-card notes, the
# save summary and the delete counts.
[[bench]]
name = "notetype_reads"
harness = false

# U92's Card Info read: the card with the most rows and 500 rows.
[[bench]]
name = "card_info"
harness = false

# U98's graph engine: a request and one pass over its scope, from the caches
# and from the snapshot.
[[bench]]
name = "stats_engine"
harness = false

# U98's column caches: a rebuild, and a memory warning's merge and reload.
[[bench]]
name = "stats_columns_build"
harness = false

# U99's review-log records from current caches: 12 months and all history.
[[bench]]
name = "stats_log_year"
harness = false

# U101's card records (the present tier): one request naming the seven card
# graphs, and Retrievability alone.
[[bench]]
name = "stats_present"
harness = false

# U289's card-state history (stats/history-reads H19): the cold build and
# H18's read without it; the warm reads; the updates per answer and sync.
[[bench]]
name = "stats_history_build"
harness = false

[[bench]]
name = "stats_history_warm"
harness = false

[[bench]]
name = "stats_history_apply"
harness = false

# U290's Knowledge Over Time (stats/history-reads H19): the cold build with
# the FSRS replay of every card, and its read without the component.
[[bench]]
name = "stats_knowledge_build"
harness = false

# U293's page request: every part named, to each tier's last part.
[[bench]]
name = "stats_page"
harness = false

# Integration tests: one binary. A file gets its own target only when it
# cannot share that binary, with the reason.
[[test]]
name = "testkit_it"
path = "tests/main.rs"

# Its #[global_allocator] would serve every test in a shared binary.
[[test]]
name = "bench_harness"
path = "tests/bench_harness.rs"
