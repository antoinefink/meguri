[package]
name = "meguri-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-hooks = ["meguri-engine/test-hooks", "meguri-sync/test-hooks"]

[dependencies]
meguri-package.workspace = true
meguri-sync.workspace = true
meguri-engine.workspace = true
meguri-model.workspace = true
meguri-storage.workspace = true
tracing.workspace = true

[dev-dependencies]
meguri-testkit.workspace = true
meguri-sync = { workspace = true, features = ["test-hooks"] }
bytes.workspace = true
zstd.workspace = true
sha2.workspace = true
meguri-sched.workspace = true
serde.workspace = true
serde_json.workspace = true
meguri-engine = { workspace = true, features = ["test-hooks"] }
meguri-model = { workspace = true, features = ["test-hooks"] }
tempfile.workspace = true

[[test]]
name = "provider_bootstrap"
required-features = ["test-hooks"]

[[test]]
name = "provider_normal"
required-features = ["test-hooks"]

[[example]]
name = "real_server_provider"
required-features = ["test-hooks"]
