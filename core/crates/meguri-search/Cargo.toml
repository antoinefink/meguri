[package]
name = "meguri-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Only the [[test]] targets below build (tests/main.rs is search_it).
autotests = false

[features]
# Test-only (KTD18): the AsciiCompat fold mode (search/query-model Q8), for
# the differential runs against the oracle (U91), and Plan::build_with, which
# runs plans with stand-in term compilers. Never on by default or in Release.
test-hooks = []

[dependencies]
fsrs.workspace = true
meguri-model.workspace = true
meguri-template.workspace = true
meguri-text.workspace = true
# The browser and search config keys (U83, `src/config.rs`) read config
# values per `storage/config-table` C3.
meguri-storage.workspace = true
# Unicode decimal digits (category Nd) in id lists (search/grammar G8), with
# the pinned regex-syntax tables.
regex.workspace = true
# Connection-local pure scalar functions; no collection SQL is issued here.
rusqlite.workspace = true
# The combining-free transform of `nc:` tag terms (text-matching T8.1).
unicode-normalization.workspace = true

[dev-dependencies]
# Turns test-hooks on for the tests (testkit depends on this crate with it):
# tests/canonical_roundtrip.rs runs plans through Plan::build_with.
meguri-testkit.workspace = true
# tests/config_keys.rs reads the config keys of a fixture copy.
tempfile.workspace = true

# Integration tests: one binary. A file gets its own target only when it
# cannot share that binary, with the reason.
[[test]]
name = "search_it"
path = "tests/main.rs"
