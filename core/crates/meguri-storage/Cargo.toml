[package]
name = "meguri-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Only the [[test]] targets below build (tests/main.rs is storage_it).
autotests = false

[features]
# Test-only hooks (KTD18): fault points fire (meguri-model's feature decides)
# and the raw SQL of the conformance runner (`raw`). Never on by default or in
# Release; meguri-testkit turns it on.
test-hooks = ["meguri-model/test-hooks"]

[dependencies]
libc.workspace = true
meguri-model.workspace = true
meguri-text.workspace = true
rusqlite.workspace = true
ryu.workspace = true
serde.workspace = true
# The write journal keeps a note's after-image as its SHA-256.
sha2.workspace = true
sha1.workspace = true
# raw_value: the upgrade reads the legacy JSON columns member by member, as
# exact text (specs/model/json-numbers.md N7).
serde_json = { workspace = true, features = ["raw_value"] }
# The open gate decides whether a file behind a hot rollback journal is
# refused on a copy in a temporary directory (open-and-connections C3).
tempfile.workspace = true

[dev-dependencies]
# Turns on test-hooks for the tests (testkit depends on this crate with it).
meguri-testkit.workspace = true

# Integration tests: one binary. A file gets its own target only when it
# cannot share that binary, with the reason.
[[test]]
name = "storage_it"
path = "tests/main.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "crash_consistency"
path = "tests/crash_consistency.rs"

# Its #[global_allocator] would serve every test in a shared binary.
[[test]]
name = "journal"
path = "tests/journal.rs"
required-features = ["test-hooks"]

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "lockfile"
path = "tests/lockfile.rs"

# Re-runs this binary by test name, and sets a #[global_allocator].
[[test]]
name = "media_download_file"
path = "tests/media_download_file.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "media_feed"
path = "tests/media_feed.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "upgrade"
path = "tests/upgrade.rs"
required-features = ["test-hooks"]
