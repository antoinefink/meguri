[package]
name = "meguri-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# One static library holds the whole core in the app (KTD9, KTD16); `lib` keeps
# it usable from Rust tests.
crate-type = ["staticlib", "lib"]

[dependencies]
uniffi.workspace = true

[features]
# AnkiWeb build switch (KTD21); off in the App Store build.
ankiweb = []
# Test-only exports (KTD18, R1967): on for Debug and Profile, never in Release
# or AppStore. Never on by default.
test-hooks = []
