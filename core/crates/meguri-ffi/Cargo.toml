[package]
name = "meguri-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# One static library holds the whole core in the app (KTD9, KTD16); `lib` keeps
# it usable from Rust tests.
crate-type = ["staticlib", "lib"]

[dependencies]
# The process's engine (U24): its change stream feeds the event dispatcher,
# its job registry runs jobs, its cancel token and progress sink back the
# exported objects.
meguri-engine.workspace = true
meguri-host.workspace = true
meguri-sched.workspace = true
# The change value types and ids the `Changes` event carries (KTD2).
meguri-model.workspace = true
meguri-template.workspace = true
meguri-storage.workspace = true
meguri-text.workspace = true
uniffi.workspace = true

[features]
# AnkiWeb build switch (KTD21); off in the App Store build.
ankiweb = []
# Test-only exports (KTD18, R1967): on for Debug and Profile, never in Release
# or AppStore. Never on by default.
test-hooks = ["meguri-host/test-hooks"]

[dev-dependencies]
meguri-host = { workspace = true, features = ["test-hooks"] }
meguri-model = { workspace = true, features = ["test-hooks"] }
meguri-storage = { workspace = true, features = ["test-hooks"] }
meguri-testkit.workspace = true
tempfile.workspace = true
