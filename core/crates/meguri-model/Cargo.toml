[package]
name = "meguri-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Only the [[test]] targets below build (tests/main.rs is model_it).
autotests = false

[features]
# Test-only hooks (KTD18): fault points that fire and the steppable clock.
# Never on by default or in Release; meguri-testkit turns it on.
test-hooks = ["dep:rand", "dep:rand_chacha"]

[dependencies]
rand = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
ryu.workspace = true
serde.workspace = true
# raw_value keeps untyped JSON values as their exact text
# (specs/model/json-numbers.md N7). Numbers are parsed from that text with
# std's exact parsers, so the model does not need float_roundtrip.
serde_json = { workspace = true, features = ["raw_value"] }
unicode-normalization.workspace = true

[dev-dependencies]
meguri-testkit.workspace = true

# Integration tests: one binary. A file gets its own target only when it
# cannot share that binary, with the reason.
[[test]]
name = "model_it"
path = "tests/main.rs"

# Re-runs this binary with `--exact <test>`: it needs unprefixed test names.
[[test]]
name = "faultpoint"
path = "tests/faultpoint.rs"
required-features = ["test-hooks"]
