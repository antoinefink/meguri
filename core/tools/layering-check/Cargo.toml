[package]
name = "layering-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Only the [[test]] targets below build (tests/main.rs is layering_it).
autotests = false

[dependencies]
proc-macro2.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Integration tests: one binary. A file gets its own target only when it
# cannot share that binary, with the reason.
[[test]]
name = "layering_it"
path = "tests/main.rs"

# A canary: core-test runs `binary(/^canary_/)` first and alone.
[[test]]
name = "canary_pins"
path = "tests/canary_pins.rs"
