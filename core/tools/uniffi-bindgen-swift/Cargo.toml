[package]
name = "uniffi-bindgen-swift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The Swift bindings generator, pinned with the runtime through the workspace
# `uniffi = "=0.32.2"` (KTD9). tools/scripts/build-core-xcframework.sh runs it
# from core/ in library mode on the macOS slice; cargo-metadata lets it find
# crates/meguri-ffi/uniffi.toml.
[dependencies]
uniffi = { workspace = true, features = ["cli", "cargo-metadata"] }
