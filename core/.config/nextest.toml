# cargo-nextest configuration (tools/mg core-test).

# Tests with a wall-clock bound run alone: in a full run, other tests
# compete for the same cores and can push a near-linear case past its bound.
# Each bound stays as the test sets it.
[[profile.default.overrides]]
filter = 'package(meguri-template) and test(=five_megabyte_templates_parse_and_render_in_bounded_time)'
threads-required = "num-test-threads"

# Tests named `*_at_150k` hold wall-clock budgets (p95 read latencies) on the
# 150k-card collection. They run alone: beside a workspace run that keeps
# every core busy, their percentiles measure the scheduler, not the code.
[[profile.default.overrides]]
filter = 'test(/_at_150k$/)'
threads-required = "num-test-threads"
