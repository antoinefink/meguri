# cargo-nextest configuration (tools/mg core-test).

# Wrapper scripts settle the disk before wall-clock WAL tests (below).
experimental = ["wrapper-scripts"]

# Local-server rig tests share an account and read or change its metadata.
# Run each alone across both packages when explicitly selected.
[[profile.default.overrides]]
filter = '(package(meguri-sync) or package(meguri-host)) and (test(/^rig_/) or ((binary(=sync_it) or binary(=host_it)) and test(/^[a-z0-9_]+::rig_/)))'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(meguri-storage) and test(=media_scan::media_unchanged_folder_at_30000_files_does_not_enumerate_or_hash)'
threads-required = "num-test-threads"

# Tests with a wall-clock bound run alone: in a full run, other tests
# compete for the same cores and can push a near-linear case past its bound.
# Each bound stays as the test sets it.
[[profile.default.overrides]]
filter = 'package(meguri-engine) and test(=decks::bulk_deck_edits_at_2000_decks_are_bounded)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(meguri-template) and test(=template_unit::five_megabyte_templates_parse_and_render_in_bounded_time)'
threads-required = "num-test-threads"

# The activity heatmap's million-row log bounds each cold query (stats/activity-heatmap AH5).
[[profile.default.overrides]]
filter = 'package(meguri-storage) and binary(storage_it) and test(=activity::a_million_reviews_count_correctly_and_quickly)'
threads-required = "num-test-threads"

# stats/history-reads H16: a cancelled history read returns within 50 ms.
[[profile.default.overrides]]
filter = 'package(meguri-stats) and test(=history_states::h16_a_cancelled_read_returns_within_50_ms_and_the_build_goes_on)'
threads-required = "num-test-threads"

# The same bound for a cancelled knowledge read (H16, U290).
[[profile.default.overrides]]
filter = 'package(meguri-stats) and test(=history_knowledge::h16_a_cancelled_knowledge_read_returns_within_50_ms_and_the_build_goes_on)'
threads-required = "num-test-threads"

# stats/history-reads H16: a cancelled page request returns within 50 ms.
[[profile.default.overrides]]
filter = 'package(meguri-stats) and test(=history_request::h16_a_cancel_during_the_build_stops_the_request_within_50_ms_and_the_build_goes_on)'
threads-required = "num-test-threads"

# stats/history-reads H16: a page request cancelled through its FFI handle ends within 50 ms.
[[profile.default.overrides]]
filter = 'package(meguri-ffi) and binary(ffi_it) and test(=stats_page_ffi::h16_a_cancel_through_the_handle_ends_the_request_within_50_ms_with_nothing_after_it)'
threads-required = "num-test-threads"

# Tests named `*_at_150k` hold wall-clock budgets (p95 read latencies) on the
# 150k-card collection. They run alone: beside a workspace run that keeps
# every core busy, their percentiles measure the scheduler, not the code.
[[profile.default.overrides]]
filter = 'test(/_at_150k$/)'
threads-required = "num-test-threads"

# The timing protocol's interval test (U18) bounds a 5 ms timed part
# against 400 ms of setup and check.
[[profile.default.overrides]]
filter = 'package(meguri-testkit) and test(=timing::timing_measures_only_the_timed_part)'
threads-required = "num-test-threads"

# meguri-sync's transport tests that time stalls (`*times_out`, transport.md
# T8: the watchdog fires within a second of its timeout, and a trickle never
# trips it), cancellation (`a_cancelled_token_*`, T9: within 200 ms) and the
# refusal of a decompression bomb (R1852: within 2 s) against the wall clock.
# The editor body-limit unit test also bounds its loopback accepts and reads.
[[profile.default.overrides]]
filter = 'package(meguri-sync) and ((binary(sync_it) and (test(/^transport::.*times_out$/) or test(/^transport::a_cancelled_token_/) or test(=transport::bytes_past_the_declared_size_are_refused_and_never_handed_out))) or test(=transport::http::tests::editor_encoded_body_limit_covers_declared_unknown_and_chunked_lengths))'
threads-required = "num-test-threads"

# U32: WAL full-sync coverage and bounded suspension must measure an idle
# machine; fault/kill loops run separately through nextest process isolation.
[[profile.default.overrides]]
filter = 'package(meguri-engine) and (binary(wal_durability) or test(=held_reader_times_out_and_resume_recovers) or test(=external_snapshot_blocks_checkpoint_without_marking_shutdown_clean) or test(=busy_uncooperative_thread_prevents_successful_suspend) or test(=derived_builder_honors_suspend_deadline_and_finishes_before_success))'
threads-required = "num-test-threads"

# An idle machine also needs an idle disk. On a hosted runner, writeback left
# by a large earlier test stalled the isolated WAL test well past its
# one-second sync bound (5.06 s against 1.56 s locally). Flush dirty pages
# before each WAL test starts; the test's own bounds are unchanged.
[scripts.wrapper.settled-disk]
command = ['sh', '-c', 'sync && exec "$@"', 'settled-disk']

[[profile.default.scripts]]
filter = 'package(meguri-engine) and binary(wal_durability)'
run-wrapper = 'settled-disk'

# This integration test deliberately exhausts the container's 64 MiB /dev
# tmpfs. Keep it isolated from every other test until its filler is dropped.
[[profile.default.overrides]]
filter = 'package(meguri-storage) and test(=atomic_file::real_disk_full_on_size_limited_tmpfs_leaves_original_intact)'
threads-required = "num-test-threads"

# U32 review regressions: lane contention and the DNS pool's idle accounting.
[[profile.default.overrides]]
filter = 'test(=control_lane_contention_counts_toward_suspend_deadline) or test(=suspend_during_a_slow_open_returns_within_its_budget) or test(=transport::idle_dns_pool_threads_do_not_exhaust_the_suspend_budget) or test(=a_cancelled_lookup_stays_busy_until_its_blocking_closure_ends)'
threads-required = "num-test-threads"

# U43's UI undo and journal coverage bounds need an idle test runner.
[[profile.default.overrides]]
filter = 'package(meguri-engine) and (binary(session_durability) or (binary(engine_it) and test(/^session_lifecycle::/)) or test(=c15_committed_undo_returns_restored_head_during_real_200ms_sync_incoming) or test(=c12_every_acceptance_is_observed_fullsynced_while_a_later_writer_is_held))'
threads-required = "num-test-threads"

# C8 runs four internal collection-owning threads across its complete session set.
# Reserve the whole test runner because its real journal has a wall-clock durability bound.
[[profile.default.overrides]]
filter = 'package(meguri-engine) and test(=session_predict::c8_all_four_actual_choices_in_ten_thousand_random_multi_answer_sessions)'
threads-required = "num-test-threads"

# U37 cancellation gates and pending-review response budgets need an idle runner.
[[profile.default.overrides]]
filter = 'package(meguri-engine) and binary(engine_it) and (test(/^controlled_services::/) or test(/^session_controlled::/))'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = '(package(meguri-host) and test(=lifecycle::close_refuses_restore_admission_and_retains_the_host_for_retry)) or (package(meguri-ffi) and binary(collection_ffi))'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(meguri-ffi) and test(=sync::tests::connection::jobs::connection_suspend_timeout_keeps_claimed_reply_then_retry_drains_without_losing_actual_result)'
threads-required = "num-test-threads"

# Each of its 24 fixtures ends with a host close under the unchanged suspend
# deadline, which a fully loaded runner exceeded (SuspendDeadline at
# "derived connection close").
[[profile.default.overrides]]
filter = 'package(meguri-ffi) and test(=sync::tests::connection::jobs::adoption_transport_failure_during_account_unavailability_still_requires_explicit_resume)'
threads-required = "num-test-threads"

# RF3's measured process footprint needs the runner to itself.
[[profile.default.overrides]]
filter = 'package(meguri-ffi) and binary(ffi_it) and test(/^collection_export_memory::/)'
threads-required = "num-test-threads"

# U107: real server pauses, one-second answer durability, cancellation and
# snapshot races must not compete with other test processes.
[[profile.default.overrides]]
filter = 'package(meguri-sync) and binary(sync_it) and test(/^normal_sync::/)'
threads-required = "num-test-threads"

# This small-fixture replay regression checks the same one-second journal handoff.
[[profile.default.overrides]]
filter = 'package(meguri-sync) and test(=normal::repeated::repeated_note_replay_declares_long_write_and_hands_off_durable_answer)'
threads-required = "num-test-threads"

# U127 Quit admission waits retain the existing end-to-end two-second budget.
[[profile.default.overrides]]
filter = 'test(=maintenance_scheduler::periodic::quit_expires_while_periodic_owner_is_still_blocked) or test(=backup_service::quit_expires_before_the_forced_provider_owner_releases_its_copy)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(meguri-host) and test(=completion_clock_reenters_runtime_and_rechecks_live_completion_facts)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(meguri-ffi) and test(=sync::tests::policy_execution::registered_execution_final_validation_completes_while_real_driver_projection_is_held)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(meguri-ffi) and test(=sync::tests::policy_execution::registered_execution_final_validation_completes_while_real_runtime_state_is_held)'
threads-required = "num-test-threads"

# Registered next-work regressions hold a process-global media scan faultpoint
# and use positive admission/terminal deadlines. Keep their original budgets.
[[profile.default.overrides]]
filter = 'package(meguri-ffi) and test(/media_next_job_/)'
threads-required = "num-test-threads"

# Runtime authority edge tests retain positive five-second completion bounds.
[[profile.default.overrides]]
filter = 'package(meguri-host) and (test(/^native_authority_/) or test(/^live_resume::/))'
threads-required = "num-test-threads"

# Retained native admission proofs hold real Driver/Runtime locks and bound starts.
[[profile.default.overrides]]
filter = 'package(meguri-ffi) and (test(/native_admission_job/) or test(/asset_next_/))'
threads-required = "num-test-threads"

# Required original-SDK completion witnesses retain the existing real-lock and
# suspend budgets, including deadline failure and writer-held replacement.
[[profile.default.overrides]]
filter = '(package(meguri-ffi) or package(meguri-engine)) and test(/required_sdk_completion_/)'
threads-required = "num-test-threads"

# Cloud reader-transfer witnesses use bounded barriers, real replacement/close
# waits and the unchanged suspend budget. Reserve an idle runner.
[[profile.default.overrides]]
filter = 'package(meguri-engine) and (test(/cloud_lifetime_pin_/) or test(/a_transferred_.*reader_waiter_/))'
threads-required = "num-test-threads"

# Original-resource pool, Host mirror, deadline and cutoff witnesses retain
# their barrier/teardown budgets and run without competing test processes.
[[profile.default.overrides]]
filter = '(package(meguri-engine) or package(meguri-host)) and test(/resource_jobs_/)'
threads-required = "num-test-threads"

# Two real consumers rendezvous at terminal Runtime time with ten-second bounds.
[[profile.default.overrides]]
filter = 'package(meguri-host) and binary(host_it) and (test(=cloud_media_rootless_ack::identical_feed::two_real_empty_feed_consumers_coalesce_in_first_started_order) or test(=cloud_media_rootless_ack::identical_feed::two_real_empty_feed_consumers_coalesce_in_second_started_order))'
threads-required = "num-test-threads"

# Reference drains retain a one-second lane bound; provider interleaving uses
# actual file observations with the existing ten-second operation budget.
[[profile.default.overrides]]
filter = 'package(meguri-host) and binary(cloud_policy_driver) and (test(/reference_waiting_large_backlog_/) or test(/reference_waiting_paused_scheduled_/))'
threads-required = "num-test-threads"

# Editor fetch fixtures use bounded loopback cancellation and teardown waits.
[[profile.default.overrides]]
filter = 'package(meguri-sync) and test(/^remote_media::/)'
threads-required = "num-test-threads"

# K10 raw canonical-cap cases hold 100 MiB images. Keep their copies isolated.
[[profile.default.overrides]]
filter = 'test(=cloud::row_payload::classification_tests::k10_raw_canonical_cap_boundary_and_asset_placement_are_distinct) or test(=row_classification::k10_rows_oversize_raw_observer_scan_reopen_shrink_never_sends_retained_payload)'
threads-required = "num-test-threads"

# The row index fixture owns its large table and measures SQLite instruction work.
[[profile.default.overrides]]
filter = 'test(=cloud::workflow_store::tests::k10_rows_indexed_observer_and_candidate_queries_are_bounded_at_150k)'
threads-required = "num-test-threads"
