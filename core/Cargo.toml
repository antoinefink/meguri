[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
# Parity pins (KTD2, R2027): exact versions from the oracle's lockfile, recorded
# with their provenance in pins.toml. Change them only with an oracle re-pin;
# the pin canary (tools/layering-check/tests/canary_pins.rs) fails otherwise.
blake3 = "=1.8.2"
difflib = "=0.4.0"
fsrs = "=6.6.2"
htmlescape = "=0.3.1"
rand = "=0.9.4"
regex = "=1.11.2"
sha1 = "=0.10.6"
unicase = "=2.6.0"
unicode-normalization = "=0.1.24"

# Meguri crates. The allowed edges between them are tools/layering-check/edges.toml.
meguri-engine = { path = "crates/meguri-engine" }
meguri-ffi = { path = "crates/meguri-ffi" }
meguri-host = { path = "crates/meguri-host" }
meguri-model = { path = "crates/meguri-model" }
meguri-package = { path = "crates/meguri-package" }
meguri-sched = { path = "crates/meguri-sched" }
meguri-search = { path = "crates/meguri-search" }
meguri-servers = { path = "crates/meguri-servers" }
meguri-stats = { path = "crates/meguri-stats" }
meguri-storage = { path = "crates/meguri-storage" }
meguri-sync = { path = "crates/meguri-sync" }
meguri-template = { path = "crates/meguri-template" }
meguri-testkit = { path = "crates/meguri-testkit" }
meguri-text = { path = "crates/meguri-text" }

# FFI (KTD9): the runtime crate and the in-repo bindgen binary must match
# exactly, because the Swift bindings compare checksums with the library at
# load time. Only meguri-ffi and tools/uniffi-bindgen-swift may use it.
uniffi = { version = "=0.32.2", default-features = false }

# Deck description rendering (meguri-text, specs/text/description-html.md):
# Meguri-defined output with no oracle parity, exact-pinned so the sanitizer's
# parse tree changes only by a deliberate bump.
html5ever = "=0.39.0"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }

# SQLite (KTD3): bundled on every target, so Docker and the devices run the
# same SQLite with the same compile options (rust-stack §1). Only
# meguri-storage issues SQL against a collection.
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled", "cache", "collation", "functions"] }

# Workspace tooling.
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"

# Conformance runner (meguri-testkit, meguri-cli). granit-parser is
# serde-saphyr's YAML parser, used at the event level so scenarios resolve with
# the exact YAML 1.2 core schema (specs/conformance/dsl.md D2). jiff's bundled
# IANA database gives the scenario clock the same zones on macOS and in Docker.
datatest-stable = "0.3.3"
granit-parser = "1.3.0"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
ryu = "1.0.23"
sha2 = "0.11.1"

[profile.dev]
opt-level = 1

# Dependencies (ndarray, SQLite) run 10-50x slower unoptimized; our code stays debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
# Keep symbols and line tables in the static library; dsymutil moves them into
# the app's dSYM at link time.
debug = "line-tables-only"
strip = "none"

# `tools/mg fixtures` (U11): an optimized meguri-cli without release's fat LTO
# and single codegen unit, which take minutes to link a test tool.
[profile.fixtures]
inherits = "release"
lto = false
codegen-units = 16
debug = false
