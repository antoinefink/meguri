<!doctype html>
<html class="{{editor.platform}}"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src meguri-editor:; media-src 'none'; font-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
/* N17.1: each field is a section of the Add form: its name as the header, a box under it. */
:root { color-scheme: light dark; font: -apple-system-body; background: transparent; }
body { margin: 0; padding: 0 16px 16px; background: transparent; }
section { margin: 0; }
header { display: block; }
button { font: inherit; }
.label { display: block; box-sizing: border-box; min-height: 44px; margin: 0; padding: 18px 16px 6px; border: 0; background: none;
    -webkit-appearance: none; appearance: none; font: -apple-system-subheadline; font-weight: 600; text-align: start;
    color: GrayText; color: -apple-system-secondary-label; -webkit-tap-highlight-color: transparent; }
.fieldBoundary { contain: layout paint style; isolation: isolate; box-sizing: border-box; min-height: 52px; padding: 12px 16px;
    border-radius: 26px; cursor: text; background: Canvas; background: -apple-system-secondary-grouped-background; }
textarea { display: block; box-sizing: border-box; width: 100%; min-height: 6em; margin: 0; padding: 12px 16px; border: 0; border-radius: 26px;
    resize: none; outline: none; font: -apple-system-body; font-family: ui-monospace, monospace; color: CanvasText;
    background: Canvas; background: -apple-system-secondary-grouped-background; }
#hint { margin: 8px 16px 0; font: -apple-system-footnote; color: GrayText; color: -apple-system-secondary-label; }
#hint:empty { display: none; }
[hidden] { display: none !important; }
/* The Mac form: names in a leading column, right-aligned, beside their boxes. */
html.mac { background: Canvas; }
html.mac body { padding: 0 20px 12px; background: Canvas; }
html.mac main { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 8px; row-gap: 10px; align-items: start; }
html.mac section { display: contents; }
html.mac header { grid-column: 1; text-align: end; }
html.mac .label { display: inline-block; min-height: 0; padding: 5px 0; font: -apple-system-body; font-weight: 400; text-align: end; color: CanvasText; }
html.mac .fieldBoundary, html.mac textarea { grid-column: 2; min-height: 28px; padding: 4px 7px; border-radius: 6px;
    border: 1px solid GrayText; border-color: -apple-system-separator; background: Canvas; background: -apple-system-text-background; }
html.mac .fieldBoundary:focus-within, html.mac textarea:focus { outline: 3px solid Highlight; outline-color: -webkit-focus-ring-color; outline-offset: -1px; }
html.mac textarea { min-height: 6em; resize: vertical; }
html.mac #hint { grid-column: 2; margin: 0; }
/* Browse's inspector (Option A): a plain list. Each field's name on its own
   line in the small secondary style, its text at the system body size under
   it, no box until it is edited, a hairline between fields. The page never
   scrolls; the inspector's scroll view does. */
html.inspector, html.inspector body { background: transparent; overflow: hidden; height: auto; }
html.inspector body { padding: 0 16px 4px; font: -apple-system-body; }
html.inspector main { display: block; }
html.inspector section { display: block; padding: 8px 0; }
html.inspector section:not([hidden]) ~ section:not([hidden]) { border-top: 1px solid -apple-system-separator; }
html.inspector header { text-align: start; }
html.inspector .label { display: block; width: 100%; min-height: 0; padding: 0 0 2px; font: 11px -apple-system; font-weight: 400;
    text-align: start; white-space: normal; overflow-wrap: anywhere; color: GrayText; color: -apple-system-secondary-label; cursor: default; }
html.inspector .fieldBoundary { min-height: 0; padding: 2px 4px; margin: 0 -4px; border: 0; border-radius: 5px; background: transparent;
    font: -apple-system-body; color: CanvasText; color: -apple-system-label; }
html.inspector .fieldBoundary:focus-within { background: -apple-system-text-background; outline: 3px solid -webkit-focus-ring-color; outline-offset: 0; }
html.inspector textarea { min-height: 2.5em; padding: 4px; margin: 0 -4px; width: calc(100% + 8px); border: 0; border-radius: 5px; resize: none;
    overflow: hidden; font: 12px ui-monospace, monospace; background: -apple-system-text-background; color: -apple-system-label; }
html.inspector textarea:focus { outline: 3px solid -webkit-focus-ring-color; outline-offset: 0; }
html.inspector ::selection { background: -apple-system-selected-text-background; }
html.inspector #hint { margin: 0; }
</style></head><body><main id="fields" inert></main><p id="hint" role="status"></p></body></html>
